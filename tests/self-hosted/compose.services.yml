# Disposable services for the image acceptance job only. No production keys,
# external accounts, host database, or provider requests are involved.
x-application: &application
  MIKKA_SELF_HOSTED_ACCEPTANCE: '1'
  MIKKA_EXPECTED_REVISION: ${GITHUB_SHA:?An exact CI revision is required}
  BETTER_AUTH_URL: http://localhost:3000
  BETTER_AUTH_SECRET: ${SELF_HOSTED_FIXTURE_KEY:?Generate a disposable fixture key}
  DEVICE_GATEWAY_PUSH_SECRET: ${SELF_HOSTED_FIXTURE_KEY:?Generate a disposable fixture key}
  WORKSPACE_SECRETS_KEY: ${SELF_HOSTED_FIXTURE_KEY:?Generate a disposable fixture key}
  CREDENTIAL_MASTER_KEY: ${SELF_HOSTED_FIXTURE_KEY:?Generate a disposable fixture key}
  CRON_SECRET: ${SELF_HOSTED_FIXTURE_KEY:?Generate a disposable fixture key}
  MIKKA_EXTERNAL_CRON: '1'
  WORKFLOW_POSTGRES_URL: postgres://mikka:${POSTGRES_PASSWORD:?Generate a disposable database password}@postgres:5432/mikka
  MIKKA_EMAIL_FROM: Self-hosted acceptance <login@selfhost.example.test>
  SMTP_URL: smtp://mailpit:1025
  RESEND_API_KEY: ''
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: mikka-selfhost-ci
  S3_ACCESS_KEY_ID: selfhost-ci
  S3_SECRET_ACCESS_KEY: ${SELF_HOSTED_FIXTURE_KEY:?Generate a disposable fixture key}
  S3_REGION: us-east-1
  MIKKA_DEFAULT_MODEL_BASE_URL: http://model:8080/v1
  MIKKA_DEFAULT_MODEL_API_KEY: synthetic-selfhost-only
  MIKKA_DEFAULT_MODEL_ID: selfhost-ci
services:
  dependency-postgres:
    image: postgres:17
    profiles: [dependency-tests]
    environment:
      POSTGRES_USER: e2e
      POSTGRES_DB: self_hosted_e2e
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate a disposable database password}
      POSTGRES_INITDB_ARGS: --set=max_locks_per_transaction=512
    ports:
      - '127.0.0.1::5432'
    networks: [dependency-tests]
    healthcheck:
      test: [CMD, pg_isready, -U, e2e, -d, self_hosted_e2e]
      interval: 2s
      timeout: 3s
      retries: 30
  app:
    environment: *application
    depends_on:
      mailpit:
        condition: service_started
      minio:
        condition: service_healthy
      model:
        condition: service_healthy
  app-replica:
    image: ${MIKKA_IMAGE:?Build the application image first}
    init: true
    environment:
      <<: *application
      MIKKA_DATABASE_URL: postgres://mikka:${POSTGRES_PASSWORD:?Generate a disposable database password}@postgres:5432/mikka
      DATABASE_URL: postgres://mikka:${POSTGRES_PASSWORD:?Generate a disposable database password}@postgres:5432/mikka
    volumes:
      - replica-data:/data
    depends_on:
      app:
        condition: service_healthy
    stop_grace_period: 60s
  mailpit:
    image: axllent/mailpit:v1.27.4
    environment:
      MP_DISABLE_VERSION_CHECK: 'true'
      MP_SMTP_DISABLE_RDNS: 'true'
      MP_QUIET: 'true'
  minio:
    image: mikka-minio:acceptance
    build:
      context: .
      dockerfile: tests/self-hosted/minio.Dockerfile
    environment:
      MINIO_ROOT_USER: selfhost-ci
      MINIO_ROOT_PASSWORD: ${SELF_HOSTED_FIXTURE_KEY:?Generate a disposable fixture key}
      MINIO_BROWSER: 'off'
      MINIO_UPDATE: 'off'
    command: [server, /data]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:9000/minio/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30
  model:
    image: node:24-bookworm-slim
    environment:
      MIKKA_SELF_HOSTED_ACCEPTANCE: '1'
    volumes:
      - ./scripts/acceptance/self-hosted-model.mjs:/fixture.mjs:ro
    command: [node, /fixture.mjs]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
networks:
  dependency-tests:
volumes:
  replica-data:
