name: Diagnose local daemon install on macOS
on:
  push:
    branches: [diag/local-install-macos]
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: nodejs.org Node 24 with an earlier sudo install, then a normal reinstall
        run: |
          set +e
          v=$(curl -fsSL https://nodejs.org/dist/index.json | python3 -c 'import json,sys;print(next(r["version"] for r in json.load(sys.stdin) if r["version"].startswith("v24.")))')
          curl -fsSLO https://nodejs.org/dist/$v/node-$v.pkg && sudo installer -pkg node-$v.pkg -target / >/dev/null
          sudo env PATH=/usr/local/bin:/usr/bin:/bin npm install --global @aspectlylabs/mikka@0.0.500 >/dev/null 2>&1; echo "sudo exit=$?"
          ls -la /usr/local/lib/node_modules/@aspectlylabs
          env -i HOME="$HOME" USER="$USER" SHELL=/bin/zsh PATH=/usr/local/bin:/usr/bin:/bin /bin/zsh -c 'npm install --global @aspectlylabs/mikka' > out.txt 2> err.txt; echo "exit=$?"
          echo "--- stderr"; cat err.txt
      - name: Fallback into a user prefix, then service and status by absolute path
        run: |
          set +e
          env -i HOME="$HOME" USER="$USER" SHELL=/bin/zsh PATH=/usr/local/bin:/usr/bin:/bin /bin/zsh -c 'npm install --global --prefix "$HOME/.mikka/npm" @aspectlylabs/mikka' > out.txt 2> err.txt; echo "exit=$?"
          cat err.txt
          ls -la ~/.mikka/npm/bin
          env -i HOME="$HOME" USER="$USER" SHELL=/bin/zsh PATH=/usr/local/bin:/usr/bin:/bin /bin/zsh -c '"$HOME/.mikka/npm/bin/mikka" daemon service install --server https://app.aspectlylabs.com/mikka --device-type laptop'; echo "exit=$?"
          plutil -p ~/Library/LaunchAgents/com.aspectlylabs.mikka.daemon.plist | grep -A4 ProgramArguments
          sleep 5
          env -i HOME="$HOME" USER="$USER" SHELL=/bin/zsh PATH=/usr/local/bin:/usr/bin:/bin /bin/zsh -c '"$HOME/.mikka/npm/bin/mikka" daemon status' | head -12; echo "exit=$?"
      - name: Stop the daemon service
        if: always()
        run: launchctl bootout gui/$(id -u)/com.aspectlylabs.mikka.daemon 2>/dev/null || true
