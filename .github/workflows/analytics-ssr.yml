name: Analytics SSR
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: analytics-ssr-${{ github.ref }}
  cancel-in-progress: true
env:
  # A cache restore that fails (e.g. the account's cache egress limit) would
  # otherwise hang for actions/cache's 10-minute default before falling back
  # to a normal install, which outlasts the short jobs' own timeouts.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.docs.outputs.docs_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: docs
        run: |
          git fetch origin main --no-tags
          trusted="$(mktemp --suffix=.mjs)"
          if ! git show origin/main:scripts/ci-docs-only.mjs > "$trusted" 2>/dev/null; then
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
          elif ! git diff --quiet origin/main -- scripts/ci-docs-only.mjs; then
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
          else
            node "$trusted"
          fi

  analytics-ssr-full:
    name: Analytics SSR (full)
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e-local-only
          POSTGRES_DB: mikka_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U e2e -d mikka_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: 'true'
      E2E_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      MIKKA_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      BETTER_AUTH_URL: http://localhost:3186
      BETTER_AUTH_SECRET: synthetic-ssr-regression-secret-not-a-real-credential
      NEXT_PUBLIC_POSTHOG_KEY: phc_synthetic_ssr_regression
      NEXT_TELEMETRY_DISABLED: '1'
      MIGRATE: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply tracked SQL only to the disposable CI database
        run: MIGRATE=1 node scripts/migrate.mjs
      - run: pnpm build
      - name: Render real Next HTTP pages with analytics enabled
        run: node scripts/check-analytics-ssr.mjs

  analytics-ssr:
    # Preserve the historical status-check name even for docs-only PRs.
    name: analytics-ssr
    needs: [changes, analytics-ssr-full]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require classification and full regression unless docs-only
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          FULL_RESULT: ${{ needs.analytics-ssr-full.result }}
        run: |
          if [ "$CHANGES_RESULT" != 'success' ]; then exit 1; fi
          if [ "$DOCS_ONLY" = 'true' ]; then
            test "$FULL_RESULT" = 'skipped'
          else
            test "$FULL_RESULT" = 'success'
          fi
