name: Analytics SSR
# Runs on pull requests only. After a merge, Vercel's production build of main
# is the build check; repeating this one on main added nothing.
on:
  workflow_call:
    inputs:
      selected:
        description: The parent CI already selected Analytics using the trusted policy
        type: boolean
        default: false
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: analytics-ssr-${{ github.ref }}
  cancel-in-progress: true
env:
  # A cache restore that fails (e.g. the account's cache egress limit) would
  # otherwise hang for actions/cache's 10-minute default before falling back
  # to a normal install, which outlasts the short jobs' own timeouts.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'

jobs:
  changes:
    if: ${{ !inputs.selected }}
    uses: ./.github/workflows/ci-selection.yml

  analytics-ssr-full:
    name: Analytics SSR (full)
    needs: changes
    if: always() && !cancelled() && (inputs.selected || (needs.changes.result == 'success' && needs.changes.outputs.analytics == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e-local-only
          POSTGRES_DB: mikka_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U e2e -d mikka_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: 'true'
      # This existing UI regression targets the frozen compatibility app.
      # The self-hosted image separately verifies backend mode by default.
      MIKKA_COMMUNITY_UI: '1'
      E2E_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      MIKKA_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      BETTER_AUTH_URL: http://localhost:3186
      BETTER_AUTH_SECRET: synthetic-ssr-regression-secret-not-a-real-credential
      NEXT_PUBLIC_POSTHOG_KEY: phc_synthetic_ssr_regression
      NEXT_TELEMETRY_DISABLED: '1'
      MIGRATE: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/pnpm-install
        with:
          skip-electron: 'true'
      - name: Apply tracked SQL only to the disposable CI database
        run: MIGRATE=1 node scripts/migrate.mjs
      - run: pnpm build
      - name: Verify compiled runtime resources and browser analytics assets
        run: node scripts/check-analytics-ssr.mjs --check-build
      - name: Install the pinned browser into this job's temporary directory
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/mikka-analytics-browsers"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          sudo "$(command -v node)" scripts/ci/apt-mirrors.mjs
          pnpm exec playwright install --with-deps chromium
      - name: Permit the installed Chromium sandbox in this disposable runner
        run: |
          profile="$RUNNER_TEMP/mikka-analytics-chromium"
          node scripts/analytics-browser-sandbox.mjs "$PLAYWRIGHT_BROWSERS_PATH" > "$profile"
          sudo install -o root -g root -m 0644 "$profile" /etc/apparmor.d/mikka-analytics-chromium
          sudo apparmor_parser --replace /etc/apparmor.d/mikka-analytics-chromium
      - name: Render real compiled HTTP pages with browser analytics enabled
        run: node scripts/check-analytics-ssr.mjs

  analytics-ssr:
    # Preserve the historical status-check name even for docs-only PRs.
    name: analytics-ssr
    needs: [changes, analytics-ssr-full]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require classification and full regression unless docs-only
        env:
          CHANGES_RESULT: ${{ inputs.selected && 'success' || needs.changes.result }}
          RUN_ANALYTICS: ${{ inputs.selected && 'true' || needs.changes.outputs.analytics }}
          FULL_RESULT: ${{ needs.analytics-ssr-full.result }}
        run: |
          if [ "$CHANGES_RESULT" != 'success' ]; then exit 1; fi
          if [ "$RUN_ANALYTICS" = 'false' ]; then
            test "$FULL_RESULT" = 'skipped'
          elif [ "$RUN_ANALYTICS" = 'true' ]; then
            test "$FULL_RESULT" = 'success'
          else
            exit 1
          fi
