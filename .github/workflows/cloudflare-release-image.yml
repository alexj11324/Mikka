name: Cloudflare API release image
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'alexj11324/Mikka' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    concurrency:
      group: cloudflare-api-release-images
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      MIKKA_EDITION: cloud
      MIKKA_DEPLOYMENT_ENVIRONMENT: production
      MIKKA_BUILD_REVISION: ${{ github.sha }}
      NEXT_PUBLIC_MIKKA_BUILD: ${{ github.sha }}
      MIKKA_BUILD_BYOS_WORKER: '1'
      NITRO_PRESET: node-server
      NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_COMPUTER_ENABLED: ${{ vars.NEXT_PUBLIC_COMPUTER_ENABLED }}
      NEXT_TELEMETRY_DISABLED: '1'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Verify public main and choose the immutable deployment ID
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/release/web-deploy.mjs main
          echo "MIKKA_DEPLOYMENT_ID=$(node lib/deployment-id.mjs)" >> "$GITHUB_ENV"
      - name: Read the private official UI checkout credential
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: HOSTED_UI_READ_KEY
          include-imports: false
      - name: Check out official UI
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: alexj11324/mikka-hosted-ui
          ref: main
          ssh-key: ${{ env.HOSTED_UI_READ_KEY }}
          path: .hosted-ui
          persist-credentials: false
      - name: Record private revision and clear the checkout credential
        run: node scripts/release/hosted-ui.mjs record .hosted-ui
      - name: Install locked workspace and private overlay dependencies
        env:
          FFMPEG_GITHUB_TOKEN: ${{ github.token }}
        run: |
          pnpm install --frozen-lockfile
          umask 077
          pnpm --dir .hosted-ui install --ignore-workspace --prod --ignore-scripts --frozen-lockfile > "$RUNNER_TEMP/private-ui-install.log" 2>&1
      - name: Read the production public build setting NEXT_PUBLIC_POSTHOG_KEY
        if: vars.NEXT_PUBLIC_POSTHOG_KEY == ''
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /vercel
          secret-name: NEXT_PUBLIC_POSTHOG_KEY
          include-imports: false
      - name: Read the production public build setting NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        if: vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY == ''
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /vercel
          secret-name: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
          include-imports: false
      - name: Read the production public build setting NEXT_PUBLIC_COMPUTER_ENABLED
        if: vars.NEXT_PUBLIC_COMPUTER_ENABLED == ''
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /vercel
          secret-name: NEXT_PUBLIC_COMPUTER_ENABLED
          include-imports: false
      - name: Compile the official frontend and non-Eve Node API
        run: |
          set -eu
          test -n "$NEXT_PUBLIC_POSTHOG_KEY"
          test -n "$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY"
          test -n "$NEXT_PUBLIC_COMPUTER_ENABLED"
          umask 077
          {
            node scripts/build-subscription-worker.mjs &&
            pnpm generate:agent-ui &&
            node apps/frontend/scripts/build.mjs web &&
            node apps/api/scripts/build.mjs
          } > "$RUNNER_TEMP/private-cloudflare-build.log" 2>&1
          node scripts/release/hosted-ui.mjs audit apps/frontend/dist/web
      - name: Package and re-open the exact Node image
        run: |
          docker buildx build --platform linux/amd64 --load --build-context release=.output \
            --build-arg MIKKA_BUILD_REVISION --build-arg MIKKA_UI_OVERLAY_SHA --build-arg MIKKA_DEPLOYMENT_ID \
            -t "mikka-api:$MIKKA_DEPLOYMENT_ID" -f cloudflare/api/Dockerfile cloudflare/api
          docker run --rm --network none -e MIKKA_BUILD_REVISION -e MIKKA_UI_OVERLAY_SHA -e MIKKA_DEPLOYMENT_ID \
            "mikka-api:$MIKKA_DEPLOYMENT_ID" node start.mjs verify-image
      - name: Read the Cloudflare account selector
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: CLOUDFLARE_ACCOUNT_ID
          include-imports: false
      - name: Authorize Cloudflare publication
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: CLOUDFLARE_API_TOKEN
          include-imports: false
      - name: Publish to the private Cloudflare registry and verify the registry digest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          node scripts/release/web-deploy.mjs main
          image="mikka-api:$MIKKA_DEPLOYMENT_ID"
          pnpm exec wrangler containers push "$image"
          repo="registry.cloudflare.com/$CLOUDFLARE_ACCOUNT_ID/mikka-api"
          digest="$(docker manifest inspect --verbose "$repo:$MIKKA_DEPLOYMENT_ID" | jq -er '.Descriptor.digest | select(test("^sha256:[a-f0-9]{64}$"))')"
          docker manifest inspect "$repo@$digest" > /dev/null
          {
            echo "### Cloudflare API image"
            echo "Public commit: $MIKKA_BUILD_REVISION"
            echo "Private UI commit: $MIKKA_UI_OVERLAY_SHA"
            echo "Deployment ID: $MIKKA_DEPLOYMENT_ID"
            echo "Registry digest: $digest"
            echo "Source and image publication only; this run does not promote a production route."
          } >> "$GITHUB_STEP_SUMMARY"
