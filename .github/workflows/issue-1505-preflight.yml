# Prepared only. Deployment commit is pinned; wait for the paired web +
# official-runtime READY confirmation before pushing this workflow and driver.
name: Issue 1505 production startup baseline
on:
  push:
    branches: [ops/1505-preflight]
permissions:
  contents: read
concurrency:
  group: issue-1505-production-acceptance
  cancel-in-progress: false
jobs:
  baseline:
    if: github.repository == 'alexj11324/Mikka'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      MIKKA_ACCEPTANCE_WORKSPACE_ID: de300001-ece6-4021-8214-c986ea306bde
      MIKKA_ACCEPTANCE_BOT_ID: bc925088-d87f-47b8-a786-c1c317ac005f
      EXPECTED_APP_COMMIT: 2960d783f0196fed5375593d910a43430a101747
      EXPECTED_DEPLOYMENT_ID: dpl_9dfpxYacqybW7U2PcpviMu83ruSg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Read the existing acceptance account
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          recursive: false
          include-imports: false
      - name: Read the existing token for read-only production version checks
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: VERCEL_TEAM_TOKEN
          include-imports: false
      - name: Diagnose only the existing log query
        run: |
          node --input-type=module <<'JS'
          const token=process.env.VERCEL_TEAM_TOKEN;
          if(!token)throw Error('token_missing');
          const base={event:'vercel.log',scope:{ownerId:'team_C7lwxVVvnUicFli6112mvxpv',projectIds:['prj_VdNz3P0FmuRbZKeI40hbCqwR0NVH']},
            timeRange:{start:'2026-11-06T20:05:14.236Z',end:'2026-11-06T20:06:51.492Z'},
            select:['deploymentId','environment','message','truncated'],limit:1,
            filter:'deploymentId:"dpl_9dfpxYacqybW7U2PcpviMu83ruSg" AND environment:production AND ("wrun_41M6S7EH0Q0GHTKW08JP0XJPQE") AND (dispatch_timing OR cloud_startup_timing OR subscription_native_timing)'};
          for(const order of ['asc','desc']){
            const response=await fetch('https://api.vercel.com/v1/observability/events?teamId=team_C7lwxVVvnUicFli6112mvxpv',{
              method:'POST',headers:{authorization:`Bearer ${token}`,'content-type':'application/json','x-vercel-observability-query-reason':'cli/logs-runtime'},
              body:JSON.stringify({...base,order}),redirect:'error',signal:AbortSignal.timeout(20000)});
            const value=await response.json();
            const error=response.ok?undefined:{code:typeof value.error?.code==='string'?value.error.code.slice(0,80):null,
              message:typeof value.error?.message==='string'?value.error.message.replaceAll(token,'[REDACTED]').slice(0,800):null};
            console.log(JSON.stringify({logQueryDiagnostic:{order,status:response.status,eventCount:Array.isArray(value.events)?value.events.length:null,error}}));
          }
          JS
