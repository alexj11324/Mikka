name: Issue 1505 production capability preflight
on:
  push:
    branches: [ops/1505-preflight]
permissions:
  contents: read
jobs:
  preflight:
    if: github.repository == 'alexj11324/Mikka'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          recursive: false
          include-imports: false
      - name: Restore the temporary smoke key and inspect ACME through normal sessions
        run: |
          node --input-type=module <<'JS'
          // Temporary #1505 operational preflight. Normal sessions stay only in memory.
          const origin = 'https://app.aspectlylabs.com'
          const uuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i
          const post = body => ({ method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
          const assert = (value, code) => { if (!value) throw new Error(code) }
          const decode = value => Array.isArray(value) ? value.map(decode) : value && typeof value === 'object'
            ? value.$mikka === 'undefined' ? undefined : value.$mikka === 'date' ? value.value
              : Object.fromEntries(Object.entries(value).map(([key, item]) => [key, decode(item)])) : value
          const emit = data => console.log(JSON.stringify(data))
          async function withSession(kind, email, password, work) {
            assert(email && password, 'credentials_missing')
            const cookies = new Map()
            async function request(path, init = {}) {
              const response = await fetch(origin + '/mikka' + path, { ...init, redirect: 'error', signal: AbortSignal.timeout(30000),
                headers: { origin, 'cache-control': 'no-store', ...(cookies.size ? { cookie: [...cookies].map(([key, value]) => `${key}=${value}`).join('; ') } : {}), ...init.headers } })
              for (const line of response.headers.getSetCookie()) {
                const pair = line.split(';', 1)[0], at = pair.indexOf('=')
                if (at < 1) continue
                const key = pair.slice(0, at), value = pair.slice(at + 1)
                if (!value || /;\s*max-age=0(?:;|$)/i.test(line)) cookies.delete(key); else cookies.set(key, value)
              }
              assert(response.ok, 'api_refused')
              return response
            }
            async function json(path, init) { const value = await (await request(path, init)).json(); assert(!value.error, 'api_refused'); return value }
            async function rpc(action, args) {
              const response = await json('/api/rpc', { ...post({ version: 1, action, args }), headers: { 'content-type': 'application/json', 'x-mikka-rpc': '1' } })
              assert(response.ok, 'rpc_refused')
              const value = decode(response.result); assert(!value?.error && value?.ok !== false, 'action_refused')
              return value?.ok === true && 'data' in value ? value.data : value
            }
            let loggedIn = false
            try {
              await request('/api/auth/sign-in/email', post({ email, password, rememberMe: false })); loggedIn = true
              assert(cookies.size, 'session_cookie_missing')
              const session = await json('/api/auth/get-session')
              assert(session.user?.email?.toLowerCase() === email.toLowerCase(), 'identity_mismatch')
              emit({ phase: 'login', account: kind, ok: true })
              await work({ json, rpc, user: session.user })
            } finally {
              if (loggedIn) {
                try { await request('/api/auth/sign-out', post({})); emit({ phase: 'sign_out', account: kind, ok: true }) }
                catch { emit({ phase: 'sign_out', account: kind, ok: false }); process.exitCode = 1 }
              }
              cookies.clear()
            }
          }
          try {
            await withSession('smoke_restore', process.env.SMOKE_OWNER_EMAIL, process.env.SMOKE_OWNER_PASSWORD, async ({ rpc }) => {
              const workspaceId = '0f877068-66a0-4893-8801-9a14eb3116b3'
              const before = await rpc('workspace-secrets.getE2BKeyCapability', [workspaceId])
              const removed = await rpc('workspace-secrets.deleteE2BKey', [workspaceId])
              const after = await rpc('workspace-secrets.getE2BKeyCapability', [workspaceId])
              assert(after.configured === false, 'smoke_restore_failed')
              emit({ phase: 'smoke_e2b_restored', workspaceId, beforeConfigured: before.configured, removed: removed.removed, configured: after.configured })
            })
          } catch (error) { emit({ phase: 'smoke_restore_failed', code: ['credentials_missing', 'identity_mismatch', 'smoke_restore_failed'].includes(error.message) ? error.message : 'preflight_failed' }); process.exitCode = 1 }
          try {
            assert(process.env.ACME_DEMO_EMAIL?.toLowerCase() === 'alex@acme.aspectlylabs.com', 'acme_identity_required')
            await withSession('acme', process.env.ACME_DEMO_EMAIL, process.env.ACME_DEMO_PASSWORD, async ({ json, rpc, user }) => {
              const version = await json('/api/version'); emit({ phase: 'version', build: version.build })
              const switcher = await json('/api/workspace/switcher')
              const choices = switcher.accounts?.find(account => account.id === user.id)?.choices
              assert(Array.isArray(choices) && choices.length > 0 && choices.length <= 30, 'workspaces_missing')
              emit({ phase: 'workspaces', currentWorkspaceId: switcher.workspace?.id, choices: choices.map(item => ({ id: item.id, name: item.name })) })
              const ready = []
              for (const workspace of choices) {
                assert(uuid.test(workspace.id), 'workspace_invalid')
                const [subscriptions, order, e2b] = await Promise.all([
                  json('/api/subscriptions?workspace=' + workspace.id), rpc('model-order.getModelOrder', [workspace.id]),
                  rpc('workspace-secrets.getE2BKeyCapability', [workspace.id]),
                ])
                const candidates = (order.candidates ?? []).filter(item => item.source?.kind === 'subscription')
                const smallModels = candidates.filter(item => (item.harness === 'claude_code' && item.model === 'claude-haiku-5-5') || (item.harness === 'codex' && item.model === 'gpt-6-luna'))
                const both = new Set(smallModels.map(item => item.harness)).size === 2
                emit({ phase: 'workspace_capabilities', workspaceId: workspace.id, subscriptions: subscriptions.connections?.map(item => ({ id: item.id, provider: item.provider, state: item.state, paused: item.paused })),
                  models: smallModels.map(item => ({ harness: item.harness, model: item.model })), e2bConfigured: e2b.configured, e2bCanEdit: e2b.canEdit, bothSubscriptions: both })
                if (both && e2b.configured) ready.push(workspace.id)
              }
              assert(ready.length, 'ready_workspace_missing')
              const workspaceId = ready.includes(switcher.workspace?.id) ? switcher.workspace.id : ready[0]
              await rpc('workspace.switchWorkspace', [workspaceId])
              const bots = await rpc('bots.listBots', [])
              emit({ phase: 'bots', workspaceId, bots: bots.map(item => ({ id: item.id, name: item.name, coordinator: Boolean(item.coordinator) })) })
              const name = '测试1505 云启动验收'
              const existing = bots.find(item => item.name === name)
              const bot = existing ?? await rpc('bots.createBot', [{ name, color: 'gris', shape: 'cercle', model: null, repository: null }])
              assert(uuid.test(bot.id), 'test_bot_missing')
              emit({ phase: 'acceptance_fixture', workspaceId, botId: bot.id, created: !existing, productionTasksDispatched: 0 })
            })
          } catch (error) { emit({ phase: 'acme_preflight_failed', code: ['credentials_missing', 'acme_identity_required', 'identity_mismatch', 'ready_workspace_missing', 'workspaces_missing', 'test_bot_missing'].includes(error.message) ? error.message : 'preflight_failed' }); process.exitCode = 1 }
          
          JS
