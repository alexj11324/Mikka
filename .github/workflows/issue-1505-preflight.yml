# Prepared only. Deployment commit is pinned; wait for the paired web +
# official-runtime READY confirmation before pushing this workflow and driver.
name: Issue 1505 production startup baseline
on:
  push:
    branches: [ops/1505-preflight]
permissions:
  contents: read
concurrency:
  group: issue-1505-production-acceptance
  cancel-in-progress: false
jobs:
  baseline:
    if: github.repository == 'alexj11324/Mikka'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      MIKKA_ACCEPTANCE_WORKSPACE_ID: de300001-ece6-4021-8214-c986ea306bde
      MIKKA_ACCEPTANCE_BOT_ID: bc925088-d87f-47b8-a786-c1c317ac005f
      EXPECTED_APP_COMMIT: 2960d783f0196fed5375593d910a43430a101747
      EXPECTED_DEPLOYMENT_ID: dpl_9dfpxYacqybW7U2PcpviMu83ruSg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Read the existing acceptance account
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          recursive: false
          include-imports: false
      - name: Read the existing token for read-only production version checks
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: VERCEL_TEAM_TOKEN
          include-imports: false
      - name: Measure three fresh repository starts on each official subscription
        run: |
          node --check scripts/acceptance/cloud-startup.mjs
          node --input-type=module <<'JS'
          import { mkdir, writeFile } from 'node:fs/promises';
          import { parseOptions, readProductionWorkerRelease, runCloudStartup } from './scripts/acceptance/cloud-startup.mjs';
          import { collectProductionTimings,markdown } from './scripts/acceptance/cloud-startup-report.mjs';
          const commit=process.env.EXPECTED_APP_COMMIT;
          if(!/^[a-f0-9]{40}$/.test(commit??''))throw Error('baseline_expected_deployment_missing');
          const release=await readProductionWorkerRelease({token:process.env.VERCEL_TEAM_TOKEN});
          const options=parseOptions(['--workspace',process.env.MIKKA_ACCEPTANCE_WORKSPACE_ID,'--bot-id',process.env.MIKKA_ACCEPTANCE_BOT_ID,
            '--runs','6','--harness','both','--mode','baseline','--strategy','official','--expected-build',commit,'--revision',commit,
            '--expected-worker-sha',release.workerSha,'--expected-worker-source',release.sourceCommit,'--timeout-ms','240000']);
          const report=await runCloudStartup(options);
          report.workflow={repository:process.env.GITHUB_REPOSITORY,runId:process.env.GITHUB_RUN_ID,commit:process.env.GITHUB_SHA};
          await collectProductionTimings(report,{token:process.env.VERCEL_TEAM_TOKEN,deploymentId:process.env.EXPECTED_DEPLOYMENT_ID});
          await mkdir('acceptance-results',{recursive:true});
          await writeFile('acceptance-results/cloud-startup-baseline.json',JSON.stringify(report,null,2)+'\n',{mode:0o600});
          await writeFile('acceptance-results/cloud-startup-baseline.md',markdown(report),{mode:0o600});
          console.log(JSON.stringify({status:report.status,applicationBuild:report.build,revision:report.revision,workerRelease:report.workerRelease,
            serverLogCollection:report.serverLogCollection,summary:report.summary,
            samples:report.samples.map(sample=>({sampleId:sample.sampleId,status:sample.status,error:sample.error,runId:sample.runId,
              workflowRunId:sample.workflowRunId,runIdHash:sample.runIdHash,requestTraceId:sample.requestTraceId,harness:sample.harness,
              agentStart:sample.agentStart,firstProviderChunk:sample.firstProviderChunk,stages:sample.stages,daemonStartupTiming:sample.daemonStartupTiming,
              toolCalls:sample.toolCalls,replyVerified:sample.replyVerified,cleanup:sample.cleanup,timing:sample.timing,
              serverStartupTimings:sample.serverStartupTimings,nativeProxyTimings:sample.nativeProxyTimings,nativeProviderCalls:sample.nativeProviderCalls}))}));
          if(report.status==='failed')process.exitCode=1;
          JS
      - name: Upload only the sanitized measurement report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1505-startup-baseline
          path: |
            acceptance-results/cloud-startup-baseline.json
            acceptance-results/cloud-startup-baseline.md
          if-no-files-found: warn
          retention-days: 7
