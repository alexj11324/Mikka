# Prepared only. Deployment commit is pinned; wait for the paired web +
# official-runtime READY confirmation before pushing this workflow and driver.
name: Issue 1505 readonly baseline observation
on:
  push:
    branches: [ops/1505-preflight]
permissions:
  contents: read
concurrency:
  group: issue-1505-production-observation
  cancel-in-progress: false
jobs:
  baseline:
    if: github.repository == 'alexj11324/Mikka'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      MIKKA_ACCEPTANCE_WORKSPACE_ID: de300001-ece6-4021-8214-c986ea306bde
      MIKKA_ACCEPTANCE_BOT_ID: bc925088-d87f-47b8-a786-c1c317ac005f
      EXPECTED_APP_COMMIT: 2960d783f0196fed5375593d910a43430a101747
      EXPECTED_DEPLOYMENT_ID: dpl_9dfpxYacqybW7U2PcpviMu83ruSg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Read the existing acceptance account
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          recursive: false
          include-imports: false
      - name: Read the existing token for read-only production version checks
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: VERCEL_TEAM_TOKEN
          include-imports: false
      - name: Observe existing test tasks and their logs once
        run: |
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          import { createSessionClient } from './scripts/acceptance/cloud-startup.mjs';
          import { sanitizeTimingLog } from './scripts/acceptance/cloud-startup-report.mjs';
          import { api,PROJECT,TEAM } from './scripts/ops/deployment-regression.mjs';
          const client=createSessionClient('https://app.aspectlylabs.com');
          const post=body=>({method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
          let loggedIn=false;
          try {
            if(process.env.ACME_DEMO_EMAIL!=='alex@acme.aspectlylabs.com')throw Error('observation_account_invalid');
            const login=await client.request('/api/auth/sign-in/email',post({email:process.env.ACME_DEMO_EMAIL,password:process.env.ACME_DEMO_PASSWORD,rememberMe:false}));
            if(!login.ok)throw Error('observation_signin_failed');loggedIn=true;
            await client.rpc('workspace.switchWorkspace',[process.env.MIKKA_ACCEPTANCE_WORKSPACE_ID]);
            const version=await client.json('/api/version');
            const bot=await client.json(`/api/bots/${process.env.MIKKA_ACCEPTANCE_BOT_ID}`);
            if(bot.name!=='测试1505 云启动验收')throw Error('observation_bot_invalid');
            const view=await client.json(`/api/mobile/bots/${bot.id}`);
            const rows=(view.threads??[]).filter(row=>/测试\s*1505/.test(row.name??'')&&Date.parse(row.createdAt)>=Date.parse('2026-11-06T20:15:00Z'));
            const hashes=new Set(rows.map(row=>createHash('sha256').update(row.id).digest('hex').slice(0,16)));
            console.log(JSON.stringify({baselineObservation:{build:version.build,threads:rows.map(row=>({runId:row.id,harness:row.harness,status:row.status,createdAt:row.createdAt,finishedAt:row.finishedAt,device:row.device?{id:row.device.id,kind:row.device.kind}:null,runIdHash:createHash('sha256').update(row.id).digest('hex').slice(0,16)}))}}));
            if(hashes.size){
              const result=await api('/v1/observability/events',{token:process.env.VERCEL_TEAM_TOKEN,headers:{'x-vercel-observability-query-reason':'cli/logs-runtime'},body:{
                event:'vercel.log',scope:{ownerId:TEAM,projectIds:[PROJECT]},timeRange:{start:'2026-11-06T20:15:00Z',end:new Date().toISOString()},
                select:['deploymentId','environment','message','truncated'],order:'desc',limit:1000,
                filter:`deploymentId:"${process.env.EXPECTED_DEPLOYMENT_ID}" AND environment:production AND (${[...hashes].join(' OR ')}) AND (cloud_startup_timing OR subscription_native_timing)`}});
              const records=[];
              for(const event of result.events??[]){if(event.deploymentId!==process.env.EXPECTED_DEPLOYMENT_ID||event.environment!=='production'||event.truncated)continue;
                for(const line of (event.message??'').split('\n')){let raw;try{raw=JSON.parse(line)}catch{continue}const clean=sanitizeTimingLog(raw,{hashes,workflows:new Set()});if(clean)records.push(clean)}}
              console.log(JSON.stringify({baselineObservationTimings:{records,hasMore:result.pagination?.hasMore,excludedIntervals:result.meta?.excludedIntervals?.length??0}}));
            }
          } finally {if(loggedIn)await client.request('/api/auth/sign-out',post({}));client.clear()}
          JS
