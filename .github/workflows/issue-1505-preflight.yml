name: Issue 1505 production capability preflight
on:
  push:
    branches: [ops/1505-preflight]
permissions:
  contents: read
jobs:
  preflight:
    if: github.repository == 'alexj11324/Mikka'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          recursive: false
          include-imports: false
      - name: Read the smoke account's capabilities through normal APIs
        run: |
          node --input-type=module <<'JS'
          const origin = 'https://app.aspectlylabs.com'; let cookie = '';
          async function read(path, body) {
            const response = await fetch(origin + '/mikka' + path, { method: body === undefined ? 'GET' : 'POST', redirect: 'error', signal: AbortSignal.timeout(30000), headers: { origin, 'cache-control': 'no-store', ...(cookie ? {cookie} : {}), ...(body ? {'content-type':'application/json'} : {}) }, ...(body ? {body:JSON.stringify(body)} : {}) });
            if (path === '/api/auth/sign-in/email' && response.ok) cookie = response.headers.getSetCookie().map(x=>x.split(';',1)[0]).join('; ');
            let data = await response.json().catch(()=>null); return {status:response.status,data};
          }
          try {
            console.log(JSON.stringify({phase:'version',...await read('/api/version')}));
            const login = await read('/api/auth/sign-in/email',{email:process.env.SMOKE_OWNER_EMAIL,password:process.env.SMOKE_OWNER_PASSWORD});
            console.log(JSON.stringify({phase:'login',status:login.status}));
            if (login.status !== 200 || !cookie) throw Error('smoke_sign_in_refused');
            const session = await read('/api/auth/get-session');
            if (session.data?.user?.email !== process.env.SMOKE_OWNER_EMAIL) throw Error('smoke_identity_mismatch');
            const bots = await read('/api/bots');
            console.log(JSON.stringify({phase:'bots',status:bots.status,bots:Array.isArray(bots.data)?bots.data.map(x=>({id:x.id,workspaceId:x.workspaceId,ownerMatched:x.ownerId===session.data.user.id,kind:x.kind})):null}));
            const workspace = bots.data?.[0]?.workspaceId;
            if (!workspace) throw Error('smoke_workspace_missing');
            const subscriptions = await read('/api/subscriptions?workspace='+workspace);
            console.log(JSON.stringify({phase:'subscriptions',status:subscriptions.status,connections:subscriptions.data?.connections?.map(x=>({id:x.id,provider:x.provider,state:x.state,paused:x.paused}))}));
            const order = await read('/api/settings/model-order?workspace='+workspace);
            console.log(JSON.stringify({phase:'model_order',status:order.status,entries:order.data?.entries?.map(x=>({id:x.id,harness:x.harness,model:x.model,kind:x.source?.kind,connectionId:x.source?.connectionId})),candidates:order.data?.candidates?.map(x=>({harness:x.harness,model:x.model,kind:x.source?.kind,connectionId:x.source?.connectionId}))}));
            const e2b = await read('/api/settings/e2b-key?workspace='+workspace);
            console.log(JSON.stringify({phase:'e2b',status:e2b.status,configured:e2b.data?.configured,canEdit:e2b.data?.canEdit,byoEnabled:e2b.data?.byoEnabled}));
          } catch(error) { console.log(JSON.stringify({phase:'failed',code:['smoke_sign_in_refused','smoke_identity_mismatch','smoke_workspace_missing'].includes(error.message)?error.message:'preflight_transport_failed'})); process.exitCode=1 }
          finally {if(cookie)await read('/api/auth/sign-out',{}).catch(()=>{});cookie=''}
          JS
