name: Issue 1506 read-only trace and account observation

# This path filter does not include the baseline or routing client directory.
on:
  push:
    branches: [acceptance/issues-1504-1506]
    paths:
      - '.github/workflows/issue-1506-readonly.yml'
      - 'scripts/acceptance/issue-1506-readonly/**'

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-smoke-owner-acceptance
  cancel-in-progress: false

jobs:
  observe:
    if: false && github.repository == 'alexj11324/Mikka' && github.event_name == 'push' && github.ref == 'refs/heads/acceptance/issues-1504-1506'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Check the isolated read-only guards offline
        id: guards
        run: |
          node --check scripts/acceptance/issue-1506-readonly/alex-session.mjs
          node --check scripts/acceptance/issue-1506-readonly/accounts-readonly.mjs
          node --check scripts/acceptance/issue-1506-readonly/coordinator-traces.mjs
          node --test scripts/acceptance/issue-1506-readonly/readonly.test.mjs
      - name: Read Alex's existing email only
        if: always() && !cancelled() && steps.guards.outcome == 'success'
        continue-on-error: true
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          secret-name: ACME_DEMO_EMAIL
          recursive: false
          include-imports: false
      - name: Read Alex's existing password only
        if: always() && !cancelled() && steps.guards.outcome == 'success'
        continue-on-error: true
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          secret-name: ACME_DEMO_PASSWORD
          recursive: false
          include-imports: false
      - name: Read the existing trace-query credential only
        if: always() && !cancelled() && steps.guards.outcome == 'success'
        continue-on-error: true
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: POSTHOG_PERSONAL_API_KEY
          recursive: false
          include-imports: false
      - name: Observe only Alex's own personal workspace and models
        if: always() && !cancelled() && steps.guards.outcome == 'success'
        run: node scripts/acceptance/issue-1506-readonly/accounts-readonly.mjs observe
      - name: Query only the fixed production trace window
        if: always() && !cancelled() && steps.guards.outcome == 'success'
        env:
          MIKKA_TRACE_FROM: '2026-11-06T19:12:15Z'
          MIKKA_TRACE_UNTIL: '2026-11-06T19:12:45Z'
        run: node scripts/acceptance/issue-1506-readonly/coordinator-traces.mjs
      - name: Retain sanitized metadata only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issue-1506-readonly-${{ github.run_id }}
          path: issue-1506-readonly-report/*.json
          if-no-files-found: ignore
          retention-days: 7
