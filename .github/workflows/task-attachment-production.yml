name: Task attachment production acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/task-attachment-production.yml'
      - 'scripts/acceptance/task-attachment-*.mjs'
      - 'scripts/acceptance/deployed-target.mjs'
  workflow_run:
    workflows: ['Web deploy']
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  guards:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: node --test scripts/acceptance/task-attachment-*.test.mjs

  roundtrip:
    if: >-
      github.repository == 'alexj11324/Mikka' && github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_sha == github.sha && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: production-smoke-owner-acceptance
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Verify the open issue and the published main release
        id: release
        run: node scripts/acceptance/task-attachment-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Read the existing smoke email
        if: steps.release.outputs.ready == 'true'
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          secret-name: SMOKE_OWNER_EMAIL
          recursive: false
          include-imports: false
      - name: Read the existing smoke password
        if: steps.release.outputs.ready == 'true'
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          secret-name: SMOKE_OWNER_PASSWORD
          recursive: false
          include-imports: false
      - name: Recheck the target before the attachment roundtrip
        if: steps.release.outputs.ready == 'true'
        id: current
        run: node scripts/acceptance/task-attachment-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Exercise the retained task through its ordinary attachment API
        if: steps.current.outputs.ready == 'true'
        run: node scripts/acceptance/task-attachment-production.mjs
        env:
          ATTACHMENT_EXPECTED_SHA: ${{ github.sha }}
      - name: Retain the bounded attachment receipt
        if: always() && steps.current.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: task-attachment-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: production-task-attachment-report/report.json
          if-no-files-found: error
          retention-days: 14
