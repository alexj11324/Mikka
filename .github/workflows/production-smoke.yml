name: Production smoke
# Signs in the tagged smoke account on production and reads (docs/production-smoke.md).
on:
  schedule:
    - cron: '17 14 * * *'
    - cron: '*/15 * * * *'
  deployment_status:
  workflow_dispatch:
    inputs:
      audit_auth_sha:
        description: Optional exact deployed main SHA for issue 1597/1600 safe authorization acceptance
        required: false
        type: string
      audit_lease:
        description: Also verify both real subscription paths and natural expiry in owned test tasks
        required: false
        type: boolean
        default: false
      domain_model_sha:
        description: Exact deployed main SHA for Epic 1687 ordinary shared-account acceptance
        required: false
        type: string
      domain_model_mode:
        description: Inspect scope, provision retained domain objects without prompts, or submit two useful reports
        required: false
        type: choice
        options: [preflight, provision, active]
        default: preflight
      domain_model_scope:
        description: Explicit JSON workspaceId/botId/repositoryKey/models, baseBranch for provision, projectId/environmentId for active
        required: false
        type: string
      audit_recover_lease_run:
        description: Recover only the own pre-dispatch CLI interruption in run 42418118236 before the lease audit
        type: choice
        options:
          - none
          - '42418118236'
        default: none
permissions:
  contents: read
concurrency:
  group: production-smoke
  cancel-in-progress: false
  queue: max
env:
  # A cache restore that fails (e.g. the account's cache egress limit) would
  # otherwise hang for actions/cache's 10-minute default before falling back
  # to a normal install, which outlasts the short jobs' own timeouts.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'

jobs:
  domain-model:
    if: github.repository == 'alexj11324/Mikka' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && (inputs.domain_model_sha != '' || inputs.domain_model_scope != '' || (inputs.domain_model_mode != '' && inputs.domain_model_mode != 'preflight'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: production-smoke-owner-acceptance
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write
    env:
      DOMAIN_MODEL_SHA: ${{ inputs.domain_model_sha }}
      DOMAIN_MODEL_MODE: ${{ inputs.domain_model_mode }}
      DOMAIN_MODEL_SCOPE: ${{ inputs.domain_model_scope }}
      DOMAIN_OTHER_AUDIT_SHA: ${{ inputs.audit_auth_sha }}
      DOMAIN_OTHER_AUDIT_LEASE: ${{ inputs.audit_lease }}
      DOMAIN_OTHER_AUDIT_RECOVERY_RUN: ${{ inputs.audit_recover_lease_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Verify strict guards and exact live main before credentials
        run: |
          node --test scripts/acceptance/work-domain-production.test.mjs
          node scripts/acceptance/work-domain-production.mjs --check-target
      - name: Read only the existing smoke account email through OIDC
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          secret-name: SMOKE_OWNER_EMAIL
          include-imports: false
      - name: Read only the existing smoke account password inside the runner
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          secret-name: SMOKE_OWNER_PASSWORD
          include-imports: false
      - name: Inspect scope or execute the two retained domain reports
        run: node scripts/acceptance/work-domain-production.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-work-domain-${{ github.run_id }}
          path: production-work-domain-report/report.json
          retention-days: 14
          if-no-files-found: ignore

  lease-audit:
    if: github.repository == 'alexj11324/Mikka' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.domain_model_sha == '' && inputs.domain_model_scope == '' && (inputs.domain_model_mode == '' || inputs.domain_model_mode == 'preflight') && inputs.audit_auth_sha != '' && inputs.audit_lease == true
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: production-smoke-owner-acceptance
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Check lease driver and exact main before credentials
        run: |
          node --test scripts/acceptance/cloud-lease-audit.test.mjs scripts/acceptance/cloud-lease-recovery.test.mjs
          node --input-type=module <<'JS'
          import { auditTarget } from './scripts/acceptance/auth-audit-production.mjs'
          const expected = auditTarget(process.env)
          const response = await fetch('https://app.aspectlylabs.com/mikka/api/version', {
            redirect: 'error', headers: { 'cache-control': 'no-store' }, signal: AbortSignal.timeout(30000),
          })
          if (!response.ok || (await response.json()).build !== expected) throw Error('audit_deployed_build_mismatch')
          JS
        env:
          APPLICATION_SHA: ${{ inputs.audit_auth_sha }}
      - name: Read only the existing shared account through OIDC
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          recursive: false
          include-imports: false
      - name: Collect own natural-expiry receipts for required PostHog plugin verification
        run: node scripts/acceptance/cloud-lease-audit.mjs
        env:
          APPLICATION_SHA: ${{ inputs.audit_auth_sha }}
          DAEMON_RENEWAL_EVIDENCE: posthog_plugin
          LEASE_AUDIT_RECOVERY_RUN: ${{ inputs.audit_recover_lease_run }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-lease-audit-${{ github.run_id }}
          path: production-lease-audit-report/report.json
          retention-days: 14

  auth-audit:
    if: github.repository == 'alexj11324/Mikka' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.domain_model_sha == '' && inputs.domain_model_scope == '' && (inputs.domain_model_mode == '' || inputs.domain_model_mode == 'preflight') && inputs.audit_auth_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: production-smoke-owner-acceptance
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Check safe authorization probes and exact main driver before credentials
        run: |
          node --test scripts/acceptance/auth-audit-production.test.mjs
          node --input-type=module <<'JS'
          import { auditTarget } from './scripts/acceptance/auth-audit-production.mjs'
          const expected = auditTarget(process.env)
          const response = await fetch('https://app.aspectlylabs.com/mikka/api/version', {
            redirect: 'error', headers: { 'cache-control': 'no-store' }, signal: AbortSignal.timeout(30000),
          })
          if (!response.ok || (await response.json()).build !== expected) throw Error('audit_deployed_build_mismatch')
          JS
        env:
          APPLICATION_SHA: ${{ inputs.audit_auth_sha }}
      - name: Read only the existing shared account through OIDC
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          recursive: false
          include-imports: false
      - name: Check human sessions and read-only PAT workspace refusal
        run: node scripts/acceptance/auth-audit-production.mjs
        env:
          APPLICATION_SHA: ${{ inputs.audit_auth_sha }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-auth-audit-${{ github.run_id }}
          path: production-auth-audit-report/report.json
          retention-days: 14

  smoke:
    # Only finished production deployments, plus the schedule and manual runs.
    if: github.repository == 'alexj11324/Mikka' && (github.event_name != 'workflow_dispatch' || (inputs.domain_model_sha == '' && inputs.domain_model_scope == '' && (inputs.domain_model_mode == '' || inputs.domain_model_mode == 'preflight'))) && (github.event_name != 'schedule' || github.event.schedule == '17 14 * * *') && (github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: node --test scripts/ops/production-smoke.test.mjs
      - name: Read the smoke account through Infisical workload identity
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          # The prod root holds only the smoke account; app secrets live in /vercel and /neon.
          secret-path: /
          recursive: false
          include-imports: false
      - run: node scripts/ops/production-smoke.mjs
        env:
          SMOKE_BASE_URL: https://app.aspectlylabs.com
          SMOKE_EXPECT_ON: credentialVault,cloudComputer
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-smoke-report
          path: production-smoke-report
          retention-days: 7

  deployment-comparison:
    # No browser/install/wait loop: quarter-hour follow-ups read the same fixed windows.
    if: github.repository == 'alexj11324/Mikka' && (github.event_name != 'workflow_dispatch' || (inputs.domain_model_sha == '' && inputs.domain_model_scope == '' && (inputs.domain_model_mode == '' || inputs.domain_model_mode == 'preflight'))) && (github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')) && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Verify egress collector contracts
        if: always()
        run: node --test scripts/ops/egress-monitor.test.mjs
      - name: Read the existing Vercel token through Infisical workload identity
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: VERCEL_TEAM_TOKEN
          recursive: false
          include-imports: false
      - name: Compare fixed production deployment windows
        run: DEPLOYMENT_COMPARISON_CHECKER_SHA="$(git rev-parse HEAD)" node scripts/ops/deployment-regression.mjs
      - name: Collect production request outcomes
        if: always()
        run: node scripts/ops/runtime-outcomes.mjs
      - name: Read only the Neon usage key for the egress collector
        if: always()
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: NEON_API_KEY
          recursive: false
          include-imports: false
      - name: Read only the existing PostHog project ingestion key
        if: always()
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /vercel
          secret-name: NEXT_PUBLIC_POSTHOG_KEY
          recursive: false
          include-imports: false
      - name: Collect database egress and publish aggregate health
        if: always()
        run: node scripts/ops/egress-monitor.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-comparison-${{ github.run_id }}
          path: |
            deployment-comparison-report
            runtime-outcomes-report
            egress-monitor-report
          retention-days: 7
