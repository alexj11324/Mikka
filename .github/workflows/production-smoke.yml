name: Production smoke
# Signs in the tagged smoke account on production and reads (docs/production-smoke.md).
on:
  schedule:
    - cron: '17 14 * * *'
  deployment_status:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-smoke
  cancel-in-progress: false
env:
  # A cache restore that fails (e.g. the account's cache egress limit) would
  # otherwise hang for actions/cache's 10-minute default before falling back
  # to a normal install, which outlasts the short jobs' own timeouts.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'

jobs:
  smoke:
    # Only finished production deployments, plus the schedule and manual runs.
    if: github.repository == 'alexj11324/Mikka' && (github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Read the smoke account through Infisical workload identity
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          # The prod root holds only the smoke account; app secrets live in /vercel and /neon.
          secret-path: /
          recursive: false
          include-imports: false
      - run: pnpm test:smoke
        env:
          SMOKE_BASE_URL: https://app.aspectlylabs.com
          SMOKE_EXPECT_ON: credentialVault,cloudComputer
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-smoke-report
          path: playwright-report-smoke
          retention-days: 7
