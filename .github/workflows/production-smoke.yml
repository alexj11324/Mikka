name: Production smoke
# Signs in the tagged smoke account on production and reads (docs/production-smoke.md).
on:
  schedule:
    - cron: '17 14 * * *'
    - cron: '*/15 * * * *'
  deployment_status:
  push:
    branches: [ops/20261108-audit-actions-dispatch]
    paths: ['.github/workflows/production-smoke.yml']
  workflow_dispatch:
    inputs:
      audit_auth_sha:
        description: Optional exact deployed main SHA for issue 1597/1600 safe authorization acceptance
        required: false
        type: string
      audit_lease:
        description: Also verify both real subscription paths and natural expiry in owned test tasks
        required: false
        type: boolean
        default: false
      audit_recover_lease_run:
        description: Recover only the own pre-dispatch CLI interruption in run 42418118236 before the lease audit
        type: choice
        options:
          - none
          - '42418118236'
        default: none
permissions:
  contents: read
concurrency:
  group: production-smoke
  cancel-in-progress: false
  queue: max
env:
  # A cache restore that fails (e.g. the account's cache egress limit) would
  # otherwise hang for actions/cache's 10-minute default before falling back
  # to a normal install, which outlasts the short jobs' own timeouts.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'

jobs:
  lease-audit:
    if: github.repository == 'alexj11324/Mikka' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.audit_auth_sha != '' && inputs.audit_lease == true
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: production-smoke-owner-acceptance
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Check lease driver and exact main before credentials
        run: |
          node --test scripts/acceptance/cloud-lease-audit.test.mjs scripts/acceptance/cloud-lease-recovery.test.mjs
          node --input-type=module <<'JS'
          import { auditTarget } from './scripts/acceptance/auth-audit-production.mjs'
          const expected = auditTarget(process.env)
          const response = await fetch('https://app.aspectlylabs.com/mikka/api/version', {
            redirect: 'error', headers: { 'cache-control': 'no-store' }, signal: AbortSignal.timeout(30000),
          })
          if (!response.ok || (await response.json()).build !== expected) throw Error('audit_deployed_build_mismatch')
          JS
        env:
          APPLICATION_SHA: ${{ inputs.audit_auth_sha }}
      - name: Read only the existing shared account through OIDC
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          recursive: false
          include-imports: false
      - name: Collect own natural-expiry receipts for required PostHog plugin verification
        run: node scripts/acceptance/cloud-lease-audit.mjs
        env:
          APPLICATION_SHA: ${{ inputs.audit_auth_sha }}
          DAEMON_RENEWAL_EVIDENCE: posthog_plugin
          LEASE_AUDIT_RECOVERY_RUN: ${{ inputs.audit_recover_lease_run }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-lease-audit-${{ github.run_id }}
          path: production-lease-audit-report/report.json
          retention-days: 14

  auth-audit:
    if: github.repository == 'alexj11324/Mikka' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.audit_auth_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: production-smoke-owner-acceptance
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Check safe authorization probes and exact main driver before credentials
        run: |
          node --test scripts/acceptance/auth-audit-production.test.mjs
          node --input-type=module <<'JS'
          import { auditTarget } from './scripts/acceptance/auth-audit-production.mjs'
          const expected = auditTarget(process.env)
          const response = await fetch('https://app.aspectlylabs.com/mikka/api/version', {
            redirect: 'error', headers: { 'cache-control': 'no-store' }, signal: AbortSignal.timeout(30000),
          })
          if (!response.ok || (await response.json()).build !== expected) throw Error('audit_deployed_build_mismatch')
          JS
        env:
          APPLICATION_SHA: ${{ inputs.audit_auth_sha }}
      - name: Read only the existing shared account through OIDC
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          recursive: false
          include-imports: false
      - name: Check human sessions and read-only PAT workspace refusal
        run: node scripts/acceptance/auth-audit-production.mjs
        env:
          APPLICATION_SHA: ${{ inputs.audit_auth_sha }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-auth-audit-${{ github.run_id }}
          path: production-auth-audit-report/report.json
          retention-days: 14

  smoke:
    # Only finished production deployments, plus the schedule and manual runs.
    if: github.ref == 'refs/heads/main' && (github.repository == 'alexj11324/Mikka' && (github.event_name != 'schedule' || github.event.schedule == '17 14 * * *') && (github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: node --test scripts/ops/production-smoke.test.mjs
      - name: Read the smoke account through Infisical workload identity
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          # The prod root holds only the smoke account; app secrets live in /vercel and /neon.
          secret-path: /
          recursive: false
          include-imports: false
      - run: node scripts/ops/production-smoke.mjs
        env:
          SMOKE_BASE_URL: https://app.aspectlylabs.com
          SMOKE_EXPECT_ON: credentialVault,cloudComputer
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-smoke-report
          path: production-smoke-report
          retention-days: 7

  deployment-comparison:
    # No browser/install/wait loop: quarter-hour follow-ups read the same fixed windows.
    if: github.repository == 'alexj11324/Mikka' && (github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')) && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Read the existing Vercel token through Infisical workload identity
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          recursive: false
          include-imports: false
      - name: Compare fixed production deployment windows
        run: DEPLOYMENT_COMPARISON_CHECKER_SHA="$(git rev-parse HEAD)" node scripts/ops/deployment-regression.mjs
      - name: Collect production request outcomes
        if: always()
        run: node scripts/ops/runtime-outcomes.mjs
      - name: Read monitoring ingestion configuration through the existing identity
        if: always()
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /vercel
          recursive: false
          include-imports: false
      - name: Verify egress collector contracts
        if: always()
        run: node --test scripts/ops/egress-monitor.test.mjs
      - name: Collect database egress and publish aggregate health
        if: always()
        run: node scripts/ops/egress-monitor.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-comparison-${{ github.run_id }}
          path: |
            deployment-comparison-report
            runtime-outcomes-report
            egress-monitor-report
          retention-days: 7

  dispatch-audit:
    if: github.repository == 'alexj11324/Mikka' && github.event_name == 'push' && github.ref == 'refs/heads/ops/20261108-audit-actions-dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    env:
      REPO_ACTIONS_TOKEN: ${{ github.token }}
      AUDIT_BRIDGE_CLI: '1'
      AUDIT_DISPATCH_MODE: check
      AUDIT_SOURCE_SHA: ''
      AUDIT_DISPATCH_NOT_AFTER: ''
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Check repository dispatch authority without production operations
        run: |
          node --input-type=module <<'JS'
          const repository = 'alexj11324/Mikka'
          const branch = 'refs/heads/ops/20261108-audit-actions-dispatch'
          const driver = '8bceef7e67d251e4e0b59f7a89baf593fee4cbbf'
          const api = `https://api.github.com/repos/${repository}`
          const terminal = new Set(['completed'])
          
          export async function dispatchAudit(env, { fetchImpl = fetch, now = Date.now } = {}) {
            const check = (value, code) => { if (!value) throw new Error(code) }
            check(env.GITHUB_REPOSITORY === repository && env.GITHUB_REF === branch
              && env.GITHUB_EVENT_NAME === 'push', 'dispatch_bridge_scope_refused')
            check(['check', 'dispatch'].includes(env.AUDIT_DISPATCH_MODE), 'dispatch_bridge_mode_refused')
            check(typeof env.REPO_ACTIONS_TOKEN === 'string' && env.REPO_ACTIONS_TOKEN.length > 0, 'dispatch_bridge_token_unavailable')
            const github = async (path, body) => {
              const response = await fetchImpl(api + path, { method: body ? 'POST' : 'GET', redirect: 'error',
                headers: { authorization: `Bearer ${env.REPO_ACTIONS_TOKEN}`, accept: 'application/vnd.github+json',
                  ...(body ? { 'content-type': 'application/json' } : {}) },
                ...(body ? { body: JSON.stringify(body) } : {}), signal: AbortSignal.timeout(30000) })
              check(response.status === (body ? 204 : 200), 'dispatch_bridge_github_request_refused')
              return body ? undefined : response.json()
            }
            const main = await github('/git/ref/heads/main')
            const source = main.object?.sha
            check(/^[a-f0-9]{40}$/.test(source ?? ''), 'dispatch_bridge_main_invalid')
            const workflow = await github('/actions/workflows/production-smoke.yml')
            check(workflow.path === '.github/workflows/production-smoke.yml' && workflow.state === 'active', 'dispatch_bridge_workflow_unavailable')
            if (env.AUDIT_DISPATCH_MODE === 'check') return { status: 'check_only', source,
              workflow: workflow.path, dispatchRequested: false, productionCredentialReads: 0 }
          
            check(env.AUDIT_SOURCE_SHA === source, 'dispatch_bridge_main_changed')
            const deadline = Date.parse(env.AUDIT_DISPATCH_NOT_AFTER ?? '')
            check(Number.isFinite(deadline) && now() <= deadline && deadline <= now() + 10 * 60_000, 'dispatch_bridge_start_window_refused')
            const comparison = await github(`/compare/${driver}...${source}`)
            check(comparison.merge_base_commit?.sha === driver && ['ahead', 'identical'].includes(comparison.status), 'dispatch_bridge_driver_not_merged')
            const listed = await github('/actions/runs?branch=main&per_page=100')
            check(Array.isArray(listed.workflow_runs), 'dispatch_bridge_runs_invalid')
            const writers = listed.workflow_runs.filter(run => ['Web deploy', 'E2B additive runtime release'].includes(run.name))
            check(writers.every(run => terminal.has(run.status)), 'dispatch_bridge_writer_active')
            const completed = async name => {
              const runs = listed.workflow_runs.filter(run => run.head_sha === source && run.head_branch === 'main'
                && run.event === 'push' && run.name === name).sort((a, b) => b.id - a.id)
              check(runs.length > 0 && runs[0].status === 'completed' && runs[0].conclusion === 'success', 'dispatch_bridge_release_incomplete')
              const jobs = await github(`/actions/runs/${runs[0].id}/jobs?per_page=100`)
              check(Array.isArray(jobs.jobs) && jobs.jobs.length > 0 && jobs.jobs.every(job => job.status === 'completed'
                && ['success', 'skipped'].includes(job.conclusion)), 'dispatch_bridge_jobs_incomplete')
              return { run: runs[0], jobs: jobs.jobs }
            }
            await completed('CI')
            await completed('Web deploy')
            const runtime = await completed('E2B additive runtime release')
            check(runtime.jobs.length === 7 && runtime.jobs.every(job => job.conclusion === 'success'), 'dispatch_bridge_runtime_incomplete')
            const version = await fetchImpl('https://app.aspectlylabs.com/mikka/api/version', {
              redirect: 'error', headers: { 'cache-control': 'no-store' }, signal: AbortSignal.timeout(30000) })
            check(version.status === 200 && (await version.json()).build === source, 'dispatch_bridge_public_version_mismatch')
            check((await github('/git/ref/heads/main')).object?.sha === source && now() <= deadline, 'dispatch_bridge_main_or_window_changed')
            await github('/actions/workflows/production-smoke.yml/dispatches', { ref: 'main', inputs: {
              audit_auth_sha: source, audit_lease: true, audit_recover_lease_run: 'none' } })
            return { status: 'dispatched', source, workflow: workflow.path, runtimeRun: runtime.run.id,
              productionCredentialReads: 0 }
          }
          
          if (process.env.GITHUB_ACTIONS === 'true' && process.env.AUDIT_BRIDGE_CLI === '1') {
            try { console.log(JSON.stringify(await dispatchAudit(process.env))) }
            catch (error) {
              const code = /^dispatch_bridge_[a-z_]+$/.test(error?.message ?? '') ? error.message : 'dispatch_bridge_failed'
              console.error(JSON.stringify({ status: 'blocked', code }))
              process.exitCode = 1
            }
          }
          JS
