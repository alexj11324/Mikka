name: Browser tests

# PRs run critical flows plus scoped regressions; unknown/shared changes run
# full functionality. Schema-only migrations use critical flows after the
# migration/bootstrap gates. The full layer is sharded across four isolated jobs;
# build, runtime gates and selection validation run as separate parallel jobs.
# Code-bearing main pushes, nightly/manual integration and
# integration PRs also run performance. Docs-only main pushes keep lightweight
# gates. See CONTRIBUTING.md for the required, fail-closed gate policy.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    # Nightly full regression on main, 03:17 Beijing time.
    - cron: '17 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-tests-${{ github.event_name }}-${{ github.ref }}
  # Superseded branch pushes are cancelled; every commit on main finishes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # A cache restore that fails (e.g. the account's cache egress limit) would
  # otherwise hang for actions/cache's 10-minute default before falling back
  # to a normal install, which outlasts the short jobs' own timeouts.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.docs.outputs.docs_only }}
      browser_tier: ${{ steps.docs.outputs.browser_tier }}
      browser_specs: ${{ steps.docs.outputs.browser_specs }}
      browser_performance: ${{ steps.docs.outputs.browser_performance }}
      verify_selection: ${{ steps.docs.outputs.verify_selection }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: docs
        env:
          INTEGRATION_ACCEPTANCE: ${{ startsWith(github.head_ref, 'integrate/') }}
        # Run the classifier from main, never from this checkout: a pull
        # request must not be able to rewrite the script that skips its own
        # required checks.
        run: |
          git fetch origin main --no-tags
          trusted="$(mktemp --suffix=.mjs)"
          echo "Retained trusted classifier: $trusted"
          if ! git show origin/main:scripts/ci-docs-only.mjs > "$trusted" 2>/dev/null; then
            echo "docs_only=false (classifier is not on main yet)"
            {
              echo "docs_only=false"
              echo "browser_tier=full"
              echo 'browser_specs=[]'
              echo "browser_performance=true"
              echo "verify_selection=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git diff --quiet origin/main -- scripts/ci-docs-only.mjs; then
            # Fixed CI-only allowlist + mode checks from trusted main. Never let
            # a changed classifier turn its own check into documentation-only.
            node --input-type=module - "$trusted" <<'BROWSER_BOOTSTRAP'
          import { execFileSync } from 'node:child_process'
          import { appendFileSync, readFileSync } from 'node:fs'
          import { pathToFileURL } from 'node:url'
          const { isDocsOnly, hasUnsafeModes } = await import(pathToFileURL(process.argv[2]).href)
          const infra = new Set([".github/workflows/browser-tests.yml", ".github/workflows/ui-policy.yml", "scripts/ci-docs-only.mjs", "scripts/ci-docs-only.test.mjs", "scripts/ci-browser-tests.mjs", "scripts/ci-browser-tests.test.mjs", "scripts/run-db-tests.mjs", "scripts/run-db-tests.test.mjs", "scripts/test-accounts/evidence.mjs", "AGENTS.md", "CONTRIBUTING.md"])
          const critical = ["routes.spec.ts", "sign-out.spec.ts", "test-account-pool.spec.ts", "workspace.spec.ts"]
          const integration = process.env.GITHUB_EVENT_NAME !== 'pull_request' || process.env.INTEGRATION_ACCEPTANCE === 'true'
          let ciOnly = false, performance = integration
          try {
            const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'))
            const base = event.pull_request?.base?.sha, head = event.pull_request?.head?.sha
            if (!base || !head || /^0+$/.test(base) || /^0+$/.test(head)) throw new Error('missing range')
            const options = { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] }
            const files = execFileSync('git', ['diff', '--no-renames', '-z', '--name-only', `${base}...${head}`], options).split('\0').filter(Boolean)
            const raw = execFileSync('git', ['diff', '--no-renames', '-z', '--raw', '--no-abbrev', `${base}...${head}`], options)
            ciOnly = !integration && files.length > 0 && !hasUnsafeModes(raw) && files.every(file => infra.has(file) || isDocsOnly([file]))
            performance ||= files.some(file => ['tests/e2e/navigation-performance.spec.ts', 'tests/e2e/agent-performance.spec.ts'].includes(file))
          } catch { /* Unknown ranges always run full functionality. */ }
          const tier = ciOnly ? 'smoke' : 'full', specs = ciOnly ? critical : []
          const outputs = `docs_only=false\nbrowser_tier=${tier}\nbrowser_specs=${JSON.stringify(specs)}\nbrowser_performance=${performance}\nverify_selection=true\n`
          appendFileSync(process.env.GITHUB_OUTPUT, outputs)
          console.log(`Trusted policy bootstrap: ${tier}; performance=${performance}; verify both subsets`)
          BROWSER_BOOTSTRAP
            exit 0
          fi
          node "$trusted"
          if [ "$INTEGRATION_ACCEPTANCE" = "true" ]; then
            # A consolidation must validate all functionality and performance
            # before merge, even when the normal PR classifier is narrower.
            {
              echo "docs_only=false"
              echo "browser_tier=full"
              echo 'browser_specs=[]'
              echo "browser_performance=true"
            } >> "$GITHUB_OUTPUT"
          fi

  browser-build:
    name: Browser build
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e-local-only
          POSTGRES_DB: mikka_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e -d mikka_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      E2E_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      MIKKA_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      BETTER_AUTH_URL: http://localhost:3100
      MIKKA_TEST_DEPLOYMENT_SHA: ${{ github.sha }}
      MIKKA_TEST_ENVIRONMENT_FILE: .cache/e2e/environment.json
      SLACK_BOT_TOKEN: ci-only-slack-bot-token
      SLACK_SIGNING_SECRET: ci-only-slack-signing-secret
      SLACK_APP_ID: A123
      SLACK_TEAM_ID: T123
      SLACK_BOT_USER_ID: U123
      SLACK_USER_BINDINGS: '{"U456":"ci-only-mikka-user"}'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/ci-docs-only.test.mjs scripts/ci-browser-tests.test.mjs
      - name: Generate ephemeral test-only auth secret
        run: |
          node --input-type=commonjs - <<'NODE'
          const { appendFileSync, writeSync } = require('node:fs')
          const secret = require('node:crypto').randomBytes(32).toString('hex')
          writeSync(1, `::add-mask::${secret}\n`)
          appendFileSync(process.env.GITHUB_ENV, `BETTER_AUTH_SECRET=${secret}\n`)
          const secretsKey = require('node:crypto').randomBytes(32).toString('hex')
          writeSync(1, `::add-mask::${secretsKey}\n`)
          appendFileSync(process.env.GITHUB_ENV, `WORKSPACE_SECRETS_KEY=${secretsKey}\n`)
          NODE
      - name: Bootstrap empty database using tracked migrations only
        run: node --experimental-strip-types --test tests/migrate-empty-db.test.mjs
        env:
          MIGRATION_BOOTSTRAP_CI: '1'
      - name: Apply tracked migrations to the disposable browser database
        run: pnpm migrate
        env:
          MIGRATE: '1'
      - run: pnpm test:e2e:setup
      - name: Bind the disposable test environment to the exact checkout
        run: node scripts/test-accounts/bootstrap.mjs --output .cache/e2e/environment.json
      - run: pnpm build
      - name: Package the build for the parallel test jobs
        run: tar -czf browser-build.tar.gz .next
      - uses: actions/upload-artifact@v4
        with:
          name: browser-build-${{ github.sha }}
          path: browser-build.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 1

  browser-runtime:
    name: Browser runtime gates
    needs: [changes, browser-build]
    if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true' && needs.browser-build.result == 'success' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e-local-only
          POSTGRES_DB: mikka_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e -d mikka_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      E2E_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      MIKKA_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      BETTER_AUTH_URL: http://localhost:3100
      MIKKA_TEST_DEPLOYMENT_SHA: ${{ github.sha }}
      MIKKA_TEST_ENVIRONMENT_FILE: .cache/e2e/environment.json
      SLACK_BOT_TOKEN: ci-only-slack-bot-token
      SLACK_SIGNING_SECRET: ci-only-slack-signing-secret
      SLACK_APP_ID: A123
      SLACK_TEAM_ID: T123
      SLACK_BOT_USER_ID: U123
      SLACK_USER_BINDINGS: '{"U456":"ci-only-mikka-user"}'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: browser-build-${{ github.sha }}
      - run: tar -xzf browser-build.tar.gz
      - name: Generate ephemeral test-only auth secret
        run: |
          node --input-type=commonjs - <<'NODE'
          const { appendFileSync, writeSync } = require('node:fs')
          const secret = require('node:crypto').randomBytes(32).toString('hex')
          writeSync(1, `::add-mask::${secret}\n`)
          appendFileSync(process.env.GITHUB_ENV, `BETTER_AUTH_SECRET=${secret}\n`)
          const secretsKey = require('node:crypto').randomBytes(32).toString('hex')
          writeSync(1, `::add-mask::${secretsKey}\n`)
          appendFileSync(process.env.GITHUB_ENV, `WORKSPACE_SECRETS_KEY=${secretsKey}\n`)
          NODE
      - name: Install Chromium and official system dependencies
        timeout-minutes: 15
        run: pnpm exec playwright install --with-deps chromium
      - name: Bootstrap empty database using tracked migrations only
        run: node --experimental-strip-types --test tests/migrate-empty-db.test.mjs
        env:
          MIGRATION_BOOTSTRAP_CI: '1'
      - name: Apply tracked migrations to the disposable browser database
        run: pnpm migrate
        env:
          MIGRATE: '1'
      - run: pnpm test:e2e:setup
      - name: Bind the disposable test environment to the exact checkout
        run: node scripts/test-accounts/bootstrap.mjs --output .cache/e2e/environment.json
      - name: Test account allocation across independent PostgreSQL clients
        run: pnpm test:test-accounts-db
      - name: Factory HTTP regressions against the built application (no skips)
        run: pnpm test:factory-http
      - name: Real HTTP authentication, account reuse and isolation
        run: node scripts/test-accounts/run-http.mjs
      - name: Navigation and Agent content ready within 1000ms (desktop + mobile, no retries)
        if: needs.changes.outputs.browser_performance == 'true'
        run: |
          umask 077
          mkdir -p .cache/e2e
          log_file=.cache/e2e/playwright-performance.log
          : > "$log_file"
          chmod 600 "$log_file"
          test_status=0
          pnpm test:performance --output=performance-results > "$log_file" 2>&1 || test_status=$?
          if ! node scripts/test-accounts/cli.mjs audit-evidence --evidence "$log_file"; then
            if [ "$test_status" -eq 0 ]; then test_status=1; fi
            exit "$test_status"
          fi
          cat "$log_file"
          exit "$test_status"
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-performance-report
      - name: MVP real-daemon core loop
        if: ${{ !cancelled() }}
        run: |
          umask 077
          mkdir -p .cache/e2e
          log_file=.cache/e2e/playwright-mvp.log
          : > "$log_file"
          chmod 600 "$log_file"
          test_status=0
          pnpm test:e2e:mvp > "$log_file" 2>&1 || test_status=$?
          if ! node scripts/test-accounts/cli.mjs audit-evidence --evidence "$log_file"; then
            if [ "$test_status" -eq 0 ]; then test_status=1; fi
            exit "$test_status"
          fi
          cat "$log_file"
          exit "$test_status"
        env:
          MIKKA_TEST_MODE: '1'
          MIKKA_MVP_E2E: '1'
          MIKKA_ISSUE_TOOLS_ENABLED: '1'
      - name: Audit MVP evidence before the remaining browser suite
        id: mvp-evidence-audit
        if: ${{ !cancelled() }}
        run: |
          node scripts/test-accounts/cli.mjs audit-evidence --evidence playwright-mvp-report
          node scripts/test-accounts/cli.mjs audit-evidence --evidence mvp-test-results
          node scripts/test-accounts/cli.mjs audit-evidence --evidence .cache/e2e/playwright-mvp.log
      - name: Preserve audited MVP evidence
        if: ${{ !cancelled() && steps.mvp-evidence-audit.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: mvp-test-report-${{ github.sha }}-runtime
          path: |
            playwright-mvp-report/
            mvp-test-results/
            .cache/e2e/playwright-mvp.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Scan account evidence before artifact upload
        id: account-evidence-audit
        if: ${{ !cancelled() }}
        run: node scripts/test-accounts/evidence.mjs
      - name: Upload runtime evidence
        if: ${{ !cancelled() && steps.account-evidence-audit.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report-runtime-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
            playwright-performance-report/
            performance-results/
            playwright-mvp-report/
            mvp-test-results/
            .cache/e2e/http-acceptance-summary.json
            .cache/e2e/account-http-evidence.json
            .cache/e2e/playwright-performance.log
            .cache/e2e/playwright-mvp.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  browser-selection:
    name: Browser selection validation
    needs: [changes, browser-build]
    if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.verify_selection == 'true' && needs.browser-build.result == 'success' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        plan: [smoke, targeted]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e-local-only
          POSTGRES_DB: mikka_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e -d mikka_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      E2E_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      MIKKA_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      BETTER_AUTH_URL: http://localhost:3100
      MIKKA_TEST_DEPLOYMENT_SHA: ${{ github.sha }}
      MIKKA_TEST_ENVIRONMENT_FILE: .cache/e2e/environment.json
      SLACK_BOT_TOKEN: ci-only-slack-bot-token
      SLACK_SIGNING_SECRET: ci-only-slack-signing-secret
      SLACK_APP_ID: A123
      SLACK_TEAM_ID: T123
      SLACK_BOT_USER_ID: U123
      SLACK_USER_BINDINGS: '{"U456":"ci-only-mikka-user"}'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: browser-build-${{ github.sha }}
      - run: tar -xzf browser-build.tar.gz
      - name: Generate ephemeral test-only auth secret
        run: |
          node --input-type=commonjs - <<'NODE'
          const { appendFileSync, writeSync } = require('node:fs')
          const secret = require('node:crypto').randomBytes(32).toString('hex')
          writeSync(1, `::add-mask::${secret}\n`)
          appendFileSync(process.env.GITHUB_ENV, `BETTER_AUTH_SECRET=${secret}\n`)
          const secretsKey = require('node:crypto').randomBytes(32).toString('hex')
          writeSync(1, `::add-mask::${secretsKey}\n`)
          appendFileSync(process.env.GITHUB_ENV, `WORKSPACE_SECRETS_KEY=${secretsKey}\n`)
          NODE
      - name: Install Chromium and official system dependencies
        timeout-minutes: 15
        run: pnpm exec playwright install --with-deps chromium
      - name: Bootstrap empty database using tracked migrations only
        run: node --experimental-strip-types --test tests/migrate-empty-db.test.mjs
        env:
          MIGRATION_BOOTSTRAP_CI: '1'
      - name: Apply tracked migrations to the disposable browser database
        run: pnpm migrate
        env:
          MIGRATE: '1'
      - run: pnpm test:e2e:setup
      - name: Bind the disposable test environment to the exact checkout
        run: node scripts/test-accounts/bootstrap.mjs --output .cache/e2e/environment.json
      - name: Test account allocation across independent PostgreSQL clients
        run: pnpm test:test-accounts-db
      - name: Validate one real browser subset
        run: |
          umask 077
          mkdir -p .cache/e2e
          log_file=.cache/e2e/playwright-selection.log
          : > "$log_file"
          chmod 600 "$log_file"
          test_status=0
          node scripts/ci-browser-tests.mjs --verify-selection-plan=${{ matrix.plan }} > "$log_file" 2>&1 || test_status=$?
          if ! node scripts/test-accounts/cli.mjs audit-evidence --evidence "$log_file"; then
            if [ "$test_status" -eq 0 ]; then test_status=1; fi
            exit "$test_status"
          fi
          cat "$log_file"
          exit "$test_status"
      - name: Scan account evidence before artifact upload
        id: account-evidence-audit
        if: ${{ !cancelled() }}
        run: node scripts/test-accounts/evidence.mjs
      - name: Upload selection evidence
        if: ${{ !cancelled() && steps.account-evidence-audit.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report-selection-${{ matrix.plan }}-${{ github.sha }}
          path: |
            playwright-selection-smoke-report/
            selection-smoke-results/
            playwright-selection-targeted-report/
            selection-targeted-results/
            .cache/e2e/playwright-selection.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  browser-e2e-full:
    name: Browser tests (selected layer)
    needs: [changes, browser-build]
    # A selection-policy change validates both subsets in browser-selection and
    # does not need this regression layer; the gate requires exactly one.
    if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true' && needs.browser-build.result == 'success' && !(needs.changes.outputs.verify_selection == 'true' && needs.changes.outputs.browser_tier != 'full') && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    # Four independent shards: each matrix job gets its own PostgreSQL service
    # and test-account directory, so no fixture or lease is shared across shards.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e-local-only
          POSTGRES_DB: mikka_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e -d mikka_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      E2E_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      MIKKA_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      BETTER_AUTH_URL: http://localhost:3100
      MIKKA_TEST_DEPLOYMENT_SHA: ${{ github.sha }}
      MIKKA_TEST_ENVIRONMENT_FILE: .cache/e2e/environment.json
      # Isolated Slack callback fixtures; these tests make no Slack API calls.
      SLACK_BOT_TOKEN: ci-only-slack-bot-token
      SLACK_SIGNING_SECRET: ci-only-slack-signing-secret
      SLACK_APP_ID: A123
      SLACK_TEAM_ID: T123
      SLACK_BOT_USER_ID: U123
      SLACK_USER_BINDINGS: '{"U456":"ci-only-mikka-user"}'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: browser-build-${{ github.sha }}
      - run: tar -xzf browser-build.tar.gz
      - name: Generate ephemeral test-only auth secret
        run: |
          node --input-type=commonjs - <<'NODE'
          const { appendFileSync, writeSync } = require('node:fs')
          const secret = require('node:crypto').randomBytes(32).toString('hex')
          writeSync(1, `::add-mask::${secret}\n`)
          appendFileSync(process.env.GITHUB_ENV, `BETTER_AUTH_SECRET=${secret}\n`)
          const secretsKey = require('node:crypto').randomBytes(32).toString('hex')
          writeSync(1, `::add-mask::${secretsKey}\n`)
          appendFileSync(process.env.GITHUB_ENV, `WORKSPACE_SECRETS_KEY=${secretsKey}\n`)
          NODE
      - name: Install Chromium and official system dependencies
        timeout-minutes: 15
        run: pnpm exec playwright install --with-deps chromium
      - name: Bootstrap empty database using tracked migrations only
        run: node --experimental-strip-types --test tests/migrate-empty-db.test.mjs
        env:
          MIGRATION_BOOTSTRAP_CI: '1'
      - name: Apply tracked migrations to the disposable browser database
        # The actual Coordinator needs the migration-owned indexes/constraints,
        # including NULLS NOT DISTINCT chat keys; schema-only seeding is not enough.
        run: pnpm migrate
        env:
          MIGRATE: '1'
      - run: pnpm test:e2e:setup
      - name: Bind the disposable test environment to the exact checkout
        run: node scripts/test-accounts/bootstrap.mjs --output .cache/e2e/environment.json
      - name: Test account allocation across independent PostgreSQL clients
        run: pnpm test:test-accounts-db
      - name: Browser functionality regression
        env:
          BROWSER_TIER: ${{ needs.changes.outputs.browser_tier }}
          BROWSER_SPECS: ${{ needs.changes.outputs.browser_specs }}
          # The real Factory claim/race specs must exercise the installed
          # lifecycle gates in this isolated process, not the default-off path.
          MIKKA_FACTORY_ROUTING_ENABLED: '1'
          MIKKA_FACTORY_LIFECYCLE_ENABLED: '1'
        if: ${{ !cancelled() }}
        run: |
          umask 077
          mkdir -p .cache/e2e
          log_file=.cache/e2e/playwright-browser.log
          : > "$log_file"
          chmod 600 "$log_file"
          test_status=0
          node scripts/ci-browser-tests.mjs --shard=${{ matrix.shard }}/4 > "$log_file" 2>&1 || test_status=$?
          if ! node scripts/test-accounts/cli.mjs audit-evidence --evidence "$log_file"; then
            if [ "$test_status" -eq 0 ]; then test_status=1; fi
            exit "$test_status"
          fi
          cat "$log_file"
          exit "$test_status"
      - name: Scan account evidence before artifact upload
        id: account-evidence-audit
        if: ${{ !cancelled() }}
        run: node scripts/test-accounts/evidence.mjs
      - name: Upload browser failure evidence
        if: ${{ !cancelled() && steps.account-evidence-audit.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report-shard-${{ matrix.shard }}-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
            .cache/e2e/http-acceptance-summary.json
            .cache/e2e/account-http-evidence.json
            .cache/e2e/playwright-browser.log
          # Only the explicit scanned paths above; never the private account directory.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  browser-e2e:
    # Preserve the protected check name. Classification errors or a missing
    # selected test job fail; documentation is the only test-free tier.
    name: Browser tests (before merge)
    needs: [changes, browser-build, browser-runtime, browser-selection, browser-e2e-full]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the selected browser layer
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUILD_RESULT: ${{ needs.browser-build.result }}
          RUNTIME_RESULT: ${{ needs.browser-runtime.result }}
          SELECTION_RESULT: ${{ needs.browser-selection.result }}
          FULL_RESULT: ${{ needs.browser-e2e-full.result }}
          BROWSER_TIER: ${{ needs.changes.outputs.browser_tier }}
          BROWSER_PERFORMANCE: ${{ needs.changes.outputs.browser_performance }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          EVENT_NAME: ${{ github.event_name }}
          VERIFY_SELECTION: ${{ needs.changes.outputs.verify_selection }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Changed files job did not succeed: $CHANGES_RESULT"
            exit 1
          fi
          if [ "$EVENT_NAME" != "pull_request" ] && [ "$DOCS_ONLY" != "true" ] && [ "$BROWSER_TIER:$BROWSER_PERFORMANCE" != "full:true" ]; then
            echo "Integration runs require full functionality and performance"
            exit 1
          fi
          case "$VERIFY_SELECTION" in true|false) ;; *) echo "Missing selection validation plan"; exit 1 ;; esac
          case "$BROWSER_TIER:$DOCS_ONLY:$BROWSER_PERFORMANCE" in
            docs:true:false) echo "Documentation-only change; no browser runtime changed."; exit 0 ;;
            smoke:false:false|targeted:false:false|full:false:false|full:false:true) ;;
            *) echo "Invalid browser test plan"; exit 1 ;;
          esac
          if [ "$BUILD_RESULT" != "success" ]; then
            echo "The build job did not succeed: $BUILD_RESULT"
            exit 1
          fi
          if [ "$RUNTIME_RESULT" != "success" ]; then
            echo "The runtime gates did not succeed: $RUNTIME_RESULT"
            exit 1
          fi
          if [ "$VERIFY_SELECTION" = "true" ]; then
            if [ "$SELECTION_RESULT" != "success" ]; then
              echo "Selection validation did not succeed: $SELECTION_RESULT"
              exit 1
            fi
          elif [ "$SELECTION_RESULT" != "skipped" ]; then
            echo "Selection validation ran without a policy change: $SELECTION_RESULT"
            exit 1
          fi
          if [ "$VERIFY_SELECTION" = "true" ] && [ "$BROWSER_TIER" != "full" ]; then
            if [ "$FULL_RESULT" != "skipped" ]; then
              echo "Policy validation must not run the regression layer: $FULL_RESULT"
              exit 1
            fi
          elif [ "$FULL_RESULT" != "success" ]; then
            echo "The selected browser layer did not succeed: $FULL_RESULT"
            exit 1
          fi
