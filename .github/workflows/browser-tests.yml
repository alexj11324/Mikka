name: Browser tests

# PRs run critical flows plus scoped regressions; unknown/shared changes run
# full functionality. Main, nightly and manual integration runs also measure
# performance. See CONTRIBUTING.md for the required, fail-closed gate policy.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    # Nightly full regression on main, 03:17 Beijing time.
    - cron: '17 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-tests-${{ github.event_name }}-${{ github.ref }}
  # Superseded PR pushes are cancelled; every commit on main finishes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.docs.outputs.docs_only }}
      browser_tier: ${{ steps.docs.outputs.browser_tier }}
      browser_specs: ${{ steps.docs.outputs.browser_specs }}
      browser_performance: ${{ steps.docs.outputs.browser_performance }}
      verify_selection: ${{ steps.docs.outputs.verify_selection }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: docs
        # Run the classifier from main, never from this checkout: a pull
        # request must not be able to rewrite the script that skips its own
        # required checks.
        run: |
          git fetch origin main --no-tags
          trusted="$(mktemp --suffix=.mjs)"
          echo "Retained trusted classifier: $trusted"
          if ! git show origin/main:scripts/ci-docs-only.mjs > "$trusted" 2>/dev/null; then
            echo "docs_only=false (classifier is not on main yet)"
            {
              echo "docs_only=false"
              echo "browser_tier=full"
              echo 'browser_specs=[]'
              echo "browser_performance=true"
              echo "verify_selection=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git diff --quiet origin/main -- scripts/ci-docs-only.mjs; then
            echo "docs_only=false (classifier differs from main)"
            {
              echo "docs_only=false"
              echo "browser_tier=full"
              echo 'browser_specs=[]'
              echo "browser_performance=true"
              echo "verify_selection=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node "$trusted"

  browser-e2e-full:
    name: Browser tests (selected layer)
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    # OS/browser setup took 9–10 minutes in runs 40320688470/40324658490.
    # Budget setup separately without weakening any Playwright test limits.
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e-local-only
          POSTGRES_DB: mikka_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e -d mikka_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      E2E_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      MIKKA_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      BETTER_AUTH_URL: http://localhost:3100
      MIKKA_TEST_DEPLOYMENT_SHA: ${{ github.sha }}
      MIKKA_TEST_ENVIRONMENT_FILE: .cache/e2e/environment.json
      # Isolated Slack callback fixtures; these tests make no Slack API calls.
      SLACK_BOT_TOKEN: ci-only-slack-bot-token
      SLACK_SIGNING_SECRET: ci-only-slack-signing-secret
      SLACK_APP_ID: A123
      SLACK_TEAM_ID: T123
      SLACK_BOT_USER_ID: U123
      SLACK_USER_BINDINGS: '{"U456":"ci-only-mikka-user"}'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/ci-docs-only.test.mjs scripts/ci-browser-tests.test.mjs
      - name: Generate ephemeral test-only auth secret
        run: |
          node --input-type=commonjs - <<'NODE'
          const { appendFileSync, writeSync } = require('node:fs')
          const secret = require('node:crypto').randomBytes(32).toString('hex')
          writeSync(1, `::add-mask::${secret}\n`)
          appendFileSync(process.env.GITHUB_ENV, `BETTER_AUTH_SECRET=${secret}\n`)
          NODE
      - name: Install Chromium and official system dependencies
        timeout-minutes: 15
        run: pnpm exec playwright install --with-deps chromium
      - name: Bootstrap empty database using tracked migrations only
        run: node --experimental-strip-types --test tests/migrate-empty-db.test.mjs
        env:
          MIGRATION_BOOTSTRAP_CI: '1'
      - run: pnpm test:e2e:setup
      - name: Bind the disposable test environment to the exact checkout
        run: node scripts/test-accounts/bootstrap.mjs --output .cache/e2e/environment.json
      - name: Test account allocation across independent PostgreSQL clients
        run: pnpm test:test-accounts-db
      - run: pnpm build
        id: build
      - name: Real HTTP authentication, account reuse and isolation
        run: node scripts/test-accounts/run-http.mjs
      - name: Validate real subset execution when browser selection policy changes
        if: needs.changes.outputs.verify_selection == 'true'
        run: |
          umask 077
          mkdir -p .cache/e2e
          log_file=.cache/e2e/playwright-selection.log
          : > "$log_file"
          chmod 600 "$log_file"
          test_status=0
          node scripts/ci-browser-tests.mjs --verify-selection > "$log_file" 2>&1 || test_status=$?
          if ! node scripts/test-accounts/cli.mjs audit-evidence --evidence "$log_file"; then
            if [ "$test_status" -eq 0 ]; then test_status=1; fi
            exit "$test_status"
          fi
          cat "$log_file"
          exit "$test_status"
      - name: Navigation and Agent content ready within 1000ms (desktop + mobile, no retries)
        if: needs.changes.outputs.browser_performance == 'true'
        run: |
          umask 077
          mkdir -p .cache/e2e
          log_file=.cache/e2e/playwright-performance.log
          : > "$log_file"
          chmod 600 "$log_file"
          test_status=0
          pnpm test:performance --output=performance-results > "$log_file" 2>&1 || test_status=$?
          if ! node scripts/test-accounts/cli.mjs audit-evidence --evidence "$log_file"; then
            if [ "$test_status" -eq 0 ]; then test_status=1; fi
            exit "$test_status"
          fi
          cat "$log_file"
          exit "$test_status"
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-performance-report
      - name: Browser functionality regression
        env:
          BROWSER_TIER: ${{ needs.changes.outputs.browser_tier }}
          BROWSER_SPECS: ${{ needs.changes.outputs.browser_specs }}
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          umask 077
          mkdir -p .cache/e2e
          log_file=.cache/e2e/playwright-browser.log
          : > "$log_file"
          chmod 600 "$log_file"
          test_status=0
          node scripts/ci-browser-tests.mjs > "$log_file" 2>&1 || test_status=$?
          if ! node scripts/test-accounts/cli.mjs audit-evidence --evidence "$log_file"; then
            if [ "$test_status" -eq 0 ]; then test_status=1; fi
            exit "$test_status"
          fi
          cat "$log_file"
          exit "$test_status"
      - name: Scan account evidence before artifact upload
        id: account-evidence-audit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/test-accounts/evidence.mjs
      - name: Upload browser failure evidence
        if: ${{ !cancelled() && steps.account-evidence-audit.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
            playwright-performance-report/
            performance-results/
            playwright-selection-smoke-report/
            selection-smoke-results/
            playwright-selection-targeted-report/
            selection-targeted-results/
            .cache/e2e/http-acceptance-summary.json
            .cache/e2e/account-http-evidence.json
            .cache/e2e/playwright-selection.log
            .cache/e2e/playwright-performance.log
            .cache/e2e/playwright-browser.log
          # Only the explicit scanned paths above; never the private account directory.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  browser-e2e:
    # Preserve the protected check name. Classification errors or a missing
    # selected test job fail; documentation is the only test-free tier.
    name: Browser tests (before merge)
    needs: [changes, browser-e2e-full]
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the selected browser layer
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          FULL_RESULT: ${{ needs.browser-e2e-full.result }}
          BROWSER_TIER: ${{ needs.changes.outputs.browser_tier }}
          BROWSER_PERFORMANCE: ${{ needs.changes.outputs.browser_performance }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Changed files job did not succeed: $CHANGES_RESULT"
            exit 1
          fi
          if [ "$EVENT_NAME" != "pull_request" ] && [ "$BROWSER_TIER:$BROWSER_PERFORMANCE" != "full:true" ]; then
            echo "Integration runs require full functionality and performance"
            exit 1
          fi
          case "$BROWSER_TIER:$DOCS_ONLY:$BROWSER_PERFORMANCE" in
            docs:true:false) echo "Documentation-only change; no browser runtime changed."; exit 0 ;;
            smoke:false:false|targeted:false:false|full:false:false|full:false:true) ;;
            *) echo "Invalid browser test plan"; exit 1 ;;
          esac
          if [ "$FULL_RESULT" != "success" ]; then
            echo "The selected browser layer did not succeed: $FULL_RESULT"
            exit 1
          fi
