name: Browser tests

# Three tiers (CONTRIBUTING.md, "How changes are tested"):
# - pull requests: the @smoke set plus the complete specs of the areas the change
#   touches, in one job (install, build, start, run). Performance runs when a
#   change touches what the budgets measure.
# - push to main: the functional spec files on two shards. A red run opens or
#   updates one issue that names the merged pull request's author.
# - nightly and manual runs: every spec, including visual, crawler and slower
#   specs, plus performance, on four shards. integrate/* pull requests run this
#   tier before merge. Docs-only changes keep only the small gate jobs.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    # Nightly full regression on main: 19:17 UTC = 03:17 Beijing = 12:17 Pacific (PDT).
    - cron: '17 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep each main commit's pending/running postmerge verification; otherwise
  # GitHub concurrency would replace an older pending run with a newer one.
  group: browser-tests-${{ github.event_name }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # A cache restore that fails (e.g. the account's cache egress limit) would
  # otherwise hang for actions/cache's 10-minute default before falling back
  # to a normal install, which outlasts the short jobs' own timeouts.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
  # Ephemeral CI registration fixtures share one loopback IP. Keep finite
  # limits while leaving the production defaults at 5 signups/IP/hour.
  MIKKA_SIGNUP_IP_HOURLY: '1000'
  MIKKA_SIGNUP_GLOBAL_HOURLY: '10000'
  MIKKA_VERIFICATION_IP_HOURLY: '1000'
  MIKKA_VERIFICATION_GLOBAL_HOURLY: '10000'

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.docs.outputs.docs_only }}
      browser_tier: ${{ steps.docs.outputs.browser_tier }}
      browser_specs: ${{ steps.docs.outputs.browser_specs }}
      browser_performance: ${{ steps.docs.outputs.browser_performance }}
      verify_selection: ${{ steps.docs.outputs.verify_selection }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: docs
        env:
          INTEGRATION_ACCEPTANCE: ${{ startsWith(github.head_ref, 'integrate/') }}
        # Run the classifier from main, never from this checkout: a pull
        # request must not be able to rewrite the script that skips its own
        # required checks.
        run: |
          git fetch origin main --no-tags
          trusted="$(mktemp --suffix=.mjs)"
          echo "Retained trusted classifier: $trusted"
          if ! git show origin/main:scripts/ci-docs-only.mjs > "$trusted" 2>/dev/null; then
            echo "docs_only=false (classifier is not on main yet)"
            {
              echo "docs_only=false"
              echo "browser_tier=full"
              echo 'browser_specs=[]'
              echo "browser_performance=true"
              echo "verify_selection=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git diff --quiet origin/main -- scripts/ci-docs-only.mjs; then
            # Fixed CI-only allowlist + mode checks from trusted main. A changed
            # classifier never narrows its own run: CI-only edits take the smoke
            # tier, anything else takes full, and a pull request validates the
            # subsets as well.
            node --input-type=module - "$trusted" <<'BROWSER_BOOTSTRAP'
          import { execFileSync } from 'node:child_process'
          import { appendFileSync, readFileSync } from 'node:fs'
          import { pathToFileURL } from 'node:url'
          const { isDocsOnly, hasUnsafeModes } = await import(pathToFileURL(process.argv[2]).href)
          const infra = new Set([".github/workflows/browser-tests.yml", ".github/workflows/ui-policy.yml", ".github/actions/pnpm-install/action.yml", "scripts/ci-docs-only.mjs", "scripts/ci-docs-only.test.mjs", "scripts/ci-browser-tests.mjs", "scripts/ci-browser-tests.test.mjs", "scripts/run-db-tests.mjs", "scripts/run-db-tests.test.mjs", "scripts/test-accounts/evidence.mjs", "AGENTS.md", "CONTRIBUTING.md"])
          const pullRequest = process.env.GITHUB_EVENT_NAME === 'pull_request'
          const integration = !pullRequest || process.env.INTEGRATION_ACCEPTANCE === 'true'
          let ciOnly = false, performance = integration
          try {
            const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'))
            const base = event.pull_request?.base?.sha, head = event.pull_request?.head?.sha
            if (!base || !head || /^0+$/.test(base) || /^0+$/.test(head)) throw new Error('missing range')
            const options = { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] }
            const files = execFileSync('git', ['diff', '--no-renames', '-z', '--name-only', `${base}...${head}`], options).split('\0').filter(Boolean)
            const raw = execFileSync('git', ['diff', '--no-renames', '-z', '--raw', '--no-abbrev', `${base}...${head}`], options)
            ciOnly = !integration && files.length > 0 && !hasUnsafeModes(raw) && files.every(file => infra.has(file) || isDocsOnly([file]))
            performance ||= files.some(file => ['tests/e2e/navigation-performance.spec.ts', 'tests/e2e/agent-performance.spec.ts'].includes(file))
          } catch { /* Unknown ranges always run full functionality. */ }
          const tier = ciOnly ? 'smoke' : 'full'
          const outputs = `docs_only=false\nbrowser_tier=${tier}\nbrowser_specs=[]\nbrowser_performance=${performance}\nverify_selection=${pullRequest}\n`
          appendFileSync(process.env.GITHUB_OUTPUT, outputs)
          console.log(`Trusted policy bootstrap: ${tier}; performance=${performance}; verify subsets=${pullRequest}`)
          BROWSER_BOOTSTRAP
            exit 0
          fi
          node "$trusted"
          if [ "$INTEGRATION_ACCEPTANCE" = "true" ]; then
            # A consolidation must validate all functionality and performance
            # before merge, even when the normal PR classifier is narrower.
            {
              echo "docs_only=false"
              echo "browser_tier=full"
              echo 'browser_specs=[]'
              echo "browser_performance=true"
            } >> "$GITHUB_OUTPUT"
          fi

  browser-pr:
    # Pull request tier: one runner installs, builds, starts and runs the smoke
    # set, the targeted specs and the runtime gates. No artifact round trip.
    name: Browser tests (pull request)
    needs: changes
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft && needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true' && (needs.changes.outputs.browser_tier == 'smoke' || needs.changes.outputs.browser_tier == 'targeted')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e-local-only
          POSTGRES_DB: mikka_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e -d mikka_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      E2E_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      MIKKA_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      BETTER_AUTH_URL: http://localhost:3100
      MIKKA_TEST_DEPLOYMENT_SHA: ${{ github.sha }}
      MIKKA_TEST_ENVIRONMENT_FILE: .cache/e2e/environment.json
      # Isolated Slack callback fixtures; these tests make no Slack API calls.
      SLACK_BOT_TOKEN: ci-only-slack-bot-token
      SLACK_SIGNING_SECRET: ci-only-slack-signing-secret
      SLACK_APP_ID: A123
      SLACK_TEAM_ID: T123
      SLACK_BOT_USER_ID: U123
      SLACK_USER_BINDINGS: '{"U456":"ci-only-mikka-user"}'
      NEXT_TELEMETRY_DISABLED: '1'
      # Cloudflare's documented public test site key (always passes). Baked into
      # the build so the sign-up form renders the widget and sends a token; the
      # matching test secret is given only to the keyed sign-up run below.
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pnpm-install
      - name: Generate ephemeral test-only auth secret
        run: |
          node --input-type=commonjs - <<'NODE'
          const { appendFileSync, writeSync } = require('node:fs')
          const secret = require('node:crypto').randomBytes(32).toString('hex')
          writeSync(1, `::add-mask::${secret}\n`)
          appendFileSync(process.env.GITHUB_ENV, `BETTER_AUTH_SECRET=${secret}\n`)
          const secretsKey = require('node:crypto').randomBytes(32).toString('hex')
          writeSync(1, `::add-mask::${secretsKey}\n`)
          appendFileSync(process.env.GITHUB_ENV, `WORKSPACE_SECRETS_KEY=${secretsKey}\n`)
          NODE
      - name: Install Chromium and official system dependencies
        timeout-minutes: 15
        run: pnpm exec playwright install --with-deps chromium
      - name: Bootstrap empty database using tracked migrations only
        run: node --experimental-strip-types --test tests/migrate-empty-db.test.mjs
        env:
          MIGRATION_BOOTSTRAP_CI: '1'
      - name: Apply tracked migrations to the disposable browser database
        # The actual Coordinator needs the migration-owned indexes/constraints,
        # including NULLS NOT DISTINCT chat keys; schema-only seeding is not enough.
        run: pnpm migrate
        env:
          MIGRATE: '1'
      - run: pnpm test:e2e:setup
      - name: Bind the disposable test environment to the exact checkout
        run: node scripts/test-accounts/bootstrap.mjs --output .cache/e2e/environment.json
      - name: Build the application (lint runs once, in the CI workflow's UI policy job)
        run: |
          node scripts/build-subscription-worker.mjs
          pnpm generate:agent-ui
          pnpm exec next build
      - name: Test account allocation across independent PostgreSQL clients
        run: pnpm test:test-accounts-db
      - name: Factory HTTP regressions against the built application (no skips)
        run: pnpm test:factory-http
      - name: Real HTTP authentication, account reuse and isolation
        run: node scripts/test-accounts/run-http.mjs
      - name: MVP real-daemon core loop (smoke)
        if: ${{ !cancelled() }}
        run: |
          umask 077
          mkdir -p .cache/e2e
          log_file=.cache/e2e/playwright-mvp.log
          : > "$log_file"
          chmod 600 "$log_file"
          test_status=0
          pnpm test:e2e:mvp --grep @smoke > "$log_file" 2>&1 || test_status=$?
          if ! node scripts/test-accounts/cli.mjs audit-evidence --evidence "$log_file"; then
            if [ "$test_status" -eq 0 ]; then test_status=1; fi
            exit "$test_status"
          fi
          cat "$log_file"
          exit "$test_status"
        env:
          MIKKA_TEST_MODE: '1'
          MIKKA_MVP_E2E: '1'
          MIKKA_ISSUE_TOOLS_ENABLED: '1'
      - name: Audit MVP evidence before the remaining browser suite
        id: mvp-evidence-audit
        if: ${{ !cancelled() }}
        run: |
          node scripts/test-accounts/cli.mjs audit-evidence --evidence playwright-mvp-report
          node scripts/test-accounts/cli.mjs audit-evidence --evidence mvp-test-results
          node scripts/test-accounts/cli.mjs audit-evidence --evidence .cache/e2e/playwright-mvp.log
      - name: Preserve audited MVP evidence
        if: ${{ !cancelled() && steps.mvp-evidence-audit.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: mvp-test-report-${{ github.sha }}-pull-request
          path: |
            playwright-mvp-report/
            mvp-test-results/
            .cache/e2e/playwright-mvp.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Browser smoke and targeted specs
        if: ${{ !cancelled() }}
        env:
          BROWSER_TIER: ${{ needs.changes.outputs.browser_tier }}
          BROWSER_SPECS: ${{ needs.changes.outputs.browser_specs }}
          # The real Factory claim/race specs must exercise the installed
          # lifecycle gates in this isolated process, not the default-off path.
          MIKKA_FACTORY_ROUTING_ENABLED: '1'
          MIKKA_FACTORY_LIFECYCLE_ENABLED: '1'
        run: |
          umask 077
          mkdir -p .cache/e2e
          log_file=.cache/e2e/playwright-browser.log
          : > "$log_file"
          chmod 600 "$log_file"
          test_status=0
          node scripts/ci-browser-tests.mjs > "$log_file" 2>&1 || test_status=$?
          if ! node scripts/test-accounts/cli.mjs audit-evidence --evidence "$log_file"; then
            if [ "$test_status" -eq 0 ]; then test_status=1; fi
            exit "$test_status"
          fi
          cat "$log_file"
          exit "$test_status"
      - name: Sign-up through Cloudflare Turnstile with the public test keys
        if: ${{ !cancelled() }}
        run: |
          # The keyed run needs a sign-up form that sends the token (#554). Until
          # that is on the branch, the build has no widget and the run would
          # only prove that a token-less sign-up is refused.
          if ! grep -rqs --include='*.ts' --include='*.tsx' NEXT_PUBLIC_TURNSTILE_SITE_KEY components app lib; then
            echo "::notice::The sign-up form does not read NEXT_PUBLIC_TURNSTILE_SITE_KEY yet; the keyed sign-up run starts once it does."
            exit 0
          fi
          umask 077
          mkdir -p .cache/e2e
          log_file=.cache/e2e/playwright-turnstile.log
          : > "$log_file"
          chmod 600 "$log_file"
          test_status=0
          node scripts/ci-browser-tests.mjs --turnstile > "$log_file" 2>&1 || test_status=$?
          if ! node scripts/test-accounts/cli.mjs audit-evidence --evidence "$log_file"; then
            if [ "$test_status" -eq 0 ]; then test_status=1; fi
            exit "$test_status"
          fi
          cat "$log_file"
          exit "$test_status"
      - name: Navigation and Agent content ready within 1000ms (desktop + mobile, no retries)
        if: ${{ !cancelled() && needs.changes.outputs.browser_performance == 'true' }}
        run: |
          umask 077
          mkdir -p .cache/e2e
          log_file=.cache/e2e/playwright-performance.log
          : > "$log_file"
          chmod 600 "$log_file"
          test_status=0
          pnpm test:performance --output=performance-results > "$log_file" 2>&1 || test_status=$?
          if ! node scripts/test-accounts/cli.mjs audit-evidence --evidence "$log_file"; then
            if [ "$test_status" -eq 0 ]; then test_status=1; fi
            exit "$test_status"
          fi
          cat "$log_file"
          exit "$test_status"
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-performance-report
      - name: Scan account evidence before artifact upload
        id: account-evidence-audit
        if: ${{ !cancelled() }}
        run: node scripts/test-accounts/evidence.mjs
      - name: Upload browser evidence
        if: ${{ !cancelled() && steps.account-evidence-audit.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report-pull-request-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
            playwright-turnstile-report/
            turnstile-results/
            playwright-performance-report/
            performance-results/
            .cache/e2e/http-acceptance-summary.json
            .cache/e2e/account-http-evidence.json
            .cache/e2e/playwright-browser.log
            .cache/e2e/playwright-turnstile.log
            .cache/e2e/playwright-performance.log
          # Only the explicit scanned paths above; never the private account directory.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  browser-selection:
    # Selection-policy pull requests also run the union of every scoped spec
    # (plus the smoke tag) as a real subset, on its own runner.
    name: Browser selection validation
    needs: changes
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft && needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.verify_selection == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e-local-only
          POSTGRES_DB: mikka_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e -d mikka_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      E2E_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      MIKKA_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      BETTER_AUTH_URL: http://localhost:3100
      MIKKA_TEST_DEPLOYMENT_SHA: ${{ github.sha }}
      MIKKA_TEST_ENVIRONMENT_FILE: .cache/e2e/environment.json
      SLACK_BOT_TOKEN: ci-only-slack-bot-token
      SLACK_SIGNING_SECRET: ci-only-slack-signing-secret
      SLACK_APP_ID: A123
      SLACK_TEAM_ID: T123
      SLACK_BOT_USER_ID: U123
      SLACK_USER_BINDINGS: '{"U456":"ci-only-mikka-user"}'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pnpm-install
      - name: Generate ephemeral test-only auth secret
        run: |
          node --input-type=commonjs - <<'NODE'
          const { appendFileSync, writeSync } = require('node:fs')
          const secret = require('node:crypto').randomBytes(32).toString('hex')
          writeSync(1, `::add-mask::${secret}\n`)
          appendFileSync(process.env.GITHUB_ENV, `BETTER_AUTH_SECRET=${secret}\n`)
          const secretsKey = require('node:crypto').randomBytes(32).toString('hex')
          writeSync(1, `::add-mask::${secretsKey}\n`)
          appendFileSync(process.env.GITHUB_ENV, `WORKSPACE_SECRETS_KEY=${secretsKey}\n`)
          NODE
      - name: Install Chromium and official system dependencies
        timeout-minutes: 15
        run: pnpm exec playwright install --with-deps chromium
      - name: Bootstrap empty database using tracked migrations only
        run: node --experimental-strip-types --test tests/migrate-empty-db.test.mjs
        env:
          MIGRATION_BOOTSTRAP_CI: '1'
      - name: Apply tracked migrations to the disposable browser database
        run: pnpm migrate
        env:
          MIGRATE: '1'
      - run: pnpm test:e2e:setup
      - name: Bind the disposable test environment to the exact checkout
        run: node scripts/test-accounts/bootstrap.mjs --output .cache/e2e/environment.json
      - name: Build the application
        run: |
          node scripts/build-subscription-worker.mjs
          pnpm generate:agent-ui
          pnpm exec next build
      - name: Test account allocation across independent PostgreSQL clients
        run: pnpm test:test-accounts-db
      - name: Validate the targeted browser subset
        env:
          MIKKA_FACTORY_ROUTING_ENABLED: '1'
          MIKKA_FACTORY_LIFECYCLE_ENABLED: '1'
        run: |
          umask 077
          mkdir -p .cache/e2e
          log_file=.cache/e2e/playwright-selection.log
          : > "$log_file"
          chmod 600 "$log_file"
          test_status=0
          node scripts/ci-browser-tests.mjs --verify-selection-plan=targeted > "$log_file" 2>&1 || test_status=$?
          if ! node scripts/test-accounts/cli.mjs audit-evidence --evidence "$log_file"; then
            if [ "$test_status" -eq 0 ]; then test_status=1; fi
            exit "$test_status"
          fi
          cat "$log_file"
          exit "$test_status"
      - name: Scan account evidence before artifact upload
        id: account-evidence-audit
        if: ${{ !cancelled() }}
        run: node scripts/test-accounts/evidence.mjs
      - name: Upload selection evidence
        if: ${{ !cancelled() && steps.account-evidence-audit.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report-selection-targeted-${{ github.sha }}
          path: |
            playwright-selection-targeted-report/
            selection-targeted-results/
            .cache/e2e/playwright-selection.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  browser-build:
    # Main and full tiers: build once, reuse the .next artifact on every shard.
    name: Browser build
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true' && (needs.changes.outputs.browser_tier == 'main' || needs.changes.outputs.browser_tier == 'full') && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e-local-only
          POSTGRES_DB: mikka_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e -d mikka_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      E2E_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      MIKKA_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      BETTER_AUTH_URL: http://localhost:3100
      MIKKA_TEST_DEPLOYMENT_SHA: ${{ github.sha }}
      MIKKA_TEST_ENVIRONMENT_FILE: .cache/e2e/environment.json
      SLACK_BOT_TOKEN: ci-only-slack-bot-token
      SLACK_SIGNING_SECRET: ci-only-slack-signing-secret
      SLACK_APP_ID: A123
      SLACK_TEAM_ID: T123
      SLACK_BOT_USER_ID: U123
      SLACK_USER_BINDINGS: '{"U456":"ci-only-mikka-user"}'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pnpm-install
      - name: Generate ephemeral test-only auth secret
        run: |
          node --input-type=commonjs - <<'NODE'
          const { appendFileSync, writeSync } = require('node:fs')
          const secret = require('node:crypto').randomBytes(32).toString('hex')
          writeSync(1, `::add-mask::${secret}\n`)
          appendFileSync(process.env.GITHUB_ENV, `BETTER_AUTH_SECRET=${secret}\n`)
          const secretsKey = require('node:crypto').randomBytes(32).toString('hex')
          writeSync(1, `::add-mask::${secretsKey}\n`)
          appendFileSync(process.env.GITHUB_ENV, `WORKSPACE_SECRETS_KEY=${secretsKey}\n`)
          NODE
      - name: Bootstrap empty database using tracked migrations only
        run: node --experimental-strip-types --test tests/migrate-empty-db.test.mjs
        env:
          MIGRATION_BOOTSTRAP_CI: '1'
      - name: Apply tracked migrations to the disposable browser database
        run: pnpm migrate
        env:
          MIGRATE: '1'
      - run: pnpm test:e2e:setup
      - name: Bind the disposable test environment to the exact checkout
        run: node scripts/test-accounts/bootstrap.mjs --output .cache/e2e/environment.json
      - name: Build the application (lint runs once, in the CI workflow's UI policy job)
        run: |
          node scripts/build-subscription-worker.mjs
          pnpm generate:agent-ui
          pnpm exec next build
      - name: Package the build for the parallel test jobs
        run: tar -czf browser-build.tar.gz .next
      - uses: actions/upload-artifact@v4
        with:
          name: browser-build-${{ github.sha }}
          path: browser-build.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 1

  browser-runtime:
    name: Browser runtime gates
    needs: [changes, browser-build]
    if: needs.changes.result == 'success' && needs.browser-build.result == 'success' && (needs.changes.outputs.browser_tier == 'main' || needs.changes.outputs.browser_tier == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e-local-only
          POSTGRES_DB: mikka_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e -d mikka_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      E2E_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      MIKKA_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      BETTER_AUTH_URL: http://localhost:3100
      MIKKA_TEST_DEPLOYMENT_SHA: ${{ github.sha }}
      MIKKA_TEST_ENVIRONMENT_FILE: .cache/e2e/environment.json
      SLACK_BOT_TOKEN: ci-only-slack-bot-token
      SLACK_SIGNING_SECRET: ci-only-slack-signing-secret
      SLACK_APP_ID: A123
      SLACK_TEAM_ID: T123
      SLACK_BOT_USER_ID: U123
      SLACK_USER_BINDINGS: '{"U456":"ci-only-mikka-user"}'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pnpm-install
      - uses: actions/download-artifact@v4
        with:
          name: browser-build-${{ github.sha }}
      - run: tar -xzf browser-build.tar.gz
      - name: Generate ephemeral test-only auth secret
        run: |
          node --input-type=commonjs - <<'NODE'
          const { appendFileSync, writeSync } = require('node:fs')
          const secret = require('node:crypto').randomBytes(32).toString('hex')
          writeSync(1, `::add-mask::${secret}\n`)
          appendFileSync(process.env.GITHUB_ENV, `BETTER_AUTH_SECRET=${secret}\n`)
          const secretsKey = require('node:crypto').randomBytes(32).toString('hex')
          writeSync(1, `::add-mask::${secretsKey}\n`)
          appendFileSync(process.env.GITHUB_ENV, `WORKSPACE_SECRETS_KEY=${secretsKey}\n`)
          NODE
      - name: Install Chromium and official system dependencies
        timeout-minutes: 15
        run: pnpm exec playwright install --with-deps chromium
      - name: Bootstrap empty database using tracked migrations only
        run: node --experimental-strip-types --test tests/migrate-empty-db.test.mjs
        env:
          MIGRATION_BOOTSTRAP_CI: '1'
      - name: Apply tracked migrations to the disposable browser database
        run: pnpm migrate
        env:
          MIGRATE: '1'
      - run: pnpm test:e2e:setup
      - name: Bind the disposable test environment to the exact checkout
        run: node scripts/test-accounts/bootstrap.mjs --output .cache/e2e/environment.json
      - name: Test account allocation across independent PostgreSQL clients
        run: pnpm test:test-accounts-db
      - name: Factory HTTP regressions against the built application (no skips)
        run: pnpm test:factory-http
      - name: Real HTTP authentication, account reuse and isolation
        run: node scripts/test-accounts/run-http.mjs
      - name: Navigation and Agent content ready within 1000ms (desktop + mobile, no retries)
        if: needs.changes.outputs.browser_performance == 'true'
        run: |
          umask 077
          mkdir -p .cache/e2e
          log_file=.cache/e2e/playwright-performance.log
          : > "$log_file"
          chmod 600 "$log_file"
          test_status=0
          pnpm test:performance --output=performance-results > "$log_file" 2>&1 || test_status=$?
          if ! node scripts/test-accounts/cli.mjs audit-evidence --evidence "$log_file"; then
            if [ "$test_status" -eq 0 ]; then test_status=1; fi
            exit "$test_status"
          fi
          cat "$log_file"
          exit "$test_status"
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-performance-report
      - name: MVP real-daemon core loop
        if: ${{ !cancelled() }}
        run: |
          umask 077
          mkdir -p .cache/e2e
          log_file=.cache/e2e/playwright-mvp.log
          : > "$log_file"
          chmod 600 "$log_file"
          test_status=0
          pnpm test:e2e:mvp > "$log_file" 2>&1 || test_status=$?
          if ! node scripts/test-accounts/cli.mjs audit-evidence --evidence "$log_file"; then
            if [ "$test_status" -eq 0 ]; then test_status=1; fi
            exit "$test_status"
          fi
          cat "$log_file"
          exit "$test_status"
        env:
          MIKKA_TEST_MODE: '1'
          MIKKA_MVP_E2E: '1'
          MIKKA_ISSUE_TOOLS_ENABLED: '1'
      - name: Audit MVP evidence before the remaining browser suite
        id: mvp-evidence-audit
        if: ${{ !cancelled() }}
        run: |
          node scripts/test-accounts/cli.mjs audit-evidence --evidence playwright-mvp-report
          node scripts/test-accounts/cli.mjs audit-evidence --evidence mvp-test-results
          node scripts/test-accounts/cli.mjs audit-evidence --evidence .cache/e2e/playwright-mvp.log
      - name: Preserve audited MVP evidence
        if: ${{ !cancelled() && steps.mvp-evidence-audit.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: mvp-test-report-${{ github.sha }}-runtime
          path: |
            playwright-mvp-report/
            mvp-test-results/
            .cache/e2e/playwright-mvp.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Scan account evidence before artifact upload
        id: account-evidence-audit
        if: ${{ !cancelled() }}
        run: node scripts/test-accounts/evidence.mjs
      - name: Upload runtime evidence
        if: ${{ !cancelled() && steps.account-evidence-audit.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report-runtime-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
            playwright-performance-report/
            performance-results/
            playwright-mvp-report/
            mvp-test-results/
            .cache/e2e/http-acceptance-summary.json
            .cache/e2e/account-http-evidence.json
            .cache/e2e/playwright-performance.log
            .cache/e2e/playwright-mvp.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  browser-e2e-full:
    name: Browser tests (selected layer)
    needs: [changes, browser-build]
    if: needs.changes.result == 'success' && needs.browser-build.result == 'success' && (needs.changes.outputs.browser_tier == 'main' || needs.changes.outputs.browser_tier == 'full')
    runs-on: ubuntu-latest
    # Independent shards (two for main, four for full): each matrix job gets its
    # own PostgreSQL service and test-account directory, so no fixture or lease
    # is shared across shards.
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.browser_tier == 'main' && '[1, 2]' || '[1, 2, 3, 4]') }}
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e-local-only
          POSTGRES_DB: mikka_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e -d mikka_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      E2E_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      MIKKA_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      BETTER_AUTH_URL: http://localhost:3100
      MIKKA_TEST_DEPLOYMENT_SHA: ${{ github.sha }}
      MIKKA_TEST_ENVIRONMENT_FILE: .cache/e2e/environment.json
      # Isolated Slack callback fixtures; these tests make no Slack API calls.
      SLACK_BOT_TOKEN: ci-only-slack-bot-token
      SLACK_SIGNING_SECRET: ci-only-slack-signing-secret
      SLACK_APP_ID: A123
      SLACK_TEAM_ID: T123
      SLACK_BOT_USER_ID: U123
      SLACK_USER_BINDINGS: '{"U456":"ci-only-mikka-user"}'
      NEXT_TELEMETRY_DISABLED: '1'
      BROWSER_SHARDS: ${{ needs.changes.outputs.browser_tier == 'main' && '2' || '4' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pnpm-install
      - uses: actions/download-artifact@v4
        with:
          name: browser-build-${{ github.sha }}
      - run: tar -xzf browser-build.tar.gz
      - name: Generate ephemeral test-only auth secret
        run: |
          node --input-type=commonjs - <<'NODE'
          const { appendFileSync, writeSync } = require('node:fs')
          const secret = require('node:crypto').randomBytes(32).toString('hex')
          writeSync(1, `::add-mask::${secret}\n`)
          appendFileSync(process.env.GITHUB_ENV, `BETTER_AUTH_SECRET=${secret}\n`)
          const secretsKey = require('node:crypto').randomBytes(32).toString('hex')
          writeSync(1, `::add-mask::${secretsKey}\n`)
          appendFileSync(process.env.GITHUB_ENV, `WORKSPACE_SECRETS_KEY=${secretsKey}\n`)
          NODE
      - name: Install Chromium and official system dependencies
        timeout-minutes: 15
        run: pnpm exec playwright install --with-deps chromium
      - name: Bootstrap empty database using tracked migrations only
        run: node --experimental-strip-types --test tests/migrate-empty-db.test.mjs
        env:
          MIGRATION_BOOTSTRAP_CI: '1'
      - name: Apply tracked migrations to the disposable browser database
        # The actual Coordinator needs the migration-owned indexes/constraints,
        # including NULLS NOT DISTINCT chat keys; schema-only seeding is not enough.
        run: pnpm migrate
        env:
          MIGRATE: '1'
      - run: pnpm test:e2e:setup
      - name: Bind the disposable test environment to the exact checkout
        run: node scripts/test-accounts/bootstrap.mjs --output .cache/e2e/environment.json
      - name: Test account allocation across independent PostgreSQL clients
        run: pnpm test:test-accounts-db
      - name: Browser functionality regression
        env:
          BROWSER_TIER: ${{ needs.changes.outputs.browser_tier }}
          BROWSER_SPECS: ${{ needs.changes.outputs.browser_specs }}
          # The real Factory claim/race specs must exercise the installed
          # lifecycle gates in this isolated process, not the default-off path.
          MIKKA_FACTORY_ROUTING_ENABLED: '1'
          MIKKA_FACTORY_LIFECYCLE_ENABLED: '1'
        if: ${{ !cancelled() }}
        run: |
          umask 077
          mkdir -p .cache/e2e
          log_file=.cache/e2e/playwright-browser.log
          : > "$log_file"
          chmod 600 "$log_file"
          test_status=0
          node scripts/ci-browser-tests.mjs --shard=${{ matrix.shard }}/$BROWSER_SHARDS > "$log_file" 2>&1 || test_status=$?
          if ! node scripts/test-accounts/cli.mjs audit-evidence --evidence "$log_file"; then
            if [ "$test_status" -eq 0 ]; then test_status=1; fi
            exit "$test_status"
          fi
          cat "$log_file"
          exit "$test_status"
      - name: Scan account evidence before artifact upload
        id: account-evidence-audit
        if: ${{ !cancelled() }}
        run: node scripts/test-accounts/evidence.mjs
      - name: Upload browser failure evidence
        if: ${{ !cancelled() && steps.account-evidence-audit.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report-shard-${{ matrix.shard }}-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
            .cache/e2e/http-acceptance-summary.json
            .cache/e2e/account-http-evidence.json
            .cache/e2e/playwright-browser.log
          # Only the explicit scanned paths above; never the private account directory.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  browser-e2e:
    # Preserve the protected check name. Classification errors or a missing
    # selected test job fail; documentation is the only test-free tier.
    name: Browser tests (before merge)
    needs: [changes, browser-pr, browser-selection, browser-build, browser-runtime, browser-e2e-full]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the selected browser layer
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PR_RESULT: ${{ needs.browser-pr.result }}
          SELECTION_RESULT: ${{ needs.browser-selection.result }}
          BUILD_RESULT: ${{ needs.browser-build.result }}
          RUNTIME_RESULT: ${{ needs.browser-runtime.result }}
          FULL_RESULT: ${{ needs.browser-e2e-full.result }}
          BROWSER_TIER: ${{ needs.changes.outputs.browser_tier }}
          BROWSER_PERFORMANCE: ${{ needs.changes.outputs.browser_performance }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          EVENT_NAME: ${{ github.event_name }}
          VERIFY_SELECTION: ${{ needs.changes.outputs.verify_selection }}
        run: |
          fail() { echo "$1"; exit 1; }
          [ "$CHANGES_RESULT" = "success" ] || fail "Changed files job did not succeed: $CHANGES_RESULT"
          case "$VERIFY_SELECTION" in true|false) ;; *) fail "Missing selection validation plan" ;; esac
          case "$EVENT_NAME:$BROWSER_TIER:$DOCS_ONLY:$BROWSER_PERFORMANCE" in
            *:docs:true:false) echo "Documentation-only change; no browser runtime changed."; exit 0 ;;
            pull_request:smoke:false:false|pull_request:smoke:false:true|pull_request:targeted:false:false|pull_request:targeted:false:true) layer=pull-request ;;
            pull_request:full:false:false|pull_request:full:false:true) layer=sharded ;;
            push:main:false:false|push:full:false:true|schedule:full:false:true|workflow_dispatch:full:false:true) layer=sharded ;;
            *) fail "Invalid browser test plan: $EVENT_NAME:$BROWSER_TIER:$DOCS_ONLY:$BROWSER_PERFORMANCE" ;;
          esac
          if [ "$VERIFY_SELECTION" = "true" ]; then
            [ "$SELECTION_RESULT" = "success" ] || fail "Selection validation did not succeed: $SELECTION_RESULT"
          else
            [ "$SELECTION_RESULT" = "skipped" ] || fail "Selection validation ran without a policy change: $SELECTION_RESULT"
          fi
          if [ "$layer" = "pull-request" ]; then
            [ "$PR_RESULT" = "success" ] || fail "The pull request browser job did not succeed: $PR_RESULT"
            for result in "$BUILD_RESULT" "$RUNTIME_RESULT" "$FULL_RESULT"; do
              [ "$result" = "skipped" ] || fail "A sharded job ran for a pull request tier: $result"
            done
          else
            [ "$PR_RESULT" = "skipped" ] || fail "The pull request job ran for a sharded tier: $PR_RESULT"
            [ "$BUILD_RESULT" = "success" ] || fail "The build job did not succeed: $BUILD_RESULT"
            [ "$RUNTIME_RESULT" = "success" ] || fail "The runtime gates did not succeed: $RUNTIME_RESULT"
            [ "$FULL_RESULT" = "success" ] || fail "The selected browser layer did not succeed: $FULL_RESULT"
          fi

  main-red-issue:
    # A red main run opens one issue (or comments on the open one) that names
    # the merged pull request's author, who fixes forward or reverts. The issue
    # closes itself on the next green main run.
    name: Track red browser runs on main
    needs: [changes, browser-e2e]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.browser-e2e.result == 'failure' || (needs.browser-e2e.result == 'success' && needs.changes.outputs.docs_only != 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/github-script@v7
        env:
          GATE_RESULT: ${{ needs.browser-e2e.result }}
        with:
          script: |
            const marker = '<!-- browser-tests-red-main -->'
            const { owner, repo } = context.repo
            const sha = context.sha
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 })
            const open = issues.find(issue => !issue.pull_request && issue.user?.login === 'github-actions[bot]' && issue.body?.includes(marker))
            if (process.env.GATE_RESULT === 'success') {
              if (!open) return
              await github.rest.issues.createComment({ owner, repo, issue_number: open.number, body: `Green again on \`${sha.slice(0, 7)}\`: ${runUrl}` })
              await github.rest.issues.update({ owner, repo, issue_number: open.number, state: 'closed', state_reason: 'completed' })
              return
            }
            const { data: pulls } = await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: sha })
            const pull = pulls.find(candidate => candidate.merged_at && candidate.base.ref === 'main') ?? pulls[0]
            const author = pull?.user?.login ?? context.payload.head_commit?.author?.username ?? context.actor
            const source = pull ? `#${pull.number}` : `commit \`${sha.slice(0, 7)}\``
            const line = `[Run](${runUrl}) on \`${sha.slice(0, 7)}\`, merged from ${source} by @${author}.`
            const ask = `@${author}, please fix forward or revert within one working day (CONTRIBUTING.md, "How changes are tested").`
            const assign = async number => {
              try { await github.rest.issues.addAssignees({ owner, repo, issue_number: number, assignees: [author] }) }
              catch (error) { core.warning(`Could not assign ${author}: ${error.message}`) }
            }
            if (open) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.number, body: `Still red. ${line}\n\n${ask}` })
              await assign(open.number)
              core.notice(`Updated #${open.number}`)
              return
            }
            const body = `${marker}\nThe browser tests after a merge to main failed.\n\n${line}\n\n${ask}\n\nThis issue gets a comment on every red main run and closes on the next green one.`
            const { data: created } = await github.rest.issues.create({ owner, repo, title: 'Browser tests are red on main', body })
            await assign(created.number)
            core.notice(`Opened #${created.number}`)
