name: Issue 1506 owned Docker verification

on:
  push:
    branches: [acceptance/issues-1504-1506]
    paths:
      - '.github/workflows/issue-1506-docker.yml'
      - 'scripts/acceptance/issue-1506-docker/**'

permissions:
  contents: read
  id-token: write

concurrency:
  group: issue-1506-owned-docker-sbx_001m6rywbd7a5pjmqb79qs43vad
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'alexj11324/Mikka' && github.event_name == 'push' && github.ref == 'refs/heads/acceptance/issues-1504-1506'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Validate the exact reviewed inputs before credentials or remote work
        run: |
          node --check scripts/acceptance/issue-1506-docker/control.mjs
          node --check scripts/acceptance/issue-1506-docker/remote-verify.mjs
          bash -n scripts/acceptance/issue-1506-docker/remote-verify.sh
          node scripts/acceptance/issue-1506-docker/control.mjs validate
      - name: Read existing Docker ID
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /docker
          secret-name: DOCKER_ID
          recursive: false
          include-imports: false
      - name: Read existing Docker PAT
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /docker
          secret-name: DOCKER_PAT
          recursive: false
          include-imports: false
      - name: Verify final candidate in the existing development sandbox
        run: node scripts/acceptance/issue-1506-docker/control.mjs verify
      - name: Ensure the same owned sandbox is stopped
        if: always() && env.DOCKER_ID != '' && env.DOCKER_PAT != ''
        timeout-minutes: 2
        run: node scripts/acceptance/issue-1506-docker/control.mjs stop
      - name: Retain complete sanitized verification results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1506-docker-${{ github.run_id }}-${{ github.run_attempt }}
          path: issue-1506-docker-report/*.json
          if-no-files-found: ignore
          retention-days: 7
