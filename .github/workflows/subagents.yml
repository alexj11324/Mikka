name: Subagents and thread backend
on:
  push:
    branches: ['codex/342-runtime', 'candidate/pr346-acceptance']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-ci
          POSTGRES_DB: subagent_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm exec oxlint --deny-warnings lib/cloud-computer workflows/subagent app/api/computer/events scripts/e2b/subagent-cdp.mjs
      - run: python3 -m py_compile scripts/e2b/subagent-gateway.py scripts/e2b/subagent-live-acceptance.py
      - run: python3 scripts/e2b/subagent-guard.test.py
      - run: python3 scripts/e2b/subagent-retain.test.py
      - name: Test credential broker protocol against isolated Chromium
        env:
          COMPUTER_TEST_DATABASE_URL: postgresql://postgres:isolated-ci@localhost:5432/subagent_test
        run: |
          python3 -m venv "$RUNNER_TEMP/pr346-gateway"
          "$RUNNER_TEMP/pr346-gateway/bin/pip" install --disable-pip-version-check 'aiohttp==3.14.0'
          PATH="$RUNNER_TEMP/pr346-gateway/bin:$PATH" pnpm test:credential-broker-cdp-db
      - run: node --experimental-test-module-mocks --import ./scripts/server-test.mjs --import tsx --test lib/cloud-computer/integration.test.ts
      - run: node --import ./scripts/server-test.mjs --import tsx --test lib/cloud-computer/runtime.test.ts
      - run: node --experimental-test-module-mocks --import ./scripts/server-test.mjs --import tsx --test lib/cloud-computer/action-reviews.test.ts
      - run: node --experimental-test-module-mocks --import ./scripts/server-test.mjs --import tsx --test lib/cloud-computer/browser-authority.test.ts
      - run: node --import tsx --test lib/cloud-computer/visual-observation.test.ts
      - run: node --experimental-test-module-mocks --import ./scripts/server-test.mjs --import tsx --test lib/cloud-computer/credential-consumer.test.ts lib/cloud-computer/credential-card.test.ts
      - run: node --import ./scripts/server-test.mjs --import tsx --test lib/cloud-computer/credential-action-plan.test.ts
      - run: node --experimental-test-module-mocks --import ./scripts/server-test.mjs --import tsx --test workflows/subagent/steps.test.ts
      - run: pnpm --filter @mikka/daemon exec vitest run src/computer/subagent-credential-callback.test.ts
      - run: pnpm --filter @mikka/daemon typecheck
      - run: node scripts/check-migrations.mjs
      - run: node --import ./scripts/server-test.mjs --import tsx --test lib/cloud-computer/backend.db.test.ts
        env:
          REQUIRE_DB: '1'
          COMPUTER_TEST_DATABASE_URL: postgresql://postgres:isolated-ci@localhost:5432/subagent_test
