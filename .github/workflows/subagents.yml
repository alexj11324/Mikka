name: Subagents and thread backend
on:
  push:
    branches: ['codex/342-runtime', 'codex/180-account-credential-vault', 'integration/**', 'integrate/**']
  workflow_dispatch:
permissions:
  contents: read
env:
  # A cache restore that fails (e.g. the account's cache egress limit) would
  # otherwise hang for actions/cache's 10-minute default before falling back
  # to a normal install, which outlasts the short jobs' own timeouts.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-ci
          POSTGRES_DB: subagent_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm exec oxlint --deny-warnings lib/cloud-computer workflows/subagent app/api/computer/events scripts/e2b/subagent-cdp.mjs
      - run: python3 -m py_compile scripts/e2b/subagent-gateway.py scripts/e2b/subagent-live-acceptance.py
      - run: python3 scripts/e2b/subagent-guard.test.py
      - run: node --experimental-test-module-mocks --import ./tests/support/server-only.mjs --import tsx --test lib/cloud-computer/credential-reviews.test.ts
      - name: Test credential broker protocol against isolated Chromium
        run: |
          python3 -m venv "$RUNNER_TEMP/pr346-gateway"
          "$RUNNER_TEMP/pr346-gateway/bin/pip" install --disable-pip-version-check 'aiohttp==3.14.0'
          "$RUNNER_TEMP/pr346-gateway/bin/python" scripts/e2b/broker-websocket.test.py
      - run: node --import ./scripts/server-test.mjs --import tsx --test lib/cloud-computer/runtime.test.ts
      - run: node scripts/check-migrations.mjs
      - run: node --import ./scripts/server-test.mjs --import tsx --test lib/cloud-computer/backend.db.test.ts
        env:
          REQUIRE_DB: '1'
          COMPUTER_TEST_DATABASE_URL: postgresql://postgres:isolated-ci@localhost:5432/subagent_test
