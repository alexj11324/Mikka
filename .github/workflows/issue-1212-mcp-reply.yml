name: Root final production acceptance

# Bound to the verified 3c production source for three MCP read/cancel cases.
# The job holds the Web deploy queue and the driver checks the public version.
# No automatic retry.
on:
  push:
    branches: [acceptance/issues-1504-1506]
    paths:
      - '.github/workflows/issue-1212-mcp-reply.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-smoke-owner-acceptance
  cancel-in-progress: false
  queue: max

jobs:
  observe:
    if: ${{ false && github.repository == 'alexj11324/Mikka' && github.event_name == 'push' && github.ref == 'refs/heads/acceptance/issues-1504-1506' }}
    runs-on: ubuntu-latest
    # The business deadline is 240s; bounded cleanup remains outside that
    # deadline and must have time to finish after a transport failure.
    timeout-minutes: 12
    concurrency:
      group: web-deploy-production
      cancel-in-progress: false
      queue: max
    env:
      MIKKA_ACCEPTANCE_SHA: '3c32675c99d32f9c84a9b5e4bc48e59231baa4d8' # Only the verified final production application SHA.
      MIKKA_ACCEPTANCE_TREE: '22d486bdaf50b2168c8f9291ffd2c5a848a67675' # Exact tree of that application commit.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Check out the exact final application source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.MIKKA_ACCEPTANCE_SHA }}
          path: application-source
          persist-credentials: false
      - name: Verify immutable source and complete runtime imports before credentials
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { createHash } from 'node:crypto'
          import { execFileSync } from 'node:child_process'
          import { readFile, mkdir, writeFile } from 'node:fs/promises'
          import { resolve } from 'node:path'
          import { pathToFileURL } from 'node:url'
          
          const sha = /^[0-9a-f]{40}$/
          assert.match(process.env.MIKKA_ACCEPTANCE_SHA ?? '', sha)
          assert.match(process.env.MIKKA_ACCEPTANCE_TREE ?? '', sha)
          const git = (cwd, ref) => execFileSync('git', ['rev-parse', ref], { cwd, encoding: 'utf8' }).trim()
          assert.equal(git('.', 'HEAD'), process.env.GITHUB_SHA)
          assert.equal(git('application-source', 'HEAD'), process.env.MIKKA_ACCEPTANCE_SHA)
          assert.equal(git('application-source', 'HEAD^{tree}'), process.env.MIKKA_ACCEPTANCE_TREE)
          const driverHashes = {
            "scripts/acceptance/issue-1212-mcp/mcp-reply-production.mjs": "65a76df6a9eb39c04df9837d0f548bf3be623331cdfef543607f7f14d6d27e22",
            "scripts/acceptance/issue-1212-mcp/pkce-session.mjs": "66bda21e04553537d7c9f5b02009ae26a12421079ff10f9dc9d2abc55cb76ad9",
            "scripts/acceptance/issue-1212-mcp/mcp-reply-production.test.mjs": "6e51ebdf54c97c233dcbf8c32dddaa1e465f96839e983d9e5daac8b4297e1ad8"
          }
          const applicationHashes = {
            "app/api/mcp/route.ts": "870359781ddfee56f9baf7fff232b2573ca3daf9e8c27743e76e0cf475d2a012",
            "lib/mcp/reply-wait.ts": "23e20f711297b32759831da547f7690b1ba6f536464c6d73b8a40b975f6f5f62",
            "lib/mcp/reply-completion.ts": "84f31ae9791ac7fd7949b2b8022dc591e62912959b22f820fc2f363d178df12b",
            "apps/api/build-contract.mjs": "0949d55ff5a14d34fad8f3e5effacb5dbf71f8e7ae097a6d24280233ef604a13",
            "apps/api/scripts/finalize-build.mjs": "aedf49e2ab1763c86949421a042ff5256def92f1442c1db8b3ecf62b25467822"
          }
          for (const [path, expected] of Object.entries(driverHashes)) {
            assert.equal(createHash('sha256').update(await readFile(path)).digest('hex'), expected, path)
          }
          for (const [path, expected] of Object.entries(applicationHashes)) {
            assert.equal(createHash('sha256').update(await readFile(resolve('application-source', path))).digest('hex'), expected, path)
          }
          let networkAttempts = 0
          const denied = () => { networkAttempts++; throw new Error('offline_network_forbidden') }
          globalThis.fetch = denied
          globalThis.WebSocket = class { constructor() { denied() } }
          const driver = await import(pathToFileURL(resolve('scripts/acceptance/issue-1212-mcp/mcp-reply-production.mjs')).href)
          const helper = await import(pathToFileURL(resolve('scripts/acceptance/issue-1212-mcp/pkce-session.mjs')).href)
          assert.equal(typeof helper.authorizeMcpSession, 'function')
          assert.equal(typeof driver.runMcpReplyProof, 'function')
          const event = JSON.parse(await readFile(process.env.GITHUB_EVENT_PATH, 'utf8'))
          const binding = driver.configuration(process.env, event)
          assert.equal(networkAttempts, 0)
          await mkdir('issue-1212-mcp-report', { recursive: true, mode: 0o700 })
          const proof = { schemaVersion: 1, kind: 'mcp-offline-source-preflight', binding,
            applicationTree: process.env.MIKKA_ACCEPTANCE_TREE,
            reviewedSourceSha: '1a3ca56d62b8dff6bdb243eb98feca51347185e7',
            driverHashes, applicationHashes, importedRuntimeFiles: 2, networkAttempts,
            productionRequests: 0, modelCalls: 0, credentialsLoaded: false, deploymentVerified: false }
          await writeFile('issue-1212-mcp-report/source-preflight.json', JSON.stringify(proof, null, 2) + '\n', { mode: 0o600, flag: 'wx' })
          console.log(JSON.stringify({ sourcePreflight: 'passed', importedRuntimeFiles: 2, networkAttempts: 0, productionRequests: 0 }))
          NODE
          node scripts/acceptance/issue-1212-mcp/mcp-reply-production.mjs --check-config
          node --test scripts/acceptance/issue-1212-mcp/mcp-reply-production.test.mjs
      - name: Read the issue-bound ACME email only
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          secret-name: ACME_DEMO_EMAIL
          recursive: false
          include-imports: false
      - name: Read the issue-bound ACME password only
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          secret-name: ACME_DEMO_PASSWORD
          recursive: false
          include-imports: false
      - name: Observe bounded reads and cancel only this client's HTTP wait
        run: node scripts/acceptance/issue-1212-mcp/mcp-reply-production.mjs observe
      - name: Retain the sanitized observations and exact cleanup status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issue-1212-mcp-reply-${{ github.run_id }}
          path: issue-1212-mcp-report/*.json
          if-no-files-found: ignore
          retention-days: 7

  final-acceptance:
    if: >-
      ${{ false && github.repository == 'alexj11324/Mikka' && github.event_name == 'push' &&
      github.ref == 'refs/heads/acceptance/issues-1504-1506' &&
      startsWith(github.event.head_commit.message, 'test: run root final issue acceptance') }}
    permissions:
      contents: read
      actions: read
      id-token: write
    runs-on: ubuntu-latest
    # MCP is bounded to 240s; four independent native Stop cases are each
    # bounded to 120s plus normal Stop and session cleanup.
    timeout-minutes: 40
    env:
      MIKKA_ACCEPTANCE_SHA: '0a355918330f6dac04d2b0ee4716cd056c263162' # Only the verified final production application SHA.
      MIKKA_GROUP_MODE: lifecycle
      MIKKA_LIFECYCLE_ADMISSION_DEADLINE: '2026-11-09T03:45:00Z'
      MIKKA_RELEASE_SOURCE: ${{ github.workspace }}/released
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Verify the exact input and offline request cleanup boundaries
        run: |
          node --input-type=module -e "import {assertLifecycleAdmission} from './scripts/acceptance/issue-1212-mcp/thread-lifecycle-bounds.mjs'; if(process.env.MIKKA_GROUP_MODE==='lifecycle') assertLifecycleAdmission(process.env)"
          node scripts/acceptance/issue-1212-mcp/mcp-reply-production.mjs --check-config
          node --input-type=module -e "if (!['mcp','observe','audit','cleanup','lifecycle'].includes(process.env.MIKKA_GROUP_MODE)) throw Error('GROUP_MODE_INVALID')"
          node --test scripts/acceptance/issue-1212-mcp/mcp-reply-production.test.mjs
          node --test scripts/acceptance/issue-1212-mcp/group-stop-production.test.mjs
          node --test scripts/acceptance/issue-1212-mcp/group-stop-audit.test.mjs
          node --test scripts/acceptance/issue-1212-mcp/thread-lifecycle-bounds.test.mjs
      - name: Require the exact main and completed public releases before new acceptance
        if: env.MIKKA_GROUP_MODE == 'mcp' || env.MIKKA_GROUP_MODE == 'observe' || env.MIKKA_GROUP_MODE == 'lifecycle'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { mkdirSync, writeFileSync } from 'node:fs'
          const sha = process.env.MIKKA_ACCEPTANCE_SHA
          if (!/^[a-f0-9]{40}$/.test(sha)) throw Error('RELEASE_PIN_REQUIRED')
          const read = async path => {
            const response = await fetch('https://api.github.com/repos/alexj11324/Mikka/'+path, {
              headers: { authorization:'Bearer '+process.env.GITHUB_TOKEN, accept:'application/vnd.github+json' },
              redirect:'error', signal:AbortSignal.timeout(20000) })
            if (!response.ok) throw Error('RELEASE_READ_REFUSED')
            return response.json()
          }
          const [main,runs] = await Promise.all([read('git/ref/heads/main'),read('actions/runs?head_sha='+sha+'&per_page=100')])
          if(runs.total_count>100) throw Error('RELEASE_SOURCE_CHANGED')
          if(main.object?.sha!==sha) {
            if(process.env.MIKKA_GROUP_MODE!=='lifecycle') throw Error('RELEASE_SOURCE_CHANGED')
            const ancestry=await read('compare/'+sha+'...'+main.object?.sha)
            if(ancestry.status!=='ahead'||ancestry.behind_by!==0||ancestry.merge_base_commit?.sha!==sha) throw Error('RELEASE_SOURCE_CHANGED')
          }
          if (process.env.MIKKA_GROUP_MODE === 'mcp') {
            const p0 = await read('pulls/1636')
            let scopedSource = false
            if (p0.merged) {
              if (!/^[a-f0-9]{40}$/.test(p0.merge_commit_sha ?? '')) throw Error('EXPLICIT_MCP_WORKSPACE_RELEASE_REQUIRED')
              const ancestry = await read('compare/' + p0.merge_commit_sha + '...' + sha)
              scopedSource = ['ahead','identical'].includes(ancestry.status) && ancestry.behind_by === 0
                && ancestry.merge_base_commit?.sha === p0.merge_commit_sha
            }
            const scopedInput = Boolean(process.env.MIKKA_MCP_WORKSPACE_HASH || process.env.MIKKA_MCP_WORKSPACE_ID)
            if (scopedSource !== scopedInput) throw Error('EXPLICIT_MCP_WORKSPACE_SOURCE_CHANGED')
          }
          const live=await fetch('https://app.aspectlylabs.com/mikka/api/version',{
            headers:{'cache-control':'no-store'},redirect:'error',signal:AbortSignal.timeout(20000)})
          if(!live.ok || (await live.json()).build!==sha) throw Error('PUBLIC_SOURCE_CHANGED')
          const required = process.env.MIKKA_GROUP_MODE === 'mcp' ? ['Web deploy']
            : process.env.MIKKA_GROUP_MODE === 'lifecycle' ? ['CI','Web deploy']
            : ['CI','Web deploy','E2B additive runtime release','Self-hosted image']
          const workflows=required.map(name=>{
            const candidates=runs.workflow_runs.filter(r=>r.name===name&&r.head_sha===sha&&r.head_branch==='main')
              .sort((a,b)=>b.id-a.id || b.run_attempt-a.run_attempt)
            const run=candidates[0]
            if(!run||run.status!=='completed'||run.conclusion!=='success') throw Error('RELEASE_NOT_COMPLETE')
            return {name,runId:run.id,attempt:run.run_attempt}
          })
          mkdirSync('issue-1212-mcp-report',{recursive:true})
          // MCP only observes the already deployed application; it does not publish or merge.
          // Keep its CI observations honest without adding a new deployment gate to reads.
          const latestCi = runs.workflow_runs.filter(r=>r.name==='CI'&&r.head_sha===sha&&r.head_branch==='main')
            .sort((a,b)=>b.id-a.id || b.run_attempt-a.run_attempt)[0]
          const ciObserved = latestCi ? {runId:latestCi.id,attempt:latestCi.run_attempt,status:latestCi.status,conclusion:latestCi.conclusion} : null
          writeFileSync('issue-1212-mcp-report/release-gate.json',JSON.stringify({sourceSha:sha,workflows,ciObserved,
            acceptanceOnly:process.env.MIKKA_GROUP_MODE==='mcp',runtimeUsed:process.env.MIKKA_GROUP_MODE!=='mcp',credentialsDelivered:false})+'\n')
          JS
      - name: Read only the exact released source for normal shared-account helpers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.MIKKA_ACCEPTANCE_SHA }}
          path: released
          persist-credentials: false
      - name: Install only the pinned released dependencies for the read-only audit
        if: env.MIKKA_GROUP_MODE == 'audit' || env.MIKKA_GROUP_MODE == 'lifecycle'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.3
      - if: env.MIKKA_GROUP_MODE == 'audit' || env.MIKKA_GROUP_MODE == 'lifecycle'
        run: pnpm --dir released install --frozen-lockfile --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Read only the existing runtime configuration reader credential
        if: env.MIKKA_GROUP_MODE == 'lifecycle'
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: VERCEL_TEAM_TOKEN
          recursive: false
          include-imports: false
      - name: Verify the actual approved runtime before account credentials or new machines
        if: env.MIKKA_GROUP_MODE == 'lifecycle'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs'
          import { readProductionWorkerRelease } from './released/scripts/acceptance/cloud-startup.mjs'
          import { assertLifecycleAdmission } from './scripts/acceptance/issue-1212-mcp/thread-lifecycle-bounds.mjs'
          assertLifecycleAdmission(process.env)
          const release=await readProductionWorkerRelease({token:process.env.VERCEL_TEAM_TOKEN})
          const read=async path=>{
            const response=await fetch('https://api.github.com/repos/alexj11324/Mikka/'+path,{redirect:'error',signal:AbortSignal.timeout(20000),
              headers:{authorization:'Bearer '+process.env.GITHUB_TOKEN,accept:'application/vnd.github+json'}})
            if(!response.ok)throw Error('APPROVED_RUNTIME_METADATA_REFUSED')
            return response.json()
          }
          const [history,ancestry]=await Promise.all([read('actions/runs?head_sha='+release.sourceCommit+'&per_page=100'),
            read('compare/'+release.sourceCommit+'...'+process.env.MIKKA_ACCEPTANCE_SHA)])
          if(history.total_count>100||!['ahead','identical'].includes(ancestry.status)||ancestry.behind_by!==0||ancestry.merge_base_commit?.sha!==release.sourceCommit)throw Error('APPROVED_RUNTIME_ANCESTRY')
          const run=history.workflow_runs.filter(r=>r.name==='E2B additive runtime release'&&r.head_branch==='main'&&r.status==='completed'&&r.conclusion==='success'&&['push','workflow_dispatch'].includes(r.event)).sort((a,b)=>b.id-a.id)[0]
          if(!run)throw Error('APPROVED_RUNTIME_NOT_RELEASED')
          const jobs=await read('actions/runs/'+run.id+'/jobs?per_page=100')
          if(jobs.total_count>100)throw Error('APPROVED_RUNTIME_METADATA_TRUNCATED')
          const groups=[['test'],['check'],['validate','validate / build'],['await-web'],['subscriptions'],['publish','publish / deploy'],['cleanup']]
          const verified=groups.map(names=>{
            const job=jobs.jobs.find(j=>names.includes(j.name)&&j.status==='completed'&&j.conclusion==='success')
            if(!job)throw Error('APPROVED_RUNTIME_INCOMPLETE')
            return {id:job.id,name:job.name}
          })
          const subscription=jobs.jobs.find(j=>j.name==='subscriptions')
          const publication=jobs.jobs.find(j=>j.name==='publish'||j.name==='publish / deploy')
          if(!subscription.steps?.some(s=>s.name==='Require real Claude Code and Codex subscriptions on the private candidates'&&s.conclusion==='success')||
            !publication.steps?.some(s=>s.name==='Publish the verified additive runtime pair inside the deployment queue'&&s.conclusion==='success'))throw Error('APPROVED_RUNTIME_REAL_GATE_REQUIRED')
          writeFileSync('issue-1212-mcp-report/runtime-pin.json',JSON.stringify({configuration:release,runId:run.id,attempt:run.run_attempt,verifiedJobs:verified,
            applicationSha:process.env.MIKKA_ACCEPTANCE_SHA,source:'existing_approved_production_configuration',runtimePublishedByThisJob:false})+'\n')
          console.log(JSON.stringify({approvedRuntime:'verified',source:release.sourceCommit,worker:release.workerSha,runId:run.id,newMachineCreated:false}))
          JS
      - name: Read the shared smoke account email only
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          secret-name: SMOKE_OWNER_EMAIL
          recursive: false
          include-imports: false
      - name: Read the shared smoke account password only
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          secret-name: SMOKE_OWNER_PASSWORD
          recursive: false
          include-imports: false
      - name: Observe bounded reads and cancel only this client's HTTP wait
        if: env.MIKKA_GROUP_MODE == 'mcp' || env.MIKKA_GROUP_MODE == 'observe'
        run: node scripts/acceptance/issue-1212-mcp/mcp-reply-production.mjs observe
      - name: Observe public and private group Stop on both fixed small subscriptions
        if: ${{ !cancelled() && env.MIKKA_GROUP_MODE == 'observe' }}
        run: node scripts/acceptance/issue-1212-mcp/group-stop-production.mjs observe
      - name: Read the production database only for the terminal-bound scoped audit
        if: ${{ !cancelled() && (env.MIKKA_GROUP_MODE == 'audit' || env.MIKKA_GROUP_MODE == 'lifecycle') }}
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /vercel
          secret-name: MIKKA_DATABASE_URL
          recursive: false
          include-imports: false
      - name: Read the existing provider observer key only for the native lifecycle case
        if: env.MIKKA_GROUP_MODE == 'lifecycle'
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /vercel
          secret-name: E2B_API_KEY
          recursive: false
          include-imports: false
      - name: Measure startup, actual lease renewal, native exits and owned cancellation
        if: env.MIKKA_GROUP_MODE == 'lifecycle'
        timeout-minutes: 32
        env:
          DATABASE_URL: ${{ env.MIKKA_DATABASE_URL }}
        run: timeout --signal=TERM --kill-after=4m 28m node scripts/acceptance/issue-1212-mcp/thread-lifecycle-bounds.mjs
      - name: Audit each server-confirmed terminal with exactly one read-only snapshot
        if: ${{ !cancelled() && env.MIKKA_GROUP_MODE == 'audit' }}
        env:
          DATABASE_URL: ${{ env.MIKKA_DATABASE_URL }}
        run: node scripts/acceptance/issue-1212-mcp/group-stop-audit.mjs
      - name: Clean only the independently audited owned group fixtures
        if: ${{ !cancelled() && env.MIKKA_GROUP_MODE == 'cleanup' }}
        run: node scripts/acceptance/issue-1212-mcp/group-stop-production.mjs cleanup
      - name: Retain the sanitized observations and exact cleanup status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issue-1212-mcp-reply-${{ github.run_id }}
          path: issue-1212-mcp-report/*.json
          if-no-files-found: ignore
          retention-days: 7
