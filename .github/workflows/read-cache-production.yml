name: Read cache production acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/read-cache-production.yml'
      - 'scripts/acceptance/read-cache*.mjs'
      - 'scripts/acceptance/production-readiness.mjs'
      - 'scripts/acceptance/workflow-migration-production*.mjs'
  workflow_dispatch:
    inputs:
      application_sha:
        description: Exact already-deployed main commit to accept with read-only requests
        required: true
        type: string
  workflow_run:
    workflows: ['Web deploy']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('read-cache-production-guards-{0}', github.event.pull_request.number) || 'production-smoke-owner-acceptance' }}
  cancel-in-progress: false

jobs:
  guards:
    outputs:
      migration_open: ${{ steps.migration.outputs.open }}
    permissions:
      contents: read
      issues: read
    name: Read cache production guards
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm-install
      - run: node --import tsx --test scripts/acceptance/read-cache.test.mjs scripts/acceptance/read-cache-production.test.mjs scripts/acceptance/workflow-migration-production.test.mjs

      - name: Check whether the one-time migration acceptance is still open
        id: migration
        if: github.event_name == 'workflow_run' && github.repository == 'alexj11324/Mikka'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFile } from 'node:fs/promises'
          const endpoint = 'https://api.github.com/repos/alexj11324/Mikka/issues/1415'
          const response = await fetch(endpoint, { redirect: 'error', headers: { authorization: 'Bearer ' + process.env.GH_TOKEN,
            accept: 'application/vnd.github+json' }, signal: AbortSignal.timeout(20000) })
          const issue = await response.json()
          if (!response.ok || issue.number !== 1415 || issue.url !== endpoint || issue.pull_request ||
            issue.repository_url !== 'https://api.github.com/repos/alexj11324/Mikka' || !['open', 'closed'].includes(issue.state))
            throw new Error('migration_issue_gate_invalid')
          await appendFile(process.env.GITHUB_OUTPUT, 'open=' + (issue.state === 'open') + '\n')
          NODE

  acceptance:
    name: Read cache production reads
    needs: guards
    if: >-
      github.repository == 'alexj11324/Mikka' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_sha == github.sha &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm-install
      - name: Verify the exact production version and its successful Web deployment
        id: attest
        run: node --import tsx scripts/acceptance/read-cache-production.mjs --attest
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Read the existing smoke email only
        if: steps.attest.outputs.readable == 'true'
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          secret-name: SMOKE_OWNER_EMAIL
          recursive: false
          include-imports: false
      - name: Read the existing smoke password only
        if: steps.attest.outputs.readable == 'true'
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          secret-name: SMOKE_OWNER_PASSWORD
          recursive: false
          include-imports: false
      - name: Measure existing chat, tasks, activity and Settings reads
        if: steps.attest.outputs.readable == 'true'
        run: node --import tsx scripts/acceptance/read-cache-production.mjs
      - name: Retain the aggregate production evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: read-cache-production-${{ github.run_id }}
          path: |
            production-read-cache-report/attestation.json
            production-read-cache-report/report.json
          if-no-files-found: ignore
          retention-days: 14


  workflow-migration:
    name: Issue 1415 production reads and managed reminder
    needs: [guards, acceptance]
    if: >-
      needs.guards.outputs.migration_open == 'true' &&
      github.repository == 'alexj11324/Mikka' && github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_sha == github.sha &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm-install
      - name: Gate the open migration against current main and its exact deployed Web build
        id: attest
        run: node --import tsx scripts/acceptance/read-cache-production.mjs --attest --migration-1415
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Download the audited Web comparison archive
        if: steps.attest.outputs.readable == 'true'
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { mkdir, open, unlink } from 'node:fs/promises'
          const url = 'https://3001-001m6p8qt9pcng01mwgkmshdz6m.sbx.sandboxes-cloud.docker.com/issue1415-web-3f10-5715-public.tar.gz'
          const target = 'production-web-parity-evidence/issue1415-web-3f10-5715-public.tar.gz'
          const expectedBytes = 12805628
          const expectedSha256 = 'fde33bf6cc91ca1a37646354e2d4f28abff9232d5dc84f9e28e28247d44dce3c'
          const response = await fetch(url, { redirect: 'error', credentials: 'omit', cache: 'no-store',
            headers: { 'accept-encoding': 'identity' }, signal: AbortSignal.timeout(120000) })
          const length = response.headers.get('content-length')
          if (!response.ok || response.url !== url || !response.body ||
            ![null, 'identity'].includes(response.headers.get('content-encoding')) ||
            (length !== null && length !== String(expectedBytes))) throw new Error('web_evidence_download_invalid')
          await mkdir('production-web-parity-evidence', { recursive: true, mode: 0o700 })
          const file = await open(target, 'wx', 0o600)
          const hash = createHash('sha256')
          let bytes = 0
          try {
            for await (const chunk of response.body) {
              bytes += chunk.byteLength
              if (bytes > expectedBytes) throw new Error('web_evidence_size_invalid')
              hash.update(chunk)
              await file.writeFile(chunk)
            }
            if (bytes !== expectedBytes || hash.digest('hex') !== expectedSha256)
              throw new Error('web_evidence_digest_invalid')
          } catch (error) {
            await unlink(target)
            throw error
          } finally {
            await file.close()
          }
          console.log('Audited Web comparison archive verified: ' + bytes + ' bytes; SHA256 ' + expectedSha256)
          NODE
      - name: Retain the audited Web before and after screenshots
        if: steps.attest.outputs.readable == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issue1415-web-before-after-3f10-5715-${{ github.run_id }}
          path: production-web-parity-evidence/issue1415-web-3f10-5715-public.tar.gz
          if-no-files-found: error
          retention-days: 90
      - name: Read the existing smoke email only
        if: steps.attest.outputs.readable == 'true'
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          secret-name: SMOKE_OWNER_EMAIL
          recursive: false
          include-imports: false
      - name: Read the existing smoke password only
        if: steps.attest.outputs.readable == 'true'
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          secret-name: SMOKE_OWNER_PASSWORD
          recursive: false
          include-imports: false
      - name: Execute the original five production reads and their cache scenarios
        if: steps.attest.outputs.readable == 'true'
        run: node --import tsx scripts/acceptance/read-cache-production.mjs --migration-1415
      - name: Read the existing platform token for read-only managed Workflow evidence
        if: steps.attest.outputs.readable == 'true'
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: VERCEL_TEAM_TOKEN
          recursive: false
          include-imports: false
      - name: Prove one normal-owner Coordinator turn and its once-only due reminder
        if: steps.attest.outputs.readable == 'true'
        run: node --import tsx scripts/acceptance/workflow-migration-production.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Retain only aggregate migration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workflow-migration-production-${{ github.run_id }}
          path: |
            production-read-cache-report/attestation.json
            production-read-cache-report/report.json
            production-workflow-migration-report/report.json
          if-no-files-found: ignore
          retention-days: 14
