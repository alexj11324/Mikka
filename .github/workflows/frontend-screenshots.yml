name: Frontend screenshots

# A pull request that changes the interface must show it. The description
# needs a screenshot or recording. Editing the description reruns this job
# without rerunning the rest of CI. The job checks out the pull request so
# the rule ships with the change; it does not run on pull_request_target and
# it does not start a browser (decision 2026-11-01-1520).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: frontend-screenshots-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  require:
    name: Frontend changes include a screenshot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Require a screenshot or recording in the description
        run: node scripts/ci/frontend-screenshot-check.mjs
