name: Mobile native release

# Native configuration changes need a new fingerprint-compatible iOS binary.
# Reuse the existing Expo signing and App Store Connect credentials; never
# create or repair credentials in CI. OTA publication remains a separate job.
on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/app.json'
      - 'apps/mobile/app.config.ts'
      - 'apps/mobile/eas.json'
      - '.easignore'
  workflow_dispatch:
    inputs:
      overlay_sha:
        description: Exact reviewed hosted UI commit for a new official build
        type: string
        default: c34b3adf07240afebae725b2af599cfbc69c4f42
      submit:
        description: Submit this exact completed build to TestFlight
        type: boolean
        default: true
      existing_build_id:
        description: Completed official iOS build with original archive evidence (requires expected_commit)
        type: string
        default: ''
      expected_commit:
        description: Exact 40-character main commit of the existing build
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: mobile-native-production
  cancel-in-progress: false

jobs:
  release:
    name: EAS iOS build and TestFlight
    if: >-
      github.repository == 'alexj11324/Mikka' && github.ref == 'refs/heads/main' &&
      github.repository_id == '1427517699' && github.repository_owner_id == '183887963'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      OVERLAY_SHA: ${{ inputs.overlay_sha || 'c34b3adf07240afebae725b2af599cfbc69c4f42' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @mikka/mobile...
      - run: pnpm --filter @mikka/mobile typecheck
      - name: Require successful checks for the workflow and binary source commits
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXISTING_BUILD_ID: ${{ inputs.existing_build_id }}
          EXPECTED_BUILD_COMMIT: ${{ inputs.expected_commit }}
        run: node scripts/release/mobile-native.mjs source
      - name: Recover the original verified official build and archive
        if: steps.source.outputs.build_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EXISTING_BUILD_ID: ${{ steps.source.outputs.build_id }}
          EXPECTED_BUILD_COMMIT: ${{ steps.source.outputs.commit }}
        run: node scripts/release/mobile-native.mjs recover
      - name: Verify production credential delivery boundaries
        run: node --test scripts/mobile-ota-credentials.test.mjs scripts/release/apple-credentials.test.mjs scripts/release/mobile-native.test.mjs
      - name: Validate the official UI pin before credential access
        if: steps.source.outputs.build_id == ''
        run: node -e "if (!/^[a-f0-9]{40}$/.test(process.env.OVERLAY_SHA || '')) process.exit(1)"
      - name: Read existing HOSTED_UI_READ_KEY through OIDC
        if: steps.source.outputs.build_id == ''
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: HOSTED_UI_READ_KEY
          recursive: false
          include-imports: false
      - name: Check out the exact official UI
        if: steps.source.outputs.build_id == ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: alexj11324/mikka-hosted-ui
          ref: ${{ env.OVERLAY_SHA }}
          ssh-key: ${{ env.HOSTED_UI_READ_KEY }}
          path: .hosted-ui
          persist-credentials: false
      - name: Clear the checkout key before packaging
        if: steps.source.outputs.build_id == ''
        run: echo 'HOSTED_UI_READ_KEY=' >> "$GITHUB_ENV"
      - name: Read existing EXPO_TOKEN through OIDC
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: EXPO_TOKEN
          recursive: false
          include-imports: false
      - name: Read existing ASC_API_KEY_P8 through OIDC
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: ASC_API_KEY_P8
          recursive: false
          include-imports: false
      - name: Read existing ASC_API_KEY_ID through OIDC
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: ASC_API_KEY_ID
          recursive: false
          include-imports: false
      - name: Read existing ASC_API_ISSUER_ID through OIDC
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: ASC_API_ISSUER_ID
          recursive: false
          include-imports: false
      - name: Map existing Apple credential names in the trusted runner
        run: node scripts/release/apple-credentials.mjs
      - name: Require the existing Expo credential
        run: node -e "if (!process.env.EXPO_TOKEN) { console.error('EXPO_TOKEN is missing; no native release was published.'); process.exit(1) }"
      - name: Require the existing App Store Connect credential inputs
        if: github.event_name == 'push' || inputs.submit
        run: node scripts/release/mobile-native.mjs credentials
      - name: Inspect the official source upload without building
        if: steps.source.outputs.build_id == ''
        working-directory: apps/mobile
        env:
          CI: '1'
        run: npx -y eas-cli@27.2.0 build:inspect --platform ios --profile hosted-production --stage archive --output "$RUNNER_TEMP/mikka-eas-archive"
      - name: Require the complete protected UI in the EAS archive
        if: steps.source.outputs.build_id == ''
        run: node scripts/release/mobile-native.mjs archive
      - name: Build iOS with existing signing credentials
        if: steps.source.outputs.build_id == ''
        working-directory: apps/mobile
        run: npx -y eas-cli@27.2.0 build --platform ios --profile hosted-production --non-interactive --freeze-credentials --wait --json > "$RUNNER_TEMP/mikka-native-build.json"
      - name: Read the existing completed build without rebuilding
        if: steps.source.outputs.build_id != ''
        working-directory: apps/mobile
        env:
          EXISTING_BUILD_ID: ${{ steps.source.outputs.build_id }}
        run: npx -y eas-cli@27.2.0 build:view "$EXISTING_BUILD_ID" --json > "$RUNNER_TEMP/mikka-native-build.json"
      - name: Verify the completed build and commit
        id: build
        env:
          NATIVE_SOURCE_SHA: ${{ steps.source.outputs.commit }}
          EXISTING_BUILD_ID: ${{ steps.source.outputs.build_id }}
        run: node scripts/release/mobile-native.mjs verify
      - name: Submit this build to TestFlight
        if: github.event_name == 'push' || inputs.submit
        env:
          NATIVE_BUILD_ID: ${{ steps.build.outputs.id }}
        run: node scripts/release/mobile-native.mjs submit
      - name: Remove temporary App Store Connect key
        if: always()
        run: node scripts/release/mobile-native.mjs cleanup
      - name: Preserve non-secret build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobile-native-${{ github.sha }}
          path: mobile-native-report/*.json
          if-no-files-found: ignore
          retention-days: 14
