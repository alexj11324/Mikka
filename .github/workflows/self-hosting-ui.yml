name: Self-hosting UI evidence
on:
  pull_request:
    paths:
      - '.github/workflows/self-hosting-ui.yml'
      - 'scripts/self-hosting-ui/**'
      - 'components/settings/cloud-settings.tsx'
      - 'components/plugins/github-app-settings.tsx'
      - 'apps/mobile/features/accounts/**'
      - 'apps/mobile/components/SignIn.tsx'
      - 'apps/mobile/components/ServerGate.tsx'
      - 'apps/mobile/lib/server-*.ts'
permissions:
  contents: read
concurrency:
  group: self-hosting-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  screenshots:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    name: Production bundle screenshots (synthetic records)
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/pnpm-install
      - name: Check evidence failure diagnostics remain secret-free
        run: node --test scripts/self-hosting-ui/*.test.mjs
      - name: Build the existing settings components in production mode
        run: node scripts/self-hosting-ui/build.mjs
      - name: Export the actual mobile application
        run: pnpm --filter @mikka/mobile exec expo export --platform web --max-workers 2 --output-dir ../../.artifacts/self-hosting-ui/mobile
      - name: Prepare Ubuntu package mirrors
        run: sudo "$(command -v node)" scripts/ci/apt-mirrors.mjs
      - name: Install Chromium for visual capture
        run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Capture views and open dialogs only
        run: node scripts/self-hosting-ui/capture.mjs
      - name: Create a new evidence branch for this source and run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/self-hosting-ui/publish.mjs
