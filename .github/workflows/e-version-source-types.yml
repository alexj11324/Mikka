name: E exact frontend source types for the version control
on:
  push:
    branches: [evidence/2254-sidebar-85dfc396]
    paths: [.github/workflows/e-version-source-types.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f19dffd045d4cee99c0f6960cd0978b1a96bd129
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - run: |
          test "$(git rev-parse 'HEAD^{tree}')" = 8cd4be321b3e03be0c3862d1fbbe3c7bb7a8965c
          pnpm install --frozen-lockfile
      - name: Typecheck the original public root
        run: pnpm typecheck
