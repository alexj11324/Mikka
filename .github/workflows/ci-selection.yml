name: Trusted CI selection
on:
  workflow_call:
    outputs:
      full:
        value: ${{ jobs.select.outputs.full }}
      docs_only:
        value: ${{ jobs.select.outputs.docs_only }}
      core:
        value: ${{ jobs.select.outputs.core }}
      integration:
        value: ${{ jobs.select.outputs.integration }}
      source:
        value: ${{ jobs.select.outputs.source }}
      daemon:
        value: ${{ jobs.select.outputs.daemon }}
      desktop:
        value: ${{ jobs.select.outputs.desktop }}
      image:
        value: ${{ jobs.select.outputs.image }}
      analytics:
        value: ${{ jobs.select.outputs.analytics }}
      db:
        value: ${{ jobs.select.outputs.db }}
      units:
        value: ${{ jobs.select.outputs.units }}
      db_suites:
        value: ${{ jobs.select.outputs.db_suites }}
      db_matrix:
        value: ${{ jobs.select.outputs.db_matrix }}
permissions:
  contents: read
jobs:
  select:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 7
    outputs:
      full: ${{ steps.select.outputs.full }}
      docs_only: ${{ steps.select.outputs.docs_only }}
      core: ${{ steps.select.outputs.core }}
      integration: ${{ steps.select.outputs.integration }}
      source: ${{ steps.select.outputs.source }}
      daemon: ${{ steps.select.outputs.daemon }}
      desktop: ${{ steps.select.outputs.desktop }}
      image: ${{ steps.select.outputs.image }}
      analytics: ${{ steps.select.outputs.analytics }}
      db: ${{ steps.select.outputs.db }}
      units: ${{ steps.select.outputs.units }}
      db_suites: ${{ steps.select.outputs.db_suites }}
      db_matrix: ${{ steps.select.outputs.db_matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - id: select
        run: |
          git fetch origin main --no-tags
          bootstrap="$(mktemp)"
          if git show origin/main:scripts/ci/bootstrap.sh > "$bootstrap"; then
            bash "$bootstrap"
          else
            # First introduction runs only the trusted base inventory and FULL jobs.
            trusted="$(mktemp -d)"
            git archive origin/main | tar -x -C "$trusted"
            TRUSTED_ROOT="$trusted" node --input-type=module <<'JS'
          import fs from 'node:fs'
          import { pathToFileURL } from 'node:url'
          const {inventory, readTree} = await import(pathToFileURL(`${process.env.TRUSTED_ROOT}/scripts/run-db-tests.mjs`))
          const db = inventory(readTree('.'), JSON.parse(fs.readFileSync('package.json')).scripts)
          const result = {docs_only:false,core:true,integration:true,source:true,daemon:true,desktop:true,image:true,analytics:true,db:true,units:['*'],db_suites:db.scripts,db_matrix:{shard:['1/4','2/4','3/4','4/4']}}
          for (const [key,value] of Object.entries(result)) fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${typeof value === 'object' ? JSON.stringify(value) : value}\n`)
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Trusted selector absent: full legacy coverage and complete DB inventory.\n')
          JS
            rm -rf "$trusted"
          fi
          rm -f "$bootstrap"
