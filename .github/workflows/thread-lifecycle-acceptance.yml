name: Task VM question-resume evidence
# #1593: main-only provider integration, then the ordinary Owner HTTP flow.
# The webhook is a pointer, never an artifact/source authorization by itself.
on:
  workflow_run:
    workflows: [E2B additive runtime release]
    types: [completed]
permissions:
  contents: read
jobs:
  authorize:
    if: >-
      github.repository == 'alexj11324/Mikka' && github.ref == 'refs/heads/main' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      source-sha: ${{ steps.source.outputs.source-sha }}
      upstream-run-id: ${{ steps.source.outputs.upstream-run-id }}
      upstream-run-attempt: ${{ steps.source.outputs.upstream-run-attempt }}
      selected: ${{ steps.select.outputs.selected }}
    steps:
      - name: Authenticate upstream metadata before any checkout or workload token
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs'
          try {
            const repo = 'alexj11324/Mikka', path = '.github/workflows/e2b-official-runtime.yml'
            const name = 'E2B additive runtime release', sha = /^[a-f0-9]{40}$/
            const positive = value => Number.isSafeInteger(value) && value > 0
            const check = value => { if (!value) throw Error('thread_lifecycle_source_refused') }
            check(process.env.GITHUB_EVENT_NAME === 'workflow_run' && process.env.GITHUB_REPOSITORY === repo
              && process.env.GITHUB_REF === 'refs/heads/main' && process.env.GITHUB_TOKEN)
            const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8')), pointer = event.workflow_run
            check(positive(pointer?.id) && positive(pointer?.run_attempt) && positive(pointer?.workflow_id)
              && sha.test(pointer?.head_sha ?? '') && pointer.name === name
              && pointer.status === 'completed' && pointer.conclusion === 'success'
              && ['push', 'workflow_dispatch'].includes(pointer.event) && pointer.head_branch === 'main'
              && pointer.repository?.full_name === repo && pointer.head_repository?.full_name === repo)
            const read = async suffix => {
              const response = await fetch('https://api.github.com/repos/' + repo + suffix, {
                headers: { accept: 'application/vnd.github+json', authorization: 'Bearer ' + process.env.GITHUB_TOKEN,
                  'x-github-api-version': '2022-11-28' }, redirect: 'error', signal: AbortSignal.timeout(20_000),
              })
              check(response.ok)
              return response.json()
            }
            const [workflow, run, main] = await Promise.all([
              read('/actions/workflows/e2b-official-runtime.yml'), read('/actions/runs/' + pointer.id), read('/git/ref/heads/main'),
            ])
            check(workflow.id === pointer.workflow_id && workflow.path === path && workflow.name === name && workflow.state === 'active')
            check(run.id === pointer.id && run.run_attempt === pointer.run_attempt && run.workflow_id === workflow.id
              && run.path === path && run.name === name && run.status === 'completed' && run.conclusion === 'success'
              && run.event === pointer.event && ['push', 'workflow_dispatch'].includes(run.event)
              && run.head_branch === 'main' && run.head_sha === pointer.head_sha
              && run.repository?.full_name === repo && run.head_repository?.full_name === repo)
            check(main.object?.type === 'commit' && sha.test(main.object?.sha ?? '') && main.object.sha === run.head_sha)
            appendFileSync(process.env.GITHUB_OUTPUT,
              `source-sha=${run.head_sha}\nupstream-run-id=${run.id}\nupstream-run-attempt=${run.run_attempt}\n`)
          } catch {
            // Never print webhook bodies, HTTP errors, authorization or nested causes.
            console.error('thread_lifecycle_source_refused')
            process.exitCode = 1
          }
          JS
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.source.outputs.source-sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Select lifecycle changes or an actually validated runtime candidate
        id: select
        run: node scripts/acceptance/thread-lifecycle-ci.mjs eligible
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_SHA: ${{ steps.source.outputs.source-sha }}
          EXPECTED_UPSTREAM_RUN_ID: ${{ steps.source.outputs.upstream-run-id }}
          EXPECTED_UPSTREAM_RUN_ATTEMPT: ${{ steps.source.outputs.upstream-run-attempt }}

  acceptance:
    needs: authorize
    if: needs.authorize.outputs.selected == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 85
    # All normal smoke-session acceptance shares the account serially.
    concurrency:
      group: production-smoke-owner-acceptance
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      EXPECTED_SOURCE_SHA: ${{ needs.authorize.outputs.source-sha }}
      EXPECTED_UPSTREAM_RUN_ID: ${{ needs.authorize.outputs.upstream-run-id }}
      EXPECTED_UPSTREAM_RUN_ATTEMPT: ${{ needs.authorize.outputs.upstream-run-attempt }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e-local-only
          POSTGRES_DB: mikka_e2e
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e -d mikka_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.authorize.outputs.source-sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/pnpm-install
        with:
          ffmpeg-github-token: ${{ github.token }}
      - name: Check source, official template and disposable database guards without allocating
        run: node --import ./scripts/server-test.mjs --import tsx scripts/e2b/thread-lifecycle-acceptance.ts --check
        env: &provider_environment
          NODE_ENV: test
          MIKKA_LOCAL_TEST_ACCOUNTS: '1'
          E2E_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
          MIKKA_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
          DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
          MIKKA_CLOUD_WORKER_SOURCE_COMMIT: ${{ needs.authorize.outputs.source-sha }}
      - name: Recheck main and upstream attempt and attest the exact live Web build before credentials
        run: node scripts/acceptance/thread-lifecycle-ci.mjs attest
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Read only the existing E2B key through the existing workload identity
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /vercel
          secret-name: E2B_API_KEY
          recursive: false
          include-imports: false
      - name: Exercise real E2B RPCs and injected transport faults on one owned disposable VM
        id: provider
        continue-on-error: true
        timeout-minutes: 16
        run: timeout --signal=TERM --kill-after=3m 12m node --import ./scripts/server-test.mjs --import tsx scripts/acceptance/thread-lifecycle-ci.mjs provider
        env: *provider_environment
      - name: Recheck the exact source before independent Owner subscription cases
        id: owner-source
        if: ${{ !cancelled() && steps.provider.outputs.cleanup-complete == 'true' }}
        run: node scripts/acceptance/thread-lifecycle-ci.mjs attest
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Read only the shared smoke account email
        id: owner-email
        if: ${{ !cancelled() && steps.provider.outputs.cleanup-complete == 'true' && steps.owner-source.outcome == 'success' }}
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          secret-name: SMOKE_OWNER_EMAIL
          recursive: false
          include-imports: false
      - name: Read only the shared smoke account password
        id: owner-password
        if: ${{ !cancelled() && steps.provider.outputs.cleanup-complete == 'true' && steps.owner-source.outcome == 'success' && steps.owner-email.outcome == 'success' }}
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          secret-name: SMOKE_OWNER_PASSWORD
          recursive: false
          include-imports: false
      - name: Run normal Owner question and continuation on both official subscriptions
        id: owner
        if: ${{ !cancelled() && steps.provider.outputs.cleanup-complete == 'true' && steps.owner-source.outcome == 'success' && steps.owner-email.outcome == 'success' && steps.owner-password.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 25
        run: timeout --signal=TERM --kill-after=4m 20m node scripts/acceptance/thread-lifecycle.mjs
      - name: Require both question-resume cases and provider cleanup evidence
        if: always()
        run: node scripts/acceptance/thread-lifecycle-ci.mjs complete
        env:
          PROVIDER_OUTCOME: ${{ steps.provider.outcome }}
          OWNER_OUTCOME: ${{ steps.owner.outcome }}
      - name: Preserve scoped evidence and cleanup receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: thread-lifecycle-question-resume-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/thread-lifecycle-acceptance/attestation.json
            ${{ runner.temp }}/thread-lifecycle-acceptance/provider-report.json
            ${{ runner.temp }}/thread-lifecycle-acceptance/report.json
            ${{ runner.temp }}/thread-lifecycle-acceptance/summary.json
          if-no-files-found: warn
          retention-days: 7
