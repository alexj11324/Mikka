name: Issue1512 frozen Git Native evidence extraction

on:
  push:
    branches: [ops/1512-task-runs-pg-20261110]

permissions:
  actions: read
  contents: write

concurrency:
  group: issue1512-native-evidence-extract
  cancel-in-progress: false

jobs:
  extract:
    name: Extract five exact JSON members from frozen Native Git ZIPs
    if: >-
      github.repository == 'alexj11324/Mikka' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/ops/1512-task-runs-pg-20261110' &&
      github.event.before == 'e20084593d3635084daeaf478d5bd251dc9620e6' &&
      github.event.head_commit.message == 'issue1512 frozen Git ZIP extraction admit 6e1a5e12-269f-44be-9ef5-a05d6f5088c1' &&
      github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - name: Checkout the reviewed extraction controller only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact admission and preserve original artifact bytes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/ops/issue1512-native-evidence-extract/controller.py
