name: Community settings UI evidence
on:
  pull_request:
    paths:
      - '.github/workflows/community-settings-ui.yml'
      - 'scripts/community-settings-ui/**'
      - 'components/settings/settings-view.tsx'
      - 'components/settings/settings-sidebar.tsx'
      - 'components/settings/issue-prefix-settings.tsx'
      - 'components/settings/workspace-settings.tsx'
      - 'components/app-shell.tsx'
      - 'components/ui/settings-layout.tsx'
      - 'hooks/use-workspace.ts'
      - 'lib/settings-sections.ts'
      - 'lib/workspace-access.ts'
      - 'lib/edition.ts'
      - 'apps/frontend/**'
      - 'app/globals.css'
      - 'apps/desktop/src/renderer/styles.css'
      - 'messages/*.json'
permissions:
  contents: read
concurrency:
  group: community-settings-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  screenshots:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    name: Community/cloud settings screenshots (synthetic records)
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/pnpm-install
      - name: Build the existing settings view in production mode
        run: node scripts/community-settings-ui/build.mjs
      - name: Install Chromium for visual capture
        run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Capture four existing settings views without interactions
        run: node scripts/community-settings-ui/capture.mjs
      - name: Create a new evidence branch for this source and run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/community-settings-ui/publish.mjs
