name: Pinned frontend compiler diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    if: github.repository == 'alexj11324/Mikka' && github.actor_id == '183887963'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d59c85cb321b2b466616960db49dea8f038c2384
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: alexj11324/mikka-hosted-ui
          ref: 05096305ad4c7b5b3bebc1a9108798b451b988e0
          ssh-key: ${{ secrets.HOSTED_UI_READ_KEY }}
          path: .hosted-ui
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Install pinned compiler dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned UI dependencies
        run: pnpm --dir .hosted-ui install --ignore-workspace --prod --ignore-scripts --frozen-lockfile
      - name: Generate the existing Agent UI
        run: pnpm generate:agent-ui
      - name: Compile the exact frontend and report compiler metadata
        env:
          MIKKA_EDITION: cloud
          MIKKA_DEPLOYMENT_STAGE: production
          MIKKA_UI_OVERLAY_DIR: .hosted-ui
          MIKKA_UI_OVERLAY_SHA: 05096305ad4c7b5b3bebc1a9108798b451b988e0
          MIKKA_BUILD_REVISION: d59c85cb321b2b466616960db49dea8f038c2384
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_frontend_diagnosis
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: frontend-diagnosis
          NEXT_PUBLIC_POSTHOG_KEY: frontend-diagnosis
          NEXT_PUBLIC_COMPUTER_ENABLED: '1'
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { build } from 'vite'
          import { frontendConfig } from './apps/frontend/vite.config.mjs'
          const label = value => typeof value === 'string' && /^[A-Za-z0-9_.:-]{1,100}$/.test(value) ? value : undefined
          const file = value => typeof value === 'string' && value.startsWith(process.cwd() + '/') ? value.slice(process.cwd().length + 1).split('?')[0] : undefined
          const metadata = error => ({
            keys: Object.keys(error), code: label(error.code), plugin: label(error.plugin),
            id: file(error.id), exporter: file(error.exporter), binding: label(error.binding),
            location: error.loc ? { file: file(error.loc.file), line: Number.isInteger(error.loc.line) ? error.loc.line : undefined, column: Number.isInteger(error.loc.column) ? error.loc.column : undefined } : undefined,
          })
          assert.ok(!JSON.stringify(metadata(Object.assign(new Error('private-canary'), { code: 'BUILD_ERROR' }))).includes('private-canary'))
          try {
            process.env.MIKKA_DEPLOYMENT_ID = ['d59c85cb321b', process.env.GITHUB_RUN_ID, process.env.GITHUB_RUN_ATTEMPT].join('-')
            const config = await frontendConfig({ target: 'web' })
            config.logLevel = 'silent'
            await build(config)
            console.log(JSON.stringify({ frontend: 'passed' }))
          } catch (error) {
            const errors = Array.isArray(error.errors) ? error.errors : [error]
            console.log(JSON.stringify({ frontend: 'failed', errors: errors.map(metadata) }))
            process.exitCode = 1
          }
          JS
