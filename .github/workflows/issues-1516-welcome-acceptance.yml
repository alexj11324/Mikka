name: Issue 1516 real welcome acceptance
on:
  workflow_dispatch:
    inputs:
      application_sha:
        description: Exact deployed application SHA
        required: true
        type: string
      acceptance_cases:
        description: Real welcome cases or read-only structure diagnosis of the retained failed B fixture
        required: true
        default: all
        type: choice
        options: [all, claude-b, diagnose-b]
permissions:
  contents: read
jobs:
  recovery-contract:
    if: github.repository == 'alexj11324/Mikka' && github.ref == 'refs/heads/ops/1515-1517-acceptance'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/pnpm-install
        with:
          ffmpeg-github-token: ${{ github.token }}
      - name: Bind deterministic SDK regressions to the deployed business source
        env:
          APPLICATION_SHA: ${{ inputs.application_sha }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process'
          const sha = process.env.APPLICATION_SHA
          if (!/^[a-f0-9]{40}$/.test(sha ?? '')) throw new Error('application_sha_required')
          execFileSync('git', ['merge-base', '--is-ancestor', sha, 'HEAD'], { stdio: 'ignore' })
          execFileSync('git', ['diff', '--quiet', sha, '--', 'lib/subscription-workflow-turn.ts', 'lib/subscription-workflow-model.ts', 'lib/coordinator/invalid-tool-call.ts', 'workflows/coordinator/workflow.ts', 'workflows/coordinator/round-preparation.ts', 'workflows/coordinator/agent-kit-steps.ts', 'lib/agent-welcome.ts', 'lib/agent-ui-source.ts', 'lib/agent-ui-catalog.ts', 'lib/agent-ui-status.ts', 'pnpm-lock.yaml'], { stdio: 'ignore' })
          JS
      - name: Prove unknown/none/empty recovery budget and dedicated failure outcome with the real SDK
        run: node --experimental-test-module-mocks --import ./scripts/server-test.mjs --import tsx --test lib/subscription-workflow-turn.test.ts lib/agent-rounds.test.ts lib/agent-kit/core-entry.test.ts
  preflight:
    needs: recovery-contract
    concurrency:
      group: production-smoke-owner-acceptance
      cancel-in-progress: false
      queue: max
    if: github.repository == 'alexj11324/Mikka' && github.ref == 'refs/heads/ops/1515-1517-acceptance'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm-install
        with:
          ffmpeg-github-token: ${{ github.token }}
      - name: Read application database through the existing workload identity
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /vercel
          secret-name: MIKKA_DATABASE_URL
          recursive: false
          include-imports: false
      - name: Read the shared test account email
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          secret-name: SMOKE_OWNER_EMAIL
          recursive: false
          include-imports: false
      - name: Read the shared test account password
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          secret-name: SMOKE_OWNER_PASSWORD
          recursive: false
          include-imports: false
      - name: Verify the bounded production acceptance driver
        run: node --import tsx scripts/ops/issues-1516-welcome-acceptance.mjs --self-test
      - name: Exercise the real fresh Coordinator welcome through the normal account
        env:
          APPLICATION_SHA: ${{ inputs.application_sha || 'f7225f3eb1e38762dfdecde0395792c85b81ec22' }}
          ACCEPTANCE_CASES: ${{ inputs.acceptance_cases }}
        run: MIKKA_OPS_DEPENDENCIES="${{ github.workspace }}" node --import tsx scripts/ops/issues-1516-welcome-acceptance.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1516-welcome-${{ github.sha }}
          path: issues-1516-welcome-report
          retention-days: 7
