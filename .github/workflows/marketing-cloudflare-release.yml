name: Marketing Cloudflare release
on:
  push:
    branches: [main]
    paths: &release_paths
      - '.github/workflows/marketing-cloudflare-release.yml'
      - 'scripts/ops/marketing-cloudflare-release.mjs'
  pull_request:
    paths: *release_paths
  workflow_dispatch:
    inputs:
      action:
        description: Apply the reviewed release, or restore the prior marketing DNS
        type: choice
        options: [release, rollback]
        default: release
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('marketing-preview-{0}', github.ref) || 'marketing-cloudflare-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.action != 'rollback'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - run: node scripts/ops/marketing-cloudflare-release.mjs verify-staging
  production:
    needs: verify
    if: always() && github.repository == 'alexj11324/Mikka' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (needs.verify.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.action == 'rollback'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Wait for successful CI on this exact public main
        if: inputs.action != 'rollback'
        run: node scripts/release/ci-gate.mjs
      - name: Read Cloudflare release token via the existing main identity
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: CLOUDFLARE_API_TOKEN
          recursive: false
          include-imports: false
      - name: Read Cloudflare account ID
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: CLOUDFLARE_ACCOUNT_ID
          recursive: false
          include-imports: false
      - name: Publish the reviewed Worker version at 100 percent
        if: inputs.action != 'rollback'
        run: node scripts/ops/marketing-cloudflare-release.mjs publish
      - name: Cut over and verify www then apex, with automatic DNS rollback
        if: inputs.action != 'rollback'
        run: node scripts/ops/marketing-cloudflare-release.mjs cutover
      - name: Restore Vercel DNS
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'rollback'
        run: node scripts/ops/marketing-cloudflare-release.mjs rollback
