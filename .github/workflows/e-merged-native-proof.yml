  claude-interrupt:
    if: github.repository == 'alexj11324/Mikka'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      SOURCE: 30629ee1f18fa70b3713836017b437c22af915ee
    steps:
      - name: Check out the public harness only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: harness
          ref: f50c0fb3f1cd3d04d51e1c6c533f833b01993e82
          persist-credentials: false
          sparse-checkout: evidence/2257/local-provider
      - name: Check out the existing Claude ToolSearch provider
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: tool-provider
          ref: 62528f47e658f560880112fd98b877a54561d0fa
          persist-credentials: false
          sparse-checkout: evidence/2257/local-provider
      - name: Check out the immutable public product
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: product
          ref: 30629ee1f18fa70b3713836017b437c22af915ee
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - name: Install the exact public product and CPU inference runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C product rev-parse HEAD)" = "$SOURCE"
          test "$(git -C product rev-parse 'HEAD^{tree}')" = e7c4c9fb3a72be9b06993a4ec244c5b25a1c3b26
          cd product
          pnpm install --frozen-lockfile
          cd ../harness/evidence/2257/local-provider
          # Keep both original delivery trials. Only the loopback provider implements the CLI's deferred MCP lookup.
          provider_file=evidence/2257/local-provider/claude-provider.mjs
          provider_root="$GITHUB_WORKSPACE/tool-provider"
          test "$(git -C "$provider_root" rev-parse HEAD)" = 62528f47e658f560880112fd98b877a54561d0fa
          expected_blob="$(git -C "$provider_root" rev-parse "HEAD:$provider_file")"
          cp "$provider_root/$provider_file" ./claude-provider.mjs
          test "$(git hash-object claude-provider.mjs)" = "$expected_blob"
          npm ci --ignore-scripts --no-audit --no-fund
          mkdir -m 700 "$RUNNER_TEMP/model-fixture" "$RUNNER_TEMP/isolated-home" "$RUNNER_TEMP/receipt"
          python prepare-claude.py "$GITHUB_WORKSPACE/product" "$RUNNER_TEMP/model-fixture"
          mkdir -p "$GITHUB_WORKSPACE/product/.cache/e-codex-actual"
          cp claude-delivery.mts observe-queue.mts "$GITHUB_WORKSPACE/product/.cache/e-codex-actual/"
          if [ ! -x /usr/lib/postgresql/17/bin/initdb ]; then
            . /etc/os-release
            curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o "$RUNNER_TEMP/pgdg-signing.asc"
            test "$(gpg --show-keys --with-colons "$RUNNER_TEMP/pgdg-signing.asc" | awk -F: '/^fpr:/ {print $10;exit}')" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
            sudo install -m 0644 "$RUNNER_TEMP/pgdg-signing.asc" /usr/share/keyrings/pgdg-evidence.asc
            echo "deb [signed-by=/usr/share/keyrings/pgdg-evidence.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg-evidence.list >/dev/null
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends postgresql-17
          fi
      - name: Run the official Claude Code adapter and verified GGUF inside isolated loopback
        shell: bash
        run: |
          set -euo pipefail
          worker_uid="$(id -u)"
          worker_gid="$(id -g)"
          src="$GITHUB_WORKSPACE/product"
          harness="$GITHUB_WORKSPACE/harness/evidence/2257/local-provider"
          sudo unshare --net bash -euc '
            ip link set lo up
            test "$(ls /sys/class/net)" = lo || test "$(ip -o link show | wc -l)" = 1
            test -z "$(ip route show default)"
            exec setpriv --reuid="$1" --regid="$2" --clear-groups --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs env -i PATH="$3" HOME="$4" bash "$5/pg-claude.sh" "$5" "$6" "$7/receipt" "$7/model-fixture/claude" "$7/model-fixture/model.gguf"
          ' isolated "$worker_uid" "$worker_gid" "$PATH" "$RUNNER_TEMP/isolated-home" "$harness" "$src" "$RUNNER_TEMP"
      - name: Verify the real interruption, submitted handoff and queued child
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'receipt'
          required = {
              'interrupt': ['terminal cancelled attempt held the queued message', 'new authorized replacement ran'],
              'submitted': ['authentic MCP handoff', 'automatic child executed actual queued request through native Claude Code'],
          }
          for trial, events in required.items():
              receipt = json.loads((root / f'{trial}-trial.json').read_text())
              assert receipt['source'] == os.environ['SOURCE'] and receipt['success'] is True, trial
              stages = [row['stage'] for row in receipt['stages']]
              for event in events:
                  assert any(stage.startswith(event) for stage in stages), event
          tools = [json.loads(line) for line in (root / 'claude-tools.jsonl').read_text().splitlines()]
          assert any('mcp__mikka__submit' in row.get('referencedNames', []) for row in tools)
          PY
      - name: Retain only the sanitized source, model and event receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 30629ee1-claude-interrupt
          path: |
            ${{ runner.temp }}/receipt/*-trial.json
            ${{ runner.temp }}/receipt/cleanup-*.jsonl
            ${{ runner.temp }}/receipt/delivery.json
            ${{ runner.temp }}/receipt/steer-result.json
            ${{ runner.temp }}/receipt/interrupt-result.json
            ${{ runner.temp }}/receipt/setup-diagnostic.txt
            ${{ runner.temp }}/receipt/pg-waits.jsonl
            ${{ runner.temp }}/receipt/after-run-result.json
            ${{ runner.temp }}/receipt/handoff.json
            ${{ runner.temp }}/receipt/tools.jsonl
            ${{ runner.temp }}/receipt/claude-first-token.jsonl
            ${{ runner.temp }}/receipt/claude-requests.jsonl
            ${{ runner.temp }}/receipt/claude-tools.jsonl
            ${{ runner.temp }}/receipt/claude-results.jsonl
            ${{ runner.temp }}/receipt/decisions.jsonl
            ${{ runner.temp }}/receipt/requests.jsonl
            ${{ runner.temp }}/receipt/results.jsonl
            ${{ runner.temp }}/receipt/provider-ends.jsonl
            ${{ runner.temp }}/receipt/first-token.jsonl
            ${{ runner.temp }}/receipt/start
            ${{ runner.temp }}/receipt/end
            ${{ runner.temp }}/receipt/exit
          if-no-files-found: warn
          retention-days: 7


