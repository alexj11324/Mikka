name: CLA

# Asks each new contributor to sign CLA.md once, by commenting on their pull
# request. Signatures are stored in signatures/cla.json on the cla-signatures
# branch, so the bot never writes to the protected main branch. The action
# does not check out or run pull request code.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/alexj11324/Mikka/blob/main/CLA.md
          branch: cla-signatures
          # The maintainer's account (shared by the project's coding agents) and bots need no signature.
          allowlist: alexj11324,*[bot]
