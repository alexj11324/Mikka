name: Self-hosted image
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: self-hosted-image-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Build the public standalone application
        run: docker build --build-arg MIKKA_BUILD_REVISION="$GITHUB_SHA" --tag mikka-self-hosted:check .
      - name: Start with an empty database and no Mikka credentials
        run: |
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "MIKKA_IMAGE=mikka-self-hosted:check" >> "$GITHUB_ENV"
      - name: Apply migrations and wait for health
        run: docker compose up --detach --wait --wait-timeout 240
      - name: Verify runtime edition, sign-in document, API and compiled assets
        run: node scripts/self-hosted-smoke.mjs
        env:
          MIKKA_EXPECTED_REVISION: ${{ github.sha }}
      - name: Verify the same persistent installation restarts
        run: |
          docker compose restart app
          docker compose up --detach --wait --wait-timeout 120
          node scripts/self-hosted-smoke.mjs
      - name: Publish the tested revision
        if: github.event_name == 'push' && github.repository == 'alexj11324/Mikka'
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image=ghcr.io/alexj11324/mikka
          docker tag mikka-self-hosted:check "$image:$GITHUB_SHA"
          docker push "$image:$GITHUB_SHA"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            docker tag mikka-self-hosted:check "$image:$GITHUB_REF_NAME"
            docker push "$image:$GITHUB_REF_NAME"
          elif [ "$GITHUB_REF" = refs/heads/main ]; then
            docker tag mikka-self-hosted:check "$image:latest"
            docker push "$image:latest"
          fi
      - name: Retain startup diagnostics on failure
        if: failure()
        run: docker compose logs --no-color --tail=150
      - name: Stop disposable services
        if: always()
        run: docker compose down --volumes --remove-orphans
