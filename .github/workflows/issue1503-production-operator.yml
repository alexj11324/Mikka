name: Issue 1503 encrypted continuation tool diagnosis
on:
  push:
    branches: [ops/issue-1503-production-smoke]
    paths:
      - .github/workflows/issue1503-production-operator.yml
      - scripts/ops/issue1503/**
      - scripts/ops/issue1503-smoke-github*
permissions:
  contents: read
concurrency:
  group: production-smoke-owner-acceptance
  cancel-in-progress: false
  queue: max
jobs:
  diagnose:
    if: false
    runs-on: ubuntu-latest
    concurrency:
      group: web-deploy-production
      cancel-in-progress: false
      queue: max
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    env:
      MIKKA_EDITION: cloud
      MIKKA_EXPECTED_DEPLOYMENT_SHA: '5ba1f9e2359ce714d83cd16fc040f2567c40a6d0'
      MIKKA_1503_PRIVATE_THREAD_DIAGNOSTIC_GO: ''
      MIKKA_1503_START_FIXTURE_SHA256: 9e0836aa5e5d290dac5c282e82f56907b99207820ded44396159b935c53f9de7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@10.34.3 --activate && pnpm install --frozen-lockfile
      - uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          recursive: false
          include-imports: false
      - name: Read and encrypt the fixed continuation tools once
        run: node --import ./tests/support/server-only.mjs --import tsx scripts/ops/issue1503/single-thread-diagnostic.ts
        env:
          NODE_ENV: production
          VERCEL_ENV: production
          BETTER_AUTH_URL: https://app.aspectlylabs.com
          NEXT_PUBLIC_APP_URL: https://app.aspectlylabs.com
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue1503-private-thread-0450e5aa
          path: issue1503-report/private-thread-0450e5aa.json
          if-no-files-found: error
          retention-days: 3
