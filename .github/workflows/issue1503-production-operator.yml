name: Issue 1503 cancel exact queued duplicate Web
on:
  push:
    branches: [ops/issue-1503-production-smoke]
    paths: [.github/workflows/issue1503-production-operator.yml]
permissions:
  actions: write
concurrency:
  group: issue1503-cancel-exact-42601138019
  cancel-in-progress: false
jobs:
  cancel_exact_duplicate_web:
    if: github.repository == 'alexj11324/Mikka'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel only the exact unallocated duplicate Web run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          repo='alexj11324/Mikka'
          run_id=42601138019
          expected_sha='a2198c8c2f608f7b8169329b9da853067618dba6'
          token=os.environ['GH_TOKEN']
          assert os.environ['GITHUB_REPOSITORY']==repo
          assert os.environ['GITHUB_RUN_ID']!=str(run_id)
          api='https://api.github.com/repos/'+repo
          base=api+'/actions/runs/'+str(run_id)
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def request(url,method='GET'):
           try:
            with urllib.request.urlopen(urllib.request.Request(url,headers=headers,method=method),timeout=20) as r:
             return r.status,r.read()
           except urllib.error.HTTPError as e:
            raise SystemExit('issue1503_cancel_http_'+str(e.code))
          def read(url):
           status,raw=request(url)
           assert status==200
           return json.loads(raw)
          def exact(run):
           assert run['id']==run_id and run['head_sha']==expected_sha and run['head_branch']=='main'
           assert run['event']=='workflow_dispatch' and run['path']=='.github/workflows/web-deploy.yml'
           assert run['created_at']=='2026-11-09T10:28:38Z' and run['run_attempt']==1
          assert read(api+'/git/ref/heads/main')['object']['sha']==expected_sha
          run=read(base)
          exact(run)
          report={'issue':1503,'phase':'cancel_exact_unallocated_duplicate_web','targetRunId':run_id,'targetSource':expected_sha,'targetStatusBefore':run['status'],'cancelRequested':False,'preservedRunIds':[42600269460,42600269541]}
          if run['status']=='completed':
           report['targetConclusion']=run['conclusion']
          else:
           assert run['status'] in ('queued','pending')
           listed=read(base+'/jobs?per_page=100')
           jobs=listed['jobs']
           assert listed['total_count']==1 and len(jobs)==1 and jobs[0]['id']==129105623578
           for job in jobs:
            assert job['run_id']==run_id and job['head_sha']==expected_sha and job['run_attempt']==1
            assert job['status'] in ('queued','pending') and not job.get('runner_id') and not job.get('runner_name')
            assert not job.get('steps')
           latest=read(base)
           exact(latest)
           assert latest['status'] in ('queued','pending')
           status,_=request(base+'/cancel','POST')
           assert status==202
           report.update({'cancelRequested':True,'httpStatus':status,'jobsVerifiedUnallocated':len(jobs),'stepsStarted':0})
          print(json.dumps(report))
          PY
