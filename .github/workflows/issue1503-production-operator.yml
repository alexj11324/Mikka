name: Issue 1503 bounded read-only diagnosis
on:
  push:
    branches: [ops/issue-1503-production-smoke]
    paths:
      - .github/workflows/issue1503-production-operator.yml
      - scripts/ops/issue1503/diagnose-f42606137512.ts
permissions:
  contents: read
concurrency:
  group: production-smoke-owner-acceptance
  cancel-in-progress: false
  queue: max
jobs:
  read_failed_evidence:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@10.34.3 --activate && pnpm install --frozen-lockfile
      - uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          secret-name: SMOKE_OWNER_EMAIL
          recursive: false
          include-imports: false
      - uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          secret-name: SMOKE_OWNER_PASSWORD
          recursive: false
          include-imports: false
      - name: Read one existing review artifact and normal linked-account metadata
        run: node --import ./tests/support/server-only.mjs --import tsx scripts/ops/issue1503/diagnose-f42606137512.ts
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue1503-diagnosis-42606137512
          path: issue1503-report/diagnosis-42606137512.json
          if-no-files-found: error
          retention-days: 3
