name: Issue 1503 production setup operator
on:
  push:
    branches: [ops/issue-1503-production-smoke]
    paths:
      - .github/workflows/issue1503-production-operator.yml
      - scripts/ops/issue1503/**
      - scripts/ops/issue1503-smoke-github*
permissions:
  contents: read
concurrency:
  group: production-smoke-owner-acceptance
  cancel-in-progress: false
  queue: max
jobs:
  setup:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: web-deploy-production
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        id: setup_node
        with:
          node-version: 24
      - id: dependencies
        run: corepack enable && corepack prepare pnpm@10.34.3 --activate && pnpm install --frozen-lockfile
      - name: Read the Vercel team token through Infisical workload identity
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: VERCEL_TEAM_TOKEN
          include-imports: false
      - name: Record the normal production runtime pair before setup writes
        id: runtime_witness
        if: always()
        env:
          MIKKA_RUNTIME_WITNESS_PRIOR_STATUS: ${{ job.status }}
        run: |
          node --input-type=module - <<'JS'
          import { createHash } from 'node:crypto'
          import { mkdirSync, writeFileSync } from 'node:fs'
          
          const sha = process.env.GITHUB_SHA
          const runId = process.env.GITHUB_RUN_ID
          const attempt = process.env.GITHUB_RUN_ATTEMPT
          const report = {
            version: 1, phase: 'runtime_witness', status: 'failed',
            code: 'runtime_witness_not_completed', consistency: 'unverified',
            sourceCommit: /^[a-f0-9]{40}$/.test(sha ?? '') ? sha : null,
            runId: /^[1-9][0-9]*$/.test(runId ?? '') ? runId : null,
            runAttempt: /^[1-9][0-9]*$/.test(attempt ?? '') ? attempt : null,
            startedAt: new Date().toISOString(),
          }
          let code = 'runtime_witness_source_invalid'
          try {
            if (!report.sourceCommit || !report.runId || !report.runAttempt) throw Error()
            code = 'runtime_witness_prerequisite_failed'
            if (process.env.MIKKA_RUNTIME_WITNESS_PRIOR_STATUS !== 'success') throw Error()
            code = 'runtime_witness_token_unavailable'
            const token = process.env.VERCEL_TEAM_TOKEN
            if (!token) throw Error()
            code = 'runtime_witness_module_unavailable'
            const { api, PROJECT, TEAM, TEMPLATE_ENV, runtimeConfigurationSha } =
              await import('./scripts/e2b/publish-template-env.mjs')
            report.projectId = PROJECT
            report.teamId = TEAM
            const keys = [...Object.values(TEMPLATE_ENV), 'MIKKA_CLOUD_WORKER_SHA',
              'MIKKA_CLOUD_TEMPLATE_MODELS', 'MIKKA_CLOUD_WORKER_SOURCE_COMMIT']
            code = 'runtime_witness_configuration_read_failed'
            const { envs } = await api('/v10/projects/' + PROJECT + '/env', { token, method: 'GET' })
            if (!Array.isArray(envs)) throw Error()
            code = 'runtime_witness_production_binding_invalid'
            const rows = keys.map(key => {
              const matches = envs.filter(row => row.key === key && row.target?.includes('production') && !row.gitBranch)
              if (matches.length !== 1 || typeof matches[0].id !== 'string' || !matches[0].id) throw Error()
              return [key, matches[0].id]
            })
            code = 'runtime_witness_configuration_read_failed'
            const pairs = await Promise.all(rows.map(async ([key, id]) => [key,
              (await api('/v1/projects/' + PROJECT + '/env/' + encodeURIComponent(id), { token, method: 'GET' })).value,
            ]))
            const configuration = Object.fromEntries(pairs)
            code = 'runtime_witness_configuration_inconsistent'
            const workerSha = runtimeConfigurationSha(configuration, { allowLegacy: false })
            if (!workerSha) { report.consistency = 'inconsistent'; throw Error() }
            report.runtimeSourceCommit = configuration.MIKKA_CLOUD_WORKER_SOURCE_COMMIT
            report.workerSha = workerSha
            report.templateIds = Object.fromEntries(Object.entries(TEMPLATE_ENV).map(([kind, key]) => [kind, configuration[key]]))
            report.catalogueSha256 = createHash('sha256').update(configuration.MIKKA_CLOUD_TEMPLATE_MODELS).digest('hex')
            report.consistency = 'consistent'
            report.status = 'passed'
            report.code = 'runtime_configuration_consistent'
          } catch {
            report.code = code
            process.exitCode = 1
          } finally {
            report.finishedAt = new Date().toISOString()
            mkdirSync('issue1503-report', { recursive: true, mode: 0o700 })
            writeFileSync('issue1503-report/runtime-witness.json', JSON.stringify(report, null, 2) + '\n', { mode: 0o600 })
            console.log(JSON.stringify({ phase: report.phase, status: report.status, code: report.code, consistency: report.consistency }))
          }
          JS
      - name: Upload the actual runtime witness before setup writes
        id: upload_runtime_witness
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue1503-runtime-witness
          path: issue1503-report/runtime-witness.json
          if-no-files-found: error
          retention-days: 3
      - uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        id: smoke_secrets
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          recursive: false
          include-imports: false
      - name: Import the pinned production application database
        id: start_database
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /vercel
          secret-name: MIKKA_DATABASE_URL
          recursive: false
          include-imports: false
      - name: Import the production auth key for normal setup services
        id: setup_auth_secret
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /vercel
          secret-name: BETTER_AUTH_SECRET
          recursive: false
          include-imports: false
      - name: Import the pinned production workspace database
        id: setup_workspace_database
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /neon
          secret-name: DATABASE_URL
          recursive: false
          include-imports: false
      - name: Import the normal GitHub application client identifier
        id: setup_github_client_id
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /vercel
          secret-name: GITHUB_CLIENT_ID
          recursive: false
          include-imports: false
      - name: Import the normal GitHub application client secret
        id: setup_github_client_secret
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /vercel
          secret-name: GITHUB_CLIENT_SECRET
          recursive: false
          include-imports: false
      - name: Validate setup configuration before application modules load
        id: setup_configuration
        run: |
          node --input-type=module - <<'JS'
          const keys = ['MIKKA_DATABASE_URL', 'DATABASE_URL', 'BETTER_AUTH_SECRET', 'GITHUB_CLIENT_ID', 'GITHUB_CLIENT_SECRET']
          const missing = keys.filter(key => !process.env[key]?.trim())
          if (missing.length) {
            console.error(JSON.stringify({ phase: 'setup_configuration', status: 'failed', code: 'setup_configuration_missing', keys: missing }))
            process.exitCode = 1
          } else {
            console.log(JSON.stringify({ phase: 'setup_configuration', status: 'passed', keys }))
          }
          JS
      - name: Prepare the existing smoke workspace and a new scoped GitHub child
        id: preflight_reentry
        run: node --import ./tests/support/server-only.mjs --import tsx scripts/ops/issue1503/preflight-reentry.ts
        env:
          NODE_ENV: production
          VERCEL_ENV: production
          MIKKA_EDITION: cloud
          MIKKA_EXPECTED_DEPLOYMENT_SHA: "ab2d00a43a79d35380b4d2db9014a3792fea63ca"
      - name: Upload the actual preflight receipt
        id: upload_preflight
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue1503-preflight-reentry
          path: issue1503-report/preflight-reentry.json
          if-no-files-found: error
          retention-days: 3
      - name: Enable the normal credit share without starting a task
        id: credit_share_setup
        if: success() && steps.preflight_reentry.outcome == 'success'
        run: node --import ./tests/support/server-only.mjs --import tsx scripts/ops/issue1503/credit-share-setup.ts
        env:
          NODE_ENV: production
          VERCEL_ENV: production
          MIKKA_EDITION: cloud
          MIKKA_EXPECTED_DEPLOYMENT_SHA: "ab2d00a43a79d35380b4d2db9014a3792fea63ca"
          MIKKA_1503_CREDIT_SHARE_REPORT: issue1503-report/credit-share-setup.json
      - name: Upload the actual credit-share setup receipt
        id: upload_credit_share
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue1503-credit-share-setup
          path: issue1503-report/credit-share-setup.json
          if-no-files-found: error
          retention-days: 3
