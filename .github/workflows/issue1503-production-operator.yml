name: Issue 1503 cancel exact queued setup
on:
  push:
    branches: [ops/issue-1503-production-smoke]
    paths: [.github/workflows/issue1503-production-operator.yml]
permissions:
  actions: write
concurrency:
  group: issue1503-cancel-exact-42585486907
  cancel-in-progress: false
jobs:
  cancel_exact_setup:
    if: github.repository == 'alexj11324/Mikka'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel only the previous source-bound setup run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          repo='alexj11324/Mikka'
          run_id=42585486907
          expected_sha='24633749c1a902368fb6380297fc24acaee5b60b'
          expected_branch='ops/issue-1503-production-smoke'
          token=os.environ['GH_TOKEN']
          assert os.environ['GITHUB_REPOSITORY']==repo
          assert os.environ['GITHUB_RUN_ID']!=str(run_id)
          base='https://api.github.com/repos/'+repo+'/actions/runs/'+str(run_id)
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def request(url,method='GET'):
           try:
            with urllib.request.urlopen(urllib.request.Request(url,headers=headers,method=method),timeout=20) as r:
             return r.status,r.read()
           except urllib.error.HTTPError as e:
            raise SystemExit('issue1503_cancel_http_'+str(e.code))
          status,raw=request(base)
          run=json.loads(raw)
          assert run['id']==run_id and run['head_sha']==expected_sha and run['head_branch']==expected_branch
          assert run['event']=='push' and run['path']=='.github/workflows/issue1503-production-operator.yml'
          report={'issue':1503,'phase':'cancel_exact_unstarted_setup','targetRunId':run_id,'targetSource':expected_sha,'targetStatusBefore':run['status'],'cancelRequested':False}
          if run['status']!='completed':
           status,_=request(base+'/cancel','POST')
           assert status==202
           report['cancelRequested']=True
           report['httpStatus']=status
          else:
           report['targetConclusion']=run['conclusion']
          print(json.dumps(report))
          PY
