name: App icon

# The iOS app and the desktop app share one Icon Composer bundle
# (apps/mobile/assets/icon.icon, copied to apps/desktop/build/icon.icon).
# EAS compiles the iOS copy with Xcode's actool; electron-builder compiles the
# desktop copy. This job compiles both the same way on a pull request, so a
# broken bundle fails here, and renders each appearance with Icon Composer's
# ictool for review (artifact `app-icon-previews`).
on:
  pull_request:
    paths:
      - 'apps/mobile/assets/icon.icon/**'
      - 'apps/desktop/build/icon.icon/**'
      - '.github/workflows/app-icon.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  icon:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: The iOS and desktop bundles are the same file
        run: diff -r apps/mobile/assets/icon.icon apps/desktop/build/icon.icon
      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          test -n "$xcode" || { echo "::error::No Xcode 26 on this runner; icon.icon needs actool 26+"; exit 1; }
          sudo xcode-select -s "$xcode"
          actool --version
          ictool="$xcode/Contents/Applications/Icon Composer.app/Contents/Executables/ictool"
          test -x "$ictool" || ictool=$(find "$xcode" -name ictool -type f -perm -u+x | head -1)
          test -x "$ictool" || { echo "::error::ictool not found in $xcode"; exit 1; }
          echo "ICTOOL=$ictool" >> "$GITHUB_ENV"
      - name: Compile for iOS, with flat icons for iOS before 26
        run: |
          out="$RUNNER_TEMP/out/ios"
          mkdir -p "$out"
          cp -R apps/mobile/assets/icon.icon "$RUNNER_TEMP/AppIcon.icon"
          actool "$RUNNER_TEMP/AppIcon.icon" --compile "$out" \
            --output-format human-readable-text --notices --warnings --errors \
            --output-partial-info-plist "$out/assetcatalog_generated_info.plist" \
            --app-icon AppIcon --include-all-app-icons \
            --enable-on-demand-resources NO --development-region en \
            --target-device iphone --minimum-deployment-target 15.1 --platform iphoneos
          test -s "$out/Assets.car"
          ls -la "$out"
          xcrun assetutil --info "$out/Assets.car" > "$out/assets-info.json"
          grep -o '"Appearance" : "[^"]*"' "$out/assets-info.json" | sort | uniq -c
          ls "$out"/AppIcon*.png
      - name: TEMP isolate the macOS crash
        run: |
          mk() { rm -rf "$RUNNER_TEMP/v/$1.icon"; mkdir -p "$RUNNER_TEMP/v"; cp -R apps/desktop/build/icon.icon "$RUNNER_TEMP/v/$1.icon"; python3 -c "import json,sys;p=sys.argv[1];d=json.load(open(p));exec(sys.argv[2]);json.dump(d,open(p,'w'),indent=2)" "$RUNNER_TEMP/v/$1.icon/icon.json" "$2"; }
          mk base 'pass'
          mk noopacity 'del d["groups"][1]["layers"][0]["opacity"]'
          mk offnoglass 'd["groups"][1]["layers"][0]["glass"]=False'
          mk notransl 'd["groups"][0]["translucency"]={"enabled":False,"value":0.5}'
          mk nospec 'd["groups"][0]["specular"]=False; d["groups"][0].pop("name"); d["groups"][1].pop("name")'
          mk noshadow 'd["groups"][0]["shadow"]={"kind":"none","opacity":0.5}'
          mk onegroup 'd["groups"]=d["groups"][:1]'
          for v in base noopacity offnoglass notransl nospec noshadow onegroup; do
            o="$RUNNER_TEMP/v/out-$v"; mkdir -p "$o"
            if actool "$RUNNER_TEMP/v/$v.icon" --compile "$o" --output-format human-readable-text --errors \
              --output-partial-info-plist "$o/p.plist" --app-icon $v --include-all-app-icons \
              --enable-on-demand-resources NO --development-region en \
              --target-device mac --minimum-deployment-target 26.0 --platform macosx > "$o/log.txt" 2>&1 && test -s "$o/Assets.car"
            then echo "RESULT $v ok"; else echo "RESULT $v CRASH"; fi
          done
      - name: Compile for macOS as electron-builder does
        continue-on-error: true
        run: |
          out="$RUNNER_TEMP/out/mac"
          mkdir -p "$out"
          cp -R apps/desktop/build/icon.icon "$RUNNER_TEMP/Icon.icon"
          actool "$RUNNER_TEMP/Icon.icon" --compile "$out" \
            --output-format human-readable-text --notices --warnings --errors \
            --output-partial-info-plist "$out/assetcatalog_generated_info.plist" \
            --app-icon Icon --include-all-app-icons --accent-color AccentColor \
            --enable-on-demand-resources NO --development-region en \
            --target-device mac --minimum-deployment-target 26.0 --platform macosx
          test -s "$out/Assets.car"
          test -s "$out/Icon.icns"
      - name: Render each appearance
        run: |
          out="$RUNNER_TEMP/out/previews"
          mkdir -p "$out"
          "$ICTOOL" --version || true
          for platform in iOS macOS; do
            for rendition in Default Dark TintedLight TintedDark ClearLight ClearDark; do
              "$ICTOOL" apps/mobile/assets/icon.icon --export-image \
                --output-file "$out/$platform-$rendition.png" \
                --platform "$platform" --rendition "$rendition" \
                --width 1024 --height 1024 --scale 1
              test -s "$out/$platform-$rendition.png"
            done
          done
          ls -la "$out"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-icon-previews
          path: ${{ runner.temp }}/out
          retention-days: 14
