name: Session mailbox contracts
on: [push, pull_request, merge_group]
permissions:
  contents: read
jobs:
  mailboxes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: mikka_mailbox_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d mikka_mailbox_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MAILBOX_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/mikka_mailbox_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/isolated-pg-extensions
        with:
          container: ${{ job.services.postgres.id }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Group review disposable database
        run: psql postgres://postgres@127.0.0.1:5432/postgres -c 'CREATE DATABASE mikka_review'
      - run: pnpm test:mailboxes
      - name: Group API, HTTP and offline native adapters
        run: pnpm test:groups
        env:
          MIKKA_DISPOSABLE_POSTGRES_URL: postgres://postgres@127.0.0.1:5432/mikka_review
          MIKKA_TEST_NATIVE_GROUPS: '1'
      - run: pnpm --filter @mikka/daemon exec vitest run test/mailbox.test.ts test/skills.test.ts test/adapters.test.ts test/runs.test.ts test/group-review-worker.test.ts test/server-link-http.test.ts
      - run: pnpm --filter @mikka/daemon typecheck
