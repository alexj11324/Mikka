name: Session mailbox contracts
on: [push, pull_request, merge_group]
permissions:
  contents: read
jobs:
  native-authorization:
    runs-on: ubuntu-latest
    steps:
      # Prior approvals are not reusable. This gate has no service containers.
      - name: Native authorization is pending for automatic events
        run: |
          echo '::error::BLOCKED: this automatic run has no run-specific native resource deletion authorization'
          exit 1
  mailboxes:
    needs: native-authorization
    if: github.ref != 'refs/heads/fix/169-metadata-integration' && github.ref != 'refs/heads/fix/178-daemon-revocation' && github.ref != 'refs/heads/fix/178-transaction-fence' && github.head_ref != 'fix/169-metadata-integration' && github.head_ref != 'fix/178-daemon-revocation' && github.head_ref != 'fix/178-transaction-fence'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: mikka_mailbox_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d mikka_mailbox_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MAILBOX_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/mikka_mailbox_e2e
      KEEP_GROUP_TEST_FIXTURES: '1'
      KEEP_NATIVE_TEST_FIXTURES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Group review disposable database
        run: |
          psql postgres://postgres@127.0.0.1:5432/postgres -c 'CREATE DATABASE mikka_review'
          psql postgres://postgres@127.0.0.1:5432/postgres -c 'CREATE DATABASE mikka_workspace_review'
      - run: pnpm test:mailboxes
      - name: Group API, HTTP and offline native adapters
        run: pnpm test:groups
        env:
          MIKKA_DISPOSABLE_POSTGRES_URL: postgres://postgres@127.0.0.1:5432/mikka_review
          MIKKA_DISPOSABLE_WORKSPACE_POSTGRES_URL: postgres://postgres@127.0.0.1:5432/mikka_workspace_review
          MIKKA_TEST_NATIVE_GROUPS: '1'
      - name: Required native profile count and retained receipt
        run: pnpm test:group-native
        env:
          MIKKA_DISPOSABLE_POSTGRES_URL: postgres://postgres@127.0.0.1:5432/mikka_review
          MIKKA_DISPOSABLE_WORKSPACE_POSTGRES_URL: postgres://postgres@127.0.0.1:5432/mikka_workspace_review
      - run: pnpm --filter @mikka/daemon exec vitest run test/mailbox.test.ts test/skills.test.ts test/adapters.test.ts test/runs.test.ts test/group-review-worker.test.ts test/server-link-http.test.ts
      - run: pnpm --filter @mikka/daemon typecheck
      - name: Preserve native resource receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-resource-receipts
          path: |
            /tmp/mgn-img-*/resource-receipts.jsonl
            /tmp/mgn-img-*/retained-resources.json
          if-no-files-found: error
