name: Mobile OTA update

# Production OTA shares the deployment pipeline's default-off owner window
# and completed staging proof. A main push still checks the client, but cannot
# publish ahead of staging. A completed automatic deployment supplies the next
# release opportunity without polling. PR previews keep their own EAS branch.
on:
  push:
    branches: [main]
    paths: ['apps/mobile/**', 'packages/protocol/**']
  pull_request:
    paths: ['apps/mobile/**', 'packages/protocol/**']
  workflow_run:
    workflows: [Cloudflare application deployment]
    types: [completed]
  # A private UI change also needs the corresponding reviewed staging receipt.
  workflow_dispatch:
    inputs:
      staging_run:
        description: Completed automatic staging workflow run for this main source
        type: string
        required: false
      staging_attempt:
        description: Original staging run attempt
        type: string
        required: false
        default: '1'
      staging_artifact:
        description: Original deploy-pipeline receipt artifact
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: mobile-update-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MIKKA_PRIVATE_GITHUB_OWNER: ${{ vars.MIKKA_PRIVATE_GITHUB_OWNER }}
  MIKKA_HOSTED_UI_GITHUB_OWNER: ${{ vars.MIKKA_HOSTED_UI_GITHUB_OWNER }}

jobs:
  update:
    name: EAS Update
    if: >-
      (github.repository_id == '1427517699' && ((github.repository == 'alexj11324/Mikka' && github.repository_owner_id == '183887963') || (github.repository == 'aspectly-labs/Mikka' && github.repository_owner_id == '359279274'))) &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'workflow_run' &&
       github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.repository.id == 1427517699 &&
       github.event.workflow_run.head_repository.id == 1427517699 && !github.event.workflow_run.head_repository.fork))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Verify production credential delivery boundaries
        run: node --test scripts/mobile-ota-credentials.test.mjs
      - run: pnpm install --frozen-lockfile --filter @mikka/mobile...
      - run: pnpm --filter @mikka/mobile typecheck
      - name: Validate the selected private UI owner before credential access
        run: |
          node --input-type=module - <<'JS'
          import { privateMikkaRepository } from './scripts/cloudflare-source.mjs'
          privateMikkaRepository('mikka-hosted-ui')
          JS
      - name: Select the trusted main OTA candidate
        id: candidate
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run') &&
          github.ref == 'refs/heads/main' && (github.repository_id == '1427517699' && ((github.repository == 'alexj11324/Mikka' && github.repository_owner_id == '183887963') || (github.repository == 'aspectly-labs/Mikka' && github.repository_owner_id == '359279274'))) && github.actor_id == '183887963'
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { appendFile } from 'node:fs/promises'
          import { execFileSync } from 'node:child_process'
          const source = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim()
          assert.match(source, /^[a-f0-9]{40}$/)
          assert.equal(source, process.env.GITHUB_SHA)
          await appendFile(process.env.GITHUB_OUTPUT, 'source=' + source + '\n')
          JS
      - name: Read the existing source App id
        if: steps.candidate.outputs.source != ''
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /github
          secret-name: GITHUB_APP_ID
          recursive: false
          include-imports: false
      - name: Read the existing source App private key
        if: steps.candidate.outputs.source != ''
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /github
          secret-name: GITHUB_APP_PRIVATE_KEY
          recursive: false
          include-imports: false
      - name: Read the reviewed operations policy and public evidence
        if: steps.candidate.outputs.source != ''
        id: source-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ env.GITHUB_APP_ID }}
          private-key: ${{ env.GITHUB_APP_PRIVATE_KEY }}
          owner: alexj11324
          repositories: |
            Mikka
            mikka-cloud
          permission-contents: read
          permission-actions: read
          permission-issues: read
      - name: Remove source App credentials
        if: steps.candidate.outputs.source != ''
        run: |
          echo 'GITHUB_APP_ID=' >> "$GITHUB_ENV"
          echo 'GITHUB_APP_PRIVATE_KEY=' >> "$GITHUB_ENV"
      - name: Pin the reviewed private main source
        if: steps.candidate.outputs.source != ''
        id: operations
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { appendFile } from 'node:fs/promises'
          import { execFileSync } from 'node:child_process'
          const source = execFileSync('gh', ['api', 'repos/alexj11324/mikka-cloud/git/ref/heads/main', '--jq', '.object.sha'],
            { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] }).trim()
          assert.match(source, /^[a-f0-9]{40}$/)
          await appendFile(process.env.GITHUB_OUTPUT, 'source=' + source + '\n')
          JS
      - name: Check out the fixed read-only production policy
        if: steps.candidate.outputs.source != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: alexj11324/mikka-cloud
          ref: ${{ steps.operations.outputs.source }}
          token: ${{ steps.source-token.outputs.token }}
          path: .mikka-cloud
          persist-credentials: false
      - name: Check the shared owner window and actual staging receipts
        if: steps.candidate.outputs.source != ''
        id: eligibility
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
          MIKKA_CF_OPERATIONS_SHA: ${{ steps.operations.outputs.source }}
          MIKKA_PUBLIC_SOURCE_SHA: ${{ steps.candidate.outputs.source }}
          MIKKA_PRODUCT_ROOT: ${{ github.workspace }}
          MIKKA_STAGE_RUN_ID: ${{ inputs.staging_run }}
          MIKKA_STAGE_RUN_ATTEMPT: ${{ inputs.staging_attempt }}
          MIKKA_STAGE_ARTIFACT_ID: ${{ inputs.staging_artifact }}
        run: node .mikka-cloud/operations/business-api/pipeline-policy.mjs mobile-eligibility
      - name: Record when production OTA is not authorized
        if: steps.candidate.outputs.source != '' && steps.eligibility.outputs.allowed != 'true'
        env:
          ELIGIBILITY_REASON: ${{ steps.eligibility.outputs.reason }}
        run: |
          printf 'Production OTA was not published: %s. Type checking completed; no production Expo credential was read.\n' "$ELIGIBILITY_REASON" >> "$GITHUB_STEP_SUMMARY"
      - name: Read the private UI checkout credential through OIDC
        if: steps.eligibility.outputs.allowed == 'true'
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: HOSTED_UI_READ_KEY
          recursive: false
          include-imports: false
      - name: Require the authorized private UI credential
        if: steps.eligibility.outputs.allowed == 'true'
        run: |
          if [ -z "$HOSTED_UI_READ_KEY" ]; then
            echo '::error::The authorized private UI credential was not delivered.'
            exit 1
          fi
      - name: Check out the private UI
        if: steps.eligibility.outputs.allowed == 'true' && env.HOSTED_UI_READ_KEY != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ format('{0}/mikka-hosted-ui', vars.MIKKA_HOSTED_UI_GITHUB_OWNER || vars.MIKKA_PRIVATE_GITHUB_OWNER || 'alexj11324') }}
          ref: ${{ steps.eligibility.outputs.overlay_sha }}
          ssh-key: ${{ env.HOSTED_UI_READ_KEY }}
          path: .hosted-ui
          persist-credentials: false
      - name: Use the private UI's mobile layer
        if: steps.eligibility.outputs.allowed == 'true'
        env:
          OVERLAY_SHA: ${{ steps.eligibility.outputs.overlay_sha }}
        run: |
          echo "HOSTED_UI_READ_KEY=" >> "$GITHUB_ENV"
          test "$(git -C .hosted-ui rev-parse HEAD)" = "$OVERLAY_SHA"
          test -d .hosted-ui/mobile || { echo "::error::Official mobile UI checkout required."; exit 1; }
          echo "MIKKA_MOBILE_OVERLAY_DIR=.hosted-ui/mobile" >> "$GITHUB_ENV"
          echo "::notice::Bundling the private UI layer at $(git -C .hosted-ui rev-parse HEAD)."
      - name: Compare actual mobile release inputs
        if: steps.eligibility.outputs.allowed == 'true'
        id: mobile-source
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
          OVERLAY_SHA: ${{ steps.eligibility.outputs.overlay_sha }}
        run: node scripts/release/mobile-ota-source.mjs select
      - name: Record when mobile inputs do not authorize an OTA
        if: steps.eligibility.outputs.allowed == 'true' && steps.mobile-source.outputs.selected != 'true'
        env:
          SOURCE_REASON: ${{ steps.mobile-source.outputs.reason }}
        run: |
          printf 'Production OTA was not published: %s. No production Expo credential was read.\n' "$SOURCE_REASON" >> "$GITHUB_STEP_SUMMARY"
      # This immutable file records inputs, not success. Its consumer also
      # checks the original attempt's later Publish to production step.
      - name: Preserve the immutable mobile source receipt
        if: steps.eligibility.outputs.allowed == 'true' && steps.mobile-source.outputs.selected == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobile-production-ota-source
          path: ${{ runner.temp }}/mobile-ota-source/release.json
          if-no-files-found: error
          retention-days: 90
      - name: Read the existing production Expo credential through OIDC
        if: >-
          steps.eligibility.outputs.allowed == 'true' && steps.mobile-source.outputs.selected == 'true' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run') && github.ref == 'refs/heads/main' &&
          (github.repository_id == '1427517699' && ((github.repository == 'alexj11324/Mikka' && github.repository_owner_id == '183887963') || (github.repository == 'aspectly-labs/Mikka' && github.repository_owner_id == '359279274')))
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: EXPO_TOKEN
          recursive: false
          include-imports: false
      - name: Require the authorized production Expo credential
        if: steps.eligibility.outputs.allowed == 'true' && steps.mobile-source.outputs.selected == 'true'
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo '::error::The authorized production Expo credential was not delivered.'
            exit 1
          fi
      - name: Recheck the owner window immediately before publication
        if: steps.eligibility.outputs.allowed == 'true' && steps.mobile-source.outputs.selected == 'true' && env.EXPO_TOKEN != ''
        id: publication-eligibility
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
          MIKKA_CF_OPERATIONS_SHA: ${{ steps.operations.outputs.source }}
          MIKKA_PUBLIC_SOURCE_SHA: ${{ steps.candidate.outputs.source }}
          MIKKA_PRODUCT_ROOT: ${{ github.workspace }}
          MIKKA_STAGE_RUN_ID: ${{ inputs.staging_run }}
          MIKKA_STAGE_RUN_ATTEMPT: ${{ inputs.staging_attempt }}
          MIKKA_STAGE_ARTIFACT_ID: ${{ inputs.staging_artifact }}
        run: node .mikka-cloud/operations/business-api/pipeline-policy.mjs mobile-eligibility
      - name: Publish to production
        if: >-
          env.EXPO_TOKEN != '' && steps.mobile-source.outputs.selected == 'true' && steps.publication-eligibility.outputs.allowed == 'true' &&
          steps.publication-eligibility.outputs.overlay_sha == steps.eligibility.outputs.overlay_sha
        working-directory: apps/mobile
        env:
          OVERLAY_SHA: ${{ steps.eligibility.outputs.overlay_sha }}
        run: |
          node ../../scripts/release/mobile-ota-source.mjs verify
          npx -y eas-cli@27.2.0 update --channel production --platform ios --message "$(git log -1 --format=%s)" --non-interactive
      - name: Record a closed window before publication
        if: >-
          steps.eligibility.outputs.allowed == 'true' && steps.mobile-source.outputs.selected == 'true' &&
          (steps.publication-eligibility.outputs.allowed != 'true' ||
           steps.publication-eligibility.outputs.overlay_sha != steps.eligibility.outputs.overlay_sha)
        run: echo 'Production OTA was not published because the final owner window or staged UI identity no longer matched.' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish to pr-${{ github.event.number }}
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: apps/mobile
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            npx -y eas-cli@27.2.0 update --branch "pr-${{ github.event.number }}" --platform ios --message "$PR_TITLE" --non-interactive
          else
            echo "::notice::EXPO_TOKEN is not set; no PR preview was published."
          fi
