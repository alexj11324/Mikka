name: Mobile OTA update

# Publishes the iOS app's JavaScript as an EAS Update (decision
# 2026-10-31-2010-ota-updates): main goes to the `production` channel that
# TestFlight builds read; a pull request gets its own `pr-<n>` branch, which
# can be opened in a preview build. Production reads the existing Expo token
# from Infisical using the trusted main workload's OIDC identity. PR previews
# retain their existing repository-secret delivery; forks cannot publish.
# Production requires the official mobile UI checkout before publishing.
on:
  push:
    branches: [main]
    paths: ['apps/mobile/**', 'packages/protocol/**']
  pull_request:
    paths: ['apps/mobile/**', 'packages/protocol/**']
  # A push to the private UI layer's mobile/ folder ships through this (docs/ui-overlay.md).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: EAS Update
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Verify production credential delivery boundaries
        run: node --test scripts/mobile-ota-credentials.test.mjs
      - run: pnpm install --frozen-lockfile --filter @mikka/mobile...
      - run: pnpm --filter @mikka/mobile typecheck
      - name: Read the existing production Expo credential through OIDC
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' &&
          github.repository == 'alexj11324/Mikka' && github.repository_id == '1427517699' &&
          github.repository_owner_id == '183887963'
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: EXPO_TOKEN
          recursive: false
          include-imports: false
      - name: Read the private UI checkout credential through OIDC
        if: env.EXPO_TOKEN != ''
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: HOSTED_UI_READ_KEY
          recursive: false
          include-imports: false
      - name: Check out the private UI
        if: env.EXPO_TOKEN != '' && env.HOSTED_UI_READ_KEY != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: alexj11324/mikka-hosted-ui
          ref: main
          ssh-key: ${{ env.HOSTED_UI_READ_KEY }}
          path: .hosted-ui
          persist-credentials: false
      - name: Use the private UI's mobile layer
        if: env.EXPO_TOKEN != ''
        run: |
          echo "HOSTED_UI_READ_KEY=" >> "$GITHUB_ENV"
          test -d .hosted-ui/mobile || { echo "::error::Official mobile UI checkout required."; exit 1; }
          echo "MIKKA_MOBILE_OVERLAY_DIR=.hosted-ui/mobile" >> "$GITHUB_ENV"
          echo "::notice::Bundling the private UI layer at $(git -C .hosted-ui rev-parse HEAD)."
      - name: Publish to production
        if: env.EXPO_TOKEN != '' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        working-directory: apps/mobile
        run: npx -y eas-cli@27.2.0 update --channel production --platform ios --message "$(git log -1 --format=%s)" --non-interactive
      - name: Publish to pr-${{ github.event.number }}
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: apps/mobile
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            npx -y eas-cli@27.2.0 update --branch "pr-${{ github.event.number }}" --platform ios --message "$PR_TITLE" --non-interactive
          else
            echo "::notice::EXPO_TOKEN is not set; no PR preview was published."
          fi
