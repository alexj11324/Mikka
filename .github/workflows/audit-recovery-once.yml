name: Recover verified audit patch once
on:
  push:
    branches: [chore/audit-recovery-20261107]
    paths: ['.audit-recovery/**', '.github/workflows/audit-recovery-once.yml']
permissions:
  contents: write
concurrency:
  group: audit-recovery-20261107
  cancel-in-progress: false
jobs:
  recover:
    if: github.repository == 'alexj11324/Mikka'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify the recovered patch, then publish only its source changes
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/chore/audit-recovery-20261107
          python3 - <<'PY'
          import base64, gzip, hashlib, os
          from pathlib import Path
          encoded = ''.join(Path(f'.audit-recovery/{n}.b64').read_text() for n in range(9))
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          expected = 'be2d3144f59db4c2cfff85af91318cf4b3c295750d2bbbd3d53d76192088ffbf'
          assert hashlib.sha256(patch).hexdigest() == expected, 'Recovered patch checksum mismatch'
          allowed = {'app/api/factory/tasks/[taskId]/route.ts', 'app/api/factory/tasks/route.ts', 'app/api/factory/tasks/route/route.ts', 'app/api/integrations/mcp/shares/route.ts', 'lib/cloud-subscription-lease-route.db.test.ts', 'lib/device-token-scope.test.ts', 'lib/device-token-scope.ts', 'lib/plugins/actor.ts', 'lib/plugins/sharing-auth.db.test.ts', 'messages/zh-CN.json', 'package.json', 'tests/factory-pat-scope.db.test.ts'}
          changed = {line.removeprefix('+++ b/') for line in patch.decode().splitlines() if line.startswith('+++ b/')}
          assert changed == allowed, 'Unexpected recovered paths'
          Path(os.environ['RUNNER_TEMP'], 'audit.patch').write_bytes(patch)
          print('Verified 12 source/test paths and recovered patch checksum')
          PY
          git checkout -b batch/20261107-audit-auth-lease 22fbf179bc8e2a1c20120156be946eafff765ace
          git apply --check "$RUNNER_TEMP/audit.patch"
          git apply --index "$RUNNER_TEMP/audit.patch"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: retain Factory PAT scope, require human MCP grants, and admit cloud lease renewal'
          git push origin HEAD:refs/heads/batch/20261107-audit-auth-lease
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          printf '\nRecovered #1597, #1598 and #1600. CI and production acceptance remain required.\n' >> "$GITHUB_STEP_SUMMARY"
