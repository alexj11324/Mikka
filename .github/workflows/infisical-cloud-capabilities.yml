name: Existing Infisical cloud capabilities

on:
  push:
    branches: [ops/infisical-cloud-capabilities]

permissions:
  contents: read

concurrency:
  group: infisical-cloud-capabilities
  cancel-in-progress: false

jobs:
  inspect:
    if: >-
      github.repository == 'alexj11324/Mikka' && github.repository_id == '1427517699' &&
      github.repository_owner_id == '183887963' && github.actor == 'alexj11324' &&
      github.event_name == 'push' && github.ref == 'refs/heads/ops/infisical-cloud-capabilities' && github.run_attempt == 1 &&
      !startsWith(github.event.head_commit.message, 'ops: prepare private cloud production') && !startsWith(github.event.head_commit.message, 'ops: inspect private cloud production') && !startsWith(github.event.head_commit.message, 'ops: stage community acceptance')
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Test fixed scope, metadata-only routes and closed output
        run: node --test scripts/ops/infisical-cloud-capabilities.test.mjs
      - name: Verify the reviewed branch and three-file change before authentication
        run: node scripts/ops/infisical-cloud-capabilities.mjs --preflight
      - name: Compare organization and project connection scope with source metadata
        run: node scripts/ops/infisical-cloud-capabilities.mjs --inspect

# Fresh rollout readback, 2026-11-07.

  stage-community-acceptance:
    if: >-
      github.repository == 'alexj11324/Mikka' && github.ref == 'refs/heads/ops/infisical-cloud-capabilities' && startsWith(github.event.head_commit.message, 'ops: stage community acceptance')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: node --test scripts/ops/self-hosting-release.test.mjs scripts/ops/self-hosting-subscription-acceptance.test.mjs
      - run: node scripts/ops/self-hosting-release.mjs --preflight

  prepare-private-production:
    if: >-
      github.repository == 'alexj11324/Mikka' && github.ref == 'refs/heads/ops/infisical-cloud-capabilities' && startsWith(github.event.head_commit.message, 'ops: prepare private cloud production')
    runs-on: ubuntu-latest
    timeout-minutes: 13
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: node --test scripts/ops/self-hosting-release.test.mjs
      - run: node scripts/ops/self-hosting-release.mjs --preflight
      - uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: VERCEL_TEAM_TOKEN
          recursive: false
          include-imports: false
      - run: node scripts/ops/self-hosting-release.mjs --prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}

  private-production-readiness:
    if: >-
      github.repository == 'alexj11324/Mikka' && github.ref == 'refs/heads/ops/infisical-cloud-capabilities' && startsWith(github.event.head_commit.message, 'ops: inspect private cloud production') && !startsWith(github.event.head_commit.message, 'ops: inspect private cloud production subscriptions')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: node --test scripts/ops/self-hosting-release.test.mjs scripts/ops/self-hosting-subscription-acceptance.test.mjs
      - run: node scripts/ops/self-hosting-release.mjs --preflight
      - name: Install the pinned HTTPS receiver tunnel before credential delivery
        run: |
          curl --fail --silent --show-error --location --max-time 60 https://github.com/cloudflare/cloudflared/releases/download/2026.10.7/cloudflared-linux-amd64 -o "$RUNNER_TEMP/mikka-cloudflared"
          node --input-type=module <<'JS'
          import { readFileSync, chmodSync } from 'node:fs'
          import { createHash } from 'node:crypto'
          const file = process.env.RUNNER_TEMP + '/mikka-cloudflared'
          if (createHash('sha256').update(readFileSync(file)).digest('hex') !== '1f99fb518b83dec2ba8d870a7cc991d82a77e6196295a3d2754ba17ab9f91872') throw Error('TUNNEL_DIGEST')
          chmodSync(file, 0o700)
          JS
      - uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          secret-name: SMOKE_OWNER_EMAIL
          recursive: false
          include-imports: false
      - uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          secret-name: SMOKE_OWNER_PASSWORD
          recursive: false
          include-imports: false
      - uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: VERCEL_TEAM_TOKEN
          recursive: false
          include-imports: false
      - name: Read existing ASC_API_KEY_P8 only for TestFlight status
        if: >-
          (startsWith(github.event.head_commit.message, 'ops: inspect private cloud production public') || startsWith(github.event.head_commit.message, 'ops: inspect private cloud production testflight'))
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: ASC_API_KEY_P8
          recursive: false
          include-imports: false
      - name: Read existing ASC_API_KEY_ID only for TestFlight status
        if: >-
          (startsWith(github.event.head_commit.message, 'ops: inspect private cloud production public') || startsWith(github.event.head_commit.message, 'ops: inspect private cloud production testflight'))
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: ASC_API_KEY_ID
          recursive: false
          include-imports: false
      - name: Read existing ASC_API_ISSUER_ID only for TestFlight status
        if: >-
          (startsWith(github.event.head_commit.message, 'ops: inspect private cloud production public') || startsWith(github.event.head_commit.message, 'ops: inspect private cloud production testflight'))
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: ASC_API_ISSUER_ID
          recursive: false
          include-imports: false
      - run: node scripts/ops/self-hosting-release.mjs --business
        if: >-
          startsWith(github.event.head_commit.message, 'ops: inspect private cloud production testflight') == false
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MIKKA_METERING_ONLY: >-
            ${{ startsWith(github.event.head_commit.message, 'ops: inspect private cloud production metering') && '1' || '0' }}
          MIKKA_CLOUD_ACCEPTANCE_PUBLIC: >-
            ${{ startsWith(github.event.head_commit.message, 'ops: inspect private cloud production public') && '1' || '0' }}
      - name: Independently read the existing TestFlight build and dispatch metadata-only native readback
        if: >-
          always() && startsWith(github.event.head_commit.message, 'ops: inspect private cloud production public')
        run: node scripts/ops/self-hosting-release.mjs --clients-readback
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Read only the fixed TestFlight build with an exact request-scoped JWT
        if: >-
          always() && startsWith(github.event.head_commit.message, 'ops: inspect private cloud production testflight')
        run: node scripts/ops/self-hosting-release.mjs --testflight-readback

  community-subscriptions:
    if: >-
      github.repository == 'alexj11324/Mikka' && github.repository_id == '1427517699' &&
      github.repository_owner_id == '183887963' && github.actor == 'alexj11324' &&
      github.ref == 'refs/heads/ops/infisical-cloud-capabilities' && github.run_attempt == 1 &&
      startsWith(github.event.head_commit.message, 'ops: inspect private cloud production') && startsWith(github.event.head_commit.message, 'ops: inspect private cloud production subscriptions') && !startsWith(github.event.head_commit.message, 'ops: inspect private cloud production subscriptions final')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: production-smoke-owner-acceptance
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    env:
      # Exact formally released main containing1692; verify all four gates before credentials.
      MIKKA_COMMUNITY_REVISION: 7e34d869aa80266494cb2e2eefeee5d8e7ff7d4d
      MIKKA_COMMUNITY_CANDIDATE: '0'
      MIKKA_COMMUNITY_PROVIDER: both
      MIKKA_COMMUNITY_SHARED_COMPATIBLE_REVISION: 9ea7b2cd61deb724f20330906f86df6df2cd9828
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Check the source and access-only fixture boundary before authentication
        run: |
          node --test scripts/ops/self-hosting-release.test.mjs scripts/ops/self-hosting-subscription-acceptance.test.mjs
          node scripts/ops/self-hosting-release.mjs --preflight
      - name: Verify the exact served main release and all four completed gates before credentials
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          const sha = process.env.MIKKA_COMMUNITY_REVISION
          if (!/^[a-f0-9]{40}$/.test(sha) || process.env.MIKKA_COMMUNITY_CANDIDATE !== '0' || process.env.MIKKA_COMMUNITY_PROVIDER !== 'both') throw Error('COMMUNITY_RELEASE_PIN_REQUIRED')
          const get = async path => {
            const response = await fetch('https://api.github.com/repos/alexj11324/Mikka/' + path, {
              redirect:'error', signal:AbortSignal.timeout(20000),
              headers:{authorization:'Bearer '+process.env.GITHUB_TOKEN,accept:'application/vnd.github+json'} })
            if (!response.ok) throw Error('COMMUNITY_RELEASE_METADATA_HTTP_'+response.status)
            return response.json()
          }
          const [main,runs,pr,ancestry] = await Promise.all([get('git/ref/heads/main'),get('actions/runs?head_sha='+sha+'&event=push&branch=main&per_page=100'),get('pulls/1692'),get('compare/93165f4ad0cc5b375e1e49ecafa267209729fb0e...'+sha)])
          if (pr.head?.sha !== '93165f4ad0cc5b375e1e49ecafa267209729fb0e' || !['ahead','identical'].includes(ancestry.status) || ancestry.behind_by !== 0 || ancestry.merge_base_commit?.sha !== '93165f4ad0cc5b375e1e49ecafa267209729fb0e') throw Error('COMMUNITY_REPLAY_FIX_NOT_IN_RELEASE')
          const live = await fetch('https://app.aspectlylabs.com/mikka/api/version',{redirect:'error',headers:{'cache-control':'no-store'},signal:AbortSignal.timeout(20000)})
          if (!live.ok || (await live.json()).build !== sha) throw Error('COMMUNITY_PUBLIC_BUILD_CHANGED')
          const workflows = ['CI','Web deploy','E2B additive runtime release','Self-hosted image']
          const receipt = workflows.map(name => {
            const run = runs.workflow_runs?.find(r=>r.head_sha===sha && r.head_branch==='main' && r.event==='push' && r.name===name && r.status==='completed' && r.conclusion==='success')
            if (!run) throw Error('COMMUNITY_RELEASE_NOT_READY_'+name.replaceAll(' ','_').toUpperCase())
            return {workflow:name,run:run.id}
          })
          console.log(JSON.stringify({kind:'community-release-gate',revision:sha,gitMain:main.object?.sha,sharedServedBuild:sha,status:'passed',workflows:receipt,credentialsDelivered:false}))
          JS
      - name: Prepare the exact released source and immutable public image before credentials
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          if (!/^[a-f0-9]{40}$/.test(process.env.MIKKA_COMMUNITY_REVISION)) throw Error('COMMUNITY_SOURCE_PIN_REQUIRED')
          JS
          git fetch --depth=1 origin "$MIKKA_COMMUNITY_REVISION"
          git worktree add --detach "$RUNNER_TEMP/mikka-community-source" "$MIKKA_COMMUNITY_REVISION"
          pnpm --dir "$RUNNER_TEMP/mikka-community-source" install --frozen-lockfile
          docker pull "ghcr.io/alexj11324/mikka:$MIKKA_COMMUNITY_REVISION"
          curl --fail --silent --show-error --location --max-time 60 https://github.com/cloudflare/cloudflared/releases/download/2026.10.7/cloudflared-linux-amd64 -o "$RUNNER_TEMP/mikka-cloudflared"
          node --input-type=module <<'JS'
          import { readFileSync, chmodSync } from 'node:fs'
          import { createHash } from 'node:crypto'
          const file = process.env.RUNNER_TEMP + '/mikka-cloudflared'
          if (createHash('sha256').update(readFileSync(file)).digest('hex') !== '1f99fb518b83dec2ba8d870a7cc991d82a77e6196295a3d2754ba17ab9f91872') throw Error('TUNNEL_DIGEST')
          chmodSync(file, 0o700)
          JS
      - uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: VERCEL_TEAM_TOKEN
          recursive: false
          include-imports: false
      - name: Complete both independent official subscription threads on the released community installation
        timeout-minutes: 18
        run: node scripts/ops/self-hosting-subscription-acceptance.mjs
      - name: Independently reclaim only this run's access folder and machines
        if: always()
        run: node scripts/ops/self-hosting-subscription-acceptance.mjs --cleanup
      - name: Retain only the closed acceptance receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: community-subscriptions-${{ github.run_id }}
          path: .artifacts/self-hosting/community-subscriptions.json
          if-no-files-found: warn
          retention-days: 14

# Community preparation redirects were verified on the exact published core image.

# Staging checkpoint: access-only fixture constraints and owned volume cleanup verified.

# Public bridge protocol covers published ce67; native/full-thread acceptance follows 1668.

# Community run awaits exact a23 Web/E2B/image readiness; includes native authentication fix1668.

# Source projection read uses the live configured access project and existing custody identity.

# Production Secret selector values stay in Infisical; Vercel supplies only named variable metadata.

# Per-provider model selection verifies exactly the original small subscription before dispatch.

# Repository failures retain only fixed classifications; cleanup awaits the terminal live push.

# Verify the normal fixture reader before VMs; source-only error matches retain no runtime messages.

# Lease diagnosis uses the frozen authority function read-only and unchanged heartbeat responses.

# Isolated stop-writer observation retains fixed query kinds/fingerprints only, never SQL or arguments.

# Compare only owner-event provenance booleans; verify enabled Manifest preparation without creating an App.

# Reuse the reviewed shared-team policy for exact formal-source acceptance.

  final-community-subscriptions:
    if: >-
      false && github.repository == 'alexj11324/Mikka' && github.repository_id == '1427517699' &&
      github.repository_owner_id == '183887963' && github.actor == 'alexj11324' &&
      github.ref == 'refs/heads/ops/infisical-cloud-capabilities' && github.run_attempt == 1 &&
      startsWith(github.event.head_commit.message, 'ops: inspect private cloud production subscriptions final')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    concurrency:
      group: production-smoke-owner-acceptance
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: read
      id-token: write
    env:
      # Pin a genuinely published image and the current public control plane separately.
      MIKKA_COMMUNITY_REVISION: 9bcdefc5fe0c047393d581eea867ffa801f53dbe
      MIKKA_PUBLIC_REVISION: 0e4118020311ae8f9083d0d21cfb990be0282f25
      MIKKA_COMMUNITY_MODE: native-delivery
      MIKKA_COMMUNITY_RUNTIME_REVISION: facb389f6cc06c453e9135bb60ada1b0f302e0d9
      MIKKA_COMMUNITY_ADMISSION_DEADLINE: '2026-11-09T04:50:00Z'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Check the source and access-only fixture boundary before authentication
        run: |
          node --test scripts/ops/self-hosting-release.test.mjs scripts/ops/self-hosting-subscription-acceptance.test.mjs
          node scripts/ops/self-hosting-release.mjs --preflight
          node --input-type=module -e "import {assertCommunityAdmission} from './scripts/ops/self-hosting-subscription-acceptance.mjs'; assertCommunityAdmission(process.env)"
      - name: Verify exact main and completed public CI and releases before credentials
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { mkdirSync, writeFileSync } from 'node:fs'
          import { communityReleaseCompatibility, communityPublishedAncestry } from './scripts/ops/self-hosting-subscription-acceptance.mjs'
          const sha = process.env.MIKKA_COMMUNITY_REVISION
          const live = await fetch('https://app.aspectlylabs.com/mikka/api/version', {redirect:'error',headers:{'cache-control':'no-store'},signal:AbortSignal.timeout(20000)})
          if (!live.ok) throw Error('COMMUNITY_PUBLIC_BUILD_HTTP')
          const publicSha = (await live.json()).build
          if (![sha, publicSha].every(value => /^[a-f0-9]{40}$/.test(value))) throw Error('COMMUNITY_SOURCE_PIN_REQUIRED')
          writeFileSync(process.env.GITHUB_ENV, 'MIKKA_PUBLIC_REVISION=' + publicSha + '\n', {flag:'a'})
          const get = async path => {
            const response = await fetch('https://api.github.com/repos/alexj11324/Mikka/' + path, {
              redirect: 'error', signal: AbortSignal.timeout(20000),
              headers: { authorization: 'Bearer ' + process.env.GITHUB_TOKEN, accept: 'application/vnd.github+json' } })
            if (!response.ok) throw Error('COMMUNITY_RELEASE_METADATA_HTTP_' + response.status)
            return response.json()
          }
          const imageRuns = get('actions/runs?head_sha=' + sha + '&per_page=100')
          const publicRuns = publicSha === sha ? imageRuns : get('actions/runs?head_sha=' + publicSha + '&per_page=100')
          const [main, runs, controlRuns, epoch, community, comparison] = await Promise.all([get('git/ref/heads/main'),
            imageRuns, publicRuns, get('pulls/1692'), get('pulls/1688'),
            publicSha === sha ? null : get('compare/' + sha + '...' + publicSha)])
          if (runs.total_count > 100 || controlRuns.total_count > 100) throw Error('COMMUNITY_RELEASE_METADATA_TRUNCATED')
          const mainComparison = main.object?.sha === publicSha ? null : await get('compare/' + publicSha + '...' + main.object?.sha)
          const mainAncestry = communityPublishedAncestry(publicSha, main.object?.sha, mainComparison)
          const compatibility = communityReleaseCompatibility(sha, publicSha, comparison, process.env.MIKKA_COMMUNITY_MODE)
          if (!epoch.merged || epoch.head?.sha !== '93165f4ad0cc5b375e1e49ecafa267209729fb0e'
            || !community.merged || community.draft || !/^[a-f0-9]{40}$/.test(community.head?.sha ?? '')) throw Error('COMMUNITY_REQUIRED_PRS_NOT_MERGED')
          const deliveries = await Promise.all([epoch,community].map(async pr => {
            const ancestry = await get('compare/' + pr.head.sha + '...' + sha)
            if (!['ahead','identical'].includes(ancestry.status) || ancestry.behind_by !== 0
              || ancestry.merge_base_commit?.sha !== pr.head.sha) throw Error('COMMUNITY_REQUIRED_PR_NOT_IN_RELEASE')
            return { pullRequest: pr.number, head: pr.head.sha, mergeCommit: pr.merge_commit_sha }
          }))

          const completed = (collection, revision, name) => {
            const run = collection.workflow_runs.filter(r => r.head_sha === revision && r.name === name && r.head_branch === 'main' && r.event === 'push')
              .sort((a,b) => b.id-a.id || b.run_attempt-a.run_attempt)[0]
            if (!run || run.status !== 'completed' || run.conclusion !== 'success') throw Error('COMMUNITY_RELEASE_NOT_READY_' + name.replaceAll(' ', '_').toUpperCase())
            return { workflow: name, run: run.id, attempt: run.run_attempt }
          }
          const imageReceipt = ['CI', 'Self-hosted image'].map(name => completed(runs, sha, name))
          const publicReceipt = ['Web deploy'].map(name => completed(controlRuns, publicSha, name))
          const publicCI = controlRuns.workflow_runs.filter(r => r.head_sha === publicSha && r.name === 'CI' && r.head_branch === 'main').sort((a,b)=>b.id-a.id)[0]
          const publicContinuousIntegration = {run:publicCI?.id ?? null,status:publicCI?.status ?? null,conclusion:publicCI?.conclusion ?? null,requiredForIndependentImageCase:false}
          const runtimeRun = await get('actions/runs/42516906256')
          if (runtimeRun.head_sha !== process.env.MIKKA_COMMUNITY_RUNTIME_REVISION || runtimeRun.head_branch !== 'main'
            || runtimeRun.event !== 'push' || runtimeRun.status !== 'completed' || runtimeRun.conclusion !== 'success') throw Error('COMMUNITY_APPROVED_RUNTIME_NOT_PUBLISHED')
          const runtimeJobs = await get('actions/runs/42516906256/jobs?per_page=100')
          const requiredRuntimeJobs = ['test','check','validate / build','await-web','subscriptions','publish / deploy','cleanup']
          if (!requiredRuntimeJobs.every(name => runtimeJobs.jobs?.some(job => job.name === name && job.conclusion === 'success'))) throw Error('COMMUNITY_APPROVED_RUNTIME_JOBS')
          const runtimeReceipt = { source: runtimeRun.head_sha, run: runtimeRun.id, verifiedJobs: requiredRuntimeJobs }
          const imageRun = imageReceipt.find(row => row.workflow === 'Self-hosted image')
          const jobs = await get('actions/runs/' + imageRun.run + '/jobs?per_page=100')
          if (!jobs.jobs?.some(job => job.name === 'image' && job.conclusion === 'success'
            && job.steps?.some(step => step.name === 'Publish the tested revision' && step.conclusion === 'success'))) throw Error('COMMUNITY_IMAGE_NOT_PUBLISHED')
          const receipt = { kind: 'community-release-gate', revision: sha, publicRevision: publicSha, gitMain: main.object?.sha,
            sharedServedBuild: publicSha, compatibility, mainAncestry, status: 'passed', imageWorkflows: imageReceipt,
            publicWorkflows: publicReceipt, publicContinuousIntegration, runtimeReceipt, imagePublicationVerified: true, deliveries, credentialsDelivered: false }
          mkdirSync('.artifacts/self-hosting', { recursive: true })
          writeFileSync('.artifacts/self-hosting/release-binding.json', JSON.stringify(receipt) + '\n')
          console.log(JSON.stringify(receipt))
          JS
      - name: Prepare the exact released source and immutable public image before credentials
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          if (!/^[a-f0-9]{40}$/.test(process.env.MIKKA_COMMUNITY_REVISION)) throw Error('COMMUNITY_SOURCE_PIN_REQUIRED')
          JS
          git fetch --depth=1 origin "$MIKKA_COMMUNITY_REVISION"
          git worktree add --detach "$RUNNER_TEMP/mikka-community-source" "$MIKKA_COMMUNITY_REVISION"
          pnpm --dir "$RUNNER_TEMP/mikka-community-source" install --frozen-lockfile
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'
          import { communityDaemonHelper } from './scripts/ops/self-hosting-subscription-acceptance.mjs'
          const source = process.env.RUNNER_TEMP + '/mikka-community-source'
          const path = process.env.RUNNER_TEMP + '/community-daemon-preflight.mts'
          writeFileSync(path, communityDaemonHelper(readFileSync(source + '/scripts/e2b/acceptance-daemon.mts', 'utf8'), 'https://owned-preflight.trycloudflare.com'))
          execFileSync(process.execPath, ['--check', path], { stdio: 'inherit' })
          JS
          mkdir -p .artifacts/self-hosting
          docker pull "ghcr.io/alexj11324/mikka:$MIKKA_COMMUNITY_REVISION"
          curl --fail --silent --show-error --location --retry 2 --retry-max-time 120 --max-time 60 --header 'Accept: application/octet-stream' --header "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/cloudflare/cloudflared/releases/assets/692817008 -o "$RUNNER_TEMP/mikka-cloudflared"
          node --input-type=module <<'JS'
          import { readFileSync, chmodSync } from 'node:fs'
          import { createHash } from 'node:crypto'
          const file = process.env.RUNNER_TEMP + '/mikka-cloudflared'
          if (createHash('sha256').update(readFileSync(file)).digest('hex') !== '1f99fb518b83dec2ba8d870a7cc991d82a77e6196295a3d2754ba17ab9f91872') throw Error('TUNNEL_DIGEST')
          chmodSync(file, 0o700)
          JS
      - uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: VERCEL_TEAM_TOKEN
          recursive: false
          include-imports: false
