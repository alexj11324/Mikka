name: Existing Infisical cloud capabilities

on:
  push:
    branches: [ops/self-hosted-idle-budget-20261108]

permissions:
  contents: read

concurrency:
  group: self-hosted-idle-budget-20261108
  cancel-in-progress: false

jobs:
  community-idle-budget:
    if: >-
      github.repository == 'alexj11324/Mikka' && github.repository_id == '1427517699' &&
      github.repository_owner_id == '183887963' && github.actor == 'alexj11324' &&
      github.ref == 'refs/heads/ops/self-hosted-idle-budget-20261108' &&
      github.run_attempt == 1 &&
      startsWith(github.event.head_commit.message, 'test: run fixed community idle budget')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      MIKKA_EDITION: community
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      IDLE_BUDGET_REPORT: '1'
      APPLICATION_SHA: facb389f6cc06c453e9135bb60ada1b0f302e0d9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: facb389f6cc06c453e9135bb60ada1b0f302e0d9
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify immutable application source
        run: test "$(git rev-parse HEAD)" = "$APPLICATION_SHA"
      - name: Install unchanged frozen dependencies without Electron
        run: pnpm install --frozen-lockfile
      - name: Run the original idle budget suite in community edition
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .artifacts/self-hosted-idle-budget
          pnpm test:idle-budget | tee .artifacts/self-hosted-idle-budget/idle-budget.log
      - name: Record exact scope without claiming a live instance measurement
        if: always()
        run: |
          node --input-type=module <<'JS'
          import { mkdirSync, writeFileSync, readFileSync } from 'node:fs'
          import { createHash } from 'node:crypto'
          const directory = '.artifacts/self-hosted-idle-budget'
          mkdirSync(directory, { recursive: true })
          const log = directory + '/idle-budget.log'
          let logSha256 = null
          try { logSha256 = createHash('sha256').update(readFileSync(log)).digest('hex') } catch {}
          const receipt = {
            schemaVersion: 1, issue: 1561, applicationSha: process.env.APPLICATION_SHA,
            driverSha: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID,
            edition: process.env.MIKKA_EDITION, command: 'pnpm test:idle-budget',
            scope: 'original-fake-clock-component-request-budget',
            liveInstanceMeasurement: false, productionCredentials: false,
            modelCalls: 0, cloudVms: 0, logSha256, recordedAt: new Date().toISOString()
          }
          writeFileSync(directory + '/binding.json', JSON.stringify(receipt, null, 2) + '\n')
          JS
      - name: Retain original test output and source binding
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: self-hosted-idle-budget-${{ github.run_id }}
          path: .artifacts/self-hosted-idle-budget/
          if-no-files-found: error
          retention-days: 14
