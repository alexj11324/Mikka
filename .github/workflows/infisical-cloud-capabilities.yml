name: Existing Infisical cloud capabilities

on:
  push:
    branches: [ops/infisical-cloud-capabilities]

permissions:
  contents: read

concurrency:
  group: infisical-cloud-capabilities
  cancel-in-progress: false

jobs:
  inspect:
    if: >-
      github.repository == 'alexj11324/Mikka' && github.repository_id == '1427517699' &&
      github.repository_owner_id == '183887963' && github.actor == 'alexj11324' &&
      github.event_name == 'push' && github.ref == 'refs/heads/ops/infisical-cloud-capabilities' && github.run_attempt == 1 &&
      !startsWith(github.event.head_commit.message, 'ops: prepare private cloud production') && !startsWith(github.event.head_commit.message, 'ops: inspect private cloud production') && !startsWith(github.event.head_commit.message, 'ops: stage community acceptance')
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Test fixed scope, metadata-only routes and closed output
        run: node --test scripts/ops/infisical-cloud-capabilities.test.mjs
      - name: Verify the reviewed branch and three-file change before authentication
        run: node scripts/ops/infisical-cloud-capabilities.mjs --preflight
      - name: Compare organization and project connection scope with source metadata
        run: node scripts/ops/infisical-cloud-capabilities.mjs --inspect

# Fresh rollout readback, 2026-11-07.

  stage-community-acceptance:
    if: >-
      github.repository == 'alexj11324/Mikka' && github.ref == 'refs/heads/ops/infisical-cloud-capabilities' && startsWith(github.event.head_commit.message, 'ops: stage community acceptance')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: node --test scripts/ops/self-hosting-release.test.mjs scripts/ops/self-hosting-subscription-acceptance.test.mjs
      - run: node scripts/ops/self-hosting-release.mjs --preflight

  prepare-private-production:
    if: >-
      github.repository == 'alexj11324/Mikka' && github.ref == 'refs/heads/ops/infisical-cloud-capabilities' && startsWith(github.event.head_commit.message, 'ops: prepare private cloud production')
    runs-on: ubuntu-latest
    timeout-minutes: 13
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: node --test scripts/ops/self-hosting-release.test.mjs
      - run: node scripts/ops/self-hosting-release.mjs --preflight
      - uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: VERCEL_TEAM_TOKEN
          recursive: false
          include-imports: false
      - run: node scripts/ops/self-hosting-release.mjs --prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}

  private-production-readiness:
    if: >-
      github.repository == 'alexj11324/Mikka' && github.ref == 'refs/heads/ops/infisical-cloud-capabilities' && startsWith(github.event.head_commit.message, 'ops: inspect private cloud production') && !startsWith(github.event.head_commit.message, 'ops: inspect private cloud production subscriptions')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: node --test scripts/ops/self-hosting-release.test.mjs scripts/ops/self-hosting-subscription-acceptance.test.mjs
      - run: node scripts/ops/self-hosting-release.mjs --preflight
      - name: Install the pinned HTTPS receiver tunnel before credential delivery
        run: |
          curl --fail --silent --show-error --location --max-time 60 https://github.com/cloudflare/cloudflared/releases/download/2026.10.7/cloudflared-linux-amd64 -o "$RUNNER_TEMP/mikka-cloudflared"
          node --input-type=module <<'JS'
          import { readFileSync, chmodSync } from 'node:fs'
          import { createHash } from 'node:crypto'
          const file = process.env.RUNNER_TEMP + '/mikka-cloudflared'
          if (createHash('sha256').update(readFileSync(file)).digest('hex') !== '1f99fb518b83dec2ba8d870a7cc991d82a77e6196295a3d2754ba17ab9f91872') throw Error('TUNNEL_DIGEST')
          chmodSync(file, 0o700)
          JS
      - uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          secret-name: SMOKE_OWNER_EMAIL
          recursive: false
          include-imports: false
      - uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          secret-name: SMOKE_OWNER_PASSWORD
          recursive: false
          include-imports: false
      - uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: VERCEL_TEAM_TOKEN
          recursive: false
          include-imports: false
      - name: Read existing ASC_API_KEY_P8 only for TestFlight status
        if: >-
          (startsWith(github.event.head_commit.message, 'ops: inspect private cloud production public') || startsWith(github.event.head_commit.message, 'ops: inspect private cloud production testflight'))
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: ASC_API_KEY_P8
          recursive: false
          include-imports: false
      - name: Read existing ASC_API_KEY_ID only for TestFlight status
        if: >-
          (startsWith(github.event.head_commit.message, 'ops: inspect private cloud production public') || startsWith(github.event.head_commit.message, 'ops: inspect private cloud production testflight'))
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: ASC_API_KEY_ID
          recursive: false
          include-imports: false
      - name: Read existing ASC_API_ISSUER_ID only for TestFlight status
        if: >-
          (startsWith(github.event.head_commit.message, 'ops: inspect private cloud production public') || startsWith(github.event.head_commit.message, 'ops: inspect private cloud production testflight'))
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: ASC_API_ISSUER_ID
          recursive: false
          include-imports: false
      - run: node scripts/ops/self-hosting-release.mjs --business
        if: >-
          startsWith(github.event.head_commit.message, 'ops: inspect private cloud production testflight') == false
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MIKKA_METERING_ONLY: >-
            ${{ startsWith(github.event.head_commit.message, 'ops: inspect private cloud production metering') && '1' || '0' }}
          MIKKA_CLOUD_ACCEPTANCE_PUBLIC: >-
            ${{ startsWith(github.event.head_commit.message, 'ops: inspect private cloud production public') && '1' || '0' }}
      - name: Independently read the existing TestFlight build and dispatch metadata-only native readback
        if: >-
          always() && startsWith(github.event.head_commit.message, 'ops: inspect private cloud production public')
        run: node scripts/ops/self-hosting-release.mjs --clients-readback
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Read only the fixed TestFlight build with an exact request-scoped JWT
        if: >-
          always() && startsWith(github.event.head_commit.message, 'ops: inspect private cloud production testflight')
        run: node scripts/ops/self-hosting-release.mjs --testflight-readback

  community-subscriptions:
    if: >-
      github.repository == 'alexj11324/Mikka' && github.repository_id == '1427517699' &&
      github.repository_owner_id == '183887963' && github.actor == 'alexj11324' &&
      github.ref == 'refs/heads/ops/infisical-cloud-capabilities' && github.run_attempt == 1 &&
      startsWith(github.event.head_commit.message, 'ops: inspect private cloud production subscriptions')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify source and access-only boundaries before reading metadata
        run: |
          node --test scripts/ops/self-hosting-release.test.mjs scripts/ops/self-hosting-subscription-acceptance.test.mjs
          node scripts/ops/self-hosting-release.mjs --preflight
      - name: Read only the exact closed failed runtime diagnostics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import {createHash} from 'node:crypto'
          import {execFileSync} from 'node:child_process'
          const need=(ok,code)=>{if(!ok)throw Error('GATE_READBACK_'+code)}
          try {
           const root='https://api.github.com/repos/alexj11324/Mikka'
           const get=async path=>{const r=await fetch(root+path,{redirect:'error',signal:AbortSignal.timeout(20000),headers:{authorization:'Bearer '+process.env.GITHUB_TOKEN,accept:'application/vnd.github+json'}});need(r.ok,'API_HTTP_'+r.status);return r.json()}
           const [run,artifact]=await Promise.all([get('/actions/runs/42439132774'),get('/actions/artifacts/13602906938')])
           need(run.id===42439132774&&run.run_attempt===2&&run.head_sha==='3c32675c99d32f9c84a9b5e4bc48e59231baa4d8'&&run.head_branch==='main'&&run.event==='push'&&run.path==='.github/workflows/e2b-official-runtime.yml','SOURCE')
           need(artifact.id===13602906938&&artifact.name==='e2b-template-subscription-diagnostics-42439132774-2'&&!artifact.expired&&artifact.size_in_bytes===1885&&artifact.digest==='sha256:adc58216e5da83ab64b5dd6c6d32a639164ad4d87f9a6ca689e091a246c046e5'&&artifact.workflow_run?.id===run.id&&artifact.workflow_run?.head_sha===run.head_sha,'ARTIFACT')
           const redirect=await fetch(root+'/actions/artifacts/13602906938/zip',{redirect:'manual',signal:AbortSignal.timeout(20000),headers:{authorization:'Bearer '+process.env.GITHUB_TOKEN,accept:'application/vnd.github+json'}})
           need(redirect.status===302,'REDIRECT')
           const location=new URL(redirect.headers.get('location'))
           need(location.protocol==='https:'&&!location.username&&!location.password&&(/\.blob\.core\.windows\.net$/.test(location.hostname)||/\.githubusercontent\.com$/.test(location.hostname)||location.hostname==='productionresultssa0.blob.core.windows.net'),'DOWNLOAD_HOST')
           const download=await fetch(location,{redirect:'error',signal:AbortSignal.timeout(20000)})
           need(download.ok,'DOWNLOAD_HTTP')
           const bytes=Buffer.from(await download.arrayBuffer());need(bytes.length===1885&&createHash('sha256').update(bytes).digest('hex')==='adc58216e5da83ab64b5dd6c6d32a639164ad4d87f9a6ca689e091a246c046e5','DIGEST')
           const py="import sys,zipfile,io\nz=zipfile.ZipFile(io.BytesIO(sys.stdin.buffer.read()))\nn=z.namelist()\nassert len(n)==1 and n[0]=='subscription-diagnostics.json'\nx=z.getinfo(n[0]); assert x.file_size<262144\nsys.stdout.write(z.read(n[0]).decode('utf-8'))"
           const raw=JSON.parse(execFileSync('python3',['-c',py],{input:bytes,encoding:'utf8',maxBuffer:262144,env:{PATH:process.env.PATH}}))
           need(raw.version===1&&raw.status==='failed'&&Array.isArray(raw.candidates)&&raw.candidates.length<=2,'PROJECTION')
           const word=v=>typeof v==='string'&&/^[a-z][a-z0-9_]{0,95}$/.test(v)?v:null
           const uuid=v=>typeof v==='string'&&/^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$/.test(v)?v:null
           const ver=v=>typeof v==='string'&&/^[0-9]+\.[0-9]+\.[0-9]+$/.test(v)?v:null
           const candidates=raw.candidates.map(c=>({kind:['claude','codex'].includes(c.kind)?c.kind:null,stage:word(c.stage),code:word(c.code),sampleStatus:word(c.sampleStatus),sampleError:word(c.sampleError),cleanupErrors:Array.isArray(c.cleanupErrors)?c.cleanupErrors.map(word):[],failure:c.failure?{phase:word(c.failure.phase),code:word(c.failure.code),httpStatus:Number.isInteger(c.failure.httpStatus)?c.failure.httpStatus:null}:null,observation:c.observation?{lastStatus:word(c.observation.lastStatus),agentStart:c.observation.agentStart===true,providerChunk:c.observation.providerChunk===true,replyVerified:c.observation.replyVerified===true,replyVerifiedAfterTool:c.observation.replyVerifiedAfterTool===true,successfulTool:c.observation.successfulTool===true,runtimeTimingStatus:word(c.observation.runtimeTimingStatus),expectedAgentAck:c.observation.expectedAgentAck===true,cliInit:c.observation.cliInit?{outcome:word(c.observation.cliInit.outcome),ms:typeof c.observation.cliInit.ms==='number'?c.observation.cliInit.ms:null}:null,runtimeEvidence:c.observation.runtimeEvidence?{status:word(c.observation.runtimeEvidence.status),reason:word(c.observation.runtimeEvidence.reason)}:null}:null,fixture:c.fixture?{issueId:uuid(c.fixture.issueId),runId:uuid(c.fixture.runId)}:null,candidateProof:c.candidateProof?{harness:word(c.candidateProof.harness),version:ver(c.candidateProof.version),sourceCommit:c.candidateProof.sourceCommit==='3c32675c99d32f9c84a9b5e4bc48e59231baa4d8'?c.candidateProof.sourceCommit:null,workerSha:c.candidateProof.workerSha==='d382cd600e4e72e04282ccaa7de7bcac22e19377'?c.candidateProof.workerSha:null}:null,passedReceipt:c.passedReceipt?{status:word(c.passedReceipt.status),harness:word(c.passedReceipt.harness),officialCliVersion:ver(c.passedReceipt.officialCliVersion),replyVerified:c.passedReceipt.replyVerified===true,replyVerifiedAfterTool:c.passedReceipt.replyVerifiedAfterTool===true}:null,cleanupFailures:Array.isArray(c.cleanupFailures)?c.cleanupFailures.map(f=>({step:word(f.step),code:word(f.code),httpStatus:Number.isInteger(f.httpStatus)?f.httpStatus:null})):[]}))
           console.log(JSON.stringify({kind:'runtime-subscription-diagnostics-readback',sourceCommit:run.head_sha,runId:run.id,runAttempt:run.run_attempt,artifactId:artifact.id,artifactDigest:artifact.digest,status:raw.status,code:word(raw.code),candidates,productionSecretValuesRequested:false}))
          } catch(e) { console.error(/^GATE_READBACK_[A-Z0-9_]+$/.test(e?.message??'')?e.message:'GATE_READBACK_FAILED');process.exitCode=1 }
          
          JS
