name: Web deploy
# Builds the production web app on GitHub's free runners (this repository is
# public) and uploads the prebuilt output to Vercel, instead of paying for
# Vercel build minutes. Vercel's own Git deployment of main is off in
# vercel.json. See docs/operations/web-deploy.md.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      overlay-refresh:
        description: Rebuild current main after a private UI push
        type: boolean
        default: false
  workflow_call:
    inputs:
      runtime-refresh:
        type: boolean
        default: false
      runtime-worker-sha:
        type: string
        default: ''
      runtime-template-models-sha256:
        type: string
        default: ''
      runtime-template-ids:
        type: string
        default: '{}'
      runtime-release-artifact-id:
        type: string
        default: ''
      runtime-release-sha256:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  deploy:
    if: github.repository == 'alexj11324/Mikka' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      # Keep newer main jobs queued even if an older runtime validation finishes
      # later. Queue order is not commit order; the main guards reject stale jobs.
      group: web-deploy-production
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write
    env:
      # This public deployment selector is not a credential. Community images still default to community.
      MIKKA_EDITION: cloud
      MIKKA_CLOUD_BACKEND_URL: https://mikka-cloud.vercel.app
      VERCEL_ORG_ID: team_C7lwxVVvnUicFli6112mvxpv
      VERCEL_PROJECT_ID: prj_VdNz3P0FmuRbZKeI40hbCqwR0NVH
      VERCEL_CLI: vercel@65.4.0
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Refuse an obsolete source before release work
        run: node scripts/release/web-deploy.mjs main
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Require one immutable runtime release artifact reference
        if: inputs.runtime-refresh == true
        run: node scripts/e2b/runtime-report.mjs reference
        env:
          RUNTIME_REPORT_ARTIFACT_ID: ${{ inputs.runtime-release-artifact-id }}
          RUNTIME_REPORT_SHA256: ${{ inputs.runtime-release-sha256 }}
      - name: Download the complete verified runtime release report
        if: inputs.runtime-refresh == true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ inputs.runtime-release-artifact-id }}
          path: ${{ runner.temp }}/e2b-release
          merge-multiple: true
      - name: Bind the release bytes to this source, worker and run attempt
        if: inputs.runtime-refresh == true
        run: node scripts/e2b/runtime-report.mjs verify "$RUNNER_TEMP/e2b-release/release.json"
        env:
          RUNTIME_REPORT_ARTIFACT_ID: ${{ inputs.runtime-release-artifact-id }}
          RUNTIME_REPORT_SHA256: ${{ inputs.runtime-release-sha256 }}
          SOURCE_SHA: ${{ inputs.runtime-worker-sha }}
      - name: Read the Vercel deploy token
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: VERCEL_DEPLOY_TOKEN
          include-imports: false
      # Every public main update must validate public main + private main.
      # Manual overlay dispatches also rebuild when the public SHA is unchanged.
      - name: Skip documentation-only changes
        id: skip
        run: node scripts/release/web-deploy.mjs skip
        env:
          VERCEL_TOKEN: ${{ env.VERCEL_DEPLOY_TOKEN }}
          RUNTIME_REFRESH: ${{ inputs.runtime-refresh || inputs.overlay-refresh || github.event_name == 'push' }}
      - name: Read the private UI checkout credential
        if: steps.skip.outputs.skip != 'true'
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: HOSTED_UI_READ_KEY
          include-imports: false
      - name: Check out the private UI
        if: steps.skip.outputs.skip != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: alexj11324/mikka-hosted-ui
          ref: main
          ssh-key: ${{ env.HOSTED_UI_READ_KEY }}
          path: .hosted-ui
          persist-credentials: false
      - name: Pin the private UI revision
        if: steps.skip.outputs.skip != 'true'
        run: node scripts/release/hosted-ui.mjs record .hosted-ui
      - name: Read the existing Vercel runtime release token
        if: inputs.runtime-refresh == true
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: VERCEL_TEAM_TOKEN
          include-imports: false
      - name: Publish the verified additive runtime pair inside the deployment queue
        if: inputs.runtime-refresh == true
        run: node scripts/e2b/publish-template-env.mjs "$RUNNER_TEMP/e2b-release/release.json"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DESKTOP_TEMPLATE_ID: ${{ fromJSON(inputs.runtime-template-ids || '{}').desktop }}
          CLAUDE_TEMPLATE_ID: ${{ fromJSON(inputs.runtime-template-ids || '{}').claude }}
          CODEX_TEMPLATE_ID: ${{ fromJSON(inputs.runtime-template-ids || '{}').codex }}
          SOURCE_SHA: ${{ inputs.runtime-worker-sha }}
          MIKKA_CLOUD_WORKER_SOURCE_COMMIT: ${{ github.sha }}
          TEMPLATE_MODELS_SHA256: ${{ inputs.runtime-template-models-sha256 }}
          RUNTIME_REPORT_SHA256: ${{ inputs.runtime-release-sha256 }}
      # `vercel pull` returns Vercel's sensitive values empty. prod:/vercel is the
      # Infisical source Vercel production is synced from; the next step fills only
      # keys production defines and Vercel withheld. Runtime still reads Vercel's copy.
      - name: Read the production values Vercel withholds from `vercel pull`
        if: steps.skip.outputs.skip != 'true'
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /vercel
          recursive: false
          include-imports: false
      - name: Pull the production project settings and environment
        if: steps.skip.outputs.skip != 'true'
        run: npx --yes "$VERCEL_CLI" pull --yes --environment=production --token "$VERCEL_TOKEN" > /dev/null
        env:
          VERCEL_TOKEN: ${{ env.VERCEL_DEPLOY_TOKEN }}
      - name: Fill build-time values
        if: steps.skip.outputs.skip != 'true'
        run: node scripts/release/web-deploy.mjs env .vercel/.env.production.local
      # Skew Protection: a unique prebuilt deploymentId per run attempt
      # (lib/deployment-id.mjs), so a re-run of a commit is a new deployment.
      - name: Choose the deployment id
        if: steps.skip.outputs.skip != 'true'
        run: |
          id="$(node lib/deployment-id.mjs)"
          echo "Deployment id $id"
          echo "MIKKA_DEPLOYMENT_ID=$id" >> "$GITHUB_ENV"
      - name: Install the pinned workspace dependencies
        if: steps.skip.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          FFMPEG_GITHUB_TOKEN: ${{ github.token }}
      - name: Install private UI runtime dependencies without license scripts
        if: steps.skip.outputs.skip != 'true'
        run: |
          if ! pnpm --dir .hosted-ui install --ignore-workspace --prod --ignore-scripts --frozen-lockfile > "$RUNNER_TEMP/private-ui-install.log" 2>&1; then
            echo "::error::Private UI dependency installation failed; private diagnostics withheld."
            exit 1
          fi
      - name: Verify the official runtime stays on the cloud edition
        if: steps.skip.outputs.skip != 'true'
        run: node --import tsx scripts/release/verify-cloud-edition.ts
        env:
          VERCEL_TOKEN: ${{ env.VERCEL_DEPLOY_TOKEN }}
      - name: Reclaim unused preinstalled SDKs before the official build
        if: steps.skip.outputs.skip != 'true'
        run: |
          df -h /
          df -i /
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
          df -i /
      - name: Build (runs migrations last, as the Vercel build did)
        if: steps.skip.outputs.skip != 'true'
        run: node scripts/release/build-vercel.mjs
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VERCEL_TOKEN: ${{ env.VERCEL_DEPLOY_TOKEN }}
          VERCEL_GIT_COMMIT_REF: main
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
      - name: Record official build capacity without private diagnostics
        if: always() && steps.skip.outputs.skip != 'true'
        run: |
          df -h /
          df -i /
          if test -d .vercel/output/functions; then du -sk .vercel/output/functions; fi
      - name: Audit the public output for source and source maps
        if: steps.skip.outputs.skip != 'true'
        run: node scripts/release/hosted-ui.mjs audit .vercel/output/static
      - name: Upload the prebuilt output to production
        if: steps.skip.outputs.skip != 'true'
        run: |
          node scripts/release/web-deploy.mjs main
          message="$(git log -1 --format=%s "$GITHUB_SHA")"
          url="$(npx --yes "$VERCEL_CLI" deploy --prebuilt --prod --archive=tgz --regions cle1 --token "$VERCEL_TOKEN" \
            --meta githubDeployment=1 --meta githubOrg=alexj11324 --meta githubRepo=Mikka \
            --meta githubCommitRef=main --meta githubCommitSha="$GITHUB_SHA" \
            --meta mikkaUiOverlaySha="$MIKKA_UI_OVERLAY_SHA" \
            --meta githubCommitMessage="$message")"
          echo "Deployed $url"
          echo "### Production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "$url (commit $GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ env.VERCEL_DEPLOY_TOKEN }}
      - name: Verify the public production version before releasing the deployment queue
        if: steps.skip.outputs.skip != 'true'
        run: |
          node scripts/release/web-deploy.mjs verify
          node scripts/release/hosted-ui.mjs production
