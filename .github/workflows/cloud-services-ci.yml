name: Cloud Services qualification
on:
  workflow_dispatch:
    inputs:
      cloud_source_sha:
        description: Pinned Cloud Services source commit SHA
        type: string
        required: true
permissions:
  contents: read
env:
  MIKKA_PRIVATE_GITHUB_OWNER: ${{ vars.MIKKA_PRIVATE_GITHUB_OWNER == 'aspectly-labs' && 'aspectly-labs' || 'alexj11324' }}
  MIKKA_HOSTED_UI_GITHUB_OWNER: ${{ vars.MIKKA_HOSTED_UI_GITHUB_OWNER }}
jobs:
  qualify:
    if: (github.repository_id == '1427517699' && (github.repository_owner_id == '183887963' || github.repository_owner_id == '359279274')) && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor_id == '183887963'
    # The qualification extracts PostgreSQL 17 from the PGDG noble (24.04)
    # packages, and its initdb only runs on that release. `ubuntu-latest`
    # moved to 26.04 on 2026-11-19 and broke the stage; pin the image the
    # pinned packages were built for until they are re-pinned.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: cloudflare-runtime-release
    permissions:
      contents: read
      id-token: write
    env:
      MIKKA_CLOUD_SOURCE_SHA: ${{ inputs.cloud_source_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - name: Prepare the qualification toolchain
        run: |
          corepack enable
          corepack prepare pnpm@10.34.3 --activate
          docker version
      - name: Select the source App before credential access
        id: source-app
        env:
          SOURCE_OWNER: ${{ vars.MIKKA_PRIVATE_GITHUB_OWNER || 'alexj11324' }}
          ORG_SECRET_PATH: ${{ vars.MIKKA_ORG_GITHUB_SECRET_PATH }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs'
          const owner = process.env.SOURCE_OWNER
          if (!['alexj11324', 'aspectly-labs'].includes(owner)) throw Error('CI_SOURCE_APP_OWNER_REQUIRED')
          const path = owner === 'aspectly-labs' ? process.env.ORG_SECRET_PATH?.trim() : '/github'
          if (!path || /[\r\n]/.test(path)) throw Error('CI_SOURCE_APP_SECRET_PATH_REQUIRED')
          appendFileSync(process.env.GITHUB_OUTPUT, `owner=${owner}\nsecret-path=${path}\napp-id=${owner === 'aspectly-labs' ? '5853576' : '4840908'}\n`)
          JS
      - name: Read the existing source App id
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: ${{ steps.source-app.outputs.secret-path }}
          secret-name: GITHUB_APP_ID
          recursive: false
          include-imports: false
      - name: Read the existing source App private key
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: ${{ steps.source-app.outputs.secret-path }}
          secret-name: GITHUB_APP_PRIVATE_KEY
          recursive: false
          include-imports: false
      - name: Verify the selected source App
        env:
          EXPECTED_SOURCE_APP_ID: ${{ steps.source-app.outputs.app-id }}
        run: node -e 'if (!process.env.EXPECTED_SOURCE_APP_ID || process.env.GITHUB_APP_ID !== process.env.EXPECTED_SOURCE_APP_ID) throw Error("CI_SOURCE_APP_ID_MISMATCH")'
      - name: Mint a short-lived read-only operations checkout token
        id: source-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ env.GITHUB_APP_ID }}
          private-key: ${{ env.GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ vars.MIKKA_PRIVATE_GITHUB_OWNER == 'aspectly-labs' && 'aspectly-labs' || 'alexj11324' }}
          repositories: mikka-cloud
          permission-contents: read
      - name: Remove App credentials before loading private operations code
        run: |
          echo 'GITHUB_APP_ID=' >> "$GITHUB_ENV"
          echo 'GITHUB_APP_PRIVATE_KEY=' >> "$GITHUB_ENV"
      - name: Check out the pinned private operations source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ format('{0}/mikka-cloud', vars.MIKKA_PRIVATE_GITHUB_OWNER == 'aspectly-labs' && 'aspectly-labs' || 'alexj11324') }}
          ref: ${{ inputs.cloud_source_sha }}
          token: ${{ steps.source-token.outputs.token }}
          path: .mikka-cloud
          persist-credentials: false
      - name: Qualify the pinned Cloud Services source
        run: node scripts/cloudflare-cloud-ci.mjs build
      - name: Verify the Cloud Services qualification
        run: node scripts/cloudflare-cloud-ci.mjs verify
      - name: Issue a short-lived Registry publication credential
        id: registry
        uses: ./.github/actions/cloudflare-registry-credentials
        with:
          mode: publish
      - name: Publish the qualified Cloud Services artifact
        env:
          CF_RUNTIME_REGISTRY_USERNAME: ${{ steps.registry.outputs.username }}
          CF_RUNTIME_REGISTRY_PASSWORD: ${{ steps.registry.outputs.password }}
        run: node scripts/cloudflare-cloud-ci.mjs publish
      - name: Upload the qualification receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloud-services-ci-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cloud-services-ci-receipt/receipt.json
          if-no-files-found: error
          retention-days: 90
