name: Cloud Services qualification
on:
  workflow_dispatch:
    inputs:
      cloud_source_sha:
        description: Pinned Cloud Services source commit SHA
        type: string
        required: true
permissions:
  contents: read
jobs:
  qualify:
    if: github.repository == 'alexj11324/Mikka' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor_id == '183887963'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: cloudflare-runtime-release
    permissions:
      contents: read
      id-token: write
    env:
      MIKKA_CLOUD_SOURCE_SHA: ${{ inputs.cloud_source_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - name: Prepare the qualification toolchain
        run: |
          corepack enable
          corepack prepare pnpm@10.34.3 --activate
          docker version
      - name: Read the existing source App id
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /github
          secret-name: GITHUB_APP_ID
          recursive: false
          include-imports: false
      - name: Read the existing source App private key
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /github
          secret-name: GITHUB_APP_PRIVATE_KEY
          recursive: false
          include-imports: false
      - name: Mint a short-lived read-only operations checkout token
        id: source-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ env.GITHUB_APP_ID }}
          private-key: ${{ env.GITHUB_APP_PRIVATE_KEY }}
          owner: alexj11324
          repositories: mikka-cloud
          permission-contents: read
      - name: Remove App credentials before loading private operations code
        run: |
          echo 'GITHUB_APP_ID=' >> "$GITHUB_ENV"
          echo 'GITHUB_APP_PRIVATE_KEY=' >> "$GITHUB_ENV"
      - name: Qualify the pinned Cloud Services source
        env:
          MIKKA_CLOUD_READ_TOKEN: ${{ steps.source-token.outputs.token }}
        run: node scripts/cloudflare-cloud-ci.mjs build
      - name: Verify the Cloud Services qualification
        run: node scripts/cloudflare-cloud-ci.mjs verify
      - name: Issue a short-lived Registry publication credential
        id: registry
        uses: ./.github/actions/cloudflare-registry-credentials
        with:
          mode: publish
      - name: Publish the qualified Cloud Services artifact
        env:
          CF_RUNTIME_REGISTRY_USERNAME: ${{ steps.registry.outputs.username }}
          CF_RUNTIME_REGISTRY_PASSWORD: ${{ steps.registry.outputs.password }}
        run: node scripts/cloudflare-cloud-ci.mjs publish
      - name: Upload the qualification receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloud-services-ci-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cloud-services-ci-receipt/receipt.json
          if-no-files-found: error
          retention-days: 1
