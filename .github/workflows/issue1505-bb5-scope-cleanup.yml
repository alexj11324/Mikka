# DISABLED REVIEW ONLY. Root must review the sole enable diff before creating the exact branch.
# Normal single-parent child of fixed H; sole added path is this workflow.
# Exact project env cleanup only. No login, scope creation, Web dispatch, model, Task or VM operation.
name: Issue 1505 remove only the exact bb5 diagnostic scope
on:
  push:
    branches: [ops/1505-scope-web-bb5d1f9e-20261108-cleanup]
permissions:
  contents: read
  id-token: write
concurrency:
  group: production-smoke-owner-acceptance
  cancel-in-progress: false
  queue: max
jobs:
  cleanup:
    if: github.repository == 'alexj11324/Mikka' && github.event_name == 'push' && github.ref == 'refs/heads/ops/1505-scope-web-bb5d1f9e-20261108-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLEANUP_REVIEW_GO: 'root-reviewed-1505-scope-bb5-exact-cleanup-20261108'
      EXPECTED_DIAGNOSTIC_ENV_ID: YOGBLcWfTgOE99LO
      EXPECTED_DIAGNOSTIC_VALUE_SHA256: e247595f9a1eb67591c9bf1809492798ed010b4248520869e0e68e2d78ef1342
      EXPECTED_DIAGNOSTIC_EXPIRES_AT: 2026-11-09T00:09:08.687Z
    steps:
      - name: Check out the exact one-shot cleanup carrier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: .cleanup-carrier
          fetch-depth: 2
          persist-credentials: false
      - name: Check out the immutable reviewed helper
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f997dbe4f97829cd54f96705ec4e56d624f61c52
          path: .acceptance-window-helper
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify source, sole-path parent, exact target and root review before credentials
        id: source_ready
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const env=process.env;
          const git=(cwd,...args)=>execFileSync('git',['-C',cwd,...args],{encoding:'utf8'}).trim();
          assert.equal(env.CLEANUP_REVIEW_GO,'root-reviewed-1505-scope-bb5-exact-cleanup-20261108');
          assert.equal(env.GITHUB_REPOSITORY,'alexj11324/Mikka');
          assert.equal(env.GITHUB_EVENT_NAME,'push');
          assert.equal(env.GITHUB_REF,'refs/heads/ops/1505-scope-web-bb5d1f9e-20261108-cleanup');
          assert.equal(env.GITHUB_RUN_ATTEMPT,'1');
          assert.match(env.GITHUB_SHA,/^[0-9a-f]{40}$/);
          const H='f997dbe4f97829cd54f96705ec4e56d624f61c52',HT='cabe0754abf789856b889d7a8fefe9c29f340754';
          assert.equal(git('.cleanup-carrier','rev-list','--parents','-n','1','HEAD'),env.GITHUB_SHA+' '+H);
          assert.equal(git('.cleanup-carrier','rev-parse',H+'^{tree}'),HT);
          assert.equal(git('.cleanup-carrier','diff','--name-status',H,'HEAD'),'A\t.github/workflows/issue1505-bb5-scope-cleanup.yml');
          assert.match(git('.cleanup-carrier','ls-tree','HEAD','--','.github/workflows/issue1505-bb5-scope-cleanup.yml'),/^100644 blob [0-9a-f]{40}\t\.github\/workflows\/issue1505-bb5-scope-cleanup\.yml$/);
          assert.equal(git('.acceptance-window-helper','rev-parse','HEAD'),H);
          assert.equal(git('.acceptance-window-helper','rev-parse','HEAD^{tree}'),HT);
          assert.equal(createHash('sha256').update(readFileSync('.acceptance-window-helper/scripts/ops/issue1505-diagnostic-window.mjs')).digest('hex'),'8b19d8f763a49a3813d104d3adb57b34f718db515da008df1f915c364b546f4c');
          const pins={
            EXPECTED_DIAGNOSTIC_ENV_ID:'YOGBLcWfTgOE99LO',
            EXPECTED_DIAGNOSTIC_VALUE_SHA256:'e247595f9a1eb67591c9bf1809492798ed010b4248520869e0e68e2d78ef1342',
            EXPECTED_DIAGNOSTIC_EXPIRES_AT:'2026-11-09T00:09:08.687Z'
          };
          for(const [key,value] of Object.entries(pins))assert.equal(env[key],value);
          console.log(JSON.stringify({status:'source_and_target_verified',helperCommit:H,helperTree:HT,
            targetEnvId:pins.EXPECTED_DIAGNOSTIC_ENV_ID,targetValueSha256:pins.EXPECTED_DIAGNOSTIC_VALUE_SHA256,
            applicationCalls:0,models:0,virtualMachines:0}));
          JS
      - name: Read only the existing platform token
        id: platform_token
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: VERCEL_TEAM_TOKEN
          include-imports: false
      - name: Remove only the exact prepared project diagnostic window
        if: always() && steps.source_ready.outcome == 'success' && steps.platform_token.outcome == 'success'
        run: |
          node --input-type=module <<'JS'
          import { mkdir, readFile, writeFile, appendFile } from 'node:fs/promises';
          import { removeOwnedWindow, SOURCE, TREE, PROJECT, TEAM, KEY } from './.acceptance-window-helper/scripts/ops/issue1505-diagnostic-window.mjs';
          const env=process.env;
          // These are reviewed target pins from the prepare receipt, not a newly fabricated creation receipt.
          const expected={version:1,issue:1505,sourceCommit:SOURCE,sourceTree:TREE,projectId:PROJECT,teamId:TEAM,
            window:{key:KEY,id:env.EXPECTED_DIAGNOSTIC_ENV_ID,valueSha256:env.EXPECTED_DIAGNOSTIC_VALUE_SHA256,expiresAt:env.EXPECTED_DIAGNOSTIC_EXPIRES_AT}};
          const codes=new Set(['cleanup_record_invalid','cleanup_window_changed','cleanup_absence_unconfirmed','platform_token_missing',
            'platform_transport_failed','platform_request_refused','platform_response_invalid']);
          let cleanup;
          try{cleanup={status:'passed',...await removeOwnedWindow(expected,{token:env.VERCEL_TEAM_TOKEN})};}
          catch(error){cleanup={status:'failed',code:codes.has(error?.windowCode)?error.windowCode:'diagnostic_window_cleanup_failed',
            key:KEY,id:expected.window.id,activeDeploymentRevoked:false,originalExpiresAt:expected.window.expiresAt};process.exitCode=1;}
          await mkdir('acceptance-results',{recursive:true});
          await writeFile('acceptance-results/diagnostic-window-cleanup.json',JSON.stringify(cleanup,null,2)+'\n',{mode:0o600});
          let report;
          try{report=JSON.parse(await readFile('acceptance-results/cloud-startup-acceptance.json','utf8'));}
          catch(error){if(error?.code!=='ENOENT')throw error;}
          if(report){
            report.diagnosticWindowCleanup=cleanup;
            if(cleanup.status!=='passed'){
              report.status='failed';report.cleanup.errors.push({step:'diagnostic_window_remove',code:cleanup.code});
              if(report.formalAcceptance){report.formalAcceptance.status='failed';report.formalAcceptance.reasons.push('diagnostic_window_cleanup_failed');}
              try{
                const priorMarkdown=await readFile('acceptance-results/cloud-startup-acceptance.md','utf8');
                await writeFile('acceptance-results/cloud-startup-acceptance.md',priorMarkdown.replace('独立证据判定：**passed**','独立证据判定：**failed**'),{mode:0o600});
              }catch(error){if(error?.code!=='ENOENT')throw error;}
            }
            await writeFile('acceptance-results/cloud-startup-acceptance.json',JSON.stringify(report,null,2)+'\n',{mode:0o600});
            await appendFile('acceptance-results/cloud-startup-acceptance.md',`\n## 诊断窗口配置收尾\n\n${cleanup.status==='passed'?'精确项目配置已删除，ID 404 与同 key 缺席均已回读。':'配置清理未确认，保留目标身份供后续恢复；整批不能通过。'} 删除项目配置不撤销活动 DPL 的既有环境；expiresAt=${cleanup.originalExpiresAt} 仍是该 DPL 停止开启新诊断任务的期限。\n`);
          }
          console.log(JSON.stringify(cleanup));
          JS
      - name: Upload the sanitized exact cleanup receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1505-bb5-diagnostic-window-cleanup
          path: acceptance-results/diagnostic-window-cleanup.json
          if-no-files-found: warn
          retention-days: 7
