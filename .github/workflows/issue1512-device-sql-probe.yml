name: Issue 1512 device SQL probe
on:
  push:
    branches: [ops/1512-device-sql-probe-20261109]
permissions:
  contents: read
concurrency:
  group: issue1512-device-sql-probe-20261109
  cancel-in-progress: false
jobs:
  paired-device-db:
    if: github.repository == 'alexj11324/Mikka' && github.event_name == 'push' && github.ref == 'refs/heads/ops/1512-device-sql-probe-20261109' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: mikka_1512_device_e2e
        ports:
          - 55491:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://postgres@127.0.0.1:55491/mikka_1512_device_e2e
      MIKKA_DATABASE_URL: postgres://postgres@127.0.0.1:55491/mikka_1512_device_e2e
      DATABASE_URL: postgres://postgres@127.0.0.1:55491/mikka_1512_device_e2e
      REQUIRE_DB: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify fixed repository, source and candidate files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path.cwd()
          report = root / 'device-sql-probe-reports'
          report.mkdir()
          base = 'c04690ff2c337886ea18e7a4fa73509ebff6de32'
          tree = 'a69946cdb08bceb994e11b3278572bea5e7e63c9'
          expected = {
            'lib/device-enrollment.ts': '59a025174235a9bbb5a17aa5c654a96d52deb002bb72859ae655af0322b0fede',
            'lib/device-management.ts': '17fb62c6033acded70487b56e09f989410b782d4afaaa0445988442b5f5754b1',
            'lib/device-enrollment.db.test.ts': '2fa9b163ce0219171d4bc46d5107d1db55628dc847f88dc33165ec0e5028f526',
          }
          def git(*args): return subprocess.check_output(['git', *args], text=True).strip()
          assert os.environ['GITHUB_REPOSITORY'] == 'alexj11324/Mikka'
          assert os.environ['GITHUB_EVENT_NAME'] == 'push'
          assert os.environ['GITHUB_REF'] == 'refs/heads/ops/1512-device-sql-probe-20261109'
          assert os.environ['GITHUB_RUN_ATTEMPT'] == '1'
          assert git('rev-parse', 'HEAD') == os.environ['GITHUB_SHA']
          assert git('rev-parse', base + '^{tree}') == tree
          assert git('rev-parse', 'HEAD^') == base
          workflow = '.github/workflows/issue1512-device-sql-probe.yml'
          assert set(git('diff', '--name-only', base, 'HEAD').splitlines()) == set(expected) | {workflow}
          files = []
          for name, digest in expected.items():
            data = (root / name).read_bytes()
            assert hashlib.sha256(data).hexdigest() == digest
            assert git('ls-files', '-s', name).startswith('100644 ')
            files.append({'path': name, 'bytes': len(data), 'sha256': digest, 'gitBlob': git('rev-parse', 'HEAD:' + name), 'baselineGitBlob': git('rev-parse', base + ':' + name)})
          assert git('status', '--porcelain', '--untracked-files=no') == ''
          receipt = {'schema': 'issue1512.device-sql-probe-source.v1', 'repository': os.environ['GITHUB_REPOSITORY'],
            'ref': os.environ['GITHUB_REF'], 'runId': os.environ['GITHUB_RUN_ID'], 'runAttempt': 1,
            'baseline': base, 'baselineTree': tree, 'candidate': git('rev-parse', 'HEAD'), 'candidateTree': git('rev-parse', 'HEAD^{tree}'),
            'files': files, 'workflowSha256': hashlib.sha256((root / workflow).read_bytes()).hexdigest(),
            'boundary': 'Dedicated PG17 service only; no production configuration, identity, model execution or Native acceptance.'}
          (report / 'source.safe.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - name: Install the unchanged dependency lock
        run: pnpm install --frozen-lockfile
      - name: Run the same complete device database suite against baseline and candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, shutil, subprocess, time
          root = pathlib.Path.cwd()
          report = root / 'device-sql-probe-reports'
          binding = json.loads((report / 'source.safe.json').read_text())
          baseline = pathlib.Path(os.environ['RUNNER_TEMP']) / 'issue1512-device-sql-baseline'
          assert not baseline.exists()
          canonical = 'node --experimental-test-module-mocks --import ./tests/support/server-only.mjs --import tsx --test lib/device-enrollment.db.test.ts'
          assert json.loads((root / 'package.json').read_text())['scripts']['test:device-enrollment-db'] == canonical
          command = ['node', '--test-reporter=tap', '--experimental-test-module-mocks', '--import', './tests/support/server-only.mjs', '--import', 'tsx', '--test', 'lib/device-enrollment.db.test.ts']
          expected_failures = {
            'registration grant consumption uses one PostgreSQL statement',
            'pending commands without receipts are one read and preserve current device removal state',
          }
          cases = []
          receipt = {'schema': 'issue1512.device-sql-probe-paired.v1', 'postgresObserved': False, 'command': command,
            'baseline': binding['baseline'], 'candidate': binding['candidate'], 'expectedTestsPerCase': 13,
            'nativeBudgetRemains': {'native': 473, 'web': 402, 'pass': False}, 'cases': cases, 'verified': False}
          def describe(path):
            data = path.read_bytes()
            return {'path': path.name, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()}
          try:
            version = subprocess.check_output(['node', '--input-type=module', '-e',
              "import pg from 'pg'; const url=new URL(process.env.E2E_DATABASE_URL); if(url.hostname!=='127.0.0.1'||url.port!=='55491'||url.pathname!=='/mikka_1512_device_e2e')throw Error('isolated target required'); const p=new pg.Pool({connectionString:url.href}); try{const {rows}=await p.query(\"SELECT current_setting('server_version') AS version,current_setting('server_version_num') AS number,current_database() AS database\"); console.log(JSON.stringify(rows[0]));}finally{await p.end();}"], text=True)
            receipt['postgres'] = json.loads(version)
            assert 170000 <= int(receipt['postgres']['number']) < 180000
            assert receipt['postgres']['database'] == 'mikka_1512_device_e2e'
            receipt['postgresObserved'] = True
            receipt['node'] = subprocess.check_output(['node', '--version'], text=True).strip()
            subprocess.run(['git', 'worktree', 'add', '--detach', str(baseline), binding['baseline']], check=True)
            shutil.copyfile(root / 'lib/device-enrollment.db.test.ts', baseline / 'lib/device-enrollment.db.test.ts')
            (baseline / 'node_modules').symlink_to(root / 'node_modules', target_is_directory=True)
            for row in binding['files']:
              actual = hashlib.sha256((baseline / row['path']).read_bytes()).hexdigest()
              if row['path'].endswith('.db.test.ts'): assert actual == row['sha256']
              else:
                original = subprocess.check_output(['git', 'show', binding['baseline'] + ':' + row['path']])
                assert actual == hashlib.sha256(original).hexdigest()
            for label, cwd in [('baseline-red', baseline), ('candidate-green', root)]:
              log = report / (label + '.original.log')
              began = time.monotonic()
              with log.open('wb') as stream:
                process = subprocess.run(command, cwd=cwd, env={**os.environ, 'TSX_TSCONFIG_PATH': str(cwd / 'tsconfig.json')}, stdout=stream, stderr=subprocess.STDOUT, timeout=180)
              text = log.read_text()
              summary = {key: int(value) for key, value in re.findall(r'^# (tests|suites|pass|fail|cancelled|skipped|todo) (\d+)\s*$', text, re.M)}
              failures = re.findall(r'^not ok \d+ - (.+)\s*$', text, re.M)
              cases.append({'case': label, 'returncode': process.returncode, 'durationSeconds': round(time.monotonic() - began, 3), 'summary': summary, 'failureNames': failures, 'log': describe(log)})
            red, green = cases
            for case in cases:
              assert case['summary']['tests'] == 13
              assert all(case['summary'][key] == 0 for key in ['cancelled', 'skipped', 'todo'])
            assert red['returncode'] == 1 and red['summary']['fail'] == 2 and red['summary']['pass'] == 11
            assert set(red['failureNames']) == expected_failures
            assert green['returncode'] == 0 and green['summary']['fail'] == 0 and green['summary']['pass'] == 13
            assert not green['failureNames']
            for row in binding['files']:
              assert hashlib.sha256((root / row['path']).read_bytes()).hexdigest() == row['sha256']
            assert subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=no'], text=True).strip() == ''
            receipt['verified'] = True
          finally:
            if baseline.exists():
              cleanup = subprocess.run(['git', 'worktree', 'remove', '--force', str(baseline)], capture_output=True)
              receipt['baselineWorktreeRemoved'] = cleanup.returncode == 0 and not baseline.exists()
            receipt['serviceCleanup'] = 'GitHub Actions tears down the isolated PostgreSQL service after this job; terminal job evidence must confirm completion.'
            (report / 'paired.safe.json').write_text(json.dumps(receipt, indent=2) + '\n')
            print(json.dumps({'verified': receipt['verified'], 'postgresObserved': receipt['postgresObserved'], 'cases': [{key: case[key] for key in ['case', 'returncode', 'summary']} for case in cases]}))
          PY
      - name: Preserve source binding and both complete logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issue1512-device-sql-probe-${{ github.sha }}
          path: device-sql-probe-reports/
          if-no-files-found: error
          retention-days: 14
