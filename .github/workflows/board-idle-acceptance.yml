name: Board idle-budget acceptance
on:
  push:
    branches: ['evidence/1975-board-idle-policy']
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d6d49d94cebfe725e2e3e86c750b06642e14a1e5
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Check the exact public release-order leaf
        run: test "$(git rev-parse HEAD)" = 'd6d49d94cebfe725e2e3e86c750b06642e14a1e5'
      - run: pnpm install --frozen-lockfile
      - name: Verify rendered Board and all other existing idle budgets
        run: pnpm test:idle-budget
      - name: Verify strict product UI policy
        run: pnpm lint:ui
