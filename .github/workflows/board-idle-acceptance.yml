name: Task command and idle-budget acceptance
on:
  push:
    branches: ['evidence/1975-board-idle-policy']
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a961064d364f23e834b625f253238f6427179921
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Check the exact public release-order leaf
        run: test "$(git rev-parse HEAD)" = 'a961064d364f23e834b625f253238f6427179921'
      - run: pnpm install --frozen-lockfile
      - name: Run shared creation, receipt and idle-budget suites in the public test environment
        run: node --experimental-test-module-mocks --import ./scripts/server-test.mjs --import tsx --test --test-concurrency=1 tests/idle-request-budget.test.tsx components/coordinator/task-profile-submit.test.tsx tests/use-coordinator-submit.test.tsx
