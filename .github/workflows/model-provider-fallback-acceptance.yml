name: Issue 1225 model provider acceptance
# A single merged PR's paid acceptance. No schedules, PR triggers or secret export.
on:
  workflow_run:
    workflows: [Web deploy]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only preflight, or the three independent real model paths
        type: choice
        options: [preflight, active]
        default: preflight
permissions:
  contents: read
concurrency:
  group: model-provider-fallback-1225
  cancel-in-progress: false
jobs:
  acceptance:
    if: github.repository == 'alexj11324/Mikka' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == 'alexj11324/Mikka' && (contains(github.event.workflow_run.head_commit.message, '(#1232)') || contains(github.event.workflow_run.pull_requests.*.number, 1232))))
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      pull-requests: read
      actions: read
      id-token: write
    steps:
      # Resolve the one authorized merge before checking out any executable code.
      - name: Resolve PR 1232's exact merge
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs'
          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'))
          const response = await fetch('https://api.github.com/repos/alexj11324/Mikka/pulls/1232', {
            headers: { authorization: `Bearer ${process.env.GH_TOKEN}`, accept: 'application/vnd.github+json' },
            redirect: 'error', signal: AbortSignal.timeout(30000),
          })
          if (!response.ok) throw Error('acceptance_merge_read_failed')
          const pr = await response.json(), sha = pr.merge_commit_sha
          const valid = pr.number === 1232 && pr.merged === true && pr.base?.ref === 'main'
            && pr.base?.repo?.full_name === 'alexj11324/Mikka' && /^[a-f0-9]{40}$/.test(sha ?? '')
            && /(?:refs?|fix(?:es)?|clos(?:e[sd]?|ing)|resolv(?:e[sd]?|ing))\s+(?:https:\/\/github\.com\/alexj11324\/Mikka\/issues\/)?#?1225\b/i.test(pr.body ?? '')
          const run = event.workflow_run
          const trigger = process.env.GITHUB_EVENT_NAME === 'workflow_dispatch'
            || (run?.name === 'Web deploy' && run.status === 'completed' && run.conclusion === 'success'
              && run.head_branch === 'main' && run.head_sha === sha && run.head_repository?.full_name === 'alexj11324/Mikka'
              && (run.head_commit?.message?.includes('(#1232)') || run.pull_requests?.some(item => item.number === 1232)))
          if (!valid || !trigger) {
            appendFileSync(process.env.GITHUB_OUTPUT, 'eligible=false\n')
            console.log('Not the authorized PR 1232 merge deployment; no acceptance or secret read.')
          } else {
            const mode = process.env.GITHUB_EVENT_NAME === 'workflow_dispatch' ? event.inputs?.mode ?? 'preflight' : 'active'
            if (!['preflight', 'active'].includes(mode)) throw Error('acceptance_mode_rejected')
            appendFileSync(process.env.GITHUB_OUTPUT, `eligible=true\nsha=${sha}\nmode=${mode}\n`)
          }
          JS
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.merge.outputs.eligible == 'true'
        with:
          ref: ${{ steps.merge.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.merge.outputs.eligible == 'true'
        with:
          node-version: 24
      - name: Verify the driver and the merge guard
        if: steps.merge.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.merge.outputs.sha }}
        run: |
          node --test scripts/acceptance/model-provider-fallback.test.mjs
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs'
          import { mergeGuard } from './scripts/acceptance/model-provider-fallback.mjs'
          const response = await fetch('https://api.github.com/repos/alexj11324/Mikka/pulls/1232', {
            headers: { authorization: `Bearer ${process.env.GH_TOKEN}`, accept: 'application/vnd.github+json' },
            redirect: 'error', signal: AbortSignal.timeout(30000),
          })
          if (!response.ok) throw Error('acceptance_merge_read_failed')
          const result = mergeGuard({ repository: process.env.GITHUB_REPOSITORY, ref: process.env.GITHUB_REF,
            eventName: process.env.GITHUB_EVENT_NAME, event: JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8')), pr: await response.json() })
          if (result.sha !== process.env.EXPECTED_SHA) throw Error('acceptance_merge_changed')
          JS
          node scripts/assert-test-model.mjs deepseek-flash
      - name: Confirm the same commit's official worker release
        id: worker
        if: steps.merge.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.merge.outputs.sha }}
          ACCEPTANCE_MODE: ${{ steps.merge.outputs.mode }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs'
          import { setTimeout } from 'node:timers/promises'
          const sha = process.env.EXPECTED_SHA
          const attempts = process.env.ACCEPTANCE_MODE === 'active' ? 30 : 1
          let release
          for (let attempt = 0; attempt < attempts; attempt++) {
            const url = `https://api.github.com/repos/alexj11324/Mikka/actions/workflows/e2b-official-runtime.yml/runs?event=push&head_sha=${sha}&per_page=30`
            const response = await fetch(url, { headers: { authorization: `Bearer ${process.env.GH_TOKEN}`, accept: 'application/vnd.github+json' },
              redirect: 'error', signal: AbortSignal.timeout(30000) })
            if (!response.ok) throw Error('acceptance_worker_release_read_failed')
            const data = await response.json()
            release = data.workflow_runs?.find(run => run.event === 'push' && run.head_branch === 'main' && run.head_sha === sha
              && run.head_repository?.full_name === 'alexj11324/Mikka' && run.status === 'completed' && run.conclusion === 'success')
            if (release) break
            if (attempt + 1 < attempts) await setTimeout(30000)
          }
          if (release && Number.isSafeInteger(release.id)) appendFileSync(process.env.GITHUB_OUTPUT, `sha=${sha}\nrun-id=${release.id}\n`)
          else console.log('blocked_worker_release: this merge has no confirmed successful official-runtime push release yet; active paths remain blocked and may be rerun manually.')
          JS
      - name: Read only the existing smoke account
        if: steps.merge.outputs.eligible == 'true'
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          recursive: false
          include-imports: false
      - name: Run the three independent paths
        if: steps.merge.outputs.eligible == 'true'
        run: node scripts/acceptance/model-provider-fallback.mjs
        env:
          MIKKA_PROVIDER_ACCEPTANCE_MODE: ${{ steps.merge.outputs.mode }}
          MIKKA_EXPECTED_DEPLOYMENT_SHA: ${{ steps.merge.outputs.sha }}
          MIKKA_WORKER_RELEASE_SHA: ${{ steps.worker.outputs.sha }}
          MIKKA_WORKER_RELEASE_RUN_ID: ${{ steps.worker.outputs.run-id }}
      - if: always() && steps.merge.outputs.eligible == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: model-provider-fallback-1225-${{ steps.merge.outputs.sha }}
          path: model-provider-fallback-report
          if-no-files-found: ignore
          retention-days: 14
