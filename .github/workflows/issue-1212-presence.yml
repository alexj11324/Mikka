name: Issue 1212 explicit owner device presence acceptance

# Explicit v3 diagnostic case: retain the prior failed run; fixed socket reasons, unchanged health gates.
on:
  push:
    branches: [acceptance/issues-1504-1506]
    paths:
      - '.github/workflows/issue-1212-presence.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-smoke-owner-acceptance
  cancel-in-progress: false

jobs:
  presence:
    if: github.repository == 'alexj11324/Mikka' && github.event_name == 'push' && github.ref == 'refs/heads/acceptance/issues-1504-1506'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      MIKKA_ACCEPTANCE_SHA: 1a70bb79d7dc4ab31418e9fa674dd39c0a1cae01
      MIKKA_PRESENCE_RUN_KEY: acme-1212-20261106-b
      MIKKA_PRESENCE_MODE: baseline
      MIKKA_PRESENCE_REPORT_DIR: presence-acceptance-report
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Check out the exact old client source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 2f84230d24f28c6b5d1ef78669f7d6cbaf438bfc
          path: presence-baseline-source
          persist-credentials: false
      - name: Check out the reviewed new client source for offline guards
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 4dee591a822bef3e68f7c078f4cdc4e488be3cce
          path: presence-source
          persist-credentials: false
      - name: Verify exact sources and fixture boundaries without network
        env:
          MIKKA_PRESENCE_SOURCE_ROOT: presence-source
          MIKKA_PRESENCE_BASELINE_SOURCE_ROOT: presence-baseline-source
        run: node --test scripts/acceptance/issue-1212-presence/presence.test.mjs scripts/acceptance/issue-1212-presence/presence-baseline-diagnostics.test.mjs
      - name: Read the issue-bound ACME email only
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          secret-name: ACME_DEMO_EMAIL
          recursive: false
          include-imports: false
      - name: Read the issue-bound ACME password only
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          secret-name: ACME_DEMO_PASSWORD
          recursive: false
          include-imports: false
      - name: Measure the exact old client and retain only the disabled fixture
        env:
          MIKKA_PRESENCE_SOURCE_ROOT: presence-baseline-source
        run: node scripts/acceptance/issue-1212-presence/presence-production.mjs
      - name: Retain sanitized metrics and the immutable fixture receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issue-1212-presence-${{ github.run_id }}
          path: presence-acceptance-report/*.json
          if-no-files-found: ignore
          retention-days: 7
