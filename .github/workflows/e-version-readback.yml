name: E authenticated reply version UI recovery regression
on:
  push:
    branches: [evidence/2254-sidebar-85dfc396]
    paths: [.github/workflows/e-version-readback.yml]
permissions:
  contents: read
jobs:
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 473cf431a5143034b9b3d38083d0e78f35502728
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - name: Pin the source and install its lockfile
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 473cf431a5143034b9b3d38083d0e78f35502728
          test "$(git rev-parse 'HEAD^{tree}')" = df71de52cdd61c331a9fb55a34c5f23cd2136aa6
          pnpm install --frozen-lockfile
      - name: Execute original complete group and conversation unit suites
        run: |
          set -uo pipefail
          mkdir "$RUNNER_TEMP/version-receipt"
          export R="$RUNNER_TEMP/version-receipt"
          git rev-parse HEAD > "$R/public"
          git rev-parse 'HEAD^{tree}' > "$R/tree"
          date -u +%FT%TZ > "$R/start"
          set -e
          umask 077
          pg=/usr/lib/postgresql/17/bin
          if [ ! -x "$pg/initdb" ]; then
            . /etc/os-release
            curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o "$RUNNER_TEMP/pgdg-signing.asc"
            test "$(gpg --show-keys --with-colons "$RUNNER_TEMP/pgdg-signing.asc" | awk -F: '/^fpr:/ {print $10;exit}')" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
            sudo install -m 0644 "$RUNNER_TEMP/pgdg-signing.asc" /usr/share/keyrings/pgdg-evidence.asc
            echo "deb [signed-by=/usr/share/keyrings/pgdg-evidence.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg-evidence.list >/dev/null
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends postgresql-17
          fi
          test -x "$pg/initdb"
          fixture="$RUNNER_TEMP/version-postgres"
          mkdir -m 700 "$fixture"
          pw="$(openssl rand -hex 32)"
          printf '%s\n' "$pw" > "$fixture/password"
          "$pg/initdb" -D "$fixture/db" -A scram-sha-256 -U e2e --pwfile="$fixture/password" --encoding=UTF8 > "$fixture/init.log"
          "$pg/pg_ctl" -D "$fixture/db" -o "-p 55437 -h 127.0.0.1 -c unix_socket_directories='' -c shared_buffers=64MB" -l "$fixture/server.log" -w start
          trap '"$pg/pg_ctl" -D "$fixture/db" -w -m fast stop >/dev/null; rm -f "$fixture/password"' EXIT
          export PGPASSWORD="$pw"
          "$pg/createdb" -p 55437 -h 127.0.0.1 -U e2e versions_e2e
          export E2E_DATABASE_URL="postgresql://e2e:$pw@127.0.0.1:55437/versions_e2e"
          export DATABASE_URL="$E2E_DATABASE_URL" REQUIRE_DB=1
          "$pg/psql" -At -h 127.0.0.1 -p 55437 -U e2e -d versions_e2e -c "show server_version_num" > "$R/postgres-version"
          grep -Eq '^17[[:digit:]]{4}$' "$R/postgres-version"
          date -u +%FT%TZ > "$R/start"
          node --experimental-strip-types scripts/setup-e2e-db.mjs > "$fixture/migrations.log" 2>&1
          "$pg/psql" -At -h 127.0.0.1 -p 55437 -U e2e -d versions_e2e -c "select to_regclass('public.chat_preferences')" | grep -Fx chat_preferences
          date -u +%FT%TZ > "$R/start"
          set +e
          pnpm test:groups 2>&1 | tee "$R/named-checks.txt"
          code=${PIPESTATUS[0]}
          date -u +%FT%TZ > "$R/end"
          printf '%s\n' "$code" > "$R/exit"
          test "$code" -eq 0 || exit "$code"
          if grep -E 'ℹ skipped [1-9]|# SKIP' "$R/named-checks.txt"; then exit 1; fi
      - name: Archive the original test names and run status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: version-readback-f19dffd0
          path: ${{ runner.temp }}/version-receipt/
          if-no-files-found: error
