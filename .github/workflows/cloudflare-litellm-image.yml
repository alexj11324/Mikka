name: Cloudflare LiteLLM runtime
# The private model egress, built and
# published like the task runtime: bound to an accepted API build, tested,
# then pushed to the account registry for the private publisher to pin.
on:
  workflow_dispatch:
    inputs:
      api_run_id:
        description: Accepted API publication run ID
        type: string
        required: true
      api_run_attempt:
        description: Accepted API publication run attempt
        type: string
        required: true
      api_image_digest:
        description: Accepted API image digest
        type: string
        required: true
      overlay_sha:
        description: Accepted UI Overlay commit SHA
        type: string
        required: true
  pull_request:
    paths: &litellm_paths
      - 'deploy/litellm/**'
      - 'cloudflare/litellm/**'
      - 'lib/model-gateway/**'
      - 'tests/model-gateway-litellm.test.ts'
      - '.github/workflows/cloudflare-litellm-image.yml'
  push:
    branches: [main]
    paths: *litellm_paths
permissions:
  contents: read
jobs:
  image:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --prefix cloudflare/litellm
      - run: node --test cloudflare/litellm/worker.test.mjs
      - name: Build the LiteLLM image and check its health and master-key guard offline
        run: |
          docker build --platform linux/amd64 -t mikka-litellm deploy/litellm
          bash deploy/litellm/offline-check.sh mikka-litellm
      - name: Prove both CLI protocols through the built proxy
        run: |
          corepack pnpm install --frozen-lockfile --ignore-scripts
          bash deploy/litellm/conversion-check.sh mikka-litellm
  publish:
    permissions:
      contents: read
      actions: read
      id-token: write
    if: github.repository == 'alexj11324/Mikka' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor_id == '183887963' && github.triggering_actor == 'alexj11324'
    runs-on: ubuntu-latest
    environment: cloudflare-runtime-release
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Read the verified original public API build receipt
        id: api
        env:
          GH_TOKEN: ${{ github.token }}
          API_RUN_ID: ${{ inputs.api_run_id }}
          API_RUN_ATTEMPT: ${{ inputs.api_run_attempt }}
          API_IMAGE_DIGEST: ${{ inputs.api_image_digest }}
          OVERLAY_SHA: ${{ inputs.overlay_sha }}
        run: node scripts/load-cloudflare-api-receipt.mjs
      - name: Check out the original API product source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.api.outputs.source }}
          persist-credentials: false
          fetch-depth: 0
      - name: Issue a short-lived credential to read the original API image
        id: registry-read
        uses: ./.github/actions/cloudflare-registry-credentials
        with:
          mode: read
      - name: Prepare the source-bound runtime release
        env:
          API_RUN_ID: ${{ inputs.api_run_id }}
          API_RUN_ATTEMPT: ${{ inputs.api_run_attempt }}
          API_IMAGE_DIGEST: ${{ inputs.api_image_digest }}
          OVERLAY_SHA: ${{ inputs.overlay_sha }}
          CF_RUNTIME_REGISTRY_USERNAME: ${{ steps.registry-read.outputs.username }}
          CF_RUNTIME_REGISTRY_PASSWORD: ${{ steps.registry-read.outputs.password }}
        run: node scripts/cloudflare-runtime-release.mjs prepare litellm
      - run: npm ci --ignore-scripts --prefix cloudflare/litellm
      - name: Build the LiteLLM runtime and check its health and master-key guard
        run: |
          docker build --platform linux/amd64 --label "org.opencontainers.image.revision=$MIKKA_BUILD_REVISION" --label "com.mikka.overlay=$MIKKA_UI_OVERLAY_SHA" --label "com.mikka.release=$MIKKA_DEPLOYMENT_ID" -t mikka-litellm deploy/litellm
          image_id=$(docker image inspect --format '{{.Id}}' mikka-litellm)
          echo "RUNTIME_TESTED_IMAGE_ID=$image_id" >> "$GITHUB_ENV"
          bash deploy/litellm/offline-check.sh mikka-litellm
      - name: Install the product's test dependencies for the conversion proof
        run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - name: Prove Anthropic and Responses conversion against a Chat-Completions-only provider
        # The product source supplies the gateway under test; the proof's own
        # script and mock provider come from this workflow's commit.
        run: |
          proof="$RUNNER_TEMP/litellm-proof"
          mkdir -p "$proof"
          git show "$GITHUB_SHA:deploy/litellm/conversion-check.sh" > "$proof/conversion-check.sh"
          git show "$GITHUB_SHA:deploy/litellm/mock-provider.py" > "$proof/mock-provider.py"
          bash "$proof/conversion-check.sh" mikka-litellm
      - name: Tag the verified LiteLLM runtime for release
        run: docker tag mikka-litellm "mikka-litellm:$MIKKA_DEPLOYMENT_ID"
      - name: Issue a short-lived Registry publication credential
        id: registry
        uses: ./.github/actions/cloudflare-registry-credentials
        with:
          mode: publish
      - name: Publish the verified runtime image
        env:
          API_RUN_ID: ${{ inputs.api_run_id }}
          API_RUN_ATTEMPT: ${{ inputs.api_run_attempt }}
          API_IMAGE_DIGEST: ${{ inputs.api_image_digest }}
          OVERLAY_SHA: ${{ inputs.overlay_sha }}
          CF_RUNTIME_REGISTRY_USERNAME: ${{ steps.registry.outputs.username }}
          CF_RUNTIME_REGISTRY_PASSWORD: ${{ steps.registry.outputs.password }}
        run: |
          printf '%s' "$CF_RUNTIME_REGISTRY_PASSWORD" | docker login registry.cloudflare.com --username "$CF_RUNTIME_REGISTRY_USERNAME" --password-stdin > /dev/null
          node scripts/cloudflare-runtime-release.mjs publish litellm
      - name: Upload the runtime OCI receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-litellm-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-litellm-receipt.json
          if-no-files-found: error
          retention-days: 1
      - name: Remove the temporary Registry credentials
        if: always()
        run: node scripts/cloudflare-runtime-release.mjs cleanup
