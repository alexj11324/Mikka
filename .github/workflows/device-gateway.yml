name: Device gateway
on:
  push:
    branches: [main]
    paths: &gateway_paths
      - 'cloudflare/device-gateway/**'
      - 'lib/device-gateway*.ts'
      - 'lib/device-presence*.ts'
      - 'lib/live/**'
      - 'lib/db/commit-effects*.ts'
      - 'hooks/use-live-key.tsx'
      - 'app/api/live/**'
      - 'scripts/device-gateway/**'
      - 'scripts/release/cloudflare-promoted-web.mjs'
      - 'scripts/release/cloudflare-promoted-web.test.mjs'
      - 'lib/builtin-gateway/config.ts'
      - 'lib/edition.ts'
      - 'packages/protocol/src/coded-error.ts'
      - '.github/workflows/device-gateway.yml'
  pull_request:
    paths: *gateway_paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('device-gateway-{0}', github.ref) || 'device-gateway-production' }}
  # A newer main release must never finish before an older release writes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.select.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/device-gateway/deploy.test.mjs
      - run: node --test cloudflare/device-gateway/test/presence.test.mjs
      - run: node --test cloudflare/device-gateway/test/runtime.test.mjs
      - run: node --import tsx --test lib/device-presence-grant.test.ts lib/live/presence-read.test.ts lib/live/scope.test.ts lib/live/home-scope-proof.test.ts lib/live/channel.test.ts lib/db/commit-effects.test.ts cloudflare/device-gateway/src/live-route.test.ts
      - run: node --experimental-test-module-mocks --import ./scripts/server-test.mjs --import tsx --test lib/live/ticket.test.ts lib/mobile-threads-presence.test.ts
      - name: Select changed Worker and confirm the legacy production origin
        id: select
        if: github.event_name != 'pull_request'
        env:
          RELEASE_BEFORE: ${{ github.event.before }}
        run: node scripts/device-gateway/select-release.mjs device
  deploy:
    needs: test
    if: github.repository == 'alexj11324/Mikka' && github.ref == 'refs/heads/main' && needs.test.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require successful main CI for this exact source commit
        run: node scripts/release/ci-gate.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Read the existing Cloudflare deployment token
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: CLOUDFLARE_API_TOKEN
          include-imports: false
      - name: Read the existing Cloudflare account ID
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: CLOUDFLARE_ACCOUNT_ID
          include-imports: false
      - name: Read the existing Vercel release token for read-only checks
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: VERCEL_TEAM_TOKEN
          include-imports: false
      - name: Wait for the fixed production application, then update the existing Worker
        run: node scripts/device-gateway/deploy.mjs
