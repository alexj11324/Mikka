name: Verify the published v0.1.0 self-hosted receipts
on:
  push:
    branches: ['acceptance/1963-v010-published-receipts']
permissions:
  actions: read
  contents: read
jobs:
  verify:
    name: Read the official artifact and independently verify the stable image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Match the GitHub receipts, previous installations and GHCR content
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '13915529271'
          ARCHIVE_DIGEST: 'sha256:55806086f46ad948f5d59b71578787772d7cfe698b82bff50209a2cab8a84cc3'
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, re, subprocess, zipfile
          from datetime import datetime, timedelta
          from pathlib import PurePosixPath
          repo = 'alexj11324/Mikka'
          run = '43153922171'
          artifact = os.environ['ARTIFACT_ID']
          expected_hash = os.environ['ARCHIVE_DIGEST']
          rev = '474d280d16201d28e02ebea4875138937cbbe701'
          digest = 'sha256:67e772ad4ce5249ac665f3094c7cc76c03f1284076d154bdd780530ea63a3376'
          inventory = '0eba2caa18e562e7e6c8795e3cb36858063d6157cf6dc7607e58909707c3bc35'
          tag = 'v0.1.0'
          base = 'ghcr.io/alexj11324/mikka'
          pin = base+'@'+digest
          def raw(path):
              return subprocess.check_output(['gh','api','repos/'+repo+'/'+path])
          def get(path):
              return json.loads(raw(path))
          def instant(value):
              return datetime.fromisoformat(value.replace('Z','+00:00'))
          promote = get('actions/runs/'+run)
          meta = get('actions/artifacts/'+artifact)
          assert meta['name']=='self-hosted-upgrade-'+tag and str(meta['workflow_run']['id'])==run
          assert str(promote['workflow_id'])=='415342345' and meta['workflow_run']['head_sha']==promote['head_sha']
          body = raw('actions/artifacts/'+artifact+'/zip')
          assert 'sha256:'+hashlib.sha256(body).hexdigest()==expected_hash==meta['digest']
          with zipfile.ZipFile(io.BytesIO(body)) as archive:
              def read_one(name):
                  rows = [x for x in archive.infolist() if PurePosixPath(x.filename).name==name]
                  if len(rows)!=1 or rows[0].file_size>4*1024*1024:
                      raise ValueError('Expected one bounded '+name)
                  return json.loads(archive.read(rows[0]))
              delivery, upgrade = read_one('delivery.json'),read_one('upgrade.json')
          release = get('releases/tags/'+tag)
          assert release['id']==442497224 and not release['draft'] and not release['prerelease']
          assert get('git/ref/tags/'+tag)['object']['sha']==rev
          assert '<!-- mikka-self-hosted-release-v2 sha='+rev+' digest='+digest+' migrations='+inventory+' protocol=0-1 -->' in release['body'].splitlines()
          refs = {}
          for ref in [base+':'+tag,base+':'+rev,base+':ci-43144148149-1',pin]:
              refs[ref] = subprocess.check_output(['skopeo','inspect','--format','{{.Digest}}','docker://'+ref],text=True).strip()
          assert set(refs.values())=={digest}
          config = json.loads(subprocess.check_output(['skopeo','inspect','--config','docker://'+pin]))
          assert config['config']['Labels']['org.opencontainers.image.revision']==rev
          expected = {'tag':tag,'revision':rev,'image':pin,'migrations':inventory}
          assert upgrade['release']==expected and upgrade['status']=='passed'
          assert delivery['releaseId']==release['id'] and delivery['image']==pin and delivery['revision']==rev
          assert delivery['manual']=={'acceptedDeliveries':2,'stateDirectoryEmpty':True,'containerStarts':0}
          assert delivery['duplicatePreserved'] and delivery['invalidSignatureHttpStatus']==401
          cases=sorted(upgrade['cases'],key=lambda c:c['migrationChanged'])
          assert len(cases)==2 and [c['migrationChanged'] for c in cases]==[False,True] and cases[0]['project']!=cases[1]['project']
          for c in cases:
              assert c['status']=='passed' and c['before']['runStatus']=='running' and c['before']['finishedAt'] is None
              assert c['refusal']=='SELF_HOSTED_UPDATE_ACTIVE_TASKS' and c['completion']['status']==204
              assert c['afterCompletion']==c['after'] and c['after']['runStatus']=='stopped' and c['after']['stopReason']=='turn_ended'
              assert c['backup']['matchedTaskAndRun'] and c['backup']['format']=='pg_dump -Fc'
              assert c['smoke']['status']=='passed' and c['smoke']['revision']==rev and c['smoke']['database']=='ready'
              assert c['cliCheck']=={'status':'available','tag':tag,'revision':rev,'image':pin}
              assert c['afterRecovery']['revision']==rev and c['afterRecovery']['digest']==digest
              assert c['installed']['revision']==c['baseline']['revision'] and c['installed']['digest']==c['baseline']['image'].split('@')[1]
          same, changed=cases
          assert same['baseline']['migrations']==inventory and not same['appliedMigrations']
          assert same['failure']=='SELF_HOSTED_UPDATE_REVERTED_TO_PREVIOUS_IMAGE' and same['afterFailure']['digest']==same['installed']['digest'] and same['afterFailure']['ingressStatus']==200
          auto = same['recovery']; opened=instant(auto['opensAt'])
          assert auto['policy']=='auto' and auto['result']=='processed' and auto['duplicateSuppressed'] and auto['invalidSignatureHttp']==401
          assert instant(auto['queuedAt'])<opened<=instant(auto['attemptObservedAt'])<opened+timedelta(minutes=1)
          assert changed['baseline']['migrations']!=inventory and changed['appliedMigrations']
          assert changed['failure']=='SELF_HOSTED_UPDATE_MIGRATION_RECOVERY_REQUIRED' and changed['afterFailure']['digest']==digest and changed['afterFailure']['ingressStatus']==503
          assert changed['recovery']['result']=='recovered-forward'
          report={'releaseId':release['id'],'publishedAt':release['published_at'],'archive':expected_hash,'refs':refs,'source':rev,
                  'delivery':{k:delivery[k] for k in ['tag','releaseId','manual','duplicatePreserved','invalidSignatureHttpStatus','receivedAt','transport']},
                  'cases':[]}
          for c in cases:
              report['cases'].append({'baseline':c['baseline'],'refusal':c['refusal'],'completion':c['completion'],'finishedAt':c['after']['finishedAt'],
                  'preservedTaskAndRun':c['afterCompletion']==c['after'],'backupMatches':c['backup']['matchedTaskAndRun'],'fixtureColumn':c['fixtureContractColumn'],
                  'appliedMigrations':c['appliedMigrations'],'failure':c['failure'],'afterFailure':{k:c['afterFailure'][k] for k in ['digest','revision','ingressStatus']},
                  'recovery':c['recovery'],'afterRecovery':{k:c['afterRecovery'][k] for k in ['digest','revision']},'smoke':c['smoke'],'cliCheck':c['cliCheck']})
          print('SELF_HOSTED_VERIFIED_RECEIPT '+json.dumps(report,separators=(',',':'),sort_keys=True))
          for page in range(1,4):
              recorded=[e for e in get('events?per_page=100&page='+str(page)) if e['type']=='ReleaseEvent' and e.get('payload',{}).get('release',{}).get('id')==release['id']]
              if recorded:
                  print('PUBLIC_RELEASE_EVENT '+json.dumps([{'id':e['id'],'action':e['payload']['action'],'at':e['created_at']} for e in recorded]))
                  break
          PY
