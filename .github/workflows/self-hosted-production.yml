name: Mikka cloud core compatibility

on:
  pull_request:
    paths:
      - '.github/workflows/self-hosted-production.yml'
      - 'scripts/acceptance/self-hosted-production*.mjs'
      - 'scripts/acceptance/inbox-production*.mjs'
      - 'scripts/ops/production-mobile-daemon*.mjs'
      - 'scripts/acceptance/memory-production*.mjs'
  workflow_run:
    workflows: ['Web deploy']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('self-hosted-production-guards-{0}', github.event.pull_request.number) || 'production-smoke-owner-acceptance' }}
  cancel-in-progress: false
  queue: max

jobs:
  guards:
    name: Core production offline guards
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm-install
        with:
          ffmpeg-github-token: ${{ github.token }}
      - run: node --import tsx --test scripts/acceptance/self-hosted-production.test.mjs scripts/ops/production-mobile-daemon.test.mjs scripts/acceptance/inbox-production.test.mjs scripts/acceptance/inbox-production-target.test.mjs scripts/acceptance/inbox-production-recovery.test.mjs scripts/acceptance/memory-production.test.mjs scripts/acceptance/memory-production-target.test.mjs scripts/acceptance/memory-production-pending.test.mjs scripts/acceptance/memory-production-cases.test.mjs

  acceptance:
    name: Core production API and gateway acceptance
    needs: guards
    if: >-
      github.repository == 'alexj11324/Mikka' && github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_sha == github.sha &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      id-token: write
    env:
      MIKKA_ACCEPTANCE_TARGET_MODE: self-hosted-core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm-install
        with:
          ffmpeg-github-token: ${{ github.token }}
      - name: Verify an open core issue, current main and its actual cloud Web publication before credentials
        id: attest
        run: node --import tsx scripts/acceptance/self-hosted-production.mjs --attest
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Select only Memory PR 1830 ordinary merge and its active release window
        id: memory_select
        if: steps.attest.outputs.readable == 'true'
        run: node --import tsx scripts/acceptance/memory-production.mjs --select
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Select only the exact Inbox merge and active release window before credentials
        id: inbox_selection
        run: node --import tsx scripts/acceptance/inbox-production.mjs --select
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Read the existing smoke email only
        if: steps.attest.outputs.core_selected == 'true' || steps.inbox_selection.outputs.selected == 'true' || steps.memory_select.outputs.selected == 'true'
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          secret-name: SMOKE_OWNER_EMAIL
          recursive: false
          include-imports: false
      - name: Read the existing smoke password only
        if: steps.attest.outputs.core_selected == 'true' || steps.inbox_selection.outputs.selected == 'true' || steps.memory_select.outputs.selected == 'true'
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          secret-name: SMOKE_OWNER_PASSWORD
          recursive: false
          include-imports: false
      - name: Verify cloud discovery, owner flags, live and source-daemon gateways with exact cleanup
        if: steps.attest.outputs.core_selected == 'true'
        timeout-minutes: 6
        run: node --import tsx scripts/acceptance/self-hosted-production.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify the exact Inbox fixture or inventory under its current release window
        if: steps.inbox_selection.outputs.selected == 'true'
        timeout-minutes: 6
        run: node --import tsx scripts/acceptance/inbox-production.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Retain closed evidence when artifact storage is available
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: self-hosted-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            self-hosted-production-report/*.json
            self-hosted-production-report/inbox-journal.jsonl
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify memory owner APIs and independently observe both subscription prompts
        id: memory
        if: always() && steps.memory_select.outputs.selected == 'true'
        timeout-minutes: 6
        run: node --import tsx scripts/acceptance/memory-production.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Confirm Memory owner API acceptance
        if: always() && steps.memory.outputs.owner_passed == 'true'
        run: node --import tsx scripts/acceptance/memory-production.mjs --confirm-case owner
      - name: Confirm Claude Memory reply and real usage
        if: always() && steps.memory.outputs.claude_code_passed == 'true'
        run: node --import tsx scripts/acceptance/memory-production.mjs --confirm-case claude_code
      - name: Confirm Codex Memory reply and real usage
        if: always() && steps.memory.outputs.codex_passed == 'true'
        run: node --import tsx scripts/acceptance/memory-production.mjs --confirm-case codex
      - name: Confirm Memory notification pending review
        if: always() && steps.memory.outputs.pending_passed == 'true'
        run: node --import tsx scripts/acceptance/memory-production.mjs --confirm-case pending
      - name: Retain memory acceptance and nonce-bound fixture receipts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: memory-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: memory-production-report/*.json
          if-no-files-found: ignore
          retention-days: 14
