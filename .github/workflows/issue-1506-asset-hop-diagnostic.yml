# Isolated, bounded transport diagnosis; this is not business acceptance.
# Parent source: 75930406dda8708a84786475656ae449f5ffda88.
# No application checkout, installation, archive extraction, or production access.
name: Issue 1506 bounded asset hop diagnostic

on:
  push:
    branches:
      - ops/1506-asset-hop-diagnostic-20261108
    paths:
      - .github/workflows/issue-1506-asset-hop-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event_name == 'push' && github.ref == 'refs/heads/ops/1506-asset-hop-diagnostic-20261108'
    name: Asset hops (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-14]
    steps:
      - name: Record sanitized one-byte asset hop diagnostics
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          """One-shot CUA asset transport diagnostics; never business acceptance."""
          
          import json
          import math
          import os
          import re
          import selectors
          import shutil
          import subprocess
          import sys
          import tempfile
          import time
          from pathlib import Path
          from urllib.parse import urlsplit
          
          ASSETS = {"linux": 661455608, "darwin": 661454894}
          HOP_HOSTS = {
              "release-assets.githubusercontent.com",
              "objects.githubusercontent.com",
              "github.com",
          }
          BODY_LIMIT = 1024
          STDOUT_LIMIT = BODY_LIMIT + 256  # Body plus numeric curl write-out trailer.
          METRIC_MARKER = b"\nMIKKA_ASSET_HOP_METRICS:"
          WRITE_OUT = "\nMIKKA_ASSET_HOP_METRICS:%{http_code},%{http_connect},%{size_download},%{time_total}\n"
          
          
          def emit(record):
              # Callers construct only the fixed schema below; never emit raw tool output.
              print(json.dumps(record, sort_keys=True, allow_nan=False), flush=True)
          
          
          def safe_location(header_bytes, status):
              if status not in {301, 302, 303, 307, 308}:
                  return None, "none"
              if len(header_bytes) > 65536:
                  return None, "rejected"
              blocks = [b for b in re.split(rb"\r?\n\r?\n", header_bytes) if b.startswith(b"HTTP/")]
              if not blocks:
                  return None, "rejected"
              lines = blocks[-1].splitlines()
              status_match = re.match(rb"HTTP/\S+ (\d{3})(?: |$)", lines[0])
              if not status_match or int(status_match[1]) != status:
                  return None, "rejected"
              locations = [line.split(b":", 1)[1].strip() for line in lines[1:] if line.lower().startswith(b"location:")]
              if len(locations) != 1:
                  return None, "rejected"
              try:
                  location = locations[0].decode("ascii")
                  if any(ord(c) <= 32 or ord(c) == 127 for c in location) or len(location) > 16384:
                      return None, "rejected"
                  parsed = urlsplit(location)
                  if (
                      parsed.scheme != "https"
                      or parsed.hostname not in HOP_HOSTS
                      or parsed.username is not None
                      or parsed.password is not None
                      or parsed.port not in {None, 443}
                      or parsed.fragment
                  ):
                      return None, "rejected"
                  return location, "allowed"
              except (UnicodeError, ValueError):
                  return None, "rejected"
          
          
          def request(curl, asset_id, url, phase, auth_mode, api_auth_mode, token):
              # The URL is either the fixed API URL or a separately validated HTTPS hop.
              record = {
                  "schema": 1,
                  "platform": sys.platform,
                  "assetId": asset_id,
                  "phase": phase,
                  "authMode": auth_mode,
                  "apiAuthMode": api_auth_mode,
                  "hostname": "api.github.com" if phase == "api" else urlsplit(url).hostname,
                  "status": None,
                  "connectStatus": None,
                  "exit": None,
                  "bytes": None,
                  "timeMs": None,
                  "errorClass": "internal_error",
                  "redirectDecision": "none",
                  "redirectHostname": None,
              }
              if auth_mode == "github-job-token" and not re.fullmatch(r"[A-Za-z0-9_]{1,2048}", token):
                  record["errorClass"] = "token_unavailable"
                  return record, None
          
              location = None
              try:
                  with tempfile.TemporaryDirectory(prefix="mikka-asset-hop-") as directory:
                      os.chmod(directory, 0o700)
                      paths = {name: Path(directory) / name for name in ("headers", "body", "stderr")}
                      for path in paths.values():
                          descriptor = os.open(path, os.O_CREAT | os.O_EXCL | os.O_WRONLY, 0o600)
                          os.close(descriptor)
                      args = [
                          curl, "-q", "--silent", "--show-error", "--fail",
                          "--proto", "=https", "--max-redirs", "0", "--retry", "0",
                          "--connect-timeout", "10", "--max-time", "20", "--max-filesize", "1024",
                          "--range", "0-0", "--header", "Accept: application/octet-stream",
                          "--dump-header", str(paths["headers"]), "--output", "-",
                          "--write-out", WRITE_OUT, "--config", "-", "--url", url,
                      ]
                      # No Authorization appears in argv, files, redirects, or child env.
                      config = ""
                      if phase == "api" and auth_mode == "github-job-token":
                          config = 'header = "Authorization: Bearer ' + token + '"\n'
                      child_env = os.environ.copy()
                      child_env.pop("GITHUB_TOKEN", None)
                      child_env.pop("GH_TOKEN", None)
                      output = bytearray()
                      fault = None
                      process = None
                      with paths["stderr"].open("wb") as stderr:
                          try:
                              process = subprocess.Popen(args, stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=stderr, env=child_env)
                              process.stdin.write(config.encode("ascii"))
                              process.stdin.close()
                              deadline = time.monotonic() + 25
                              with selectors.DefaultSelector() as selector:
                                  selector.register(process.stdout, selectors.EVENT_READ)
                                  while True:
                                      remaining = deadline - time.monotonic()
                                      if remaining <= 0:
                                          fault = "orchestrator_timeout"
                                          break
                                      if not selector.select(remaining):
                                          fault = "orchestrator_timeout"
                                          break
                                      chunk = os.read(process.stdout.fileno(), STDOUT_LIMIT + 1 - len(output))
                                      if not chunk:
                                          break
                                      output.extend(chunk)
                                      if len(output) > STDOUT_LIMIT:
                                          fault = "body_limit"
                                          break
                              if fault and process.poll() is None:
                                  process.kill()
                              record["exit"] = process.wait(timeout=5)
                          finally:
                              if process is not None:
                                  if process.poll() is None:
                                      process.kill()
                                      process.wait(timeout=5)
                                  for stream in (process.stdin, process.stdout):
                                      if stream is not None:
                                          stream.close()
                      body, marker, metrics = bytes(output).rpartition(METRIC_MARKER)
                      # A bounded pipe also stops an ignored Range on older curl versions.
                      if not marker:
                          body = bytes(output)
                      with paths["body"].open("wb") as body_file:
                          body_file.write(body[:BODY_LIMIT])
                      match = re.fullmatch(rb"(\d{3}),(\d{3}),(\d+(?:\.\d+)?),(\d+(?:\.\d+)?)\n", metrics) if marker else None
                      if match:
                          status, connect_status = int(match[1]), int(match[2])
                          size, duration = float(match[3]), float(match[4])
                          if math.isfinite(size) and math.isfinite(duration):
                              record.update(status=status, connectStatus=connect_status, bytes=int(size), timeMs=round(duration * 1000, 3))
                      if len(body) > BODY_LIMIT:
                          fault = "body_limit"
                      if fault:
                          record["errorClass"] = fault
                      elif record["connectStatus"] is not None and record["connectStatus"] >= 400:
                          record["errorClass"] = "proxy_connect_http_error"
                      elif record["status"] is not None and record["status"] >= 500:
                          record["errorClass"] = "http_5xx"
                      elif record["status"] is not None and record["status"] >= 400:
                          record["errorClass"] = "http_4xx"
                      elif record["exit"] != 0:
                          record["errorClass"] = {
                              5: "proxy_resolution", 6: "host_resolution", 7: "connect_failure",
                              22: "http_failure", 23: "write_failure", 28: "curl_timeout",
                              35: "tls_failure", 56: "receive_failure", 60: "tls_verification", 63: "body_limit",
                          }.get(record["exit"], "curl_failure")
                      elif record["status"] == 206 and record["bytes"] == 1:
                          record["errorClass"] = "range_ok"
                      elif record["status"] in {301, 302, 303, 307, 308}:
                          record["errorClass"] = "redirect"
                      else:
                          record["errorClass"] = "unexpected_response"
                      with paths["headers"].open("rb") as headers:
                          location, decision = safe_location(headers.read(65537), record["status"])
                      record["redirectDecision"] = decision
                      if location is not None:
                          record["redirectHostname"] = urlsplit(location).hostname
                      # At most one direct hop; a subsequent redirect is never followed.
                      if phase == "direct-hop" and decision == "allowed":
                          record["redirectDecision"] = "not_followed"
                          location = None
                      if fault or record["exit"] != 0:
                          location = None
                      return record, location
              except Exception:
                  # Never print exception text: it could contain a signed Location/secret.
                  record["errorClass"] = "internal_error"
                  return record, None
              # TemporaryDirectory removes headers/body/stderr on normal and error paths.
          
          
          def main():
              asset_id = ASSETS.get(sys.platform)
              curl = shutil.which("curl")
              if asset_id is None or curl is None:
                  emit({"schema": 1, "errorClass": "unsupported_runner"})
                  return 1
              token = os.environ.get("GITHUB_TOKEN", "")
              api_url = f"https://api.github.com/repos/trycua/cua/releases/assets/{asset_id}"
              for mode in ("anonymous", "github-job-token"):
                  record, location = request(curl, asset_id, api_url, "api", mode, mode, token)
                  emit(record)
                  if location is not None:
                      record, _ = request(curl, asset_id, location, "direct-hop", "anonymous", mode, "")
                      emit(record)
              return 0
          
          
          if __name__ == "__main__":
              try:
                  result = main()
              except Exception:
                  emit({"schema": 1, "errorClass": "internal_error"})
                  result = 1
              raise SystemExit(result)
          PY
