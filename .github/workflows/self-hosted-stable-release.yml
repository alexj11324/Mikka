name: Publish self-hosted stable release
on:
  workflow_run:
    workflows: [CI, Self-hosted image]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: self-hosted-stable-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  publish:
    name: Promote accepted revision to stable
    if: ${{ github.repository == 'alexj11324/Mikka' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.event == 'push' && (github.event.workflow_run.head_branch == 'main' || startsWith(github.event.workflow_run.head_branch, 'v')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      actions: read
      contents: write
      packages: write
    outputs:
      tag: ${{ steps.promote.outputs.tag }}
      digest: ${{ steps.promote.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require a trusted commit reachable from main
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin main --tags
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          git checkout --detach "$SOURCE_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - id: promote
        name: Check source CI, image job, immutable digest and release identity
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: bash scripts/release/self-hosted-stable.sh
  accept-upgrade:
    name: Upgrade and recover a persisted install on the released digest
    needs: publish
    if: needs.publish.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Run persisted upgrade, rollback and forward recovery
        env:
          RELEASE_TAG: ${{ needs.publish.outputs.tag }}
          EXPECTED_RELEASE_DIGEST: ${{ needs.publish.outputs.digest }}
          MIKKA_EXPECTED_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/acceptance/self-hosted-stable-upgrade.mjs "$RELEASE_TAG"
      - name: Retain upgrade evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: self-hosted-upgrade-${{ needs.publish.outputs.tag }}
          path: .artifacts/self-hosted/upgrade.json
          if-no-files-found: error
