name: Issue 1503 GitHub source refresh and child rotation 5
on:
  push:
    branches: [ops/issue-1503-github-renew5-20261107]
    paths:
      - .github/workflows/issue1503-github-renew5.yml
      - scripts/ops/issue1503/**
      - scripts/ops/issue1503-smoke-github*
permissions:
  contents: read
concurrency:
  group: production-smoke-owner-acceptance
  cancel-in-progress: false
  queue: max
jobs:
  refresh_source_and_rotate_child:
    if: github.repository == 'alexj11324/Mikka' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@10.34.3 --activate && pnpm install --frozen-lockfile
      - uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /neon
          secret-name: DATABASE_URL
          recursive: false
          include-imports: false
      - uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /vercel
          secret-name: MIKKA_DATABASE_URL
          recursive: false
          include-imports: false
      - uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /vercel
          secret-name: BETTER_AUTH_SECRET
          recursive: false
          include-imports: false
      - uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /vercel
          secret-name: GITHUB_CLIENT_ID
          recursive: false
          include-imports: false
      - uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /vercel
          secret-name: GITHUB_CLIENT_SECRET
          recursive: false
          include-imports: false

      - name: Prepare the Owner source through normal expired-token renewal
        run: node --import ./tests/support/server-only.mjs --import tsx scripts/ops/issue1503/prepare-github-source.mjs
        env:
          NODE_ENV: production
          VERCEL_ENV: production
          BETTER_AUTH_URL: https://app.aspectlylabs.com
          NEXT_PUBLIC_APP_URL: https://app.aspectlylabs.com
      - name: Run the unchanged scoped-child rotation with the prepared source
        run: node --import ./tests/support/server-only.mjs --import tsx scripts/ops/issue1503/rotate-github-token.mjs
        env:
          NODE_ENV: production
          VERCEL_ENV: production
          BETTER_AUTH_URL: https://app.aspectlylabs.com
          NEXT_PUBLIC_APP_URL: https://app.aspectlylabs.com
      - name: Record the complete credential maintenance boundary
        if: always()
        run: node scripts/ops/issue1503/prepare-github-source.mjs --summary
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue1503-github-renew5
          path: issue1503-report
          retention-days: 3
