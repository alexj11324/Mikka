name: Cloudflare engineering sandbox
on:
  pull_request:
    paths: &runner_paths
      - 'cloudflare/engineering-sandbox/**'
      - 'scripts/engineering-sandbox.mjs'
      - '.github/workflows/engineering-sandbox.yml'
  push:
    branches: [main]
    paths: *runner_paths
  workflow_dispatch:
    inputs:
      issue:
        description: Owning Mikka issue number
        required: true
        type: number
      sha:
        description: Exact 40-character commit in alexj11324/Mikka
        required: true
        type: string
      workload:
        required: true
        type: choice
        options: [factory-handoff, startup-timing]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: node --test cloudflare/engineering-sandbox/jobs.test.mjs

  run:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    permissions:
      contents: read
      id-token: write
    env:
      ENGINEERING_SANDBOX_URL: ${{ vars.ENGINEERING_SANDBOX_URL }}
      ISSUE: ${{ inputs.issue }}
      SOURCE_SHA: ${{ inputs.sha }}
      WORKLOAD: ${{ inputs.workload }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Run immutable candidate in Cloudflare
        run: node scripts/engineering-sandbox.mjs run "$WORKLOAD" "$ISSUE" "$SOURCE_SHA"
      - name: Stop the scoped container on cancellation
        if: cancelled()
        run: node scripts/engineering-sandbox.mjs cancel "$WORKLOAD"
      - name: Preserve the version-bound receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: engineering-${{ inputs.workload }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/engineering-receipt.json
          retention-days: 7
          if-no-files-found: error
