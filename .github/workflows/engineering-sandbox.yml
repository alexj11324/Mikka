name: Cloudflare engineering sandbox
on:
  pull_request:
    paths: &runner_paths
      - 'cloudflare/engineering-sandbox/**'
      - 'scripts/engineering-sandbox.mjs'
      - '.github/workflows/engineering-sandbox.yml'
  push:
    branches: [main]
    paths: *runner_paths
  workflow_dispatch:
    inputs:
      issue:
        description: Owning Mikka issue number
        required: true
        type: number
      sha:
        description: Exact 40-character commit in alexj11324/Mikka
        required: true
        type: string
      workload:
        required: true
        type: choice
        options: [factory-handoff, startup-timing, postgres-policy]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: node --test cloudflare/engineering-sandbox/jobs.test.mjs

  postgres_image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build and verify the pinned engineering image using a real isolated PG17 cluster
        run: |
          docker build -t mikka-engineering-pg17 cloudflare/engineering-sandbox/postgres
          docker run --rm --network none --read-only --cap-drop ALL --security-opt=no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,mode=1777 --shm-size=128m \
            --mount "type=bind,src=$PWD/drizzle,dst=/workspace/drizzle,readonly" --workdir /workspace \
            mikka-engineering-pg17 node --test /opt/mikka-engineering/pg17.test.mjs

  deploy:
    if: github.repository == 'alexj11324/Mikka' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test, postgres_image]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: engineering-sandbox-release
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm ci --ignore-scripts --prefix cloudflare/engineering-sandbox
      - name: Require exact main source CI
        run: node scripts/release/ci-gate.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Read the existing Cloudflare deployment token
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: CLOUDFLARE_API_TOKEN
          include-imports: false
      - name: Read the existing Cloudflare account ID
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: CLOUDFLARE_ACCOUNT_ID
          include-imports: false
      - name: Deploy the engineering Worker and its Container
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/alexj11324/Mikka/commits/main --jq '.sha')" = "$GITHUB_SHA"
          pnpm exec wrangler deploy --config cloudflare/engineering-sandbox/wrangler.jsonc --message "$GITHUB_SHA"

  run:
    needs: [test, postgres_image, deploy]
    if: >-
      always() && github.repository == 'alexj11324/Mikka' && github.ref == 'refs/heads/main' &&
      needs.test.result == 'success' && needs.postgres_image.result == 'success' &&
      ((github.event_name == 'push' && needs.deploy.result == 'success') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 13
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        workload: ${{ fromJSON(github.event_name == 'push' && '["factory-handoff","startup-timing","postgres-policy"]' || format('["{0}"]', inputs.workload)) }}
    env:
      ISSUE: ${{ inputs.issue || 1948 }}
      SOURCE_SHA: ${{ inputs.sha || github.sha }}
      WORKLOAD: ${{ matrix.workload }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Run immutable candidate in Cloudflare
        run: node scripts/engineering-sandbox.mjs run "$WORKLOAD" "$ISSUE" "$SOURCE_SHA"
      - name: Stop the scoped container on cancellation
        if: cancelled()
        run: node scripts/engineering-sandbox.mjs cancel "$WORKLOAD"
      - name: Preserve the version-bound receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: engineering-${{ matrix.workload }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/engineering-receipt.json
          retention-days: 7
          if-no-files-found: error
