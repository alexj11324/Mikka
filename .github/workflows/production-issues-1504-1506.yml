name: Issues 1504 and 1506 production source inventory

# Branch-only, ordinary smoke login and read-only metadata. No task dispatch.
on:
  push:
    branches: [acceptance/issues-1504-1506]
    paths:
      - '.github/workflows/production-issues-1504-1506.yml'
      - 'scripts/acceptance/issue-1504-1506/**'

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-smoke-owner-acceptance
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'alexj11324/Mikka' && github.event_name == 'push' && github.ref == 'refs/heads/acceptance/issues-1504-1506'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Check the metadata clients
        run: |
          node --check scripts/acceptance/issue-1504-1506/production-session.mjs
          node --check scripts/acceptance/issue-1504-1506/workspace-subscriptions.mjs
      - name: Read the existing smoke email only
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          secret-name: SMOKE_OWNER_EMAIL
          recursive: false
          include-imports: false
      - name: Read the existing smoke password only
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          secret-name: SMOKE_OWNER_PASSWORD
          recursive: false
          include-imports: false
      - name: Read workspace subscription metadata and sign out
        run: node scripts/acceptance/issue-1504-1506/workspace-subscriptions.mjs
      - name: Retain the sanitized inventory result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-issues-1504-1506-${{ github.run_id }}
          path: issue-1504-1506-report/workspace-subscriptions.json
          if-no-files-found: ignore
          retention-days: 7
