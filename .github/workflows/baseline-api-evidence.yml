name: Original conversation baseline public API artifact
on:
  push:
    branches: [evidence/2254-sidebar-85dfc396]
    paths: [.github/workflows/baseline-api-evidence.yml]
permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'alexj11324/Mikka'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MIKKA_BUILD_REVISION: e53c7a6edf301324b4db64291ff8241bec3a5158
      MIKKA_TEST_DEPLOYMENT_SHA: e53c7a6edf301324b4db64291ff8241bec3a5158
      NITRO_PRESET: node-server
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Check out the fixed public product revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e53c7a6edf301324b4db64291ff8241bec3a5158
          persist-credentials: false
      - name: Verify source commit and tree
        run: |
          test "$(git rev-parse HEAD)" = "$MIKKA_BUILD_REVISION"
          test "$(git rev-parse 'HEAD^{tree}')" = 90a1b11a5427e9a6ea0a840e7e9ed47a081e8a61
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - name: Install the frozen public workspace dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile
      - name: Compile the public fixture frontend and production Nitro API
        run: |
          node apps/frontend/scripts/build.mjs --public-test-fixture
          node apps/api/scripts/build.mjs
      - name: Verify the built application and archive the public test backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/api-receipt"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import fs from 'node:fs'
          import path from 'node:path'
          const {readCompiledBuild}=await import('./scripts/start-app.mjs')
          const rev=process.env.MIKKA_BUILD_REVISION
          const build=await readCompiledBuild(process.cwd(),{expectedRevision:rev})
          assert.equal(build.revision,rev)
          assert.equal(build.preset,'node-server')
          assert.equal(build.basePath,'/mikka')
          assert.ok(build.resources.length>0)
          assert.ok(!fs.existsSync('.hosted-ui'))
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'api-receipt','source.json'),JSON.stringify({source:rev,tree:'90a1b11a5427e9a6ea0a840e7e9ed47a081e8a61',qualificationRun:process.env.GITHUB_RUN_ID,mode:'public-test-fixture',resources:build.resources.length},null,2)+'\n')
          JS
          tar -C .output -czf "$RUNNER_TEMP/api-receipt/public-api.tar.gz" .
          cd "$RUNNER_TEMP/api-receipt"
          sha256sum public-api.tar.gz source.json > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-api-2265-e53c7a6edf301324b4db64291ff8241bec3a5158
          path: ${{ runner.temp }}/api-receipt/
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
