name: Read-only private Coding Workspace build diagnosis
on:
  push:
    branches: [ops/self-hosted-vault-closeout-20261108]
permissions:
  contents: read
concurrency:
  group: coding-workspace-private-candidates
  cancel-in-progress: false
  queue: max
jobs:
  private_build_diagnostic:
    name: Read only the exact already-deleted Claude build
    if: github.repository == 'alexj11324/Mikka' && github.actor == 'alexj11324' && github.ref == 'refs/heads/ops/self-hosted-vault-closeout-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      P0_SOURCE: 37b0e55ddfca6646bc3beea7531048e6e63331c1
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 2
        with:
          repository: alexj11324/Mikka
          ref: 37b0e55ddfca6646bc3beea7531048e6e63331c1
          path: workspace-acceptance-source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        timeout-minutes: 1
        with:
          node-version: 24
      - name: Check fixed read-only request and closed-evidence boundaries
        timeout-minutes: 1
        run: node --test scripts/ops/workspace-private-acceptance.test.mjs
      - name: Verify the actual Ops subject and exact public source before credentials
        id: source
        timeout-minutes: 1
        run: node scripts/ops/workspace-private-acceptance.mjs diagnostic-check workspace-acceptance-source
      - name: Read only the existing E2B workload credential
        id: credential
        timeout-minutes: 1
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /vercel
          secret-name: E2B_API_KEY
          recursive: false
          include-imports: false
      - name: Read bounded debug pages for the exact historical build
        timeout-minutes: 2
        run: >-
          timeout --signal=TERM --kill-after=5s 100s
          node scripts/ops/workspace-private-acceptance.mjs diagnose workspace-acceptance-source
      - name: Retain only closed source and diagnostic evidence
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-workspace-build-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workspace-private-diagnostic/evidence/*.json
          retention-days: 14
          if-no-files-found: warn
