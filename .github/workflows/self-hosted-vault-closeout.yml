name: Self-hosted real vault closeout
on:
  push:
    branches: [ops/self-hosted-vault-closeout-20261108]
permissions:
  contents: read
concurrency:
  group: production-smoke-owner-acceptance
  cancel-in-progress: false
  queue: max
jobs:
  vault:
    if: github.repository == 'alexj11324/Mikka' && github.actor == 'alexj11324' && github.ref == 'refs/heads/ops/self-hosted-vault-closeout-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm-install
      - name: Verify exact published source and isolated fixture guards before credentials
        run: |
          node --import tsx --test scripts/ops/self-hosted-vault-closeout.test.mjs scripts/ops/vault-runtime-diagnostics.test.mjs
          node --import tsx scripts/ops/self-hosted-vault-closeout.mjs --check
      - name: Prepare immutable image and disposable infrastructure
        run: |
          docker pull ghcr.io/alexj11324/mikka@sha256:0972e911ae6020f95aaf9fb62ae499f0f6ec67fc63e737cec25334ad48784c51
          docker pull postgres:17-alpine
          docker pull axllent/mailpit:v1.27.4
          curl --fail --silent --show-error --location --max-time 60 https://github.com/cloudflare/cloudflared/releases/download/2026.10.7/cloudflared-linux-amd64 --output "$RUNNER_TEMP/cloudflared"
          node --input-type=module <<'JS'
          import { readFileSync, chmodSync } from 'node:fs'
          import { createHash } from 'node:crypto'
          import assert from 'node:assert/strict'
          const path = process.env.RUNNER_TEMP + '/cloudflared'
          assert.equal(createHash('sha256').update(readFileSync(path)).digest('hex'), '1f99fb518b83dec2ba8d870a7cc991d82a77e6196295a3d2754ba17ab9f91872')
          chmodSync(path, 0o700)
          JS
      - name: Read only the existing E2B workload credential
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /vercel
          secret-name: E2B_API_KEY
          recursive: false
          include-imports: false
      - name: Save a random login with local KMS and let the real owned Agent fill it
        timeout-minutes: 13
        run: timeout --signal=TERM --kill-after=3m 10m node --import tsx scripts/ops/self-hosted-vault-closeout.mjs
      - name: Retain only closed evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: self-hosted-vault-${{ github.run_id }}
          path: .artifacts/self-hosted-vault/report.json
          if-no-files-found: warn
          retention-days: 14
