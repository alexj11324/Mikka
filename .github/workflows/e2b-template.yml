name: E2B additive template candidates
# Reusable builder only. It cannot make a candidate public or change production.
on:
  workflow_call:
    outputs:
      source-sha:
        value: ${{ jobs.build.outputs.source-sha }}
      template-models-sha256:
        value: ${{ jobs.build.outputs.template-models-sha256 }}
      candidate-artifact-id:
        value: ${{ jobs.build.outputs.candidate-artifact-id }}
      candidate-sha256:
        value: ${{ jobs.build.outputs.candidate-sha256 }}
      candidate-identities:
        value: ${{ jobs.build.outputs.candidate-identities }}
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'alexj11324/Mikka' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    outputs:
      source-sha: ${{ steps.build.outputs.source-sha }}
      template-models-sha256: ${{ steps.build.outputs.template-models-sha256 }}
      candidate-artifact-id: ${{ steps.candidates.outputs.artifact-id }}
      candidate-sha256: ${{ steps.build.outputs.candidate-sha256 }}
      candidate-identities: ${{ steps.build.outputs.candidate-identities }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Refuse an obsolete source before building candidates
        run: node scripts/release/web-deploy.mjs main
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install the pinned E2B SDK
        run: |
          python3 -m venv "$RUNNER_TEMP/e2b"
          "$RUNNER_TEMP/e2b/bin/pip" install --disable-pip-version-check 'e2b==2.62.0'
      - name: Read the existing E2B build key
        id: e2b-key
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /vercel
          secret-name: E2B_API_KEY
          include-imports: false
      - name: Build private versioned candidates and require official file conservation
        id: build
        run: |
          name="mikka-${GITHUB_SHA::12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          "$RUNNER_TEMP/e2b/bin/python" scripts/e2b/build-template.py --name "$name" --source-ref "$GITHUB_SHA" --json > "$RUNNER_TEMP/candidates.json"
          node --input-type=module - "$RUNNER_TEMP/candidates.json" <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs'
          import { assertReportIdentity, cleanupIdentity, reportDigest, templateModelsDigest } from './scripts/e2b/runtime-report.mjs'
          const bytes = readFileSync(process.argv[2]), report = JSON.parse(bytes)
          const expected = { sourceCommit: process.env.GITHUB_SHA, workerSha: report.workerSha,
            runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT }
          assertReportIdentity(report, expected)
          for (const kind of ['desktop', 'claude', 'codex']) {
            const row = report.templates[kind], proof = row.conservation
            if (row.baseTemplate !== kind || row.preinstalled !== true || !row.buildId || !Array.isArray(row.models)
              || !proof?.before?.entries || JSON.stringify(proof.before) !== JSON.stringify(proof.after)) throw Error('Candidate preservation gate failed')
            console.log(`${kind}: ${proof.before.entries} preserved entries, manifest ${proof.before.sha256}`)
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `source-sha=${report.workerSha}\ntemplate-models-sha256=${templateModelsDigest(report)}\ncandidate-sha256=${reportDigest(bytes)}\ncandidate-identities=${cleanupIdentity(report, expected)}\n`)
          JS
      - name: Preserve the complete private candidate report
        id: candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2b-candidates-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidates.json
          if-no-files-found: error
          retention-days: 7
      - name: Close leftover probes and failed private builds
        if: always() && steps.e2b-key.outcome == 'success'
        run: |
          args=()
          if [ "$BUILD_OUTCOME" = success ]; then args+=(--report "$RUNNER_TEMP/candidates.json"); fi
          if [ "$BUILD_OUTCOME" = success ] && [ "$ARTIFACT_OUTCOME" = success ]; then args+=(--sandboxes-only); fi
          "$RUNNER_TEMP/e2b/bin/python" scripts/e2b/cleanup-template-candidates.py "${args[@]}" --output "$RUNNER_TEMP/build-cleanup.json"
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.candidates.outcome }}
      - name: Preserve candidate build cleanup receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2b-candidate-build-cleanup
          path: ${{ runner.temp }}/build-cleanup.json
          if-no-files-found: warn
          retention-days: 7
