name: E2B additive template candidates
# Reusable builder only. It cannot make a candidate public or change production.
on:
  workflow_call:
    outputs:
      source-sha:
        value: ${{ jobs.build.outputs.source-sha }}
      template-models:
        value: ${{ jobs.build.outputs.template-models }}
      candidate-report:
        value: ${{ jobs.build.outputs.candidate-report }}
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'alexj11324/Mikka' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    outputs:
      source-sha: ${{ steps.build.outputs.source-sha }}
      template-models: ${{ steps.build.outputs.template-models }}
      candidate-report: ${{ steps.build.outputs.candidate-report }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Refuse an obsolete source before building candidates
        run: node scripts/release/web-deploy.mjs main
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install the pinned E2B SDK
        run: |
          python3 -m venv "$RUNNER_TEMP/e2b"
          "$RUNNER_TEMP/e2b/bin/pip" install --disable-pip-version-check 'e2b==2.62.0'
      - name: Read the existing E2B build key
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /vercel
          secret-name: E2B_API_KEY
          include-imports: false
      - name: Build private versioned candidates and require official file conservation
        id: build
        run: |
          name="mikka-${GITHUB_SHA::12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          "$RUNNER_TEMP/e2b/bin/python" scripts/e2b/build-template.py --name "$name" --source-ref "$GITHUB_SHA" --json > "$RUNNER_TEMP/candidates.json"
          node --input-type=module - "$RUNNER_TEMP/candidates.json" <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs'
          const report = JSON.parse(readFileSync(process.argv[2], 'utf8'))
          if (report.sourceCommit !== process.env.GITHUB_SHA || !/^[a-f0-9]{40}$/.test(report.workerSha)) throw Error('Runtime source mismatch')
          const models = {}
          for (const kind of ['desktop', 'claude', 'codex']) {
            const row = report.templates[kind], proof = row.conservation
            if (row.baseTemplate !== kind || row.preinstalled !== true || !row.buildId || !Array.isArray(row.models)
              || !proof?.before?.entries || JSON.stringify(proof.before) !== JSON.stringify(proof.after)) throw Error('Candidate preservation gate failed')
            models[kind] = row.models
            console.log(`${kind}: ${proof.before.entries} preserved entries, manifest ${proof.before.sha256}`)
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `source-sha=${report.workerSha}\ntemplate-models=${JSON.stringify(models)}\ncandidate-report=${JSON.stringify(report)}\n`)
          JS
