name: Build marketing for Cloudflare
on:
  workflow_dispatch:
    inputs:
      marketing_source:
        description: Exact private website source commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: marketing-build
  cancel-in-progress: false
jobs:
  marketing:
    if: github.repository_id == '1427517699' && github.ref == 'refs/heads/main' && github.actor_id == '183887963' && github.triggering_actor == 'alexj11324'
    runs-on: ubuntu-latest
    environment: marketing-build
    timeout-minutes: 25
    env:
      MIKKA_MARKETING_SOURCE_SHA: ${{ inputs.marketing_source }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - name: Build and test the pinned website once
        run: node scripts/cloudflare-marketing-ci.mjs build
        env:
          MIKKA_MARKETING_READ_TOKEN: ${{ secrets.MIKKA_MARKETING_READ_TOKEN }}
      - name: Verify the compiled archive
        run: node scripts/cloudflare-marketing-ci.mjs verify
      - name: Store the compiled archive in the private website release
        run: node scripts/cloudflare-marketing-ci.mjs publish
        env:
          GH_TOKEN: ${{ secrets.MIKKA_MARKETING_RELEASE_TOKEN }}
      - name: Retain public build metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: marketing-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cloudflare-marketing/receipt.json
            .cloudflare-marketing/marketing-worker.sha256
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
