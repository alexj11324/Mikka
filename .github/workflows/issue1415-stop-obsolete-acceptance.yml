name: Issue 1415 stop obsolete automatic acceptance
on:
  push:
    branches: [ops/issue1415-stop-obsolete-acceptance]
permissions:
  contents: read
concurrency:
  group: issue1415-stop-obsolete-acceptance
  cancel-in-progress: false
jobs:
  cancel:
    if: github.repository == 'alexj11324/Mikka' && github.repository_owner_id == '183887963' && github.ref == 'refs/heads/ops/issue1415-stop-obsolete-acceptance'
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Cancel only the bound obsolete automatic run before credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ops/stop-obsolete-acceptance.mjs
      - name: Retain the closed cancellation result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue1415-stop-obsolete-acceptance-${{ github.run_id }}
          path: obsolete-acceptance-cancel-report/result.json
          retention-days: 14
          if-no-files-found: error
