name: Operation ledger PostgreSQL
on:
  push:
    branches: ['codex/208-operation-ledger', 'codex/208-calendar-integration']
  pull_request:
    paths: ['lib/operations/**', 'drizzle/*operation_ledger.sql', '.github/workflows/operation-ledger.yml']
permissions:
  contents: read
jobs:
  ledger:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: mikka_208_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d mikka_208_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/verify-operation-acceptance.test.mjs
      - run: node --import tsx --test lib/operations/ledger.test.ts lib/operations/session-authorization.test.ts
        env:
          OPERATION_DB_TESTS: '1'
          OPERATION_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/mikka_208_test

      - run: node --conditions=react-server --import tsx --test lib/operations/calendar-integration.test.ts lib/operations/calendar-provider.test.ts
        env:
          NODE_ENV: test
          OPERATION_DB_TESTS: '1'
          OPERATION_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/mikka_208_test
