name: Cloudflare API image
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      overlay_sha:
        description: Reviewed private UI commit SHA
        type: string
        required: true
permissions:
  contents: read
env:
  MIKKA_PRIVATE_GITHUB_OWNER: ${{ vars.MIKKA_PRIVATE_GITHUB_OWNER == 'aspectly-labs' && 'aspectly-labs' || 'alexj11324' }}
  MIKKA_HOSTED_UI_GITHUB_OWNER: ${{ vars.MIKKA_HOSTED_UI_GITHUB_OWNER }}
jobs:
  source:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify public API and runtime provenance without credentials
        run: node --test scripts/cloudflare-ci.test.mjs scripts/cloudflare-native-oci.test.mjs scripts/cloudflare-cloud-ci.test.mjs scripts/cloudflare-marketing-ci.test.mjs scripts/cloudflare-runtime-release.test.mjs scripts/cloudflare-registry-credentials.test.mjs scripts/load-cloudflare-api-receipt.test.mjs lib/deployment-id.test.mjs scripts/release/service-builds.test.mjs scripts/release/service-build-ci.test.mjs
  publish:
    permissions:
      contents: read
      id-token: write
    if: (github.repository_id == '1427517699' && (github.repository_owner_id == '183887963' || github.repository_owner_id == '359279274')) && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor_id == '183887963' && github.triggering_actor == 'alexj11324'
    runs-on: ubuntu-latest
    environment: cloudflare-runtime-release
    timeout-minutes: 30
    concurrency:
      group: cloudflare-api-registry-release
      cancel-in-progress: false
    env:
      OVERLAY_SHA: ${{ inputs.overlay_sha }}
      CLOUDFLARE_ACCOUNT_ID: d8f6630c7869111a5139bc5ed4d24ace
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Check out the source-bound official UI and install dependencies
        env:
          HOSTED_UI_READ_KEY: ${{ secrets.HOSTED_UI_READ_KEY }}
          # Read-only (contents: read); only api.github.com/meta sees it, never the build's child processes.
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/cloudflare-ci.mjs build
      - name: Compile and verify the API image offline
        env:
          API_PUBLIC_BUILD_SETTINGS: ${{ secrets.API_PUBLIC_BUILD_SETTINGS }}
          HOSTED_UI_READ_KEY: ${{ secrets.HOSTED_UI_READ_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/cloudflare-native-oci.mjs prepare
      - name: Issue a short-lived Registry publication credential
        id: registry
        uses: ./.github/actions/cloudflare-registry-credentials
        with:
          mode: publish
      - name: Verify the source checkout and publish the API image
        env:
          HOSTED_UI_READ_KEY: ${{ secrets.HOSTED_UI_READ_KEY }}
          CF_RUNTIME_REGISTRY_USERNAME: ${{ steps.registry.outputs.username }}
          CF_RUNTIME_REGISTRY_PASSWORD: ${{ steps.registry.outputs.password }}
        run: |
          node scripts/cloudflare-ci.mjs verify
          node scripts/cloudflare-native-oci.mjs publish
      - name: Upload the API OCI receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: api-image-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cloudflare-ci/api-image-receipt.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  service-plan:
    needs: source
    # The existing environment rejects refs/pull/*/merge, including owner PRs.
    # Keep that protection: PRs run the credential-free legacy image gates;
    # Registry publication starts only after a real merge into main.
    if: (github.repository_id == '1427517699' && (github.repository_owner_id == '183887963' || github.repository_owner_id == '359279274')) && ((github.actor_id == '183887963' && github.triggering_actor == 'alexj11324') || (github.actor_id == '118344674' && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || github.triggering_actor == 'alexj11324'))) && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: cloudflare-runtime-release
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      changed: ${{ steps.plan.outputs.changed }}
      litellm_reused: ${{ steps.plan.outputs.litellm_reused }}
      overlay: ${{ steps.selection.outputs.overlay }}
      plan-artifact: ${{ steps.plan-artifact.outputs.artifact-id }}
    env:
      CLOUDFLARE_ACCOUNT_ID: d8f6630c7869111a5139bc5ed4d24ace
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Select the source App before credential access
        id: source-app
        env:
          SOURCE_OWNER: ${{ vars.MIKKA_PRIVATE_GITHUB_OWNER || 'alexj11324' }}
          ORG_SECRET_PATH: ${{ vars.MIKKA_ORG_GITHUB_SECRET_PATH }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs'
          const owner = process.env.SOURCE_OWNER
          if (!['alexj11324', 'aspectly-labs'].includes(owner)) throw Error('CI_SOURCE_APP_OWNER_REQUIRED')
          const path = owner === 'aspectly-labs' ? process.env.ORG_SECRET_PATH?.trim() : '/github'
          if (!path || /[\r\n]/.test(path)) throw Error('CI_SOURCE_APP_SECRET_PATH_REQUIRED')
          appendFileSync(process.env.GITHUB_OUTPUT, `owner=${owner}\nsecret-path=${path}\napp-id=${owner === 'aspectly-labs' ? '5853576' : '4840908'}\n`)
          JS
      - name: Read the existing source App id
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: ${{ steps.source-app.outputs.secret-path }}
          secret-name: GITHUB_APP_ID
          recursive: false
          include-imports: false
      - name: Read the existing source App private key
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: ${{ steps.source-app.outputs.secret-path }}
          secret-name: GITHUB_APP_PRIVATE_KEY
          recursive: false
          include-imports: false
      - name: Verify the selected source App
        env:
          EXPECTED_SOURCE_APP_ID: ${{ steps.source-app.outputs.app-id }}
        run: node -e 'if (!process.env.EXPECTED_SOURCE_APP_ID || process.env.GITHUB_APP_ID !== process.env.EXPECTED_SOURCE_APP_ID) throw Error("CI_SOURCE_APP_ID_MISMATCH")'
      - name: Read the approved release input
        id: source-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ env.GITHUB_APP_ID }}
          private-key: ${{ env.GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ vars.MIKKA_PRIVATE_GITHUB_OWNER == 'aspectly-labs' && 'aspectly-labs' || 'alexj11324' }}
          repositories: mikka-cloud
          permission-contents: read
      - name: Remove App credentials
        run: |
          echo 'GITHUB_APP_ID=' >> "$GITHUB_ENV"
          echo 'GITHUB_APP_PRIVATE_KEY=' >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ format('{0}/mikka-cloud', vars.MIKKA_PRIVATE_GITHUB_OWNER == 'aspectly-labs' && 'aspectly-labs' || 'alexj11324') }}
          ref: main
          token: ${{ steps.source-token.outputs.token }}
          path: .operations-input
          persist-credentials: false
      - name: Read the independent approved build input from the fixed operations checkout
        id: selection
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import {readFile,appendFile} from 'node:fs/promises'
          import {execFileSync} from 'node:child_process'
          try {
            const operations = execFileSync('git',['-C','.operations-input','rev-parse','HEAD'],{encoding:'utf8'}).trim()
            assert.match(operations,/^[a-f0-9]{40}$/)
            const selected = JSON.parse(await readFile('.operations-input/docs/operations/releases/deploy-build-inputs.json','utf8'))
            assert.ok(selected && typeof selected === 'object' && !Array.isArray(selected))
            assert.deepEqual(Object.keys(selected).sort(),['overlaySource','version'])
            assert.equal(selected.version,1)
            assert.match(selected.overlaySource,/^[a-f0-9]{40}$/)
            await appendFile(process.env.GITHUB_OUTPUT,'overlay='+selected.overlaySource+'\n')
          } catch {
            console.error('APPROVED_BUILD_SELECTION_UNAVAILABLE')
            process.exitCode = 1
          }
          JS
      - name: Read existing content tags with a short-lived pull credential
        id: registry-read
        uses: ./.github/actions/cloudflare-registry-credentials
        with:
          mode: read
      - name: Plan service builds by content
        id: plan
        env:
          OVERLAY_SHA: ${{ steps.selection.outputs.overlay }}
          API_PUBLIC_BUILD_SETTINGS: ${{ secrets.API_PUBLIC_BUILD_SETTINGS }}
          CF_RUNTIME_REGISTRY_USERNAME: ${{ steps.registry-read.outputs.username }}
          CF_RUNTIME_REGISTRY_PASSWORD: ${{ steps.registry-read.outputs.password }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/service-build-ci.mjs plan "$RUNNER_TEMP/service-build-plan"
      - name: Upload the service build plan
        id: plan-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: service-build-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/service-build-plan/
          if-no-files-found: error
          retention-days: 90

  service-build:
    needs: service-plan
    if: needs.service-plan.outputs.changed == 'true'
    name: service-build (${{ matrix.service }})
    runs-on: ubuntu-latest
    environment: cloudflare-runtime-release
    timeout-minutes: ${{ matrix.service == 'eve' && 60 || (matrix.service == 'api' || matrix.service == 'web') && 30 || 20 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.service-plan.outputs.matrix) }}
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      CLOUDFLARE_ACCOUNT_ID: d8f6630c7869111a5139bc5ed4d24ace
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.3
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.service-plan.outputs.plan-artifact }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/service-build-plan
      - name: Build and verify service
        env:
          HOSTED_UI_READ_KEY: ${{ (matrix.service == 'api' || matrix.service == 'web') && secrets.HOSTED_UI_READ_KEY || '' }}
          API_PUBLIC_BUILD_SETTINGS: ${{ secrets.API_PUBLIC_BUILD_SETTINGS }}
          BUILD_SERVICE: ${{ matrix.service }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/service-build-ci.mjs build "$BUILD_SERVICE" "$RUNNER_TEMP/service-build-plan/build-plan.json" "$RUNNER_TEMP/service-output"
      - name: Issue a short-lived Registry publication credential
        if: matrix.service != 'web' && matrix.service != 'world'
        id: registry
        uses: ./.github/actions/cloudflare-registry-credentials
        with:
          mode: publish
      - name: Publish immutable service image
        env:
          CF_RUNTIME_REGISTRY_USERNAME: ${{ steps.registry.outputs.username }}
          CF_RUNTIME_REGISTRY_PASSWORD: ${{ steps.registry.outputs.password }}
        run: node scripts/release/service-build-ci.mjs publish "$RUNNER_TEMP/service-output"
      - name: Upload service artifact
        id: service-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: service-${{ matrix.service }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/service-output/
          if-no-files-found: error
          retention-days: 90

      - name: Record immutable service receipt
        id: receipt
        env:
          SERVICE_ARTIFACT_ID: ${{ steps.service-artifact.outputs.artifact-id }}
        run: node scripts/release/service-build-ci.mjs record-cache "$RUNNER_TEMP/service-output" "$RUNNER_TEMP/service-cache" "$SERVICE_ARTIFACT_ID"
      - name: Upload service cache receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.receipt.outputs.cache_name }}
          path: ${{ runner.temp }}/service-cache/service-receipt.json
          if-no-files-found: error
          # Only this discovery pointer is replaceable on a retry of the same
          # run. Original service artifacts remain immutable per run/attempt.
          overwrite: true
          retention-days: 90

  litellm-qualification:
    needs: service-plan
    if: needs.service-plan.outputs.litellm_reused == 'true'
    runs-on: ubuntu-latest
    environment: cloudflare-runtime-release
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.service-plan.outputs.plan-artifact }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/service-build-plan
      - name: Read the immutable image with a short-lived pull credential
        id: registry
        uses: ./.github/actions/cloudflare-registry-credentials
        with:
          mode: read
      - name: Pull and verify the cached platform image
        env:
          CF_RUNTIME_REGISTRY_USERNAME: ${{ steps.registry.outputs.username }}
          CF_RUNTIME_REGISTRY_PASSWORD: ${{ steps.registry.outputs.password }}
        run: node scripts/release/service-build-ci.mjs qualify-pull "$RUNNER_TEMP/service-build-plan"
      - name: Prove both CLI protocols through the cached proxy
        run: node scripts/release/service-build-ci.mjs qualify "$RUNNER_TEMP/service-build-plan"

  release-manifest:
    needs: [service-plan, service-build, litellm-qualification]
    if: always() && needs.service-plan.result == 'success' && (needs.service-build.result == 'success' || needs.service-plan.outputs.changed == 'false') && (needs.litellm-qualification.result == 'success' || needs.service-plan.outputs.litellm_reused == 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.service-plan.outputs.plan-artifact }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/service-build-plan
      - name: Restore verified service artifacts
        if: needs.service-plan.outputs.changed == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          # A failed-job retry retains successful matrix jobs from their original
          # attempts. The manifest verifies each job and preserves that origin.
          pattern: service-{web,api,eve,task,world,litellm}-${{ github.run_id }}-*
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: ${{ runner.temp }}/service-results
      - name: Verify every service and write the immutable manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/service-results" "$RUNNER_TEMP/service-release"
          node scripts/release/service-build-ci.mjs finish "$RUNNER_TEMP/service-build-plan" "$RUNNER_TEMP/service-results" "$RUNNER_TEMP/service-release/release-manifest.json"
      - name: Upload release manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/service-release/release-manifest.json
          if-no-files-found: error
          retention-days: 90
