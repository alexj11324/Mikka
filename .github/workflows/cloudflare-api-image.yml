name: Cloudflare API image
on:
  pull_request:
    paths:
      - '.github/workflows/cloudflare-api-image.yml'
      - '.github/workflows/cloud-services-ci.yml'
      - 'scripts/cloudflare-ci*'
      - 'scripts/cloudflare-cloud-ci*'
      - 'scripts/cloudflare-native-oci*'
      - 'scripts/cloudflare-runtime-release*'
      - 'scripts/load-cloudflare-api-receipt*'
      - 'lib/deployment-id.mjs'
  workflow_dispatch:
    inputs:
      overlay_sha:
        description: Reviewed private UI commit SHA
        type: string
        required: true
permissions:
  contents: read
jobs:
  source:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify public API and runtime provenance without credentials
        run: node --test scripts/cloudflare-ci.test.mjs scripts/cloudflare-native-oci.test.mjs scripts/cloudflare-cloud-ci.test.mjs scripts/cloudflare-runtime-release.test.mjs scripts/load-cloudflare-api-receipt.test.mjs lib/deployment-id.test.mjs
  publish:
    if: github.repository == 'alexj11324/Mikka' && github.repository_id == '1427517699' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor_id == '183887963' && github.triggering_actor == 'alexj11324'
    runs-on: ubuntu-latest
    environment: cloudflare-runtime-release
    timeout-minutes: 30
    concurrency:
      group: cloudflare-api-registry-release
      cancel-in-progress: false
    env:
      OVERLAY_SHA: ${{ inputs.overlay_sha }}
      CLOUDFLARE_ACCOUNT_ID: d8f6630c7869111a5139bc5ed4d24ace
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Check out the source-bound official UI and install dependencies
        env:
          HOSTED_UI_READ_KEY: ${{ secrets.HOSTED_UI_READ_KEY }}
        run: node scripts/cloudflare-ci.mjs build
      - name: Compile and verify the API image offline
        env:
          API_PUBLIC_BUILD_SETTINGS: ${{ secrets.API_PUBLIC_BUILD_SETTINGS }}
          HOSTED_UI_READ_KEY: ${{ secrets.HOSTED_UI_READ_KEY }}
        run: node scripts/cloudflare-native-oci.mjs prepare
      - name: Verify the source checkout and publish the API image
        env:
          HOSTED_UI_READ_KEY: ${{ secrets.HOSTED_UI_READ_KEY }}
          CF_RUNTIME_REGISTRY_USERNAME: ${{ vars.CF_RUNTIME_REGISTRY_USERNAME }}
          CF_RUNTIME_REGISTRY_PASSWORD: ${{ secrets.CF_RUNTIME_REGISTRY_PASSWORD }}
        run: |
          node scripts/cloudflare-ci.mjs verify
          node scripts/cloudflare-native-oci.mjs publish
      - name: Upload the API OCI receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: api-image-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cloudflare-ci/api-image-receipt.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
