name: Cloudflare Eve image
on:
  workflow_dispatch:
    inputs:
      api_run_id:
        description: Accepted API publication run ID
        type: string
        required: true
      api_run_attempt:
        description: Accepted API publication run attempt
        type: string
        required: true
      api_image_digest:
        description: Accepted API image digest
        type: string
        required: true
      overlay_sha:
        description: Accepted UI Overlay commit SHA
        type: string
        required: true
      maintenance_owner_release:
        description: Existing Eve owner routing release to maintain with this accepted API build
        type: string
        required: false
  pull_request:
    paths:
      - 'apps/eve/**'
      - 'lib/eve/**'
      - 'packages/eve-cloudflare-world/**'
      - 'cloudflare/eve-runtime/**'
      - 'scripts/build-eve.mjs'
      - 'scripts/package-cf-eve-host.mjs'
      - 'scripts/build-cloudflare-eve-image.sh'
      - 'scripts/compile-cloudflare-eve-host.sh'
      - 'patches/@fantasticfour*'
      - 'pnpm-lock.yaml'
      - '.github/workflows/cloudflare-eve-image.yml'
  push:
    branches: [main]
    paths:
      - 'apps/eve/**'
      - 'lib/eve/**'
      - 'packages/eve-cloudflare-world/**'
      - 'cloudflare/eve-runtime/**'
      - 'scripts/build-eve.mjs'
      - 'scripts/package-cf-eve-host.mjs'
      - 'scripts/build-cloudflare-eve-image.sh'
      - 'scripts/compile-cloudflare-eve-host.sh'
      - 'patches/@fantasticfour*'
      - 'pnpm-lock.yaml'
      - '.github/workflows/cloudflare-eve-image.yml'
permissions:
  contents: read
jobs:
  image:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NITRO_PRESET: node-server
      WORKFLOW_TARGET_WORLD: '@workflow/world-postgres'
      NODE_OPTIONS: --max-old-space-size=6144
      MIKKA_BUILD_REVISION: ${{ github.sha }}
      # Ordinary qualification builds the public server resources.
      # Manual publication restores resources from the accepted official API image.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm-install
        with:
          skip-electron: 'true'
      - name: Bind the existing release format
        run: echo "MIKKA_DEPLOYMENT_ID=$(node lib/deployment-id.mjs)" >> "$GITHUB_ENV"
      # The business API publisher consumes this existing World artifact.
      - name: Bundle the private World authority from the locked public source
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          world="$RUNNER_TEMP/eve-world"
          pnpm exec wrangler deploy --dry-run --config packages/eve-cloudflare-world/wrangler.jsonc --outdir "$world"
          artifact="$RUNNER_TEMP/eve-world-artifact"
          mkdir -p "$artifact/modules"
          cp -a "$world/." "$artifact/modules/"
          rm -f "$artifact/modules/README.md"
          cd "$artifact"
          find modules -type f -print -quit | grep -q .
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD > source.txt
          find modules -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum source.txt >> SHA256SUMS
          sha256sum --check --status SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eve-world-authority-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/eve-world-artifact/
          if-no-files-found: error
          retention-days: 1
      - name: Compile the official Eve runtime and shared product resources offline
        run: bash scripts/build-cloudflare-eve-image.sh
      - name: Build the portable Node 24 image
        run: docker build -f cloudflare/eve-runtime/Dockerfile -t mikka-eve-qualification .
  publish:
    permissions:
      contents: read
      actions: read
      id-token: write
    if: github.repository == 'alexj11324/Mikka' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor_id == '183887963' && github.triggering_actor == 'alexj11324'
    runs-on: ubuntu-latest
    environment: cloudflare-runtime-release
    timeout-minutes: 60
    env:
      NITRO_PRESET: node-server
      WORKFLOW_TARGET_WORLD: '@workflow/world-postgres'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Read the verified original public API build receipt
        id: api
        env:
          GH_TOKEN: ${{ github.token }}
          API_RUN_ID: ${{ inputs.api_run_id }}
          API_RUN_ATTEMPT: ${{ inputs.api_run_attempt }}
          API_IMAGE_DIGEST: ${{ inputs.api_image_digest }}
          OVERLAY_SHA: ${{ inputs.overlay_sha }}
        run: node scripts/load-cloudflare-api-receipt.mjs
      - name: Check out the original API product source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.api.outputs.source }}
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/pnpm-install
        with:
          skip-electron: 'true'
      - name: Issue a short-lived credential to read the original API image
        id: registry-read
        uses: ./.github/actions/cloudflare-registry-credentials
        with:
          mode: read
      - name: Prepare the source-bound runtime release
        env:
          MAINTENANCE_OWNER_RELEASE: ${{ inputs.maintenance_owner_release }}
          API_RUN_ID: ${{ inputs.api_run_id }}
          API_RUN_ATTEMPT: ${{ inputs.api_run_attempt }}
          API_IMAGE_DIGEST: ${{ inputs.api_image_digest }}
          OVERLAY_SHA: ${{ inputs.overlay_sha }}
          CF_RUNTIME_REGISTRY_USERNAME: ${{ steps.registry-read.outputs.username }}
          CF_RUNTIME_REGISTRY_PASSWORD: ${{ steps.registry-read.outputs.password }}
        run: node scripts/cloudflare-runtime-release.mjs prepare eve
      - name: Verify the explicit maintenance owner selection
        if: inputs.maintenance_owner_release != ''
        env:
          MAINTENANCE_OWNER_RELEASE: ${{ inputs.maintenance_owner_release }}
        run: |
          test "$MIKKA_RUNTIME_RELEASE" = "$MAINTENANCE_OWNER_RELEASE"
          test "$RUNTIME_IMAGE_TAG" = "$MIKKA_DEPLOYMENT_ID-maintenance-$MAINTENANCE_OWNER_RELEASE"
      # The business API publisher consumes this existing World artifact.
      - name: Bundle the private World authority from the locked public source
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          world="$RUNNER_TEMP/eve-world"
          pnpm exec wrangler deploy --dry-run --config packages/eve-cloudflare-world/wrangler.jsonc --outdir "$world"
          artifact="$RUNNER_TEMP/eve-world-artifact"
          mkdir -p "$artifact/modules"
          cp -a "$world/." "$artifact/modules/"
          rm -f "$artifact/modules/README.md"
          cd "$artifact"
          find modules -type f -print -quit | grep -q .
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD > source.txt
          find modules -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum source.txt >> SHA256SUMS
          sha256sum --check --status SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eve-world-authority-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/eve-world-artifact/
          if-no-files-found: error
          retention-days: 1
      - name: Compile the official Eve runtime and shared product resources offline
        run: bash scripts/build-cloudflare-eve-image.sh --prebuilt-api
      - name: Build the portable Node 24 image
        run: |
          image_tag="${RUNTIME_IMAGE_TAG:-$MIKKA_DEPLOYMENT_ID}"
          labels=()
          if [[ -n "${MIKKA_RUNTIME_RELEASE:-}" ]]; then
            labels+=(--label "com.mikka.runtime-release=$MIKKA_RUNTIME_RELEASE")
          fi
          docker build -f cloudflare/eve-runtime/Dockerfile --label "org.opencontainers.image.revision=$MIKKA_BUILD_REVISION" --label "com.mikka.overlay=$MIKKA_UI_OVERLAY_SHA" --label "com.mikka.release=$MIKKA_DEPLOYMENT_ID" "${labels[@]}" -t "mikka-eve:$image_tag" .
          image_id=$(docker image inspect --format '{{.Id}}' "mikka-eve:$image_tag")
          echo "RUNTIME_TESTED_IMAGE_ID=$image_id" >> "$GITHUB_ENV"
      - name: Issue a short-lived Registry publication credential
        id: registry
        uses: ./.github/actions/cloudflare-registry-credentials
        with:
          mode: publish
      - name: Publish the verified runtime image
        env:
          MAINTENANCE_OWNER_RELEASE: ${{ inputs.maintenance_owner_release }}
          API_RUN_ID: ${{ inputs.api_run_id }}
          API_RUN_ATTEMPT: ${{ inputs.api_run_attempt }}
          API_IMAGE_DIGEST: ${{ inputs.api_image_digest }}
          OVERLAY_SHA: ${{ inputs.overlay_sha }}
          CF_RUNTIME_REGISTRY_USERNAME: ${{ steps.registry.outputs.username }}
          CF_RUNTIME_REGISTRY_PASSWORD: ${{ steps.registry.outputs.password }}
        run: |
          printf '%s' "$CF_RUNTIME_REGISTRY_PASSWORD" | docker login registry.cloudflare.com --username "$CF_RUNTIME_REGISTRY_USERNAME" --password-stdin > /dev/null
          node scripts/cloudflare-runtime-release.mjs publish eve
      - name: Upload the runtime OCI receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-eve-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-eve-receipt.json
          if-no-files-found: error
          retention-days: 1
      - name: Remove the temporary Registry credentials
        if: always()
        run: node scripts/cloudflare-runtime-release.mjs cleanup
