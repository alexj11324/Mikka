name: E 2257 scoped community system-browser entry on original QA runner
on:
  push:
    branches: [evidence/2254-sidebar-85dfc396]
    paths:
      - .github/workflows/e-2257-full-daemon.yml
      - evidence/2257/browser-entry/**
permissions:
  contents: read
jobs:
  review:
    if: github.repository == 'alexj11324/Mikka'
    runs-on: ubuntu-latest
    timeout-minutes: 43
    env:
      PUBLIC_SOURCE: e34ac0ebdfb19f096b887c99286a81065a4dda20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: review
          persist-credentials: false
          sparse-checkout: |
            evidence/2257/full-daemon
            evidence/2257/browser-entry
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 46d60aa6802ef48600fbe2fa3d48015b14f6d50b
          path: original
          persist-credentials: false
          sparse-checkout: evidence/2257/local-provider
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e34ac0ebdfb19f096b887c99286a81065a4dda20
          path: product
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0f109ccec64515a7196d81eed656a29c9f0c75c9
          path: original-review
          persist-credentials: false
          sparse-checkout: evidence/2271/current-review
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - name: Prepare pinned public components
        shell: bash
        run: |
          set -euo pipefail
          base=$(mktemp -d /tmp/mikka-desktop-delivery.XXXXXXXX)
          echo "CASE_BASE=$base" >> "$GITHUB_ENV"
          bash review/evidence/2257/browser-entry/prepare.sh "$GITHUB_WORKSPACE" "$base"
          echo "$PUBLIC_SOURCE" > "$base/source.sha"
          if [ ! -x /usr/lib/postgresql/17/bin/initdb ]; then
            . /etc/os-release
            curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o "$RUNNER_TEMP/pgdg.asc"
            test "$(gpg --show-keys --with-colons "$RUNNER_TEMP/pgdg.asc" | awk -F: '/^fpr:/ {print $10;exit}')" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
            sudo install -m 0644 "$RUNNER_TEMP/pgdg.asc" /usr/share/keyrings/pgdg-evidence.asc
            echo "deb [signed-by=/usr/share/keyrings/pgdg-evidence.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg-evidence.list >/dev/null
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends postgresql-17
          fi
      - name: Verify real system browser and ordinary isolated loopback login
        shell: bash
        run: |
          set -euo pipefail
          base=$CASE_BASE
          sudo env -i PATH="$PATH" HOME="$HOME" USER="$(id -un)" LANG=C.UTF-8 GITHUB_WORKSPACE="$GITHUB_WORKSPACE" RUNNER_TEMP="$RUNNER_TEMP" E_MODEL_QA_DIR="$base/model-state" E_MODEL_HOME="$base/model-state/home" E_GATE_QA_DIR="$base/run/case" E_DEVICE_DATA_DIR="$base/device" E_DEVICE_GIT_CONFIG="$base/device/gitconfig" E_DEVICE_TRUST="$base/device/ca.pem" E_MODEL_LAUNCH="$base/bin/model-launch" E_DEVICE_LAUNCH="$base/bin/device-launch" E_ISOLATE_RUNTIME_PREPARE="$base/bin/runtime-prepare" MIKKA_TEST_DEPLOYMENT_SHA="$PUBLIC_SOURCE" unshare --net bash -euc '
            ip link set lo up
            test -z "$(ip route show default)"
            for worker in mikka-e-model mikka-e-device; do
              uid=$(id -u "$worker")
              for filter in iptables ip6tables; do
                "$filter" -A OUTPUT -m owner --uid-owner "$uid" -m conntrack --ctstate ESTABLISHED -j ACCEPT
                if [[ "$filter" == iptables && "$worker" == mikka-e-device ]]; then
                  "$filter" -A OUTPUT -m owner --uid-owner "$uid" -p tcp -d 127.0.0.1 --dport 3859 -j ACCEPT
                fi
                "$filter" -A OUTPUT -m owner --uid-owner "$uid" -j REJECT
              done
            done
            exec setpriv --reuid="$1" --regid="$2" --init-groups bash "$GITHUB_WORKSPACE/review/evidence/2257/browser-entry/execute.sh" "$3"
          ' isolate "$(id -u)" "$(id -g)" "$base"
      - name: Retain only enumerated diagnostic codes and registration phases
        if: always() && env.CASE_BASE != ''
        run: python3 review/evidence/2257/browser-entry/classify.py "$CASE_BASE" | tee public-receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && env.CASE_BASE != ''
        with:
          name: e2257-community-system-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: public-receipt.json
          if-no-files-found: error
