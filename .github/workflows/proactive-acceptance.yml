name: Temporary existing test-vault project metadata check
on:
  push:
    branches: [acceptance/proactive-1157-1163]
    paths:
      - '.github/workflows/proactive-acceptance.yml'
      - 'scripts/ops/vault-project-discovery.mjs'
permissions:
  contents: read
concurrency:
  group: proactive-vault-project-metadata
  cancel-in-progress: false
jobs:
  metadata:
    if: github.repository == 'alexj11324/Mikka' && github.ref == 'refs/heads/acceptance/proactive-1157-1163'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: List only projects already visible to the existing identity
        run: node scripts/ops/vault-project-discovery.mjs
      - name: Preserve sanitized metadata result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-vault-project-metadata-${{ github.run_id }}
          path: vault-project-metadata/results.json
          if-no-files-found: error
          retention-days: 7
