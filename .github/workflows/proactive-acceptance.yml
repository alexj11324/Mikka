name: Proactive production acceptance
on:
  push:
    branches: [acceptance/proactive-1157-1163]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: proactive-production-acceptance
  cancel-in-progress: false
jobs:
  account-preflight:
    if: github.repository == 'alexj11324/Mikka'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Read existing test credentials through the existing workload identity
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          recursive: false
          include-imports: false
      - name: Read the existing development test model configuration
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: dev
          secret-path: /vercel
          recursive: false
          include-imports: false
      - name: Read the existing cloud runtime test configuration
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /vercel
          recursive: false
          include-imports: false
      - name: Verify temporary Flash credential cleanup guards
        run: node --test scripts/ops/proactive-test-credentials.test.mjs
      - name: Verify normal Settings setup, Flash availability and cleanup
        run: node scripts/ops/proactive-flash-preflight.mjs
        env:
          PROACTIVE_EXPECT_FLASH: '1'
