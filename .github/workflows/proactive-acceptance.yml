name: Temporary fixed group Factory diagnostic
on:
  push:
    branches: [acceptance/proactive-1157-1163]
    paths:
      - '.github/workflows/proactive-acceptance.yml'
      - 'scripts/ops/group-factory-diagnostic.mjs'
permissions:
  contents: read
concurrency:
  group: proactive-group-factory-diagnostic-once
  cancel-in-progress: false
jobs:
  diagnostic:
    if: github.repository == 'alexj11324/Mikka' && github.ref == 'refs/heads/acceptance/proactive-1157-1163' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: source
    env:
      DIAGNOSTIC_SOURCE_SHA: 7b6c1ee1b4a53563b2d6d9885ad992858514cd7a
      DIAGNOSTIC_OUTPUT: ${{ github.workspace }}/group-factory-diagnostic/results.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: driver
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.DIAGNOSTIC_SOURCE_SHA }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Install exact-source pg dependency before reading any secret
        run: npm exec --yes --package pnpm@10.34.3 -- pnpm install --frozen-lockfile --filter '!@mikka/mobile' --ignore-scripts
      - name: Read only the existing named production connection
        id: connection
        continue-on-error: true
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /vercel
          secret-name: MIKKA_DATABASE_URL
          recursive: false
          include-imports: false
      - name: Observe exact failed group scope in one read-only transaction
        timeout-minutes: 3
        env:
          DIAGNOSTIC_SECRET_READ: ${{ steps.connection.outcome }}
        run: node ../driver/scripts/ops/group-factory-diagnostic.mjs
      - name: Upload sanitized bounded observation only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: group-factory-diagnostic-${{ github.run_id }}
          path: group-factory-diagnostic/results.json
          if-no-files-found: error
          retention-days: 7

