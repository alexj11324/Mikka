name: E2B provider CA control

# Official-only measurement backing the conservation policy for E2B's hashed
# provider CA files. Runs once per push of this file or its script on the
# control branch; builds no Mikka runtime and publishes nothing.
on:
  push:
    branches: [claude/sweet-lovelace-yjn2jy]
    paths:
      - .github/workflows/e2b-ca-control.yml
      - scripts/ops/e2b-ca-control.py

permissions:
  contents: read
  id-token: write

concurrency:
  group: e2b-ca-control
  cancel-in-progress: false

jobs:
  observe:
    if: github.repository == 'alexj11324/Mikka' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install only the pinned control SDK
        run: |
          python3 -m venv "$RUNNER_TEMP/ca-control-sdk"
          "$RUNNER_TEMP/ca-control-sdk/bin/pip" install --disable-pip-version-check 'e2b==2.62.0'
      - name: Read only the existing E2B key
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /vercel
          secret-name: E2B_API_KEY
          include-imports: false
      - name: Observe provider CA metadata on the official bases
        run: '"$RUNNER_TEMP/ca-control-sdk/bin/python" -B scripts/ops/e2b-ca-control.py "$RUNNER_TEMP/e2b-ca-control"'
      - name: Preserve the metadata observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2b-ca-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2b-ca-control/
          if-no-files-found: warn
          retention-days: 90
