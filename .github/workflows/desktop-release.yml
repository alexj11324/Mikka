name: Desktop release

# Publishes signed, notarized Apple Silicon installers for every main push.
# Versions use a fixed epoch above earlier calendar versions and the workflow
# run number: 2026.10000.<run_number>. Retries keep the version and built commit.
# Manual builds that skip notarization remain drafts.
#
# Required repository secrets for macOS:
#   APPLE_DEVELOPER_ID_P12_BASE64  Developer ID Application certificate (base64)
#   APPLE_DEVELOPER_ID_P12_PASSWORD
# Notarization (required for a public macOS release), one of:
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   APPLE_API_KEY_P8_BASE64, APPLE_API_KEY_ID, APPLE_API_ISSUER

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_notarization:
        description: Build macOS without notarization (internal testing only)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false
  queue: max

env:
  # A cache restore that fails (e.g. the account's cache egress limit) would
  # otherwise hang for actions/cache's 10-minute default before falling back
  # to a normal install, which outlasts the short jobs' own timeouts.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
  NODE_VERSION: '24'
  PNPM_VERSION: '10.34.3'

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require main
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "::error::Dispatch this workflow from main, not from a tag or branch. Actions caches are scoped per ref; a tag run cannot reuse the previous release's cache."
            exit 1
          }
      - name: Version from workflow run
        id: version
        run: |
          # The epoch sorts after earlier YYYY.MMDD.HHMM versions; retries reuse the run number.
          version="2026.10000.${GITHUB_RUN_NUMBER}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building Mikka Desktop $version"

  macos:
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      manifest-sha256: ${{ steps.seal.outputs.manifest-sha256 }}
    env:
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      CSC_LINK: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # Only the shell is packaged (`files: dist/**/*`), so install the desktop
      # subgraph rather than all ~2,000 workspace packages. The `...` suffix
      # keeps its workspace dependencies (@mikka/protocol, daemon, config).
      - run: pnpm install --frozen-lockfile --filter "@mikka/desktop..."
      - name: Cache electron-builder downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-builder-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-${{ runner.os }}-
      - name: Require the Developer ID certificate
        run: |
          test -n "$CSC_LINK" && test -n "$CSC_KEY_PASSWORD" || {
            echo "::error::APPLE_DEVELOPER_ID_P12_BASE64 / APPLE_DEVELOPER_ID_P12_PASSWORD are missing"
            exit 1
          }
      - name: Materialize App Store Connect key
        if: ${{ env.APPLE_API_KEY_P8_BASE64 != '' }}
        run: |
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 -D > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Require notarization credentials
        if: ${{ !inputs.skip_notarization }}
        run: |
          if { test -z "$APPLE_ID" || test -z "$APPLE_APP_SPECIFIC_PASSWORD" || test -z "$APPLE_TEAM_ID"; } &&
             { test -z "$APPLE_API_KEY" || test -z "$APPLE_API_KEY_ID" || test -z "$APPLE_API_ISSUER"; }; then
            echo "::error::Public macOS releases need notarization secrets (APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID or APPLE_API_KEY_P8_BASE64/APPLE_API_KEY_ID/APPLE_API_ISSUER). Use skip_notarization only for internal builds."
            exit 1
          fi
      - name: Select Xcode 26 for actool
        run: |
          # electron-builder compiles mac.icon (an Icon Composer .icon) with actool 26+.
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          test -n "$xcode" || { echo "::error::No Xcode 26 on this runner; build/icon.icon needs actool 26+"; exit 1; }
          sudo xcode-select -s "$xcode"
          actool --version
      - name: Stamp the release version
        working-directory: apps/desktop
        run: npm pkg set version="$RELEASE_VERSION"
      - name: Package signed macOS app
        run: pnpm --filter @mikka/desktop package:mac
      - name: Verify updater metadata
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          test -f apps/desktop/release/latest-mac.yml
          test -f "apps/desktop/release/mac-arm64/Mikka.app/Contents/Resources/app-update.yml"
          test -f "apps/desktop/release/Mikka-${version}-mac-arm64.zip"
          grep -q "Mikka-${version}-mac-arm64.zip" apps/desktop/release/latest-mac.yml
          echo "Updater metadata matches Mikka ${version} (arm64)"
      - name: Stage and inventory the exact signed installers
        run: |
          node scripts/release/evidence.mjs stage-desktop apps/desktop/release "$RUNNER_TEMP/mikka-desktop-release-candidate"
          pnpm --filter @mikka/desktop list --depth Infinity --json > "$RUNNER_TEMP/desktop-dependency-tree.json"
          node scripts/release/workspace-sbom.mjs "$RUNNER_TEMP/desktop-dependency-tree.json" "$RUNNER_TEMP/mikka-desktop-release-candidate/sbom.cdx.json"
      - name: Seal the signed candidate
        id: seal
        run: node scripts/release/evidence.mjs seal "$RUNNER_TEMP/mikka-desktop-release-candidate"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mikka-desktop-macos
          path: ${{ runner.temp }}/mikka-desktop-release-candidate/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [preflight, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release
          merge-multiple: true
      - name: Require successful checks for this exact main commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/ci-gate.mjs
      - name: Verify the signed candidate before creating the release
        env:
          RELEASE_MANIFEST_SHA256: ${{ needs.macos.outputs.manifest-sha256 }}
        run: node scripts/release/evidence.mjs verify release
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: desktop-${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          name: Mikka Desktop ${{ env.RELEASE_VERSION }}
          draft: ${{ inputs.skip_notarization == true }}
          make_latest: ${{ inputs.skip_notarization && 'false' || 'legacy' }}
          prerelease: false
          generate_release_notes: true
          files: |
            release/*
