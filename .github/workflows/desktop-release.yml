name: Desktop release

# Publishes signed, notarized Apple Silicon installers for every main push.
# Versions use a fixed epoch above earlier calendar versions and the workflow
# run number: 2026.10000.<run_number>. Retries keep the version and built commit.
# Manual builds that skip notarization remain drafts.
#
# Required repository secrets for macOS:
#   APPLE_DEVELOPER_ID_P12_BASE64  Developer ID Application certificate (base64)
#   APPLE_DEVELOPER_ID_P12_PASSWORD
# Notarization (required for a public macOS release), one of:
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   APPLE_API_KEY_P8_BASE64, APPLE_API_KEY_ID, APPLE_API_ISSUER

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_notarization:
        description: Build macOS without notarization (internal testing only)
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false
  queue: max

env:
  # A cache restore that fails (e.g. the account's cache egress limit) would
  # otherwise hang for actions/cache's 10-minute default before falling back
  # to a normal install, which outlasts the short jobs' own timeouts.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
  NODE_VERSION: '24'
  PNPM_VERSION: '10.34.3'

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require main
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "::error::Dispatch this workflow from main, not from a tag or branch. Actions caches are scoped per ref; a tag run cannot reuse the previous release's cache."
            exit 1
          }
      - name: Version from workflow run
        id: version
        run: |
          # The epoch sorts after earlier YYYY.MMDD.HHMM versions; retries reuse the run number.
          version="2026.10000.${GITHUB_RUN_NUMBER}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building Mikka Desktop $version"

  macos:
    needs: preflight
    runs-on: macos-14
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      CSC_LINK: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # Only the shell is packaged (`files: dist/**/*`), so install the desktop
      # subgraph rather than all ~2,000 workspace packages. The `...` suffix
      # keeps its workspace dependencies (@mikka/protocol, daemon, config).
      - run: pnpm install --frozen-lockfile --filter "@mikka/desktop..."
      - name: Cache electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-builder-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-${{ runner.os }}-
      - name: Require the Developer ID certificate
        run: |
          test -n "$CSC_LINK" && test -n "$CSC_KEY_PASSWORD" || {
            echo "::error::APPLE_DEVELOPER_ID_P12_BASE64 / APPLE_DEVELOPER_ID_P12_PASSWORD are missing"
            exit 1
          }
      - name: Materialize App Store Connect key
        if: ${{ env.APPLE_API_KEY_P8_BASE64 != '' }}
        run: |
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 -D > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Require notarization credentials
        if: ${{ !inputs.skip_notarization }}
        run: |
          if { test -z "$APPLE_ID" || test -z "$APPLE_APP_SPECIFIC_PASSWORD" || test -z "$APPLE_TEAM_ID"; } &&
             { test -z "$APPLE_API_KEY" || test -z "$APPLE_API_KEY_ID" || test -z "$APPLE_API_ISSUER"; }; then
            echo "::error::Public macOS releases need notarization secrets (APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID or APPLE_API_KEY_P8_BASE64/APPLE_API_KEY_ID/APPLE_API_ISSUER). Use skip_notarization only for internal builds."
            exit 1
          fi
      - name: Stamp the release version
        working-directory: apps/desktop
        run: npm pkg set version="$RELEASE_VERSION"
      - name: Package signed macOS app
        run: pnpm --filter @mikka/desktop package:mac
      - name: Verify updater metadata
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          test -f apps/desktop/release/latest-mac.yml
          test -f "apps/desktop/release/mac-arm64/Mikka.app/Contents/Resources/app-update.yml"
          test -f "apps/desktop/release/Mikka-${version}-mac-arm64.zip"
          grep -q "Mikka-${version}-mac-arm64.zip" apps/desktop/release/latest-mac.yml
          echo "Updater metadata matches Mikka ${version} (arm64)"
      - uses: actions/upload-artifact@v4
        with:
          name: mikka-desktop-macos
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest-mac.yml
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [preflight, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Write checksums
        working-directory: release
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          name: Mikka Desktop ${{ env.RELEASE_VERSION }}
          draft: ${{ inputs.skip_notarization == true }}
          make_latest: ${{ inputs.skip_notarization && 'false' || 'legacy' }}
          prerelease: false
          generate_release_notes: true
          files: |
            release/*
