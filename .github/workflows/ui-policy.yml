name: Frontend determinism diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      MIKKA_EDITION: cloud
      MIKKA_DEPLOYMENT_ID: build-output-contract
      PROBE_DIRECTORY: ${{ runner.temp }}/frontend-determinism
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm-install
      - name: Compare exact frontend outputs without changing build configuration
        run: node --experimental-test-module-mocks apps/frontend/scripts/frontend-determinism-probe.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: frontend-determinism-${{ github.sha }}
          path: ${{ runner.temp }}/frontend-determinism
          if-no-files-found: error
          retention-days: 1
