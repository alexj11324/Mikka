name: Frontend determinism diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      MIKKA_EDITION: cloud
      MIKKA_DEPLOYMENT_ID: build-output-contract
      NEXT_PUBLIC_MIKKA_BUILD: 6e6ee0575f64fa58a91fc392f93dddb61a63a76c
      PROBE_DIRECTORY: /tmp/frontend-determinism-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm-install
        with:
          node-version: '24.22.2'
      - name: Run unchanged regression with bounded CPU contention and retain cleanup inputs
        run: |
          mkdir -p "$PROBE_DIRECTORY"
          cd apps/frontend
          node --version
          pwd
          failed=0
          load_a=''
          load_b=''
          trap 'if [ -n "$load_a" ]; then kill "$load_a" "$load_b" 2>/dev/null || true; fi' EXIT
          for mode in normal loaded-1 loaded-2 loaded-3; do
            if [ "$mode" = loaded-1 ]; then
              yes > /dev/null & load_a=$!
              yes > /dev/null & load_b=$!
            fi
            probe_case="$PROBE_DIRECTORY/$mode"
            mkdir -p "$probe_case"
            if PROBE_CASE_DIRECTORY="$probe_case" node --experimental-test-module-mocks --import ./scripts/frontend-determinism-snapshot.mjs --test --test-concurrency=1 scripts/*.test.mjs > "$probe_case/test.log" 2>&1; then
              echo "$mode: passed"
            else
              echo "$mode: failed"
              failed=1
            fi
            tail -n 12 "$probe_case/test.log"
          done
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: frontend-determinism-${{ github.sha }}
          path: ${{ env.PROBE_DIRECTORY }}
          if-no-files-found: error
          retention-days: 1
