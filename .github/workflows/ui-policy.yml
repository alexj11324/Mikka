name: Community compatibility diagnostic

# Disposable diagnostic branch only. Product source is pinned independently.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-compat-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  community-compatibility:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e-local-only
          POSTGRES_DB: mikka_e2e
          POSTGRES_INITDB_ARGS: --set=max_locks_per_transaction=512
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e -d mikka_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      MIKKA_EDITION: community
      REQUIRE_DB: '1'
      MIKKA_TEST_DB_PORT: '5432'
      E2E_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      MIKKA_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      BETTER_AUTH_URL: http://localhost:3100
      MIKKA_TEST_DEPLOYMENT_SHA: 3f85b8e5aeecd2986446015e60d3b974a0dfea9b
      MIKKA_TEST_ENVIRONMENT_FILE: .cache/e2e/environment.json
      RUN_DISPATCH_DB_TESTS: '1'
      FACTORY_MONITOR_TEST_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      CREDENTIAL_TEST_RETAIN_RESOURCES: '1'
      SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
      MIKKA_SIGNUP_IP_HOURLY: '1000'
      MIKKA_SIGNUP_GLOBAL_HOURLY: '10000'
      MIKKA_VERIFICATION_IP_HOURLY: '1000'
      MIKKA_VERIFICATION_GLOBAL_HOURLY: '10000'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 3f85b8e5aeecd2986446015e60d3b974a0dfea9b
          fetch-depth: 0
          persist-credentials: false
      - name: Record exact diagnostic source
        run: |
          test "$(git rev-parse HEAD)" = "$MIKKA_TEST_DEPLOYMENT_SHA"
          echo "Pinned product source: $(git rev-parse HEAD)"
          echo "Diagnostic workflow source: $GITHUB_WORKFLOW_SHA"
          git status --porcelain
      - uses: ./.github/actions/pnpm-install
        with:
          node-version: '24'
          skip-electron: 'true'
          ffmpeg-github-token: ${{ github.token }}
      - name: Install existing native test prerequisites
        timeout-minutes: 5
        run: |
          sudo "$(command -v node)" scripts/ci/apt-mirrors.mjs
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y bubblewrap socat ripgrep ffmpeg
      - name: Create ephemeral auth secret for the real community live configuration
        run: |
          node --input-type=module <<'JS'
          import { randomBytes } from 'node:crypto'
          import { appendFileSync } from 'node:fs'
          const secret = randomBytes(32).toString('hex')
          console.log(`::add-mask::${secret}`)
          appendFileSync(process.env.GITHUB_ENV, `BETTER_AUTH_SECRET=${secret}\n`)
          JS
      - name: Migrate isolated PG17
        run: pnpm test:e2e:setup
      - name: Bind the disposable account environment to the pinned source
        run: node scripts/test-accounts/bootstrap.mjs --output .cache/e2e/environment.json
      - name: Reproduce exact community postpay test first
        run: |
          node --experimental-test-module-mocks --import ./scripts/server-test.mjs --import tsx --test-force-exit --test lib/model-admission/revocation-postpay.db.test.ts
      - name: Execute full declared community compatibility inventory
        run: |
          # This synthetic comparison is diagnostic metadata, not a GitHub PR event.
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs'
          writeFileSync(process.env.RUNNER_TEMP + '/community-compat-comparison.json', JSON.stringify({
            before: '250d245159ca82b8879ffa5fc7b0c5a2d78e2f1d',
            after: '3f85b8e5aeecd2986446015e60d3b974a0dfea9b'
          }))
          JS
          env -u MIKKA_LITELLM_MASTER_KEY -u MIKKA_LITELLM_URL \
            GITHUB_EVENT_PATH="$RUNNER_TEMP/community-compat-comparison.json" \
            node scripts/ci/self-hosted-requirements.mjs --run-tests
