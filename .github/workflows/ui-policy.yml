name: CI

# Three layers, as in large monorepos:
# - presubmit: every push to any branch runs CI, with or without a PR;
# - merge queue: merge_group tests the change on top of the latest main;
# - postsubmit: every push to main runs CI again.
# A PR from a branch in this repo is already covered by its push run, so the
# pull_request run is kept only for PRs from forks (see the job conditions).
# Browser tests (Playwright) are the slow part and live in browser-tests.yml,
# which runs only on the way into main. See CONTRIBUTING.md, "How changes are tested".
on:
  push:
    branches-ignore: ['gh-readonly-queue/**']
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ui-policy-${{ github.event_name }}-${{ github.ref }}
  # Superseded branch pushes are cancelled; every commit on main finishes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  cloud-secret-access:
    name: Cloud credential access (OIDC)
    # This isolated ledger candidate is authorized for synthetic tests only.
    if: github.event_name == 'push' && github.repository == 'alexj11324/Mikka' && !startsWith(github.ref, 'refs/heads/codex/208-') && github.ref != 'refs/heads/fix/169-metadata-integration' && github.ref != 'refs/heads/fix/178-daemon-revocation' && github.ref != 'refs/heads/fix/178-transaction-fence' && github.ref != 'refs/heads/codex/enterprise-audit-210'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Read one credential through Infisical workload identity
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: staging
          secret-path: /vercel
          secret-name: COMPOSIO_API_KEY
          include-imports: false
      - name: Verify cloud credential against its issuer
        run: |
          node --input-type=module <<'JS'
          if (!process.env.COMPOSIO_API_KEY) throw new Error('Cloud credential was not injected')
          const response = await fetch('https://backend.composio.dev/api/v3.1/webhook_subscriptions', {
            headers: { 'x-api-key': process.env.COMPOSIO_API_KEY },
            signal: AbortSignal.timeout(15000),
          })
          if (!response.ok) throw new Error(`Issuer rejected cloud credential: HTTP ${response.status}`)
          console.log('Infisical OIDC and issuer credential validation succeeded')
          JS

  ui-policy:
    name: UI policy (strict)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BETTER_AUTH_SECRET: ci-build-secret-0123456789abcdef0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      MIKKA_DATABASE_URL: postgres://mikka:mikka@127.0.0.1:5432/mikka
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:ui-policy
      - run: pnpm test:motion
      - run: pnpm test:i18n
      - run: pnpm i18n:check
      - run: pnpm test:ssh-target
      - run: pnpm test:linear-sync
      - run: pnpm test:coordinator-events
      - run: pnpm test:factory
      - name: Factory daemon check regressions and shared report contract
        run: |
          pnpm --filter @mikka/protocol exec vitest run src/run.test.ts
          pnpm --filter @mikka/daemon exec vitest run test/factory-check.test.ts test/runs.test.ts test/hardening.test.ts src/permissions.test.ts
          pnpm --filter @mikka/daemon typecheck
      - run: pnpm test:active-agents
        env:
          # Database regressions run against ephemeral Postgres in browser-tests below.
          MIKKA_DATABASE_URL: ""
      - run: pnpm test:auth-composio
      - run: pnpm test:groups
      - run: pnpm test:integrations
      - run: pnpm test:request-log
      - run: pnpm test:telegram
      - run: pnpm test:agent
      - run: pnpm test:acceptance
      - run: pnpm test:suggestions
      - run: pnpm test:db-runner
      - run: pnpm test:csv
      - run: pnpm test:settings
      - run: pnpm test:issues
      - run: pnpm test:issue-search
      - name: Audit business UI composition
        run: pnpm --silent lint:ui --json > ui-audit.json
      - name: Show audit summary
        if: always()
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            if (fs.existsSync("ui-audit.json")) {
              const audit = JSON.parse(fs.readFileSync("ui-audit.json", "utf8"));
              const summary = `## Strict UI policy\n\n${audit.files} business files style-scanned; ${audit.interactionFiles} files interaction-scanned (including business blocks); ${audit.errors} errors. ${audit.libraryFiles} component-library files excluded from style checks only. No upstream source verification.\n\n` + Object.entries(audit.counts).map(([rule, count]) => `- ${rule}: ${count}`).join("\n") + "\n";
              console.log(summary);
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
            }
          '
      - name: Upload detailed audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-policy-audit
          path: ui-audit.json
          if-no-files-found: ignore
      - run: pnpm lint:code
        if: always()
      - run: pnpm exec next typegen
        if: always()
      - run: pnpm typecheck
        if: always()

  browser-tests:
    # Name kept so the existing required check still reports; browser tests moved to browser-tests.yml.
    name: Production build and browser interactions
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository) && github.ref != 'refs/heads/fix/169-metadata-integration' && github.ref != 'refs/heads/fix/178-daemon-revocation' && github.ref != 'refs/heads/fix/178-transaction-fence' && github.head_ref != 'fix/169-metadata-integration' && github.head_ref != 'fix/178-daemon-revocation' && github.head_ref != 'fix/178-transaction-fence'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e-local-only
          POSTGRES_DB: mikka_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e -d mikka_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      REQUIRE_DB: '1'
      DB_TEST_EXPECTED: active-agents,activity-actor-db,audit,byos-claim,byos-worker,conversation-reads,credentials,e2e:setup,factory,factory-monitor-http,factory-query-http,factory-question-http,group-native,groups,historical-upgrade-db,improvement,issue-search-db,issue-threads-db,mailboxes,migration-session,operations,relation-cycle,run-dispatch,visibility-db,workspace-migration-db
      MIKKA_TEST_DB_PORT: '5432'
      E2E_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      MIKKA_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      BETTER_AUTH_URL: http://localhost:3100
      OPERATION_TEST_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_208_test
      IMPROVEMENT_TEST_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_improvement
      R0_GROUP_APP_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_review
      R0_WORKSPACE_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_workspace_review
      FACTORY_QUESTION_DATABASE_URL: postgresql://factoryquestions192:synthetic-question-only@127.0.0.1:5432/mikka_e2e
      FACTORY_QUESTION_HTTP_ORIGIN: http://localhost:3100
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate ephemeral test-only auth secret
        run: node -e "console.log('BETTER_AUTH_SECRET=' + require('node:crypto').randomBytes(32).toString('hex'))" >> "$GITHUB_ENV"
      - name: Bootstrap empty database using tracked migrations only
        run: node --experimental-strip-types --test tests/migrate-empty-db.test.mjs
        env:
          MIGRATION_BOOTSTRAP_CI: '1'
      - name: Apply tracked migrations to disposable browser database
        run: node scripts/migrate.mjs
        env:
          MIGRATE: '1'
      - name: Populate disposable application fixture
        run: node --experimental-strip-types scripts/setup-e2e-db.mjs
      - name: Create exact retained group databases and synthetic HTTP role
        run: |
          psql "$E2E_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE mikka_208_test'
          psql "$E2E_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE mikka_improvement'
          psql "$E2E_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE mikka_review'
          psql "$E2E_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE mikka_workspace_review'
          psql "$E2E_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE factoryquestions192 LOGIN SUPERUSER PASSWORD 'synthetic-question-only'"
      - name: R0 prebuild DB recipes (pending contracts remain failures)
        id: r0-prebuild
        continue-on-error: true
        run: pnpm test:db --phase prebuild --output test-results/r0/prebuild.json
        env:
          HISTORY_PG_CONTAINER: ${{ job.services.postgres.id }}
      - run: pnpm build
        id: r0-build
      - name: Start compiled Next for retained HTTP recipe
        if: steps.r0-build.outcome == 'success'
        run: |
          NODE_OPTIONS=--dns-result-order=ipv4first pnpm start --hostname localhost --port 3100 > test-results/r0/next.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://localhost:3100/mikka/api/auth/get-session > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: R0 postbuild contracts
        if: always()
        continue-on-error: true
        run: pnpm test:db --phase postbuild --output test-results/r0/postbuild.json
        env:
          R0_BUILD_SUCCEEDED: ${{ steps.r0-build.outcome }}
      - name: R0 independent harness contracts
        if: always()
        continue-on-error: true
        run: pnpm test:db --phase external --output test-results/r0/external.json
      - name: R0 complete same-SHA result (required; no skips or missing recipes)
        if: always()
        run: pnpm test:db --aggregate test-results/r0/prebuild.json test-results/r0/postbuild.json test-results/r0/external.json --output test-results/r0/aggregate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r0-db-recipe-results
          path: test-results/r0/*.json
          if-no-files-found: error
