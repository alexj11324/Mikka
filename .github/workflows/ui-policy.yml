name: CI

# Three layers, as in large monorepos:
# - presubmit: every push to any branch runs CI, with or without a PR;
# - merge queue: merge_group tests the change on top of the latest main;
# - postsubmit: every push to main runs CI again.
# A PR from a branch in this repo is already covered by its push run, so the
# pull_request run is kept only for PRs from forks (see the job conditions).
on:
  push:
    branches-ignore: ['gh-readonly-queue/**']
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ui-policy-${{ github.event_name }}-${{ github.ref }}
  # Superseded branch pushes are cancelled; every commit on main finishes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  cloud-secret-access:
    name: Cloud credential access (OIDC)
    if: github.event_name == 'push' && github.repository == 'alexj11324/Mikka'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Read one credential through Infisical workload identity
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: staging
          secret-path: /vercel
          secret-name: COMPOSIO_API_KEY
          include-imports: false
      - name: Verify cloud credential against its issuer
        run: |
          node --input-type=module <<'JS'
          if (!process.env.COMPOSIO_API_KEY) throw new Error('Cloud credential was not injected')
          const response = await fetch('https://backend.composio.dev/api/v3.1/webhook_subscriptions', {
            headers: { 'x-api-key': process.env.COMPOSIO_API_KEY },
            signal: AbortSignal.timeout(15000),
          })
          if (!response.ok) throw new Error(`Issuer rejected cloud credential: HTTP ${response.status}`)
          console.log('Infisical OIDC and issuer credential validation succeeded')
          JS

  ui-policy:
    name: UI policy (strict)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BETTER_AUTH_SECRET: ci-build-secret-0123456789abcdef0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      MIKKA_DATABASE_URL: postgres://mikka:mikka@127.0.0.1:5432/mikka
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:ui-policy
      - run: pnpm test:motion
      - run: pnpm test:i18n
      - run: pnpm i18n:check
      - run: pnpm test:ssh-target
      - run: pnpm test:linear-sync
      - run: pnpm test:coordinator-events
      - run: pnpm test:auth-composio
      - run: pnpm test:integrations
      - run: pnpm test:csv
      - run: pnpm test:settings
      - run: pnpm test:issues
      - name: Computer broker and gRPC-Web wire fixtures (no live desktop)
        run: node --import tsx --test lib/cua/computer.test.ts lib/cua/local-review.test.ts
      - name: Audit business UI composition
        run: pnpm --silent lint:ui --json > ui-audit.json
      - name: Show audit summary
        if: always()
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            if (fs.existsSync("ui-audit.json")) {
              const audit = JSON.parse(fs.readFileSync("ui-audit.json", "utf8"));
              const summary = `## Strict UI policy\n\n${audit.files} business files style-scanned; ${audit.interactionFiles} files interaction-scanned (including business blocks); ${audit.errors} errors. ${audit.libraryFiles} component-library files excluded from style checks only. No upstream source verification.\n\n` + Object.entries(audit.counts).map(([rule, count]) => `- ${rule}: ${count}`).join("\n") + "\n";
              console.log(summary);
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
            }
          '
      - name: Upload detailed audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-policy-audit
          path: ui-audit.json
          if-no-files-found: ignore
      - run: pnpm lint:code
        if: always()
      - run: pnpm exec next typegen
        if: always()
      - run: pnpm typecheck
        if: always()

  browser-tests:
    name: Production build and browser interactions
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e-local-only
          POSTGRES_DB: mikka_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e -d mikka_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      E2E_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      MIKKA_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      BETTER_AUTH_URL: http://localhost:3100
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate ephemeral test-only auth secret
        run: node -e "console.log('BETTER_AUTH_SECRET=' + require('node:crypto').randomBytes(32).toString('hex'))" >> "$GITHUB_ENV"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:setup
      - name: Verify legacy workspace migration and idempotency
        run: node --test tests/workspace-migration.test.mjs
      - name: Workspace computer approval migration, isolated CI database only
        run: node --test tests/computer-request-migration.test.mjs tests/device-computer-migration.test.mjs tests/local-computer-review-migration.test.mjs
      - run: pnpm build
        id: build
      - name: Navigation and Agent content ready within 1000ms (desktop + mobile, no retries)
        run: pnpm test:performance --output=performance-results
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-performance-report
      - name: Browser functionality regression
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm test:e2e --grep-invert @performance
      - name: Upload browser failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
            playwright-performance-report/
            performance-results/
          if-no-files-found: ignore
          retention-days: 7

  local-computer-linux:
    name: Local computer driver (Linux Xvfb, exact approval)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pinned MIT cua-driver binary and X11 dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb x11-utils x11-apps xdotool libxdo3
          mkdir -p "$RUNNER_TEMP/cua"
          curl -fL --retry 2 https://github.com/trycua/cua/releases/download/cua-driver-rs-v0.38.0/cua-driver-rs-0.38.0-linux-x86_64-binary.tar.gz -o "$RUNNER_TEMP/cua/driver.tar.gz"
          echo "31ab9709dd91ce73677e49b9f3e75c6f0d3e4d9625c286c9e58262bfbea698dd  $RUNNER_TEMP/cua/driver.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/cua/driver.tar.gz" -C "$RUNNER_TEMP/cua"
      - name: Detection, permissions, proxy continuation and authenticated owner review
        run: |
          node --test packages/daemon/src/computer/broker.test.mjs
          node --import tsx --test packages/daemon/src/computer/rpc.node.ts packages/daemon/src/computer/web-review.node.ts
          pnpm --filter @mikka/daemon typecheck
      - name: Real screenshot and click through exact-operation broker (no database)
        run: |
          MIKKA_CUA_TEST_BINARY="$RUNNER_TEMP/cua/cua-driver" MIKKA_CUA_TEST_SCREENSHOT="$RUNNER_TEMP/cua/desktop.png" node --import tsx --test packages/daemon/src/computer/xvfb.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-computer-linux-evidence
          path: ${{ runner.temp }}/cua/desktop*.png
          if-no-files-found: ignore

  local-computer-macos:
    name: Local computer driver (macOS, non-blocking permissions probe)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pinned MIT driver (no automatic TCC grants)
        run: |
          mkdir -p "$RUNNER_TEMP/cua"
          curl -fL --retry 2 https://github.com/trycua/cua/releases/download/cua-driver-rs-v0.38.0/cua-driver-rs-0.38.0-darwin-universal-binary.tar.gz -o "$RUNNER_TEMP/cua/driver.tar.gz"
          echo "2bb8dc4a7e69185ffd04c4a9c0eab590bd2c54b72c2c1be13ab675be4f487732  $RUNNER_TEMP/cua/driver.tar.gz" | shasum -a 256 --check
          tar -xzf "$RUNNER_TEMP/cua/driver.tar.gz" -C "$RUNNER_TEMP/cua"
      - name: Scripted native dialog screenshot and approved click
        run: |
          MIKKA_CUA_TEST_BINARY="$RUNNER_TEMP/cua/cua-driver" MIKKA_CUA_TEST_SCREENSHOT="$RUNNER_TEMP/cua/desktop.png" node --import tsx --test packages/daemon/src/computer/xvfb.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-computer-macos-evidence
          path: ${{ runner.temp }}/cua/desktop*.png
          if-no-files-found: ignore
