name: Browser gate

# Browser tests are removed from CI (decision 2026-11-01-1520). This job only
# keeps the protected check name "Browser tests (before merge)"; delete this
# file once Alex removes that name from the required checks in the repository
# settings.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# Keep each pull request or merge group independent; cancel obsolete runs only.
concurrency:
  group: browser-gate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    name: Browser tests (before merge)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "Browser tests are not run in CI (decision 2026-11-01-1520)."
