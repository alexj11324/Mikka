name: Cloud computer backend
on:
  push:
    branches: ['codex/e2b-cloud-computer-172']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-ci
          POSTGRES_DB: computer_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm exec oxlint --deny-warnings lib/computer app/api/bots
      - run: pnpm --filter @mikka/protocol exec vitest run src/computer.test.ts
      - run: node --import ./scripts/server-test.mjs --import tsx --test lib/computer/handler.test.ts lib/computer/policy-route.test.ts
      - run: node --import ./scripts/server-test.mjs --import tsx --test lib/cua/local-review.test.ts
      - run: node --test packages/daemon/src/computer/broker.test.mjs
      - run: python3 scripts/e2b/lease-driver.test.py
      - run: node --import ./scripts/server-test.mjs --import tsx --test packages/daemon/src/computer/web-review.node.ts
      - run: node --import ./scripts/server-test.mjs --import tsx --test lib/computer/store.db.test.ts
        env:
          COMPUTER_TEST_DATABASE_URL: postgresql://postgres:isolated-ci@localhost:5432/computer_test
      - run: node --import ./scripts/server-test.mjs --import tsx --test lib/computer/local-reviews.db.test.ts
        env:
          COMPUTER_TEST_DATABASE_URL: postgresql://postgres:isolated-ci@localhost:5432/computer_test
      - run: node --test tests/device-computer-migration.test.mjs
        env:
          COMPUTER_TEST_DATABASE_URL: postgresql://postgres:isolated-ci@localhost:5432/computer_test
      - run: node --test packages/daemon/src/computer/local-grant.test.mjs
      - run: cd packages/daemon && node --import tsx --test test/local-computer-adapters.node-test.ts test/local-computer-daemon.node-test.ts
  local-driver-linux:
    name: Local driver (Linux Xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install isolated X11 and pinned MIT driver
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb x11-utils x11-apps xdotool libxdo3
          mkdir -p "$RUNNER_TEMP/cua"
          curl -fL --retry 2 https://github.com/trycua/cua/releases/download/cua-driver-rs-v0.38.0/cua-driver-rs-0.38.0-linux-x86_64-binary.tar.gz -o "$RUNNER_TEMP/cua/driver.tar.gz"
          echo "31ab9709dd91ce73677e49b9f3e75c6f0d3e4d9625c286c9e58262bfbea698dd  $RUNNER_TEMP/cua/driver.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/cua/driver.tar.gz" -C "$RUNNER_TEMP/cua"
      - name: Real driver through exact-operation broker
        run: MIKKA_CUA_TEST_BINARY="$RUNNER_TEMP/cua/cua-driver" MIKKA_CUA_TEST_SCREENSHOT="$RUNNER_TEMP/cua/desktop.png" node --import tsx --test packages/daemon/src/computer/xvfb.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-computer-linux-evidence
          path: ${{ runner.temp }}/cua/desktop*.png
          if-no-files-found: ignore

  local-sandbox:
    name: Local computer through real Linux sandbox
    # Pin a host that supports nested unprivileged user namespaces. Keep the
    # runtime's seccomp/user/PID/network isolation intact; never disable probes.
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require actual isolated proxy transport and port denial
        run: |
          docker run --rm --privileged \
            -v "$PWD:/workspace:ro" -w /runtime/packages/daemon \
            node@sha256:6449e19d8184d84062525b6a7524def03146c2cb04a7f08b076680d0e8e4240a \
            sh -c 'apt-get update -qq && apt-get install -y -qq bubblewrap socat ripgrep git >/dev/null && mkdir -p /runtime && cp -a --no-preserve=ownership /workspace/node_modules /workspace/packages /workspace/package.json /workspace/tsconfig.json /runtime/ && HOME=/tmp TSX_DISABLE_CACHE=1 node --import tsx --test test/computer-sandbox.acceptance.node.ts'
