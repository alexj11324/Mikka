name: Site search read contract
on:
  push:
    branches: ['codex/131-title-search']
  pull_request:
    paths: ['lib/federated-search/**', 'app/api/search/**', 'tests/e2e/site-search.spec.ts', '.github/workflows/site-search.yml']
permissions:
  contents: read
concurrency:
  group: site-search-${{ github.ref }}
  cancel-in-progress: true
jobs:
  site-search:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e-local-only
          POSTGRES_DB: mikka_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U e2e -d mikka_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: 'true'
      E2E_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      MIKKA_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      BETTER_AUTH_URL: http://localhost:3100
      BETTER_AUTH_SECRET: synthetic-site-search-secret-not-a-real-credential
      NEXT_TELEMETRY_DISABLED: '1'
      MIGRATE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --import ./scripts/server-test.mjs --import tsx --test lib/federated-search/input.test.ts
      - run: pnpm exec next typegen && pnpm typecheck && pnpm lint
      - name: Provision only the isolated test database from existing schema
        run: pnpm test:e2e:setup
      - run: pnpm build
      - name: Real Next HTTP, Better Auth and PG title read regression (no providers)
        run: pnpm exec playwright test tests/e2e/site-search.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-search-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 7
