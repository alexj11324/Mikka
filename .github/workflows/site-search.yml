name: Site search read contract
# An HTTP API test, not a browser test (decisions 2026-11-01-1520 and 2225 run
# none): tests/e2e/site-search.spec.ts uses Playwright's request client only,
# against the compiled API, Better Auth and two PostgreSQL services. No
# browser is installed or launched.
# Runs only when search changes: on every pull request (this repository's and
# forks') and on pushes to main that touch these paths.
# Pull requests only: the same suite already passed on the PR, and main's
# CI workflow (ui-policy.yml) still verifies every merged commit.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths: ['apps/api/**', 'apps/frontend/**', 'lib/browser-rpc/**', 'scripts/start-app*', 'lib/search/**', 'lib/federated-search/**', 'app/api/search/**', 'tests/e2e/site-search.spec.ts', '.github/workflows/site-search.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-search-${{ github.ref }}
  cancel-in-progress: true
env:
  # A cache restore that fails (e.g. the account's cache egress limit) would
  # otherwise hang for actions/cache's 10-minute default before falling back
  # to a normal install, which outlasts the short jobs' own timeouts.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'

jobs:
  site-search:
    # No Runner allocation until a draft becomes review-ready.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e-local-only
          POSTGRES_DB: mikka_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U e2e -d mikka_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
      workspace-postgres:
        image: postgres:17
        env:
          POSTGRES_USER: workspace_e2e
          POSTGRES_PASSWORD: workspace-local-only
          POSTGRES_DB: mikka_workspace_e2e
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U workspace_e2e -d mikka_workspace_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: 'true'
      E2E_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      MIKKA_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      DATABASE_URL: postgresql://workspace_e2e:workspace-local-only@127.0.0.1:5433/mikka_workspace_e2e
      SITE_SEARCH_WORKSPACE_DATABASE_URL: postgresql://workspace_e2e:workspace-local-only@127.0.0.1:5433/mikka_workspace_e2e
      SITE_SEARCH_REQUIRE_DUAL_PG: '1'
      MIKKA_TEST_DEPLOYMENT_SHA: ${{ github.sha }}
      BETTER_AUTH_URL: http://localhost:3100
      BETTER_AUTH_SECRET: synthetic-site-search-secret-not-a-real-credential
      NEXT_TELEMETRY_DISABLED: '1'
      MIGRATE: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integrations
      - run: node apps/api/scripts/generate-routes.mjs --check && pnpm typecheck && pnpm lint
      - name: Provision only the isolated application test database from existing schema
        run: pnpm test:e2e:setup
      - name: Provision only the separate workspace test database from existing schema
        run: pnpm test:e2e:setup
        env:
          E2E_DATABASE_URL: ${{ env.SITE_SEARCH_WORKSPACE_DATABASE_URL }}
      - run: pnpm build
      - name: Real compiled HTTP, Better Auth and PG title read regression (HTTP API only, no browser, no providers)
        run: pnpm exec playwright test tests/e2e/site-search.spec.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: site-search-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 7
