name: Issue 1505 daemon regression
on:
  push:
    branches: [ops/1505-daemon-tests]
permissions:
  contents: read
concurrency:
  group: issue-1505-daemon-regression
  cancel-in-progress: true
jobs:
  daemon:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck daemon
        run: pnpm --filter @mikka/daemon typecheck
      - name: Validate direct execution, refresh and pushed stops
        run: pnpm --filter @mikka/daemon exec vitest run --no-cache --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/daemon-1505.json" test/subscription-hosted-runner.test.ts test/subscription-question-resume.test.ts test/claude-subscription.test.ts test/codex-subscription.test.ts test/subscription-credentials.test.ts test/machine-github.test.ts test/credential-journal.test.ts test/server-link-http.test.ts test/policy-distribution.test.ts test/github-runtime.test.ts test/repositories.test.ts test/worktrees.test.ts test/runs.test.ts src/secret-mask.test.ts src/run-runtime-timing.test.ts src/official-cli-timing.test.ts
      - name: Preserve regression results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: daemon-1505-${{ github.sha }}
          path: ${{ runner.temp }}/daemon-1505.json
          if-no-files-found: warn
