name: Issue 1505 daemon regression
on:
  push:
    branches: [ops/1505-daemon-tests]
permissions:
  contents: read
jobs:
  daemon:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      BETTER_AUTH_SECRET: ci-build-secret-0123456789abcdef0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      MIKKA_DATABASE_URL: postgres://mikka:mikka@127.0.0.1:5432/mikka
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck daemon
        run: pnpm --filter @mikka/daemon typecheck
      - name: Complete daemon unit and transport tests
        run: pnpm --filter @mikka/daemon exec vitest run --no-cache --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/issue-1505-daemon-results.json"
      - name: Existing mailbox CLI integration tests
        run: pnpm --filter @mikka/daemon test:mailbox-cli
      - name: Repository identity, GitHub credential and endpoint tests
        run: |
          pnpm --filter @mikka/daemon test:repository-identity
          pnpm --filter @mikka/daemon test:github-credentials
          pnpm --filter @mikka/daemon test:trusted-endpoint
      - name: Actual local computer daemon and adapter protocol
        run: pnpm --filter @mikka/daemon exec node --import tsx --test test/local-computer-adapters.node-test.ts test/local-computer-daemon.node-test.ts src/computer/proxy.test.mjs
        env:
          NODE_ENV: test
          MIKKA_TEST_MODE: '1'
      - name: Build daemon package
        id: daemon-package
        run: pnpm --filter @mikka/daemon build
      - name: Validate packaged daemon
        run: pnpm --filter @mikka/daemon test:package
        env:
          MIKKA_DAEMON_DIST_DIR: ${{ steps.daemon-package.outputs.package-directory }}
      - name: Preserve regression results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1505-daemon-results
          path: ${{ runner.temp }}/issue-1505-daemon-results.json
          if-no-files-found: warn
