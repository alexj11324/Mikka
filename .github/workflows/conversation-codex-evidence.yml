name: Original baseline and integration Claude Code reply identity and model inference
on:
  push:
    branches: [evidence/2254-sidebar-85dfc396]
    paths: [.github/workflows/conversation-codex-evidence.yml, 'evidence/2257/local-provider/**']
permissions:
  contents: read

jobs:
  qualify:
    if: github.repository == 'alexj11324/Mikka'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: da2df5fd22f0d41182e629006275b00baba85d29
            tree: 720517a532677cba6c043998c6bc13c2fe463473
            artifact: integration-claude-provider
          - source: 5c85ee16410fe5586ad6fef708e8630ef67fe1c3
            tree: e0a1b294790ffda17cf089fa3b78571dbb70a40b
            artifact: baseline-claude-provider
    env:
      SOURCE: ${{ matrix.source }}
    steps:
      - name: Check out the public harness only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: harness
          persist-credentials: false
          sparse-checkout: evidence/2257/local-provider
      - name: Check out the immutable public product
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: product
          ref: ${{ matrix.source }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - name: Install the exact public product and CPU inference runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C product rev-parse HEAD)" = "$SOURCE"
          test "$(git -C product rev-parse 'HEAD^{tree}')" = "${{ matrix.tree }}"
          cd product
          pnpm install --frozen-lockfile
          cd ../harness/evidence/2257/local-provider
          npm ci --ignore-scripts --no-audit --no-fund
          mkdir -m 700 "$RUNNER_TEMP/model-fixture" "$RUNNER_TEMP/isolated-home" "$RUNNER_TEMP/receipt"
          python prepare-claude.py "$GITHUB_WORKSPACE/product" "$RUNNER_TEMP/model-fixture"
          mkdir -p "$GITHUB_WORKSPACE/product/.cache/e-codex-actual"
          cp claude.mts "$GITHUB_WORKSPACE/product/.cache/e-codex-actual/"
      - name: Run the official Claude Code adapter and verified GGUF inside isolated loopback
        shell: bash
        run: |
          set -euo pipefail
          worker_uid="$(id -u)"
          worker_gid="$(id -g)"
          src="$GITHUB_WORKSPACE/product"
          harness="$GITHUB_WORKSPACE/harness/evidence/2257/local-provider"
          sudo unshare --net bash -euc '
            ip link set lo up
            test "$(ls /sys/class/net)" = lo || test "$(ip -o link show | wc -l)" = 1
            test -z "$(ip route show default)"
            exec setpriv --reuid="$1" --regid="$2" --clear-groups --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs env -i PATH="$3" HOME="$4" bash "$5/verify-claude.sh" "$5" "$6" "$7/receipt" "$7/model-fixture/claude" "$7/model-fixture/model.gguf"
          ' isolated "$worker_uid" "$worker_gid" "$PATH" "$RUNNER_TEMP/isolated-home" "$harness" "$src" "$RUNNER_TEMP"
      - name: Retain only the sanitized source, model and event receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ runner.temp }}/receipt/claude.json
            ${{ runner.temp }}/receipt/claude-requests.jsonl
            ${{ runner.temp }}/receipt/claude-results.jsonl
            ${{ runner.temp }}/receipt/claude-first-token.jsonl
            ${{ runner.temp }}/receipt/claude-routes.jsonl
            ${{ runner.temp }}/receipt/start
            ${{ runner.temp }}/receipt/end
            ${{ runner.temp }}/receipt/exit
          if-no-files-found: warn
          retention-days: 7

