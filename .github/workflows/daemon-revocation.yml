name: Daemon credential revocation
on:
  push:
    branches: ['fix/178-daemon-revocation']
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: mikka_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d mikka_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: 'true'
      E2E_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/mikka_e2e
      MIKKA_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/mikka_e2e
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/mikka_e2e
      BETTER_AUTH_URL: http://localhost:3100
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ephemeral isolated session key
        run: |
          node --input-type=module <<'JS'
          import { randomBytes } from 'node:crypto'
          import { appendFileSync } from 'node:fs'
          const key = randomBytes(32).toString('hex')
          console.log('::add-mask::' + key)
          appendFileSync(process.env.GITHUB_ENV, 'BETTER_AUTH_SECRET=' + key + '\n')
          JS
      - name: Attest exact source
        run: |
          git rev-parse HEAD
          git diff --exit-code HEAD
      - run: pnpm test:e2e:setup
      - run: pnpm typecheck
      - run: pnpm --filter @mikka/daemon typecheck
      - run: pnpm build
      - run: pnpm exec playwright test tests/e2e/device-revocation.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daemon-revocation-sanitized-evidence
          path: test-results/**/device-revocation-evidence.json
          if-no-files-found: ignore
          retention-days: 7
