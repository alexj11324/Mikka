name: E public Desktop session transport for conversation queue and historical versions
on:
  push:
    branches: [evidence/2254-sidebar-85dfc396]
    paths: [.github/workflows/e-native-thread-controls-evidence.yml, evidence/2262/native-thread-controls/controls.mjs]
permissions:
  contents: read
jobs:
  native-thread-controls:
    if: github.repository == 'alexj11324/Mikka'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: e2e, POSTGRES_PASSWORD: e2e-local-only, POSTGRES_DB: mikka_e2e }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U e2e -d mikka_e2e" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MIKKA_EDITION: cloud
      CI: 'true'
      MIKKA_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      E2E_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      BETTER_AUTH_URL: http://localhost:3000
      AUTH_TRUSTED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      MIKKA_BUILD_REVISION: '6717676486671cc827b134eccc1695e55fe05c72'
      MIKKA_TEST_DEPLOYMENT_SHA: '6717676486671cc827b134eccc1695e55fe05c72'
      NEXT_TELEMETRY_DISABLED: '1'
    defaults:
      run:
        working-directory: product
        shell: bash
    steps:
      - name: Read the isolated evidence driver
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: qa
          persist-credentials: false
          sparse-checkout: evidence/2262/native-thread-controls
      - name: Read immutable public sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: product
          ref: '6717676486671cc827b134eccc1695e55fe05c72'
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - name: Verify exact tree, install public source dependencies
        env:
          FFMPEG_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MIKKA_BUILD_REVISION"
          test "$(git rev-parse 'HEAD^{tree}')" = 924418a9b453ed387665a1bca96c4c11783fea6d
          test ! -e .hosted-ui
          pnpm install --frozen-lockfile
      - name: Install pinned Linux Electron with OS keyring, display and setuid sandbox
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo "$(command -v node)" scripts/ci/apt-mirrors.mjs
          pnpm exec playwright install-deps chromium
          sudo apt-get install -y xvfb dbus-x11 gnome-keyring libsecret-1-0
          node apps/desktop/scripts/install-electron.mjs
          cd apps/desktop
          sandbox="$(node -p "require('node:path').join(require('node:path').dirname(require('electron')),'chrome-sandbox')")"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
      - name: Bootstrap ephemeral local signing, PostgreSQL 17 migrations and unmodified public build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set -euo pipefail
          node --input-type=commonjs - <<'NODE'
          const secret=require('node:crypto').randomBytes(32).toString('hex');
          require('node:fs').writeSync(1,'::add-mask::'+secret+'\n');
          require('node:fs').appendFileSync(process.env.GITHUB_ENV,'BETTER_AUTH_SECRET='+secret+'\n');
          NODE
      - name: Migrate the isolated database and compile public API and Desktop
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set -euo pipefail
          MIGRATE=1 pnpm migrate
          pnpm test:e2e:setup
          pnpm generate:agent-ui
          pnpm build:app --public-test-fixture
          MIKKA_DESKTOP_FLAVOR=dev pnpm --filter @mikka/desktop build --public-test-fixture
      - name: Two protected native sessions through the public Electron main and server
        run: |
          set -euo pipefail
          mkdir -p .cache/e-native-qa
          cp ../qa/evidence/2262/native-thread-controls/controls.mjs .cache/e-native-qa/
          dbus-run-session -- bash -euc '
            printf "%s" "disposable-desktop-test-keyring" | gnome-keyring-daemon --unlock --components=secrets
            xvfb-run -a node apps/desktop/test/environment.mjs -- node --experimental-strip-types .cache/e-native-qa/controls.mjs
          '
      - name: Retain only sanitized source, operation and cleanup receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 67176764-public-native-queue-and-history
          path: ${{ runner.temp }}/native-controls.json
          if-no-files-found: warn
          retention-days: 14
