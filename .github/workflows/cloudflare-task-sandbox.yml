name: Cloudflare task workspace
on:
  pull_request:
    paths: &task_workspace_paths
      - 'cloudflare/task-sandbox/**'
      - 'packages/daemon/harness/**'
      - 'packages/daemon/bin/cloud-worker.ts'
      - 'packages/daemon/src/cloudflare-task-handoff.ts'
      - 'packages/daemon/src/runs/workspace-control*.ts'
      - 'packages/daemon/src/runs/supervisor.ts'
      - 'packages/daemon/src/main.ts'
      - 'packages/daemon/scripts/workspace-control-install.py'
      - 'packages/daemon/scripts/workspace-ingress.py'
      - 'scripts/e2b/terminal-gateway*.py'
      - 'scripts/e2b/preview-gateway*.py'
      - 'scripts/e2b/preview_firewall.py'
      - 'packages/daemon/src/hosted-binaries.ts'
      - 'packages/daemon/scripts/build-cloud-worker.mjs'
      - 'packages/daemon/scripts/prepare-worker-install.py'
      - 'lib/eve/cloudflare-task-*'
      - '.github/workflows/cloudflare-task-sandbox.yml'
  push:
    branches: [main]
    paths: *task_workspace_paths
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --prefix cloudflare/task-sandbox
      - run: node --test cloudflare/task-sandbox/*.test.mjs
      - run: python3 cloudflare/task-sandbox/native-history.test.py
      - name: Verify the task image and both repository-pinned official CLIs offline
        run: |
          docker build --platform linux/amd64 -f cloudflare/task-sandbox/Dockerfile -t mikka-task-sandbox .
          docker run --rm --network none --cap-drop ALL --security-opt=no-new-privileges \
            --user 1000:1000 --entrypoint sh mikka-task-sandbox -ec '
              test -w /workspace
              test -x /usr/local/bin/sandbox-shim
              test -x /usr/bin/unshare
              test -x /usr/bin/setpriv
              /usr/bin/python3 -I -c "import ast, os, signal, sys; assert os.pidfd_open and signal.pidfd_send_signal; [ast.parse(open(p).read()) for p in sys.argv[1:]]" /opt/mikka/task-sandbox/*.py
              test -s /opt/mikka/worker/packages/daemon/dist/cloud/cloud-worker.js
              test -r /opt/mikka/worker/.mikka-original-cli.json
              node --version
              git --version
              claude --version
              codex --version
            '
      - name: Verify the product image isolates every review listener before restoring a task
        run: |
          docker run --rm --network none --cap-add NET_ADMIN --entrypoint sh mikka-task-sandbox -ec '
            export PYTHONDONTWRITEBYTECODE=1
            python3 -I /opt/mikka/runtime/ingress-v1/guard.py prepare-cloudflare
            python3 -I /opt/mikka/task-sandbox/workspace-control-install.py --cloudflare-task
            test "$(stat -c %u:%g:%a /run/mikka-review-control/machine.lock)" = 0:1000:660
            python3 -I /opt/mikka/runtime/ingress-v1/guard.py verify
            python3 -c "import sys;sys.path[:0]=[\"/opt/mikka/preview\",\"/opt/mikka/runtime/preview-python-3.14.0\"];import aiohttp,preview_firewall;assert aiohttp.__version__ == \"3.14.0\""
          '
