name: E post-merge native conversation suite
on:
  push:
    branches: [evidence/2254-sidebar-85dfc396]
    paths: [.github/workflows/e-merged-mobile-conversations.yml]
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PUBLIC: 4ae55457c0230cc1b0d4ab22ba0ac86662b8202d
      PUBLIC_TREE: 01ab9f80d47c634b762534aa8bd2e739a7dedc88
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4ae55457c0230cc1b0d4ab22ba0ac86662b8202d
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - name: Verify exact public main and install its lockfile
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PUBLIC"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PUBLIC_TREE"
          pnpm install --frozen-lockfile
      - name: Run the entire original native suite
        run: |
          set -uo pipefail
          mkdir "$RUNNER_TEMP/native-receipt"
          export R="$RUNNER_TEMP/native-receipt"
          git rev-parse HEAD > "$R/public"
          git rev-parse 'HEAD^{tree}' > "$R/tree"
          date -u +%FT%TZ > "$R/start"
          node -p 'require("./package.json").scripts["test:mobile"]' > "$R/inventory"
          pnpm test:mobile 2>&1 | tee "$R/named-checks.txt"
          code=${PIPESTATUS[0]}
          date -u +%FT%TZ > "$R/end"
          echo "$code" > "$R/exit"
          exit "$code"
      - name: Retain native suite execution, named tests and totals
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-conversation-suite-4ae55457
          path: ${{ runner.temp }}/native-receipt/
          if-no-files-found: error
