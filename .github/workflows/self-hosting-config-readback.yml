name: Official GitHub App public metadata
on:
  push:
    branches: [feat/self-hosting-config-readback-1560]
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read only the public app metadata
        run: |
          node --input-type=module <<'JS'
          const response = await fetch('https://api.github.com/apps/mikka-github', {headers:{accept:'application/vnd.github+json','x-github-api-version':'2022-11-28','user-agent':'Mikka-self-hosting-review'},redirect:'error',signal:AbortSignal.timeout(15000)});
          if (!response.ok) { console.log(JSON.stringify({status:response.status,available:false})); process.exitCode=1; }
          else {
            const v=await response.json();
            if(v.slug!=='mikka-github'||!Number.isSafeInteger(v.id)||!v.permissions||!Array.isArray(v.events)) throw Error('APP_METADATA_INVALID');
            console.log(JSON.stringify({id:v.id,slug:v.slug,owner:v.owner?.login,html_url:v.html_url,permissions:v.permissions,events:v.events,readAt:new Date().toISOString()}));
          }
          JS
