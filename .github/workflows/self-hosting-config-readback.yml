name: Official GitHub App public metadata
on:
  push:
    branches: [feat/self-hosting-config-readback-1560]
permissions:
  contents: read
  id-token: write
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Read existing official app ID through OIDC
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /github
          secret-name: GITHUB_APP_ID
          recursive: false
          include-imports: false
      - name: Read existing official app key through OIDC
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /github
          secret-name: GITHUB_APP_PRIVATE_KEY
          recursive: false
          include-imports: false
      - name: Read only fixed official app permissions and events
        run: |
          node --input-type=module <<'JS'
          import { createPrivateKey, sign } from 'node:crypto';
          try {
            const appId = process.env.GITHUB_APP_ID;
            const key = process.env.GITHUB_APP_PRIVATE_KEY;
            if (!/^[1-9][0-9]*$/.test(appId ?? '') || !key) throw Error('APP_CREDENTIALS_UNAVAILABLE');
            const b64 = value => Buffer.from(JSON.stringify(value)).toString('base64url');
            const now = Math.floor(Date.now()/1000);
            const input = b64({alg:'RS256',typ:'JWT'})+'.'+b64({iat:now-60,exp:now+300,iss:appId});
            const jwt = input+'.'+sign('sha256',Buffer.from(input),createPrivateKey(key.replaceAll('\\n','\n'))).toString('base64url');
            console.log('::add-mask::'+jwt);
            const response = await fetch('https://api.github.com/app', {headers:{authorization:'Bearer '+jwt,accept:'application/vnd.github+json','x-github-api-version':'2022-11-28','user-agent':'Mikka-self-hosting-review'},redirect:'error',signal:AbortSignal.timeout(15000)});
            if (!response.ok) { console.log(JSON.stringify({status:response.status,available:false})); process.exitCode=1; }
            else {
              const v=await response.json();
              if(v.slug!=='mikka-github'||String(v.id)!==appId||!v.permissions||!Array.isArray(v.events)) throw Error('APP_METADATA_INVALID');
              console.log(JSON.stringify({id:v.id,slug:v.slug,owner:v.owner?.login,html_url:v.html_url,permissions:v.permissions,events:v.events,readAt:new Date().toISOString()}));
              const hook=await fetch('https://api.github.com/app/hook/config',{headers:{authorization:'Bearer '+jwt,accept:'application/vnd.github+json','x-github-api-version':'2022-11-28','user-agent':'Mikka-self-hosting-review'},redirect:'error',signal:AbortSignal.timeout(15000)});
              if(!hook.ok){console.log(JSON.stringify({operation:'official_webhook_config',status:hook.status}));process.exitCode=1;}
              else {const h=await hook.json();console.log(JSON.stringify({operation:'official_webhook_config',status:hook.status,urlMatches:h.url==='https://app.aspectlylabs.com/mikka/api/webhooks/github',contentTypeJson:h.content_type==='json',tlsVerificationEnabled:h.insecure_ssl==='0'||h.insecure_ssl===0,setupUrlInAppResponse:typeof v.setup_url==='string',setupUrlMatches:v.setup_url==null?null:v.setup_url==='https://app.aspectlylabs.com/mikka',secretValuesLogged:false}));}

            }
          } catch { console.log(JSON.stringify({available:false,code:'OFFICIAL_APP_METADATA_UNAVAILABLE'})); process.exitCode=1; }
          JS
  private-production-metadata:
    if: github.repository == 'alexj11324/Mikka' && github.ref == 'refs/heads/feat/self-hosting-config-readback-1560'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Read the existing Vercel team token through OIDC
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: VERCEL_TEAM_TOKEN
          recursive: false
          include-imports: false
      - name: Read only fixed private project production variable metadata
        run: |
          node --input-type=module <<'JS'
          try {
            const project = 'prj_vhbbfNIkhDO6grmZ3f6zMUH6k7rc';
            const team = 'team_C7lwxVVvnUicFli6112mvxpv';
            const get = async path => {
              const r = await fetch('https://api.vercel.com'+path, {headers:{authorization:'Bearer '+process.env.VERCEL_TEAM_TOKEN},redirect:'error',signal:AbortSignal.timeout(15000)});
              if (!r.ok) { console.log(JSON.stringify({operation:'private_project_metadata',status:r.status,available:false})); throw Error('READ_FAILED'); }
              return r.json();
            };
            const p = await get('/v9/projects/'+project+'?teamId='+team);
            if (p.id !== project || p.name !== 'mikka-cloud' || p.accountId !== team) throw Error('TARGET_MISMATCH');
            const inventory = await get('/v10/projects/'+project+'/env?teamId='+team+'&decrypt=false');
            if (!Array.isArray(inventory.envs) || inventory.envs.length>2000 || inventory.pagination?.next) throw Error('INCOMPLETE_METADATA');
            const names = ['MIKKA_EDITION','MIKKA_CLOUD_URL','MIKKA_BASE_PATH','BETTER_AUTH_URL','BETTER_AUTH_SECRET','MIKKA_DATABASE_URL','DATABASE_URL','DATABASE_URL_UNPOOLED','MIKKA_CLOUD_DATA_KEY','GITHUB_APP_ID','GITHUB_APP_SLUG','GITHUB_APP_PRIVATE_KEY','GITHUB_WEBHOOK_SECRET','GITHUB_CLIENT_ID','GITHUB_CLIENT_SECRET'];
            const rows = inventory.envs.filter(row => Array.isArray(row.target) && row.target.includes('production') && !row.gitBranch);
            console.log(JSON.stringify({readAt:new Date().toISOString(),projectMatches:true,teamMatches:true,gitRepoMatches:p.link?.org==='alexj11324'&&p.link?.repo==='mikka-cloud',productionVariableCount:rows.length,variables:Object.fromEntries(names.map(name=>[name,{present:rows.some(row=>row.key===name),count:rows.filter(row=>row.key===name).length,integrationOwned:rows.some(row=>row.key===name&&!!row.configurationId)}])),secretValuesRequested:false,configurationWrites:0}));
          } catch { console.log(JSON.stringify({code:'PRIVATE_METADATA_UNAVAILABLE',secretValuesRequested:false,configurationWrites:0})); process.exitCode=1; }
          JS
