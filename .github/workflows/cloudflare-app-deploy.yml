name: Cloudflare application deployment
on:
  workflow_dispatch:
    inputs:
      cloud_source_sha:
        description: Reviewed private operations commit containing the immutable application deployment plan
        type: string
        required: true
      phase:
        description: Reviewed deployment phase; never compiles product source
        type: choice
        required: true
        options: [stage-all, stage-verify, stage-worlds, stage-task, stage-eve, stage-api, stage-web, stage-sessions, production-reserve, production-eve, production-eve-maintenance, production-eve-postgres, production-worlds-prepare, production-api, production-worlds-register, production-web, production-verify, production-migrate-database, gateway-prepare, gateway-observe]
      database_window:
        description: Existing reviewed database migration window; used only by production-migrate-database
        type: string
        required: false
      qualification_run:
        description: Original public Cloud Services qualification run
        type: string
        required: true
      qualification_attempt:
        description: Original qualification attempt
        type: string
        default: '1'
        required: true
      qualification_artifact:
        description: Original public qualification receipt artifact
        type: string
        required: true
permissions:
  contents: read
jobs:
  deploy-application:
    if: github.repository_id == '1427517699' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor_id == '183887963'
    outputs:
      serving-release: ${{ steps.apply.outputs.serving-release }}
    runs-on: ubuntu-latest
    environment: cloudflare-runtime-release
    timeout-minutes: 45
    concurrency:
      group: cloudflare-application-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      MIKKA_CLOUD_SOURCE_SHA: ${{ inputs.cloud_source_sha }}
      MIKKA_CF_OPERATIONS_SHA: ${{ inputs.cloud_source_sha }}
      MIKKA_CF_STAGING_OPERATOR: public-github-actions
      MIKKA_OPERATIONS_CI_RUN_ID: ${{ inputs.qualification_run }}
      MIKKA_OPERATIONS_CI_RUN_ATTEMPT: ${{ inputs.qualification_attempt }}
      MIKKA_OPERATIONS_CI_ARTIFACT_ID: ${{ inputs.qualification_artifact }}
      MIKKA_DEPLOYMENT_PHASE: ${{ inputs.phase }}
      DATABASE_WINDOW: ${{ inputs.database_window }}
      CLOUDFLARE_ACCOUNT_ID: d8f6630c7869111a5139bc5ed4d24ace
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Validate the reviewed operations source
        run: node -e "if (!/^[a-f0-9]{40}$/.test(process.env.MIKKA_CLOUD_SOURCE_SHA || '')) process.exit(1)"
      - name: Verify the actual public release identity
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          const endpoint = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL)
          endpoint.searchParams.set('audience', 'mikka-infisical')
          const response = await fetch(endpoint, {headers: {authorization: 'Bearer ' + process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}})
          assert.equal(response.ok, true)
          const {value} = await response.json()
          const claims = JSON.parse(Buffer.from(value.split('.')[1], 'base64url'))
          assert.equal(claims.repository_id, '1427517699')
          assert.equal(claims.ref, 'refs/heads/main')
          assert.equal(claims.workflow_ref, 'alexj11324/Mikka/.github/workflows/cloudflare-app-deploy.yml@refs/heads/main')
          console.log(JSON.stringify({subject: claims.sub, repositoryId: claims.repository_id, ref: claims.ref, workflowRef: claims.workflow_ref}))
          JS
      - name: Read the existing source App id
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /github
          secret-name: GITHUB_APP_ID
          recursive: false
          include-imports: false
      - name: Read the existing source App private key
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /github
          secret-name: GITHUB_APP_PRIVATE_KEY
          recursive: false
          include-imports: false
      - name: Mint a short-lived read-only operations checkout token
        id: source-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ env.GITHUB_APP_ID }}
          private-key: ${{ env.GITHUB_APP_PRIVATE_KEY }}
          owner: alexj11324
          repositories: |
            Mikka
            mikka-cloud
          permission-contents: read
          permission-actions: read
          permission-issues: read
      - name: Remove App credentials before loading private operations code
        run: |
          echo 'GITHUB_APP_ID=' >> "$GITHUB_ENV"
          echo 'GITHUB_APP_PRIVATE_KEY=' >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: alexj11324/mikka-cloud
          ref: ${{ inputs.cloud_source_sha }}
          token: ${{ steps.source-token.outputs.token }}
          path: operations
          fetch-depth: 0
          persist-credentials: false
      - name: Select the reviewed public application source
        id: product
        working-directory: operations
        run: |
          node --input-type=module <<'JS'
          import {readFile, appendFile} from 'node:fs/promises'
          import assert from 'node:assert/strict'
          const eve = ['production-eve-postgres', 'production-eve-maintenance'].includes(process.env.MIKKA_DEPLOYMENT_PHASE)
          const plan = JSON.parse(await readFile('docs/operations/releases/' + (eve ? 'eve-runtime-production.json' : 'hosted-api-staging.json'), 'utf8'))
          const source = eve ? plan.maintenancePublication.publicSource : plan.publicSource
          assert.match(source, /^[a-f0-9]{40}$/)
          await appendFile(process.env.GITHUB_OUTPUT, 'source=' + source + '\n')
          JS
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: alexj11324/Mikka
          ref: ${{ steps.product.outputs.source }}
          path: operations/product
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.3
      - name: Install deployment tools without rebuilding the product
        working-directory: operations
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install pinned product client and verification dependencies
        working-directory: operations/product
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare Ubuntu package mirrors
        working-directory: operations/product
        run: sudo "$(command -v node)" scripts/ci/apt-mirrors.mjs
      - name: Install immutable image inspection tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
      - name: Read the existing Cloudflare deployment identity
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: CLOUDFLARE_API_TOKEN
          recursive: false
          include-imports: false
      - name: Deploy the reviewed public artifacts and verify the selected phase
        id: apply
        working-directory: operations
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
        run: node operations/public-release.mjs

  serving-release:
    needs: deploy-application
    if: inputs.phase == 'gateway-observe' && needs.deploy-application.outputs.serving-release != ''
    name: Serving release ${{ needs.deploy-application.outputs.serving-release }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Record the verified serving identifiers
        run: echo 'The release identity is recorded in this run attempt.'
