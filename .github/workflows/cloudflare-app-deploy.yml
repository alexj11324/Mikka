name: Cloudflare application deployment
on:
  workflow_run:
    workflows: [Cloudflare API image]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      cloud_source_sha:
        description: Reviewed private operations commit containing the immutable application deployment plan
        type: string
        required: true
      phase:
        description: Reviewed deployment phase; never compiles product source
        type: choice
        required: true
        options: [stage-all, stage-verify, stage-worlds, stage-task, stage-eve, stage-litellm, stage-api, stage-web, stage-sessions, production-reserve, production-litellm, production-eve, production-eve-maintenance, production-eve-postgres, production-worlds-prepare, production-api, production-worlds-register, production-web, production-verify, production-migrate-database, production-task, gateway-prepare, gateway-observe, eve-retire, service-stage, service-production, pipeline-stage, pipeline-rollback]
      database_window:
        description: Existing reviewed database migration window; used only by production-migrate-database
        type: string
        required: false
      qualification_run:
        description: Original public Cloud Services qualification run
        type: string
        required: true
      qualification_attempt:
        description: Original qualification attempt
        type: string
        default: '1'
        required: true
      qualification_artifact:
        description: Original public qualification receipt artifact
        type: string
        required: true
      release_run:
        description: Successful main build run for an emergency pipeline-stage replay
        type: string
        required: false
      pipeline_run:
        description: Previous deployment pipeline run to roll back in staging
        type: string
        required: false
      staging_failure_drill:
        description: Staging-only acceptance exercise that must fail the real route registration probe
        type: choice
        options: [none, route-404]
        default: none
        required: false
concurrency:
  group: cloudflare-application-deployment
  queue: max
  cancel-in-progress: false
permissions:
  contents: read
env:
  MIKKA_PRIVATE_GITHUB_OWNER: ${{ vars.MIKKA_PRIVATE_GITHUB_OWNER == 'aspectly-labs' && 'aspectly-labs' || 'alexj11324' }}
  MIKKA_HOSTED_UI_GITHUB_OWNER: ${{ vars.MIKKA_HOSTED_UI_GITHUB_OWNER }}
jobs:
  deploy-application:
    if: (github.repository_id == '1427517699' && (github.repository_owner_id == '183887963' || github.repository_owner_id == '359279274')) && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor_id == '183887963' && !startsWith(inputs.phase, 'pipeline-')
    outputs:
      serving-release: ${{ steps.apply.outputs.serving-release }}
    runs-on: ubuntu-latest
    environment: cloudflare-runtime-release
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      issues: read
      id-token: write
    env:
      MIKKA_CLOUD_SOURCE_SHA: ${{ inputs.cloud_source_sha }}
      MIKKA_CF_OPERATIONS_SHA: ${{ inputs.cloud_source_sha }}
      MIKKA_CF_STAGING_OPERATOR: public-github-actions
      MIKKA_OPERATIONS_CI_RUN_ID: ${{ inputs.qualification_run }}
      MIKKA_OPERATIONS_CI_RUN_ATTEMPT: ${{ inputs.qualification_attempt }}
      MIKKA_OPERATIONS_CI_ARTIFACT_ID: ${{ inputs.qualification_artifact }}
      MIKKA_DEPLOYMENT_PHASE: ${{ inputs.phase }}
      DATABASE_WINDOW: ${{ inputs.database_window }}
      CLOUDFLARE_ACCOUNT_ID: d8f6630c7869111a5139bc5ed4d24ace
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Validate the reviewed operations source
        run: node -e "if (!/^[a-f0-9]{40}$/.test(process.env.MIKKA_CLOUD_SOURCE_SHA || '')) process.exit(1)"
      - name: Verify the actual public release identity
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          const endpoint = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL)
          endpoint.searchParams.set('audience', 'mikka-infisical')
          const response = await fetch(endpoint, {headers: {authorization: 'Bearer ' + process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}})
          assert.equal(response.ok, true)
          const {value} = await response.json()
          const claims = JSON.parse(Buffer.from(value.split('.')[1], 'base64url'))
          assert.equal(claims.repository_id, '1427517699')
          assert.equal(claims.ref, 'refs/heads/main')
          const owner = {'183887963': 'alexj11324', '359279274': 'aspectly-labs'}[claims.repository_owner_id]
          assert.ok(owner && claims.repository === owner + '/Mikka')
          assert.equal(claims.workflow_ref, claims.repository + '/.github/workflows/cloudflare-app-deploy.yml@refs/heads/main')
          console.log(JSON.stringify({subject: claims.sub, repositoryId: claims.repository_id, ref: claims.ref, workflowRef: claims.workflow_ref}))
          JS
      - name: Select the source App before credential access
        id: source-app
        env:
          SOURCE_OWNER: ${{ vars.MIKKA_PRIVATE_GITHUB_OWNER || 'alexj11324' }}
          ORG_SECRET_PATH: ${{ vars.MIKKA_ORG_GITHUB_SECRET_PATH }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs'
          const owner = process.env.SOURCE_OWNER
          if (!['alexj11324', 'aspectly-labs'].includes(owner)) throw Error('CI_SOURCE_APP_OWNER_REQUIRED')
          const path = owner === 'aspectly-labs' ? process.env.ORG_SECRET_PATH?.trim() : '/github'
          if (!path || /[\r\n]/.test(path)) throw Error('CI_SOURCE_APP_SECRET_PATH_REQUIRED')
          appendFileSync(process.env.GITHUB_OUTPUT, `owner=${owner}\nsecret-path=${path}\napp-id=${owner === 'aspectly-labs' ? '5853576' : '4840908'}\n`)
          JS
      - name: Read the existing source App id
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: ${{ steps.source-app.outputs.secret-path }}
          secret-name: GITHUB_APP_ID
          recursive: false
          include-imports: false
      - name: Read the existing source App private key
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: ${{ steps.source-app.outputs.secret-path }}
          secret-name: GITHUB_APP_PRIVATE_KEY
          recursive: false
          include-imports: false
      - name: Verify the selected source App
        env:
          EXPECTED_SOURCE_APP_ID: ${{ steps.source-app.outputs.app-id }}
        run: node -e 'if (!process.env.EXPECTED_SOURCE_APP_ID || process.env.GITHUB_APP_ID !== process.env.EXPECTED_SOURCE_APP_ID) throw Error("CI_SOURCE_APP_ID_MISMATCH")'
      - name: Mint a short-lived read-only operations checkout token
        id: source-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ env.GITHUB_APP_ID }}
          private-key: ${{ env.GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ vars.MIKKA_PRIVATE_GITHUB_OWNER == 'aspectly-labs' && 'aspectly-labs' || 'alexj11324' }}
          repositories: mikka-cloud
          permission-contents: read
          permission-actions: read
          permission-issues: read
      - name: Remove App credentials before loading private operations code
        run: |
          echo 'GITHUB_APP_ID=' >> "$GITHUB_ENV"
          echo 'GITHUB_APP_PRIVATE_KEY=' >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ format('{0}/mikka-cloud', vars.MIKKA_PRIVATE_GITHUB_OWNER == 'aspectly-labs' && 'aspectly-labs' || 'alexj11324') }}
          ref: ${{ inputs.cloud_source_sha }}
          token: ${{ steps.source-token.outputs.token }}
          path: operations
          fetch-depth: 0
          persist-credentials: false
      - name: Select the reviewed public application source
        id: product
        working-directory: operations
        run: |
          node --input-type=module <<'JS'
          import {readFile, appendFile} from 'node:fs/promises'
          import assert from 'node:assert/strict'
          const eve = ['production-eve-postgres', 'production-eve-maintenance'].includes(process.env.MIKKA_DEPLOYMENT_PHASE)
          // A per-service release (service-*) builds from its own request's source.
          const service = process.env.MIKKA_DEPLOYMENT_PHASE.startsWith('service-')
          const plan = JSON.parse(await readFile('docs/operations/releases/' + (eve ? 'eve-runtime-production.json' : service ? 'service-release.json' : 'hosted-api-staging.json'), 'utf8'))
          const source = eve ? plan.maintenancePublication.publicSource : plan.publicSource
          assert.match(source, /^[a-f0-9]{40}$/)
          await appendFile(process.env.GITHUB_OUTPUT, 'source=' + source + '\n')
          JS
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.product.outputs.source }}
          path: operations/product
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.3
      - name: Install deployment tools without rebuilding the product
        working-directory: operations
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install pinned product client and verification dependencies
        working-directory: operations/product
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare Ubuntu package mirrors
        working-directory: operations/product
        run: sudo "$(command -v node)" scripts/ci/apt-mirrors.mjs
      - name: Install immutable image inspection tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
      - name: Read the existing Cloudflare deployment identity
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: CLOUDFLARE_API_TOKEN
          recursive: false
          include-imports: false
      - name: Deploy the reviewed public artifacts and verify the selected phase
        id: apply
        working-directory: operations
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
          MIKKA_PUBLIC_ACTIONS_TOKEN: ${{ github.token }}
        run: node operations/public-release.mjs

  serving-release:
    needs: deploy-application
    # gateway-observe after a cutover, or a per-service Web release (which deploys and checks its own gateway version).
    if: (inputs.phase == 'gateway-observe' || inputs.phase == 'service-production') && needs.deploy-application.outputs.serving-release != ''
    name: Serving release ${{ needs.deploy-application.outputs.serving-release }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Record the verified serving identifiers
        run: echo 'The release identity is recorded in this run attempt.'


  pipeline:
    if: (github.repository_id == '1427517699' && (github.repository_owner_id == '183887963' || github.repository_owner_id == '359279274')) && github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_run' && (github.actor_id == '183887963' || (github.actor_id == '118344674' && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || github.triggering_actor == 'alexj11324'))) && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.id == github.event.repository.id) || (github.event_name == 'workflow_dispatch' && github.actor_id == '183887963' && (inputs.phase == 'pipeline-stage' || inputs.phase == 'pipeline-rollback')))
    runs-on: ubuntu-latest
    environment: cloudflare-runtime-release
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      issues: read
      id-token: write
    outputs:
      selected: ${{ steps.select.outputs.status }}
      source: ${{ steps.select.outputs.source }}
      operations: ${{ steps.select.outputs.operations }}
      artifact: ${{ steps.report.outputs.artifact-id }}
      production-enabled: ${{ steps.policy.outputs.enabled }}
    env:
      MIKKA_DEPLOYMENT_PHASE: ${{ github.event_name == 'workflow_run' && 'pipeline-stage' || inputs.phase }}
      MIKKA_STAGING_FAILURE_DRILL: ${{ github.event_name == 'workflow_dispatch' && inputs.staging_failure_drill == 'route-404' && 'route-404' || '' }}
      MIKKA_CF_STAGING_OPERATOR: public-github-actions
      CLOUDFLARE_ACCOUNT_ID: d8f6630c7869111a5139bc5ed4d24ace
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify the actual public release identity
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          const endpoint = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL)
          endpoint.searchParams.set('audience', 'mikka-infisical')
          const response = await fetch(endpoint, {headers: {authorization: 'Bearer ' + process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}})
          assert.equal(response.ok, true)
          const {value} = await response.json()
          const claims = JSON.parse(Buffer.from(value.split('.')[1], 'base64url'))
          assert.equal(claims.repository_id, '1427517699')
          assert.equal(claims.ref, 'refs/heads/main')
          const owner = {'183887963': 'alexj11324', '359279274': 'aspectly-labs'}[claims.repository_owner_id]
          assert.ok(owner && claims.repository === owner + '/Mikka')
          assert.equal(claims.workflow_ref, claims.repository + '/.github/workflows/cloudflare-app-deploy.yml@refs/heads/main')
          console.log(JSON.stringify({subject: claims.sub, repositoryId: claims.repository_id, ref: claims.ref, workflowRef: claims.workflow_ref}))
          JS
      - name: Select the source App before credential access
        id: source-app
        env:
          SOURCE_OWNER: ${{ vars.MIKKA_PRIVATE_GITHUB_OWNER || 'alexj11324' }}
          ORG_SECRET_PATH: ${{ vars.MIKKA_ORG_GITHUB_SECRET_PATH }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs'
          const owner = process.env.SOURCE_OWNER
          if (!['alexj11324', 'aspectly-labs'].includes(owner)) throw Error('CI_SOURCE_APP_OWNER_REQUIRED')
          const path = owner === 'aspectly-labs' ? process.env.ORG_SECRET_PATH?.trim() : '/github'
          if (!path || /[\r\n]/.test(path)) throw Error('CI_SOURCE_APP_SECRET_PATH_REQUIRED')
          appendFileSync(process.env.GITHUB_OUTPUT, `owner=${owner}\nsecret-path=${path}\napp-id=${owner === 'aspectly-labs' ? '5853576' : '4840908'}\n`)
          JS
      - name: Read the existing source App id
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: ${{ steps.source-app.outputs.secret-path }}
          secret-name: GITHUB_APP_ID
          recursive: false
          include-imports: false
      - name: Read the existing source App private key
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: ${{ steps.source-app.outputs.secret-path }}
          secret-name: GITHUB_APP_PRIVATE_KEY
          recursive: false
          include-imports: false
      - name: Verify the selected source App
        env:
          EXPECTED_SOURCE_APP_ID: ${{ steps.source-app.outputs.app-id }}
        run: node -e 'if (!process.env.EXPECTED_SOURCE_APP_ID || process.env.GITHUB_APP_ID !== process.env.EXPECTED_SOURCE_APP_ID) throw Error("CI_SOURCE_APP_ID_MISMATCH")'
      - name: Mint a short-lived read-only operations checkout token
        id: source-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ env.GITHUB_APP_ID }}
          private-key: ${{ env.GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ vars.MIKKA_PRIVATE_GITHUB_OWNER == 'aspectly-labs' && 'aspectly-labs' || 'alexj11324' }}
          repositories: mikka-cloud
          permission-contents: read
          permission-actions: read
          permission-issues: read
      - name: Remove App credentials before loading private operations code
        run: |
          echo 'GITHUB_APP_ID=' >> "$GITHUB_ENV"
          echo 'GITHUB_APP_PRIVATE_KEY=' >> "$GITHUB_ENV"
      - name: Select the latest verified main candidate and staging baseline
        id: select
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
          MIKKA_PUBLIC_ACTIONS_TOKEN: ${{ github.token }}
          INPUT_CLOUD_SOURCE: ${{ inputs.cloud_source_sha }}
          INPUT_RELEASE_RUN: ${{ inputs.release_run }}
          INPUT_PIPELINE_RUN: ${{ inputs.pipeline_run }}
        run: node scripts/release/pipeline-inputs.mjs
      - name: Check out the pinned operations source
        if: steps.select.outputs.status == 'selected'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ format('{0}/mikka-cloud', vars.MIKKA_PRIVATE_GITHUB_OWNER == 'aspectly-labs' && 'aspectly-labs' || 'alexj11324') }}
          ref: ${{ steps.select.outputs.operations }}
          token: ${{ steps.source-token.outputs.token }}
          path: operations
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the manifest's public application source
        if: steps.select.outputs.status == 'selected'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.select.outputs.source }}
          path: operations/product
          fetch-depth: 0
          persist-credentials: false
      - name: Read the reviewed production enablement policy
        if: steps.select.outputs.status == 'selected'
        id: policy
        working-directory: operations
        run: |
          node --input-type=module <<'JS'
          import {readFile, appendFile} from 'node:fs/promises'
          import assert from 'node:assert/strict'
          const policy = JSON.parse(await readFile('docs/operations/releases/deploy-pipeline.json', 'utf8'))
          assert.equal(typeof policy.autoProduction, 'boolean')
          await appendFile(process.env.GITHUB_OUTPUT, 'enabled=' + policy.autoProduction + '\n')
          JS
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        if: steps.select.outputs.status == 'selected'
        with:
          version: 10.34.3
      - name: Install deployment tools without rebuilding the product
        if: steps.select.outputs.status == 'selected'
        working-directory: operations
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify migration admission before preparing the product
        if: steps.select.outputs.status == 'selected'
        working-directory: operations
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
          MIKKA_PUBLIC_ACTIONS_TOKEN: ${{ github.token }}
        run: node operations/business-api/pipeline-preflight.mjs
      - name: Install pinned product client and verification dependencies
        if: steps.select.outputs.status == 'selected'
        working-directory: operations/product
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare Ubuntu package mirrors
        if: steps.select.outputs.status == 'selected'
        working-directory: operations/product
        run: sudo "$(command -v node)" scripts/ci/apt-mirrors.mjs
      - name: Install immutable image inspection tools
        if: steps.select.outputs.status == 'selected'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
      - name: Read the existing Cloudflare deployment identity
        if: steps.select.outputs.status == 'selected'
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: CLOUDFLARE_API_TOKEN
          recursive: false
          include-imports: false
      - name: Deploy and verify staged service manifest
        if: steps.select.outputs.status == 'selected'
        working-directory: operations
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
          MIKKA_PUBLIC_ACTIONS_TOKEN: ${{ github.token }}
        run: node operations/public-release.mjs
      - name: Upload pipeline receipts
        id: report
        if: always() && steps.select.outputs.status == 'selected'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deploy-pipeline-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/deploy-pipeline/release-manifest.json
            ${{ runner.temp }}/deploy-pipeline/previous-manifest.json
            ${{ runner.temp }}/deploy-pipeline/pipeline-summary.json
          if-no-files-found: error
          retention-days: 90

  pipeline-record:
    needs: pipeline
    if: always() && !cancelled() && (needs.pipeline.outputs.selected == 'selected' || needs.pipeline.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      deployments: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Read safe staging evidence
        if: needs.pipeline.outputs.artifact != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.pipeline.outputs.artifact }}
          path: pipeline-report
          merge-multiple: true
      - name: Record deployment outcome and failure issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PIPELINE_JOB_RESULT: ${{ needs.pipeline.result }}
          PIPELINE_TARGET: staging
          PIPELINE_SOURCE: ${{ needs.pipeline.outputs.source || github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/release/pipeline-record.mjs

  pipeline-production:
    needs: [pipeline, pipeline-record]
    if: github.event_name == 'workflow_run' && needs.pipeline.result == 'success' && needs.pipeline-record.result == 'success' && needs.pipeline.outputs.production-enabled == 'true'
    runs-on: ubuntu-latest
    environment: cloudflare-runtime-release
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      issues: read
      id-token: write
    outputs:
      selected: ${{ steps.select.outputs.status }}
      source: ${{ steps.select.outputs.source }}
      operations: ${{ steps.select.outputs.operations }}
      artifact: ${{ steps.report.outputs.artifact-id }}
    env:
      MIKKA_DEPLOYMENT_PHASE: pipeline-promote
      MIKKA_CF_STAGING_OPERATOR: public-github-actions
      CLOUDFLARE_ACCOUNT_ID: d8f6630c7869111a5139bc5ed4d24ace
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify the actual public release identity
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          const endpoint = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL)
          endpoint.searchParams.set('audience', 'mikka-infisical')
          const response = await fetch(endpoint, {headers: {authorization: 'Bearer ' + process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}})
          assert.equal(response.ok, true)
          const {value} = await response.json()
          const claims = JSON.parse(Buffer.from(value.split('.')[1], 'base64url'))
          assert.equal(claims.repository_id, '1427517699')
          assert.equal(claims.ref, 'refs/heads/main')
          const owner = {'183887963': 'alexj11324', '359279274': 'aspectly-labs'}[claims.repository_owner_id]
          assert.ok(owner && claims.repository === owner + '/Mikka')
          assert.equal(claims.workflow_ref, claims.repository + '/.github/workflows/cloudflare-app-deploy.yml@refs/heads/main')
          console.log(JSON.stringify({subject: claims.sub, repositoryId: claims.repository_id, ref: claims.ref, workflowRef: claims.workflow_ref}))
          JS
      - name: Select the source App before credential access
        id: source-app
        env:
          SOURCE_OWNER: ${{ vars.MIKKA_PRIVATE_GITHUB_OWNER || 'alexj11324' }}
          ORG_SECRET_PATH: ${{ vars.MIKKA_ORG_GITHUB_SECRET_PATH }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs'
          const owner = process.env.SOURCE_OWNER
          if (!['alexj11324', 'aspectly-labs'].includes(owner)) throw Error('CI_SOURCE_APP_OWNER_REQUIRED')
          const path = owner === 'aspectly-labs' ? process.env.ORG_SECRET_PATH?.trim() : '/github'
          if (!path || /[\r\n]/.test(path)) throw Error('CI_SOURCE_APP_SECRET_PATH_REQUIRED')
          appendFileSync(process.env.GITHUB_OUTPUT, `owner=${owner}\nsecret-path=${path}\napp-id=${owner === 'aspectly-labs' ? '5853576' : '4840908'}\n`)
          JS
      - name: Read the existing source App id
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: ${{ steps.source-app.outputs.secret-path }}
          secret-name: GITHUB_APP_ID
          recursive: false
          include-imports: false
      - name: Read the existing source App private key
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: ${{ steps.source-app.outputs.secret-path }}
          secret-name: GITHUB_APP_PRIVATE_KEY
          recursive: false
          include-imports: false
      - name: Verify the selected source App
        env:
          EXPECTED_SOURCE_APP_ID: ${{ steps.source-app.outputs.app-id }}
        run: node -e 'if (!process.env.EXPECTED_SOURCE_APP_ID || process.env.GITHUB_APP_ID !== process.env.EXPECTED_SOURCE_APP_ID) throw Error("CI_SOURCE_APP_ID_MISMATCH")'
      - name: Mint a short-lived read-only operations checkout token
        id: source-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ env.GITHUB_APP_ID }}
          private-key: ${{ env.GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ vars.MIKKA_PRIVATE_GITHUB_OWNER == 'aspectly-labs' && 'aspectly-labs' || 'alexj11324' }}
          repositories: mikka-cloud
          permission-contents: read
          permission-actions: read
          permission-issues: read
      - name: Remove App credentials before loading private operations code
        run: |
          echo 'GITHUB_APP_ID=' >> "$GITHUB_ENV"
          echo 'GITHUB_APP_PRIVATE_KEY=' >> "$GITHUB_ENV"
      - name: Select the verified staging result and production baseline
        id: select
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
          MIKKA_PUBLIC_ACTIONS_TOKEN: ${{ github.token }}
          INPUT_OPERATIONS_SOURCE: ${{ needs.pipeline.outputs.operations }}
          INPUT_STAGE_ARTIFACT: ${{ needs.pipeline.outputs.artifact }}
        run: node scripts/release/pipeline-inputs.mjs promote
      - name: Check out the pinned operations source
        if: steps.select.outputs.status == 'selected'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ format('{0}/mikka-cloud', vars.MIKKA_PRIVATE_GITHUB_OWNER == 'aspectly-labs' && 'aspectly-labs' || 'alexj11324') }}
          ref: ${{ steps.select.outputs.operations }}
          token: ${{ steps.source-token.outputs.token }}
          path: operations
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the manifest's public application source
        if: steps.select.outputs.status == 'selected'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.select.outputs.source }}
          path: operations/product
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        if: steps.select.outputs.status == 'selected'
        with:
          version: 10.34.3
      - name: Install deployment tools without rebuilding the product
        if: steps.select.outputs.status == 'selected'
        working-directory: operations
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify migration admission before preparing the product
        if: steps.select.outputs.status == 'selected'
        working-directory: operations
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
          MIKKA_PUBLIC_ACTIONS_TOKEN: ${{ github.token }}
        run: node operations/business-api/pipeline-preflight.mjs
      - name: Install pinned product client and verification dependencies
        if: steps.select.outputs.status == 'selected'
        working-directory: operations/product
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare Ubuntu package mirrors
        if: steps.select.outputs.status == 'selected'
        working-directory: operations/product
        run: sudo "$(command -v node)" scripts/ci/apt-mirrors.mjs
      - name: Install immutable image inspection tools
        if: steps.select.outputs.status == 'selected'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
      - name: Read the existing Cloudflare deployment identity
        if: steps.select.outputs.status == 'selected'
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: CLOUDFLARE_API_TOKEN
          recursive: false
          include-imports: false
      - name: Promote and verify the staged service manifest
        if: steps.select.outputs.status == 'selected'
        working-directory: operations
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
          MIKKA_PUBLIC_ACTIONS_TOKEN: ${{ github.token }}
        run: node operations/public-release.mjs
      - name: Upload production receipts
        id: report
        if: always() && steps.select.outputs.status == 'selected'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deploy-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/deploy-production/release-manifest.json
            ${{ runner.temp }}/deploy-production/previous-manifest.json
            ${{ runner.temp }}/deploy-production/pipeline-summary.json
          if-no-files-found: error
          retention-days: 90

  pipeline-production-record:
    needs: pipeline-production
    if: always() && !cancelled() && (needs.pipeline-production.outputs.selected == 'selected' || needs.pipeline-production.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      deployments: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Read safe production evidence
        if: needs.pipeline-production.outputs.artifact != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.pipeline-production.outputs.artifact }}
          path: production-report
          merge-multiple: true
      - name: Record deployment outcome and failure issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PIPELINE_REPORT_DIRECTORY: production-report
          PIPELINE_JOB_RESULT: ${{ needs.pipeline-production.result }}
          PIPELINE_TARGET: production
          PIPELINE_SOURCE: ${{ needs.pipeline-production.outputs.source || github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/release/pipeline-record.mjs
