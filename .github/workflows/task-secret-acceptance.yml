name: Task Secret scoped external acceptance
# The upstream webhook is a pointer; authenticate it before checkout or OIDC.
on:
  workflow_run:
    workflows: [E2B additive runtime release]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only preflight or one native task per selected official subscription
        type: choice
        options: [preflight, execute]
        default: preflight
      application_sha:
        description: Exact main SHA already served by production
        type: string
        required: true
      worker_sha:
        description: Exact released worker content SHA; required for execute
        type: string
      worker_source_sha:
        description: Exact released worker source commit; required for execute
        type: string
      claude_template:
        description: Released Claude template ID; required for execute
        type: string
      codex_template:
        description: Released Codex template ID; required for execute
        type: string
      model_case:
        description: Keep each case on its own fixed official subscription
        type: choice
        options: [all, claude, codex]
        default: all
      factory_acceptance:
        description: Also run the existing ACME Factory artifact acceptance; only execute with all models
        type: boolean
        default: false
      production_canary:
        description: Explicit manual write of one new private synthetic Secret; requires a reserved owner window and full-owner DB checks
        type: boolean
        default: false
      canary_window:
        description: JSON with comment (exact issue 1752 window comment URL) and expiresAt (UTC ISO with milliseconds, within 45 minutes)
        type: string
permissions:
  contents: read
jobs:
  authorize:
    if: >-
      github.repository == 'alexj11324/Mikka' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      source-sha: ${{ steps.source.outputs.source-sha }}
      upstream-run-id: ${{ steps.source.outputs.upstream-run-id }}
      upstream-run-attempt: ${{ steps.source.outputs.upstream-run-attempt }}
      selected: ${{ steps.select.outputs.selected }}
    steps:
      - name: Authenticate main and official upstream before checkout or workload credentials
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPLICATION_SHA: ${{ inputs.application_sha }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs'
          try {
            const repo = 'alexj11324/Mikka', path = '.github/workflows/e2b-official-runtime.yml'
            const name = 'E2B additive runtime release', sha = /^[a-f0-9]{40}$/
            const positive = value => Number.isSafeInteger(value) && value > 0
            const check = value => { if (!value) throw Error('task_secret_source_refused') }
            check(process.env.GITHUB_ACTIONS === 'true' && process.env.GITHUB_REPOSITORY === repo
              && process.env.GITHUB_REF === 'refs/heads/main' && process.env.GITHUB_TOKEN
              && ['workflow_run', 'workflow_dispatch'].includes(process.env.GITHUB_EVENT_NAME)
              && /^[1-9][0-9]*$/.test(process.env.GITHUB_RUN_ATTEMPT ?? ''))
            const read = async suffix => {
              const response = await fetch('https://api.github.com/repos/' + repo + suffix, {
                headers: { accept: 'application/vnd.github+json', authorization: 'Bearer ' + process.env.GITHUB_TOKEN,
                  'x-github-api-version': '2022-11-28' }, redirect: 'error', signal: AbortSignal.timeout(20000),
              })
              check(response.ok); return response.json()
            }
            if (process.env.GITHUB_EVENT_NAME === 'workflow_dispatch') {
              const main = await read('/git/ref/heads/main'), source = process.env.APPLICATION_SHA
              check(sha.test(source ?? '') && source === process.env.GITHUB_SHA
                && main.object?.type === 'commit' && main.object.sha === source)
              appendFileSync(process.env.GITHUB_OUTPUT, `source-sha=${source}\n`)
            } else {
              check(Number(process.env.GITHUB_RUN_ATTEMPT) <= 2)
              const pointer = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8')).workflow_run
              check(positive(pointer?.id) && positive(pointer?.run_attempt) && positive(pointer?.workflow_id)
                && sha.test(pointer?.head_sha ?? '') && pointer.name === name
                && pointer.status === 'completed' && pointer.conclusion === 'success'
                && ['push', 'workflow_dispatch'].includes(pointer.event) && pointer.head_branch === 'main'
                && pointer.repository?.full_name === repo && pointer.head_repository?.full_name === repo)
              const [workflow, run, main] = await Promise.all([
                read('/actions/workflows/e2b-official-runtime.yml'), read('/actions/runs/' + pointer.id), read('/git/ref/heads/main'),
              ])
              check(workflow.id === pointer.workflow_id && workflow.path === path && workflow.name === name && workflow.state === 'active')
              check(run.id === pointer.id && run.run_attempt === pointer.run_attempt && run.workflow_id === workflow.id
                && run.path === path && run.name === name && run.status === 'completed' && run.conclusion === 'success'
                && run.event === pointer.event && ['push', 'workflow_dispatch'].includes(run.event)
                && run.head_branch === 'main' && run.head_sha === pointer.head_sha
                && run.repository?.full_name === repo && run.head_repository?.full_name === repo)
              check(main.object?.type === 'commit' && sha.test(main.object?.sha ?? '') && main.object.sha === run.head_sha)
              appendFileSync(process.env.GITHUB_OUTPUT,
                `source-sha=${run.head_sha}\nupstream-run-id=${run.id}\nupstream-run-attempt=${run.run_attempt}\n`)
            }
          } catch {
            console.error('task_secret_source_refused'); process.exitCode = 1
          }
          JS
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.source.outputs.source-sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Select relevant source and a fully published current-attempt release
        id: select
        run: node scripts/acceptance/task-secrets-ci.mjs eligible
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPLICATION_SHA: ${{ steps.source.outputs.source-sha }}
          EXPECTED_SOURCE_SHA: ${{ steps.source.outputs.source-sha }}
          EXPECTED_UPSTREAM_RUN_ID: ${{ steps.source.outputs.upstream-run-id }}
          EXPECTED_UPSTREAM_RUN_ATTEMPT: ${{ steps.source.outputs.upstream-run-attempt }}
      - name: Retain selection receipt without a workload credential
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: task-secret-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/task-secrets-ci/attestation.json
          retention-days: 14
          if-no-files-found: ignore
  acceptance:
    needs: authorize
    if: needs.authorize.outputs.selected == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: production-smoke-owner-acceptance
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      APPLICATION_SHA: ${{ needs.authorize.outputs.source-sha }}
      EXPECTED_SOURCE_SHA: ${{ needs.authorize.outputs.source-sha }}
      EXPECTED_UPSTREAM_RUN_ID: ${{ needs.authorize.outputs.upstream-run-id }}
      EXPECTED_UPSTREAM_RUN_ATTEMPT: ${{ needs.authorize.outputs.upstream-run-attempt }}
      EXPECTED_WORKER_SHA: ${{ inputs.worker_sha }}
      EXPECTED_WORKER_SOURCE_SHA: ${{ inputs.worker_source_sha }}
      EXPECTED_CLAUDE_TEMPLATE: ${{ inputs.claude_template }}
      EXPECTED_CODEX_TEMPLATE: ${{ inputs.codex_template }}
      TASK_SECRETS_MODEL_CASE: ${{ github.event_name == 'workflow_run' && 'all' || inputs.model_case }}
      ACCEPTANCE_MODE: ${{ github.event_name == 'workflow_run' && 'execute' || inputs.mode }}
      PRODUCTION_CANARY: ${{ github.event_name == 'workflow_dispatch' && inputs.production_canary && 'true' || 'false' }}
      TASK_SECRETS_WINDOW: ${{ inputs.canary_window }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.authorize.outputs.source-sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install exact source-only dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check native scopes and actual trigger guards before credentials
        run: node --import tsx --test scripts/acceptance/task-secrets.test.mjs scripts/acceptance/task-secrets-ci.test.mjs
      - name: Bind unique release artifact to run, attempt and computed worker hash
        if: github.event_name == 'workflow_run'
        run: node scripts/acceptance/task-secrets-ci.mjs prepare
      - name: Recheck main, upstream attempt and public build immediately before account email
        run: &attest |
          node --import tsx --input-type=module <<'JS'
          import { attestAcceptance } from './scripts/acceptance/task-secrets-ci.mjs'
          import { readOptions } from './scripts/acceptance/task-secrets.mjs'
          const proof = await attestAcceptance(process.env)
          const args = process.env.ACCEPTANCE_MODE === 'execute' ? ['--execute'] : []
          if (process.env.PRODUCTION_CANARY === 'true') args.push('--production-canary')
          readOptions(args, process.env, proof)
          console.log('task_secret_credential_read_guard_passed')
          JS
      - name: Read only existing shared acceptance account
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          secret-name: SMOKE_OWNER_EMAIL
          recursive: false
          include-imports: false
      - name: Recheck main, upstream attempt and public build immediately before read-only owner database checks
        if: env.PRODUCTION_CANARY == 'true'
        run: *attest
      - name: Read existing database binding only for explicit production canary idle checks
        if: env.PRODUCTION_CANARY == 'true'
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /vercel
          secret-name: MIKKA_DATABASE_URL
          recursive: false
          include-imports: false
      - name: Recheck main, upstream attempt and public build immediately before account password
        run: *attest
      - name: Read only that account password
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          secret-name: SMOKE_OWNER_PASSWORD
          recursive: false
          include-imports: false
      - name: Recheck main, upstream attempt and public build immediately before fixture key
        if: env.ACCEPTANCE_MODE == 'execute'
        run: *attest
      - name: Read existing runtime-test E2B key for one disposable fixture
        if: env.ACCEPTANCE_MODE == 'execute'
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /vercel
          secret-name: E2B_API_KEY
          recursive: false
          include-imports: false
      - name: Execute only selected bounded acceptance mode
        run: |
          args=()
          if [ "$ACCEPTANCE_MODE" = execute ]; then args+=(--execute); fi
          if [ "$PRODUCTION_CANARY" = true ]; then args+=(--production-canary); fi
          node --import tsx scripts/acceptance/task-secrets.mjs "${args[@]}"
      - name: Retain only projected receipt and release attestation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: task-secret-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            production-task-secrets-report/report.json
            production-task-secrets-report/canary-journal.json
            ${{ runner.temp }}/task-secrets-ci/attestation.json
          retention-days: 14
          if-no-files-found: warn

  factory:
    needs: authorize
    if: >-
      needs.authorize.outputs.selected == 'true' &&
      (github.event_name == 'workflow_run' ||
       (github.event_name == 'workflow_dispatch' && inputs.mode == 'execute' && inputs.model_case == 'all' && inputs.factory_acceptance))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: run-trace-production-acceptance
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      APPLICATION_SHA: ${{ needs.authorize.outputs.source-sha }}
      EXPECTED_SOURCE_SHA: ${{ needs.authorize.outputs.source-sha }}
      EXPECTED_UPSTREAM_RUN_ID: ${{ needs.authorize.outputs.upstream-run-id }}
      EXPECTED_UPSTREAM_RUN_ATTEMPT: ${{ needs.authorize.outputs.upstream-run-attempt }}
      EXPECTED_WORKER_SHA: ${{ inputs.worker_sha }}
      EXPECTED_WORKER_SOURCE_SHA: ${{ inputs.worker_source_sha }}
      EXPECTED_CLAUDE_TEMPLATE: ${{ inputs.claude_template }}
      EXPECTED_CODEX_TEMPLATE: ${{ inputs.codex_template }}
      TASK_SECRETS_MODEL_CASE: ${{ github.event_name == 'workflow_run' && 'all' || inputs.model_case }}
      ACCEPTANCE_MODE: ${{ github.event_name == 'workflow_run' && 'execute' || inputs.mode }}
      FACTORY_ACCEPTANCE_REQUESTED: ${{ github.event_name == 'workflow_run' && 'true' || inputs.factory_acceptance && 'true' || 'false' }}
      MIKKA_EXPECTED_DEPLOYMENT_SHA: ${{ needs.authorize.outputs.source-sha }}
      MIKKA_OBSERVABILITY_MODEL_CASE: all
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.authorize.outputs.source-sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install exact source-only Factory guard dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify existing Factory execution and new trigger guards before credentials
        run: node --import tsx --test scripts/acceptance/run-observability.test.mjs scripts/acceptance/run-observability-workflow.test.mjs scripts/acceptance/task-secrets-ci.test.mjs
      - name: Bind the same published source and exact release attempt for Factory
        if: github.event_name == 'workflow_run'
        run: node scripts/acceptance/task-secrets-ci.mjs prepare
      - name: Recheck Factory scope, main, upstream attempt and public build immediately before account email
        run: &factory-attest |
          node --import tsx --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs'
          import { join } from 'node:path'
          import { attestAcceptance, factoryAcceptanceScope } from './scripts/acceptance/task-secrets-ci.mjs'
          import { readOptions } from './scripts/acceptance/task-secrets.mjs'
          const scope = factoryAcceptanceScope(process.env)
          const proof = await attestAcceptance(process.env)
          readOptions(['--execute'], process.env, proof)
          writeFileSync(join(process.env.RUNNER_TEMP, 'task-secrets-ci', 'factory-scope.json'), JSON.stringify(scope) + '\n', { mode: 0o600 })
          console.log('task_secret_factory_credential_read_guard_passed')
          JS
      - name: Read only the original Factory acceptance account email
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          secret-name: ACME_DEMO_EMAIL
          recursive: false
          include-imports: false
      - name: Recheck Factory scope, main, upstream attempt and public build immediately before account password
        run: *factory-attest
      - name: Read only that Factory account password
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          secret-name: ACME_DEMO_PASSWORD
          recursive: false
          include-imports: false
      - name: Recheck Factory source and scope immediately before ordinary execution
        run: *factory-attest
      - name: Run the existing complete Factory artifact acceptance on both subscriptions
        run: node scripts/acceptance/run-observability-workflow.mjs --execute
      - name: Preserve the original Factory report and explicit scope
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: task-secret-factory-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            production-run-observability-report/report.json
            ${{ runner.temp }}/task-secrets-ci/attestation.json
            ${{ runner.temp }}/task-secrets-ci/factory-scope.json
          retention-days: 14
          if-no-files-found: warn
