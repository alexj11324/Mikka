name: Controlled Skill improvement
on:
  push:
    branches-ignore: ['gh-readonly-queue/**']
  pull_request:
  merge_group:
permissions:
  contents: read
env:
  # A cache restore that fails (e.g. the account's cache egress limit) would
  # otherwise hang for actions/cache's 10-minute default before falling back
  # to a normal install, which outlasts the short jobs' own timeouts.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'

jobs:
  postgres-http:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: improvement
          POSTGRES_PASSWORD: disposable-local-only
          POSTGRES_DB: mikka_improvement
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U improvement -d mikka_improvement"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --import tsx --test lib/self-improvement/scorer.test.ts lib/self-improvement/assignments.test.ts lib/self-improvement/postgres.test.ts lib/self-improvement/wiring-postgres.test.ts
        env:
          IMPROVEMENT_TEST_URL: postgresql://improvement:disposable-local-only@127.0.0.1:5432/mikka_improvement
      - run: pnpm test:self-improvement-semantic-source
      - run: pnpm test:skill-semantic-db
        env:
          IMPROVEMENT_TEST_URL: postgresql://improvement:disposable-local-only@127.0.0.1:5432/mikka_improvement
          SKILL_COMPARISON_TEST_URL: postgresql://improvement:disposable-local-only@127.0.0.1:5432/mikka_improvement
      - run: pnpm --filter @mikka/daemon exec vitest run test/server-link-http.test.ts
