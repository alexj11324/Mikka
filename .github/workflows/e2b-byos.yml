name: E2B subscription custody
# Pull requests only: the same suite already passed on the PR, and main's
# CI workflow (ui-policy.yml) still verifies every merged commit.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - 'lib/subscription*'
      - 'lib/infisical-workload*'
      - 'packages/subscription-worker/**'
      - 'packages/daemon/**'
      - 'packages/protocol/**'
      - 'scripts/test-subscription*'
      - 'tests/byos-*'
      - '.github/workflows/e2b-byos.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: e2b-byos-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # A cache restore that fails (e.g. the account's cache egress limit) would
  # otherwise hang for actions/cache's 10-minute default before falling back
  # to a normal install, which outlasts the short jobs' own timeouts.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'

jobs:
  custody:
    # Draft-only work is exercised locally; ready_for_review runs CI.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:byos
      - run: pnpm --filter @mikka/protocol exec vitest run src/subscription.test.ts
      # Hosted runs start the CLI directly on the task's machine: no sandbox tools (decision 2026-11-01-2335).
      - run: pnpm --filter @mikka/daemon exec vitest run test/subscription-hosted-runner.test.ts
      - run: pnpm test:byos-worker
        env:
          MIKKA_BYOS_BACKEND_ONLY: '1'
