name: E2B subscription custody
on:
  push:
    branches: [main, 'codex/e2b-cloud-computer-172']
    paths:
      - 'lib/subscription*'
      - 'lib/infisical-workload*'
      - 'packages/subscription-worker/**'
      - 'packages/daemon/**'
      - 'packages/protocol/**'
      - 'scripts/test-subscription*'
      - 'tests/byos-*'
      - '.github/workflows/e2b-byos.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    paths:
      - 'lib/subscription*'
      - 'lib/infisical-workload*'
      - 'packages/subscription-worker/**'
      - 'packages/daemon/**'
      - 'packages/protocol/**'
      - 'scripts/test-subscription*'
      - 'tests/byos-*'
      - '.github/workflows/e2b-byos.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
permissions:
  contents: read
env:
  # A cache restore that fails (e.g. the account's cache egress limit) would
  # otherwise hang for actions/cache's 10-minute default before falling back
  # to a normal install, which outlasts the short jobs' own timeouts.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'

jobs:
  custody:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:byos
      - run: pnpm --filter @mikka/protocol exec vitest run src/subscription.test.ts
      - run: docker pull node@sha256:6449e19d8184d84062525b6a7524def03146c2cb04a7f08b076680d0e8e4240a
      - run: pnpm --filter @mikka/daemon exec vitest run test/subscription-hosted-runner.test.ts
      # Docker mode on devices: the runner image (harness/Dockerfile) and one disposable run container.
      - run: pnpm --filter @mikka/daemon test:run-container
      - run: pnpm test:byos-worker
        env:
          MIKKA_BYOS_BACKEND_ONLY: '1'
