name: Local device Node 22
on:
  pull_request:
    paths:
      - 'apps/desktop/src/main/*install*'
      - 'packages/daemon/**'
      - 'packages/protocol/**'
      - '.github/workflows/local-device-node22.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: local-device-node22-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node22-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.1
      - name: Daemon and installer on real Node 22
        run: |
          node --version
          pnpm --filter @mikka/daemon test
          node --import tsx --test apps/desktop/src/main/ssh-install.test.ts apps/desktop/src/main/local-install.test.ts
