name: Node.js compatibility
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: local-device-node22-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node22-unit:
    name: App, Eve and local device (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # PR updates run one Node version to halve queued jobs; merge_group/push keep 22+24.
        node: ${{ github.event_name == 'pull_request' && fromJSON('["24"]') || fromJSON('["22","24"]') }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e-local-only
          POSTGRES_DB: mikka_e2e
          POSTGRES_INITDB_ARGS: --set=max_locks_per_transaction=512
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e -d mikka_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      BETTER_AUTH_SECRET: ci-node-compatibility-only-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      MIKKA_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      E2E_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      MIKKA_LOCAL_TEST_ACCOUNTS: '1'
      NITRO_PRESET: node-server
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/pnpm-install
        with:
          node-version: ${{ matrix.node }}
          skip-electron: 'true'
          ffmpeg-github-token: ${{ github.token }}
      - name: Ensure FFmpeg for daemon recording regressions
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo "$(command -v node)" scripts/ci/apt-mirrors.mjs
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
            sudo apt-get -o Acquire::http::Timeout=30 install -y ffmpeg
          fi
      - name: Isolate runtime data in this runner
        run: |
          echo "MIKKA_DATA_DIR=$RUNNER_TEMP/mikka-node-compat-data" >> "$GITHUB_ENV"
          echo "MIKKA_EVE_DATA_DIR=$RUNNER_TEMP/mikka-node-compat-eve" >> "$GITHUB_ENV"
      - run: pnpm test:e2e:setup
      - name: Build actual app and Eve on the selected Node runtime
        run: |
          node --version
          pnpm build:app
      - name: Start compiled app and packaged Eve and check their real HTTP routes
        run: node scripts/runtime-compatibility-smoke.mjs
      - name: Startup contracts and Eve unit tests
        run: |
          node --test scripts/start-app.test.mjs scripts/node22-test-compat.test.mjs scripts/node-runtime-compat.test.mjs
          pnpm test:eve
      - name: Daemon and installer on the selected Node runtime
        run: |
          pnpm --filter @mikka/daemon test
          node --import tsx --test apps/desktop/src/main/ssh-install.test.ts apps/desktop/src/main/local-install.test.ts
