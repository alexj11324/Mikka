name: E post-merge main full database inventory
on:
  push:
    branches: [evidence/2254-sidebar-85dfc396]
    paths: [.github/workflows/e-postmerge-full-db.yml]
permissions:
  contents: read
env:
  # Existing accounting/admission suites exercise the hosted deployment.
  # The self-hosted image workflow separately runs the default community mode.
  MIKKA_EDITION: cloud
  # A cache restore that fails (e.g. the account's cache egress limit) would
  # otherwise hang for actions/cache's 10-minute default before falling back
  # to a normal install, which outlasts the short jobs' own timeouts.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
  # Ephemeral CI registration fixtures share one loopback IP. Keep finite
  # limits while leaving the production defaults at 5 signups/IP/hour.
  MIKKA_SIGNUP_IP_HOURLY: '1000'
  MIKKA_SIGNUP_GLOBAL_HOURLY: '10000'
  MIKKA_VERIFICATION_IP_HOURLY: '1000'
  MIKKA_VERIFICATION_GLOBAL_HOURLY: '10000'

jobs:
  all-database-tests:
    if: github.repository == 'alexj11324/Mikka'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e-local-only
          POSTGRES_DB: mikka_e2e
          # Parallel full-schema DROP CASCADE needs more than PG17's default
          # cluster-wide lock table. This applies only to the disposable service.
          POSTGRES_INITDB_ARGS: --set=max_locks_per_transaction=512
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e -d mikka_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      REQUIRE_DB: '1'
      MIKKA_TEST_DB_PORT: '5432'
      E2E_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      MIKKA_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      BETTER_AUTH_URL: http://localhost:3100
      MIKKA_TEST_DEPLOYMENT_SHA: 362698c408e02582ce523df39debe7ea16320bb9
      MIKKA_TEST_ENVIRONMENT_FILE: .cache/e2e/environment.json
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 362698c408e02582ce523df39debe7ea16320bb9
          persist-credentials: false
      - name: Verify the immutable public baseline and unfiltered inventory
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MIKKA_TEST_DEPLOYMENT_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = f6908b3e196c35cf63a92bbeac2ee712733f71d3
          test -z "${DB_TEST_SELECTED+x}" && test -z "${DB_TEST_SHARD+x}"
          mkdir -m 700 "$RUNNER_TEMP/baseline-db-receipt"
      - name: Load the public receipt formatter
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: evidence-tools
          persist-credentials: false
          sparse-checkout: evidence/2265/full-db

      - uses: ./.github/actions/pnpm-install
        with:
          ffmpeg-github-token: ${{ github.token }}
      # The .deb files apt downloads for the packages below, keyed on the package
      # list and the runner image (a new image can carry newer dependencies).
      # Read-only except on pushes to main, like the pnpm store.
      - name: Name the native dependency package cache
        id: native-debs-key
        run: echo "key=native-debs-v2-$ImageOS-$ImageVersion-${{ runner.arch }}-bubblewrap-socat-ripgrep-ffmpeg" >> "$GITHUB_OUTPUT"
      - name: Restore native dependency packages
        id: native-debs
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/native-debs
          key: ${{ steps.native-debs-key.outputs.key }}
      - name: Install native dependencies for the CLI approval database roundtrip
        # A stalled Ubuntu mirror once held apt for the rest of the job
        # (2026-11-01, run 41257416436). Fail this step instead of the job.
        timeout-minutes: 5
        run: |
          packages=(bubblewrap socat ripgrep ffmpeg)
          if compgen -G "$HOME/native-debs/*.deb" > /dev/null && sudo dpkg -i "$HOME"/native-debs/*.deb && command -v bwrap socat rg ffmpeg ffprobe > /dev/null; then
            echo "Installed ${packages[*]} from the cached packages"
            exit 0
          fi
          echo "No usable cached packages; installing ${packages[*]} from the Ubuntu mirror"
          sudo "$(command -v node)" scripts/ci/apt-mirrors.mjs
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get clean
          sudo apt-get "${apt_options[@]}" install -y -f "${packages[@]}"
          command -v bwrap socat rg ffmpeg ffprobe > /dev/null
          rm -rf "$HOME/native-debs" && mkdir -p "$HOME/native-debs"
          if compgen -G "/var/cache/apt/archives/*.deb" > /dev/null; then cp /var/cache/apt/archives/*.deb "$HOME/native-debs/"; fi
      - name: Save native dependency packages (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.native-debs.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/native-debs
          key: ${{ steps.native-debs-key.outputs.key }}
      - name: Generate ephemeral test-only auth secret
        run: |
          node --input-type=commonjs - <<'NODE'
          const { appendFileSync, writeSync } = require('node:fs')
          const secret = require('node:crypto').randomBytes(32).toString('hex')
          writeSync(1, `::add-mask::${secret}\n`)
          appendFileSync(process.env.GITHUB_ENV, `BETTER_AUTH_SECRET=${secret}\n`)
          NODE
      - name: Bootstrap empty database using tracked migrations only
        run: node --experimental-strip-types --test tests/migrate-empty-db.test.mjs
        env:
          MIGRATION_BOOTSTRAP_CI: '1'
      - run: pnpm test:e2e:setup
      - name: Bind the disposable test environment to the exact checkout
        run: node scripts/test-accounts/bootstrap.mjs --output .cache/e2e/environment.json
      - name: Verify local execution identities and repository records (isolated Postgres)
        run: node --conditions=react-server --import ./tests/support/server-only-loader.mjs --import tsx --test tests/local-runtime.integration.ts
      - name: Verify thread sharing, membership and privacy against isolated database
        run: node --experimental-test-module-mocks --conditions=react-server --import ./tests/support/server-only-loader.mjs --import tsx --test tests/issue-threads.integration.ts
      - name: Required DB suites (temporary Postgres 17, no skips)
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$MIKKA_TEST_DEPLOYMENT_SHA" > "$RUNNER_TEMP/baseline-db-receipt/source-sha"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/baseline-db-receipt/tree"
          date -u +%FT%TZ > "$RUNNER_TEMP/baseline-db-receipt/start"
          set +e
          pnpm test:db 2>&1 | python3 -u evidence-tools/evidence/2265/full-db/record.py "$RUNNER_TEMP/baseline-db-receipt"
          codes=("${PIPESTATUS[@]}")
          set -e
          date -u +%FT%TZ > "$RUNNER_TEMP/baseline-db-receipt/end"
          echo "${codes[0]}" > "$RUNNER_TEMP/baseline-db-receipt/test-db-exit"
          test "${codes[0]}" = 0 && test "${codes[1]}" = 0
        env:
          REQUIRE_DB: '1'
          RUN_DISPATCH_DB_TESTS: '1'
          FACTORY_MONITOR_TEST_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
          CREDENTIAL_TEST_RETAIN_RESOURCES: '1'
          DB_TEST_EXPECTED: test:abuse-db,test:account-db,test:active-agents,test:activity-actor-db,test:agent-kit-db,test:agent-tool-approval-db,test:approved-writes-db,test:artifact-migration-db,test:audit-db,test:bot-chats-db,test:bot-threads-db,test:captures-db,test:chat-attachments-db,test:cloud-backend-db,test:cloud-services-db,test:coding-workspace-db,test:computer-db,test:conversation-reads,test:coordinator-issue-create-db,test:coordinator-issue-tools-db,test:coordinator-native,test:coordinator-task-binding-db,test:credentials-db,test:desktop-auth,test:device-enrollment-db,test:device-revocation-db,test:domain-lifecycle-db,test:drive-db,test:enterprise-db,test:eve-db,test:execution-settings-db,test:factory,test:factory-activity-db,test:factory-activity-http-db,test:factory-all-dispatch-db,test:factory-approval-db,test:factory-check-independence-db,test:factory-checks-db,test:factory-monitor-db,test:factory-routing-db,test:github-connections-db,test:group-turns,test:groups,test:inbox-db,test:issue-search-db,test:live-db,test:local-repository-migration-db,test:migration-steps-db,test:model-admission-db,test:onboarding-db,test:organization-invitations-db,test:organization-join-domains-db,test:ops-db,test:pat-api-db,test:pat-db,test:personal-mailbox-default-off-db,test:plugins-db,test:preview-driver,test:project-decisions-db,test:project-resources-db,test:project-v2-db,test:relation-cycle,test:run-dispatch,test:run-publication-db,test:run-recovery-db,test:schedules-db,test:scope-detachment-db,test:secrets-db,test:self-improvement-db,test:self-improvement-unit,test:session-mailbox-db,test:settings-activity-db,test:settings-prefs-db,test:skill-semantic-db,test:slack-installation-db,test:suggestion-artifact-db,test:task-identity-db,test:task-presentation-db,test:test-accounts-db,test:user-facts-db,test:visibility-db,test:web-auth-db,test:worker-authorization-db,test:workspace-admin-db,test:workspace-migration-db,test:workspace-permissions-migration-db
      - name: Preserve all named test receipts and complete script inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: postmerge-db-362698c4
          path: ${{ runner.temp }}/baseline-db-receipt
          retention-days: 7
          if-no-files-found: error
