name: Issues 1515-1517 production cleanup
on:
  push:
    branches: [ops/1515-1517-acceptance]
    paths:
      - scripts/ops/issues-1515-1517-cleanup.ts
      - scripts/ops/issues-1515-1517-runtime-cleanup.py
      - scripts/ops/issues-1515-1517-production-env.mjs
      - .github/workflows/issues-1515-1517-cleanup.yml
permissions:
  contents: read
jobs:
  runtime-candidates:
    if: github.repository == 'alexj11324/Mikka' && github.ref == 'refs/heads/ops/1515-1517-acceptance'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      APPLICATION_SHA: bcf82a2e058779fc308a8eea19d036fb5b9467e7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the exact historical release recovery boundaries
        run: |
          python3 scripts/ops/issues-1515-1517-runtime-cleanup.py --self-test
          python3 scripts/e2b/cleanup-template-candidates.test.py
      - name: Install the pinned release cleanup SDK
        run: |
          python3 -m venv "$RUNNER_TEMP/e2b-cleanup"
          "$RUNNER_TEMP/e2b-cleanup/bin/pip" install --disable-pip-version-check 'e2b==2.62.0'
      - name: Read the existing E2B cleanup key
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /vercel
          secret-name: E2B_API_KEY
          recursive: false
          include-imports: false
      - name: Recover only verified private candidates from the failed E2BIG release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/e2b-cleanup/bin/python" scripts/ops/issues-1515-1517-runtime-cleanup.py'
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issues-1515-1517-runtime-cleanup-${{ github.sha }}
          path: issues-1515-1517-cleanup-report/runtime-candidates.json
          retention-days: 7
  cleanup:
    if: github.repository == 'alexj11324/Mikka' && github.ref == 'refs/heads/ops/1515-1517-acceptance'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      APPLICATION_SHA: bcf82a2e058779fc308a8eea19d036fb5b9467e7
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify scoped production environment extraction without credentials
        run: node scripts/ops/issues-1515-1517-production-env.mjs --self-test
      - run: pnpm install --frozen-lockfile
      - name: Read required production configuration MIKKA_DATABASE_URL
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /vercel
          secret-name: MIKKA_DATABASE_URL
          recursive: false
          include-imports: false
      - name: Read the existing Vercel production environment credential
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: VERCEL_DEPLOY_TOKEN
          recursive: false
          include-imports: false
      - name: Read only the workspace database from the production environment
        run: node scripts/ops/issues-1515-1517-production-env.mjs
      - name: Read required production configuration DEVICE_GATEWAY_URL
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /vercel
          secret-name: DEVICE_GATEWAY_URL
          recursive: false
          include-imports: false
      - name: Read required production configuration DEVICE_GATEWAY_PUSH_SECRET
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /vercel
          secret-name: DEVICE_GATEWAY_PUSH_SECRET
          recursive: false
          include-imports: false
      - name: Read the shared test account email
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          secret-name: SMOKE_OWNER_EMAIL
          recursive: false
          include-imports: false
      - name: Read the shared test account password
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          secret-name: SMOKE_OWNER_PASSWORD
          recursive: false
          include-imports: false
      - name: Verify shared-account model and device contracts before removal
        env:
          PREFLIGHT_PHASE: before_cleanup
          MIKKA_OPS_DEPENDENCIES: ${{ github.workspace }}
        run: node scripts/ops/issues-1515-1517-preflight.mjs
      - name: Authorized cleanup dry-run with counts-only output
        env:
          CLEANUP_MODE: dry-run
        run: |
          set +e
          node --import ./scripts/server-test.mjs --import tsx scripts/ops/issues-1515-1517-cleanup.ts > "$RUNNER_TEMP/issues-cleanup-private.log" 2>&1
          result=$?
          rm -f "$RUNNER_TEMP/issues-cleanup-private.log"
          if [ -f issues-1515-1517-cleanup-report/dry-run.json ]; then
            cat issues-1515-1517-cleanup-report/dry-run.json
          else
            echo 'cleanup report unavailable'
          fi
          exit "$result"
      - name: Authorized cleanup apply with counts-only output
        env:
          CLEANUP_MODE: apply
        run: |
          set +e
          node --import ./scripts/server-test.mjs --import tsx scripts/ops/issues-1515-1517-cleanup.ts > "$RUNNER_TEMP/issues-cleanup-private.log" 2>&1
          result=$?
          rm -f "$RUNNER_TEMP/issues-cleanup-private.log"
          if [ -f issues-1515-1517-cleanup-report/apply.json ]; then
            cat issues-1515-1517-cleanup-report/apply.json
          else
            echo 'cleanup report unavailable'
          fi
          exit "$result"
      - name: Verify the specifically authorized personal workspace with read-only SQL
        if: ${{ !cancelled() }}
        run: node --import ./scripts/server-test.mjs --import tsx scripts/ops/issues-1515-self-workspace.ts
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issues-1515-1517-cleanup-${{ github.sha }}
          path: |
            issues-1515-1517-cleanup-report
            issues-1515-1517-report
            issues-1515-self-report
          retention-days: 7
