name: E group reconciliation commit receipts
on:
  push:
    branches: [evidence/2254-sidebar-85dfc396]
    paths: [.github/workflows/conversation-group-qa.yml, 'evidence/2254/group-qa/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    if: github.repository == 'alexj11324/Mikka'
    timeout-minutes: 22
    env:
      SOURCE: 8c41e536ecea6bae39149b7dc6a3c4d559c69d03
    steps:
      - name: Check out exact public source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8c41e536ecea6bae39149b7dc6a3c4d559c69d03
          persist-credentials: false
      - name: Check out isolated public checks
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: qa-harness
          sparse-checkout: evidence/2254/group-qa
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - name: Install public lock and PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          test "$(git rev-parse 'HEAD^{tree}')" = 36da2ecc2e517a9ceeeb27a0ced0f4fdd0ef3b40
          pnpm install --frozen-lockfile
          if [ ! -x /usr/lib/postgresql/17/bin/initdb ]; then
            . /etc/os-release
            curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o "$RUNNER_TEMP/pgdg-signing.asc"
            test "$(gpg --show-keys --with-colons "$RUNNER_TEMP/pgdg-signing.asc" | awk -F: '/^fpr:/ {print $10;exit}')" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
            sudo install -m 0644 "$RUNNER_TEMP/pgdg-signing.asc" /usr/share/keyrings/pgdg-evidence.asc
            echo "deb [signed-by=/usr/share/keyrings/pgdg-evidence.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg-evidence.list >/dev/null
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends postgresql-17
          fi
      - name: Run PostgreSQL delegation, commit and rollback checks with both live modes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/group-qa" "$RUNNER_TEMP/synthetic-home"
          uid="$(id -u)"
          gid="$(id -g)"
          sudo unshare --net bash -euc '
            ip link set lo up
            test -z "$(ip route show default)"
            test "$(ip -o link show | wc -l)" = 1
            exec setpriv --reuid="$1" --regid="$2" --clear-groups --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs env -i HOME="$3" PATH="$4" CI=1 bash "$5/qa-harness/evidence/2254/group-qa/qualify.sh" "$5" "$6"
          ' isolated "$uid" "$gid" "$RUNNER_TEMP/synthetic-home" "$PATH" "$PWD" "$RUNNER_TEMP/group-qa"
