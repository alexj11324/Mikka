name: Issue 1782 owned publication resource setup
on:
  push:
    branches: [ops/self-hosted-vault-closeout-20261108]
permissions:
  contents: read
jobs:
  publication_setup:
    name: Prepare one owned Bot and required fixed Profile
    # Unbound review draft; a new actual parent and finite window are required.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: production-smoke-owner-acceptance
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
      issues: read
      id-token: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify normal API bounds and the one actual source grant
        id: guard
        timeout-minutes: 3
        run: |
          node --test scripts/ops/publication-setup-1782.test.mjs
          node scripts/ops/publication-setup-1782.mjs check
      - name: Download only the fixed preflight artifact
        timeout-minutes: 1
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: alexj11324/Mikka
          run-id: ${{ steps.guard.outputs.preflight_run }}
          artifact-ids: ${{ steps.guard.outputs.preflight_artifact }}
          path: ${{ runner.temp }}/publication-setup-preflight
          merge-multiple: true
      - name: Verify fixed preflight bytes and repeat source before credentials
        timeout-minutes: 2
        run: node scripts/ops/publication-setup-1782.mjs verify
      - name: Read only SMOKE email through existing OIDC
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          secret-name: SMOKE_OWNER_EMAIL
          recursive: false
          include-imports: false
      - name: Read only SMOKE password through existing OIDC
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          secret-name: SMOKE_OWNER_PASSWORD
          recursive: false
          include-imports: false
      - name: Create and read back only the approved owned resources
        timeout-minutes: 3
        run: node scripts/ops/publication-setup-1782.mjs capture
      - name: Retain closed source and resource receipts
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: publication-setup-1782-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-setup-1782/*.json
          retention-days: 14
          if-no-files-found: warn
