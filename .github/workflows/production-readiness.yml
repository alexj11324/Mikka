name: Production owner readiness
# This workflow cannot dispatch a task. The historical paid comparison file
# must not be present when publishing the acceptance branch from reviewed main.
on:
  pull_request:
    paths:
      - '.github/workflows/production-readiness.yml'
      - '.github/workflows/model-provider-fallback-acceptance.yml'
      - '.github/workflows/project-decisions-acceptance.yml'
      - 'scripts/acceptance/production-readiness*'
  push:
    branches: [acceptance/proactive-1157-1163]
    paths:
      - '.github/workflows/production-readiness.yml'
      - 'scripts/acceptance/production-readiness*'
  workflow_dispatch:
    inputs:
      application_sha:
        description: Exact already-deployed main application SHA; runtime publication is checked separately
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('production-readiness-guards-{0}', github.event.pull_request.number) || 'production-smoke-owner-acceptance' }}
  cancel-in-progress: false
jobs:
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: node --test scripts/acceptance/production-readiness.test.mjs
  readiness:
    needs: guards
    if: github.repository == 'alexj11324/Mikka' && ((github.event_name == 'push' && github.ref == 'refs/heads/acceptance/proactive-1157-1163') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Pin the public Web release and report actual worker publication
        id: attest
        run: node scripts/acceptance/production-readiness.mjs --attest
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Read the existing smoke email only
        if: steps.attest.outputs.readable == 'true'
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          secret-name: SMOKE_OWNER_EMAIL
          recursive: false
          include-imports: false
      - name: Read the existing smoke password only
        if: steps.attest.outputs.readable == 'true'
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          secret-name: SMOKE_OWNER_PASSWORD
          recursive: false
          include-imports: false
      - name: Read identity, model sources, activity and preference fingerprint
        if: steps.attest.outputs.readable == 'true'
        run: node scripts/acceptance/production-readiness.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-readiness-${{ github.run_id }}
          path: |
            production-readiness-report/attestation.json
            production-readiness-report/report.json
          if-no-files-found: ignore
          retention-days: 14
