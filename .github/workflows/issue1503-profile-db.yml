name: Issue 1503 isolated profile fixture verification
on:
  push:
    branches: [ops/issue-1503-profile-db]
permissions:
  contents: read
concurrency:
  group: issue1503-profile-db
  cancel-in-progress: false
jobs:
  profiles:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e-local-only
          POSTGRES_DB: mikka_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e -d mikka_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      REQUIRE_DB: '1'
      MIKKA_TEST_DB_PORT: '5432'
      E2E_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      MIKKA_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      BETTER_AUTH_URL: http://localhost:3100
      MIKKA_TEST_DEPLOYMENT_SHA: ${{ github.sha }}
      MIKKA_TEST_ENVIRONMENT_FILE: .cache/e2e/environment.json
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm-install
      - name: Generate ephemeral isolated-test authentication secret
        run: |
          node --input-type=commonjs - <<'NODE'
          const { appendFileSync, writeSync } = require('node:fs')
          const secret = require('node:crypto').randomBytes(32).toString('hex')
          writeSync(1, `::add-mask::${secret}\n`)
          appendFileSync(process.env.GITHUB_ENV, `BETTER_AUTH_SECRET=${secret}\n`)
          NODE
      - name: Initialize the isolated database with tracked migrations
        run: pnpm test:e2e:setup
      - name: Bind the isolated environment to the tested revision
        run: node scripts/test-accounts/bootstrap.mjs --output .cache/e2e/environment.json
      - name: Verify the full profile suite including real elapsed-time and stale-quota cases
        run: node --import ./tests/support/server-only.mjs --import tsx --test lib/factory/agent-profile.db.test.ts
