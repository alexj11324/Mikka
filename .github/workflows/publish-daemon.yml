name: Publish daemon

# Keep this filename: npm trusted publishing authorizes this workflow identity.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-daemon
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

env:
  # A cache restore that fails (e.g. the account's cache egress limit) would
  # otherwise hang for actions/cache's 10-minute default before falling back
  # to a normal install, which outlasts the short jobs' own timeouts.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'

jobs:
  publish:
    if: github.repository == 'alexj11324/Mikka' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      MIKKA_DAEMON_PACKAGE_NAME: '@aspectlylabs/mikka'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: npm install --global npm@11.19.0
      - name: Prepare release version and check registry
        id: release
        run: node packages/daemon/scripts/release.mjs
      - run: pnpm install --frozen-lockfile
      - run: node --test packages/daemon/test/release.node-test.mjs
      - run: pnpm --filter @mikka/daemon typecheck
      - name: Prepare pinned hosted-runner test image
        run: docker pull node@sha256:6449e19d8184d84062525b6a7524def03146c2cb04a7f08b076680d0e8e4240a
      - run: pnpm --filter @mikka/daemon test
      - run: pnpm --filter @mikka/daemon build
        id: daemon-package
      - name: Pin and inventory the released runtime dependency graph
        env:
          PACKAGE_DIRECTORY: ${{ steps.daemon-package.outputs.package-directory }}
        run: |
          node scripts/release/evidence.mjs pin-runtime "$PACKAGE_DIRECTORY"
          npm --prefix "$PACKAGE_DIRECTORY" install --package-lock-only --ignore-scripts --omit=dev --workspaces=false --no-audit --no-fund
          npm --prefix "$PACKAGE_DIRECTORY" shrinkwrap --ignore-scripts --workspaces=false
          npm --prefix "$PACKAGE_DIRECTORY" sbom --sbom-format=cyclonedx --omit=dev --package-lock-only > "$PACKAGE_DIRECTORY/sbom.cdx.json"
          npm --prefix "$PACKAGE_DIRECTORY" audit --omit=dev --package-lock-only --json --workspaces=false > "$RUNNER_TEMP/daemon-release-audit.json" || audit_status=$?
          node scripts/release/audit-policy.mjs "$RUNNER_TEMP/daemon-release-audit.json" config/release-security.json "$PACKAGE_DIRECTORY/npm-shrinkwrap.json"
      - name: Seal the exact candidate before its package acceptance test
        id: seal
        run: node scripts/release/evidence.mjs seal "${{ steps.daemon-package.outputs.package-directory }}"
      - run: pnpm --filter @mikka/daemon test:package
        env:
          MIKKA_DAEMON_DIST_DIR: ${{ steps.daemon-package.outputs.package-directory }}
          RELEASE_EXPECTED_SHA: ${{ github.sha }}
      - name: Require successful checks for this exact main commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/ci-gate.mjs
      - name: Verify the tested candidate was not changed
        env:
          RELEASE_MANIFEST_SHA256: ${{ steps.seal.outputs.manifest-sha256 }}
        run: node scripts/release/evidence.mjs verify "${{ steps.daemon-package.outputs.package-directory }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daemon-release-evidence-${{ github.sha }}
          path: |
            ${{ steps.daemon-package.outputs.package-directory }}/mikka-release-manifest.json
            ${{ steps.daemon-package.outputs.package-directory }}/sbom.cdx.json
            ${{ steps.daemon-package.outputs.package-directory }}/npm-shrinkwrap.json
          if-no-files-found: error
      - name: Publish with npm trusted publishing and provenance
        if: steps.release.outputs.published != 'true'
        working-directory: ${{ steps.daemon-package.outputs.package-directory }}
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          npm publish --ignore-scripts --access public --provenance --tag "$RELEASE_TAG"
          node "$GITHUB_WORKSPACE/packages/daemon/scripts/release.mjs" --verify
