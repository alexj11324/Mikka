name: Publish daemon

# Keep this filename: npm trusted publishing authorizes this workflow identity.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-daemon
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

env:
  # A cache restore that fails (e.g. the account's cache egress limit) would
  # otherwise hang for actions/cache's 10-minute default before falling back
  # to a normal install, which outlasts the short jobs' own timeouts.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'

jobs:
  publish:
    if: github.repository == 'alexj11324/Mikka' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      MIKKA_DAEMON_PACKAGE_NAME: '@aspectlylabs/mikka'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: npm install --global npm@11.19.0
      - name: Prepare release version and check registry
        id: release
        run: node packages/daemon/scripts/release.mjs
      - run: pnpm install --frozen-lockfile
      - run: node --test packages/daemon/test/release.node-test.mjs
      - run: pnpm --filter @mikka/daemon typecheck
      - name: Prepare pinned hosted-runner test image
        run: docker pull node@sha256:6449e19d8184d84062525b6a7524def03146c2cb04a7f08b076680d0e8e4240a
      - run: pnpm --filter @mikka/daemon test
      - run: pnpm --filter @mikka/daemon build
        id: daemon-package
      - run: pnpm --filter @mikka/daemon test:package
        env:
          MIKKA_DAEMON_DIST_DIR: ${{ steps.daemon-package.outputs.package-directory }}
          RELEASE_EXPECTED_SHA: ${{ github.sha }}
      - name: Publish with npm trusted publishing and provenance
        if: steps.release.outputs.published != 'true'
        working-directory: ${{ steps.daemon-package.outputs.package-directory }}
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          npm publish --access public --provenance --tag "$RELEASE_TAG"
          node "$GITHUB_WORKSPACE/packages/daemon/scripts/release.mjs" --verify
