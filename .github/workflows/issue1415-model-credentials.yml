name: Issue 1415 isolated model credentials
on:
  push:
    branches: [ops/issue1415-model-credentials]
    paths:
      - .github/workflows/issue1415-model-credentials.yml
      - scripts/ops/issue1415-model-credentials.mjs
permissions:
  contents: read
concurrency:
  group: issue1415-isolated-model-credentials
  cancel-in-progress: false
jobs:
  seal:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'alexj11324/Mikka' &&
      github.repository_id == '1427517699' &&
      github.repository_owner_id == '183887963' &&
      github.ref == 'refs/heads/ops/issue1415-model-credentials'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Read the existing Gateway credential
        id: gateway
        continue-on-error: true
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /vercel
          secret-name: AI_GATEWAY_API_KEY
          recursive: false
          include-imports: false
          export-type: env
      - name: Read the existing ZeroCat base URL
        id: zerocat_base
        continue-on-error: true
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /vercel
          secret-name: ZEROCAT_BASE_URL
          recursive: false
          include-imports: false
          export-type: env
      - name: Read the existing ZeroCat credential
        id: zerocat_key
        continue-on-error: true
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /vercel
          secret-name: ZEROCAT_API_KEY
          recursive: false
          include-imports: false
          export-type: env
      - name: Seal only the three selected values to the reviewed receiver
        id: seal
        if: always()
        env:
          READ_GATEWAY_OUTCOME: ${{ steps.gateway.outcome }}
          READ_ZEROCAT_BASE_OUTCOME: ${{ steps.zerocat_base.outcome }}
          READ_ZEROCAT_KEY_OUTCOME: ${{ steps.zerocat_key.outcome }}
        run: node scripts/ops/issue1415-model-credentials.mjs
      - name: Clear the three selected variables before artifact upload
        id: clear_selected
        if: always()
        shell: bash
        run: |
          printf '%s\n' 'AI_GATEWAY_API_KEY=' 'ZEROCAT_BASE_URL=' 'ZEROCAT_API_KEY=' >> "$GITHUB_ENV"
      - name: Retain only authenticated ciphertext and the closed presence report
        if: ${{ always() && steps.seal.outcome == 'success' && steps.clear_selected.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue1415-model-credentials-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            issue1415-model-credentials-sealed/envelope.json
            issue1415-model-credentials-sealed/report.json
          if-no-files-found: error
          retention-days: 1
      - name: Refuse delivery without the required Gateway credential
        if: ${{ always() && steps.seal.outputs.delivery_ready != 'true' }}
        run: exit 1
