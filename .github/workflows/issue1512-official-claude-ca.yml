name: Issue 1512 official Claude public CA control

on:
  push:
    branches: [ops/1512-git-transport]
    paths:
      - .github/workflows/issue1512-official-claude-ca.yml
      - scripts/ops/issue1512-official-claude-ca.py
      - scripts/ops/issue1512-official-claude-ca.test.py

permissions:
  contents: read
  id-token: write

concurrency:
  group: issue1512-official-claude-ca
  cancel-in-progress: false
  queue: max

jobs:
  observe:
    if: github.repository == 'alexj11324/Mikka' && github.ref == 'refs/heads/ops/1512-git-transport' && startsWith(github.event.head_commit.message, 'issue1512:official-ca')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the fixed source context
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d63b5e1b2e70baa368cf42ec6f9b13691571b6e0
          path: source
          persist-credentials: false
      - name: Check out this diagnostic revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: ops
          persist-credentials: false
      - name: Verify offline guards before requesting the key
        run: python3 -B ops/scripts/ops/issue1512-official-claude-ca.test.py
      - name: Install the pinned control SDK
        run: |
          python3 -m venv "$RUNNER_TEMP/issue1512-official-ca"
          "$RUNNER_TEMP/issue1512-official-ca/bin/pip" install --disable-pip-version-check 'e2b==2.62.0'
      - name: Read only the existing E2B key
        id: key
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /vercel
          secret-name: E2B_API_KEY
          include-imports: false
      - name: Observe one fixed public CA file on the official Claude VM
        run: >-
          "$RUNNER_TEMP/issue1512-official-ca/bin/python" -B ops/scripts/ops/issue1512-official-claude-ca.py diagnose
          --source source --output "$RUNNER_TEMP/issue1512-official-claude-ca.json"
      - name: Recheck cleanup of this exact attempt's VM
        if: always() && steps.key.outcome == 'success'
        run: >-
          "$RUNNER_TEMP/issue1512-official-ca/bin/python" -B ops/scripts/ops/issue1512-official-claude-ca.py cleanup
          --source source --output "$RUNNER_TEMP/issue1512-official-claude-ca.json"
      - name: Preserve closed metadata and actual ID cleanup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue1512-official-claude-ca-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/issue1512-official-claude-ca.json
          if-no-files-found: warn
          retention-days: 7
