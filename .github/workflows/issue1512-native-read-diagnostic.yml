name: Issue 1512 native read-trigger diagnosis

# Temporary, isolated diagnostic runner. No production credentials, services or models.
# The exact d2c baseline, reviewed observation overlay and this runner are separately bound.
on:
  push:
    branches: [ops/1512-native-read-diagnostic-memory-20261109]
    paths: [.github/issue1512-native-read-diagnostic.json]

permissions:
  contents: read

concurrency:
  group: issue1512-native-read-diagnostic-20261109
  cancel-in-progress: false
  queue: max

env:
  MIKKA_EDITION: cloud
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'

jobs:
  native-read-diagnostic:
    if: >-
      github.event_name == 'push' && startsWith(github.event.head_commit.message, 'ci: diagnose native reads ') && github.run_attempt == 1
    name: Isolated native read-trigger diagnosis
    runs-on: macos-26  # Standard ARM64 runner; macOS 26 is required for the shared glass icon.
    timeout-minutes: 60
    env:
      CI: 'true'
      MIKKA_LOCAL_TEST_ACCOUNTS: '1'
      MIKKA_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      E2E_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      BETTER_AUTH_URL: http://localhost:3000
      AUTH_TRUSTED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: '1'
      MIKKA_TEST_DEPLOYMENT_SHA: ${{ github.sha }}
      MIKKA_TEST_ENVIRONMENT_FILE: .cache/e2e/environment.json
      MIKKA_DESKTOP_FLAVOR: dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.2'
          cache: pnpm
      - name: Verify the one-shot diagnostic source and request
        id: source
        run: |
          node --input-type=commonjs - <<'NODE'
          const { readFileSync, mkdirSync, writeFileSync } = require('node:fs')
          const { execFileSync } = require('node:child_process')
          const { createHash } = require('node:crypto')
          const { join, isAbsolute } = require('node:path')
          const BASE = 'd2c3f63448130443e3e10bb5304417162f585776'
          const BASE_TREE = 'a311b73945e9846a33a2bbd3ffa54b9e23888b1d'
          const BRANCH = 'refs/heads/ops/1512-native-read-diagnostic-memory-20261109'
          const WORKFLOW = '.github/workflows/issue1512-native-read-diagnostic.yml'
          const MANIFEST = '.github/issue1512-native-read-diagnostic.json'
          const EXPECTED = ["apps/desktop/src/renderer/read-batch.ts","apps/desktop/src/renderer/rpc.ts","apps/desktop/test/lifecycle.mjs","apps/desktop/test/read-diagnostics.mjs","hooks/use-live-key.tsx","lib/live/channel.ts","lib/swr/read-diagnostics.ts","lib/swr/read-observer.ts"]
          const NEW_FILES = new Set(['lib/swr/read-diagnostics.ts', 'apps/desktop/test/read-diagnostics.mjs'])
          const isSha = value => typeof value === 'string' && /^[0-9a-f]{40}$/.test(value)
          const sameKeys = (value, keys) => value && typeof value === 'object' && !Array.isArray(value) && Object.keys(value).sort().join('\n') === [...keys].sort().join('\n')
          const fail = code => { const error = new Error('Diagnostic source guard failed'); error.code = code; throw error }
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] }).trim()
          const blobAt = (commit, path) => {
            const line = git('ls-tree', commit, '--', path)
            if (!line) return null
            const prefix = '100644 blob '
            if (!line.startsWith(prefix) || line.slice(prefix.length + 40) !== '\t' + path) fail('file_mode_or_type')
            const sha = line.slice(prefix.length, prefix.length + 40)
            if (!isSha(sha)) fail('blob_identity')
            return sha
          }
          try {
            if (process.platform !== 'darwin' || process.arch !== 'arm64' || process.version !== 'v24.22.2') fail('runtime')
            if (process.env.GITHUB_REPOSITORY !== 'alexj11324/Mikka' || process.env.GITHUB_EVENT_NAME !== 'push' || process.env.GITHUB_REF !== BRANCH || process.env.GITHUB_RUN_ATTEMPT !== '1') fail('event_scope')
            const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'))
            const raw = readFileSync(MANIFEST, 'utf8')
            const manifest = JSON.parse(raw)
            if (JSON.stringify(manifest, null, 2) + '\n' !== raw || !sameKeys(manifest, ['version', 'enabled', 'requestId', 'createdAt', 'expiresAt', 'baseCommit', 'baseTree', 'sourceCommit', 'sourceTree', 'overlay'])) fail('manifest_schema')
            if (manifest.version !== 1 || manifest.enabled !== true || !/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/.test(manifest.requestId ?? '')) fail('request_identity')
            const created = Date.parse(manifest.createdAt), expires = Date.parse(manifest.expiresAt), now = Date.now()
            if (!Number.isFinite(created) || !Number.isFinite(expires) || created > now + 60_000 || expires <= now || expires - created > 90 * 60_000 || expires <= created) fail('request_freshness')
            const head = git('rev-parse', 'HEAD')
            if (!isSha(head) || head !== process.env.GITHUB_SHA || event.after !== head || event.head_commit?.id !== head) fail('execution_identity')
            if ((event.head_commit?.message ?? '').split('\n')[0] !== 'ci: diagnose native reads ' + manifest.requestId) fail('commit_request')
            if (manifest.baseCommit !== BASE || manifest.baseTree !== BASE_TREE || git('rev-parse', BASE + '^{tree}') !== BASE_TREE) fail('base_identity')
            if (!isSha(manifest.sourceCommit) || !isSha(manifest.sourceTree) || git('rev-parse', manifest.sourceCommit + '^{tree}') !== manifest.sourceTree) fail('source_identity')
            if (git('rev-list', '--parents', '-n', '1', manifest.sourceCommit) !== manifest.sourceCommit + ' ' + BASE) fail('source_parent')
            if (git('rev-list', '--parents', '-n', '1', head) !== head + ' ' + manifest.sourceCommit) fail('execution_parent')
            if (!Array.isArray(manifest.overlay) || manifest.overlay.length !== EXPECTED.length) fail('overlay_count')
            if (manifest.overlay.map(item => item.path).sort().join('\n') !== EXPECTED.join('\n')) fail('overlay_paths')
            if (git('diff', '--name-only', BASE, manifest.sourceCommit).split('\n').filter(Boolean).sort().join('\n') !== EXPECTED.join('\n')) fail('source_diff')
            if (git('diff', '--name-only', manifest.sourceCommit, head).split('\n').filter(Boolean).sort().join('\n') !== [WORKFLOW, MANIFEST].sort().join('\n')) fail('execution_diff')
            for (const item of manifest.overlay) {
              if (!sameKeys(item, ['path', 'beforeBlob', 'afterBlob']) || !isSha(item.afterBlob) || (NEW_FILES.has(item.path) ? item.beforeBlob !== null : !isSha(item.beforeBlob))) fail('overlay_schema')
              if (blobAt(BASE, item.path) !== item.beforeBlob || blobAt(manifest.sourceCommit, item.path) !== item.afterBlob || blobAt(head, item.path) !== item.afterBlob) fail('overlay_blob')
            }
            if (git('status', '--porcelain', '--untracked-files=no')) fail('dirty_tracked_source')
            if (!/^\d+$/.test(process.env.GITHUB_RUN_ID ?? '') || !isAbsolute(process.env.RUNNER_TEMP ?? '') || /[\r\n]/.test(process.env.RUNNER_TEMP)) fail('runner_temp_identity')
            const OUTPUT = join(process.env.RUNNER_TEMP, 'mikka-1512-native-read-diagnostic-' + process.env.GITHUB_RUN_ID)
            mkdirSync(OUTPUT, { mode: 0o700 })
            writeFileSync(OUTPUT + '/source-manifest.json', raw, { mode: 0o600 })
            const result = { version: 1, purpose: 'native-read-trigger-diagnostic', requestId: manifest.requestId,
              runId: process.env.GITHUB_RUN_ID, runAttempt: 1, ref: BRANCH,
              baseCommit: BASE, baseTree: BASE_TREE, sourceCommit: manifest.sourceCommit, sourceTree: manifest.sourceTree,
              executionCommit: head, executionTree: git('rev-parse', 'HEAD^{tree}'),
              manifestSha256: createHash('sha256').update(raw).digest('hex'),
              workflowBlob: blobAt(head, WORKFLOW), originalDesktopWorkflowBlob: '1cfd9d8be85015b639809faedc8a68fb83609399',
              overlay: manifest.overlay, diagnosticOnly: true, production: false,
              runner: { provider: 'github-actions', os: 'macos-26', timeoutMinutes: 60, cleanupOwner: 'issue1512/native_diag_runner', deadlineUpperBound: new Date(Date.now() + 60 * 60_000).toISOString() },
              checkedAt: new Date().toISOString() }
            writeFileSync(OUTPUT + '/source.json', JSON.stringify(result, null, 2) + '\n', { mode: 0o600 })
            console.log(JSON.stringify({ status: 'source_verified', requestId: result.requestId, executionCommit: head, sourceCommit: result.sourceCommit, overlayFiles: EXPECTED.length }))
          } catch (error) {
            console.error(JSON.stringify({ status: 'source_guard_failed', name: error instanceof Error ? error.name : 'unknown', code: typeof error?.code === 'string' && /^[a-z_]{1,40}$/.test(error.code) ? error.code : 'read_or_parse_failed' }))
            process.exitCode = 1
          }
          NODE
      - run: test "$(uname -m)" = arm64
      - run: pnpm install --frozen-lockfile
        env:
          FFMPEG_GITHUB_TOKEN: ${{ github.token }}
      - name: Check diagnostic syntax and renderer types before building
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          node --check apps/desktop/test/read-diagnostics.mjs
          node --check apps/desktop/test/lifecycle.mjs
          pnpm --filter @mikka/desktop typecheck
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs'
          import { load } from 'js-yaml'
          const workflow = load(readFileSync('.github/workflows/issue1512-native-read-diagnostic.yml', 'utf8'))
          if (workflow.name !== 'Issue 1512 native read-trigger diagnosis' || Object.keys(workflow.jobs).join() !== 'native-read-diagnostic' || workflow.jobs['native-read-diagnostic']['timeout-minutes'] !== 60) throw new Error('DIAGNOSTIC_WORKFLOW_SCHEMA_INVALID')
          console.log('DIAGNOSTIC_WORKFLOW_SCHEMA_VALID')
          NODE
      - name: Keep setup-node 24 in the native installer login shell
        run: node apps/desktop/test/native-node.mjs
      - name: Prepare the pinned native Electron and builder checksum cache
        run: node apps/desktop/scripts/install-electron.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: pnpm exec playwright install chromium
      - name: Start an independent local PostgreSQL
        id: postgres
        run: |
          brew install postgresql@17
          diagnostic_pg_bin="$(brew --prefix postgresql@17)/bin"
          set +e
          "$diagnostic_pg_bin/pg_isready" -h 127.0.0.1 -p 5432 >/dev/null 2>&1
          diagnostic_pg_baseline=$?
          set -e
          test "$diagnostic_pg_baseline" = 2 || { echo '::error::DIAGNOSTIC_PG_BASELINE_NOT_EMPTY'; exit 1; }
          node --input-type=commonjs - <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs')
          const { join } = require('node:path')
          const output = join(process.env.RUNNER_TEMP, 'mikka-1512-native-read-diagnostic-' + process.env.GITHUB_RUN_ID)
          const source = JSON.parse(readFileSync(join(output, 'source.json'), 'utf8'))
          if (source.executionCommit !== process.env.GITHUB_SHA || source.runId !== process.env.GITHUB_RUN_ID) throw new Error('DIAGNOSTIC_CONTROL_IDENTITY_MISMATCH')
          writeFileSync(output + '/postgres-intent.json', JSON.stringify({ version: 1, service: 'postgresql@17', host: '127.0.0.1', port: 5432, baselineReadyStatus: 2, startRequestedAt: new Date().toISOString(), startCommandCompletedAt: null }, null, 2) + '\n', { mode: 0o600, flag: 'wx' })
          NODE
          brew services start postgresql@17
          node --input-type=commonjs - <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs')
          const { join } = require('node:path')
          const file = join(process.env.RUNNER_TEMP, 'mikka-1512-native-read-diagnostic-' + process.env.GITHUB_RUN_ID, 'postgres-intent.json')
          const value = JSON.parse(readFileSync(file, 'utf8'))
          value.startCommandCompletedAt = new Date().toISOString()
          writeFileSync(file, JSON.stringify(value, null, 2) + '\n', { mode: 0o600 })
          NODE
          for _ in $(seq 1 30); do
            "$diagnostic_pg_bin/pg_isready" -h 127.0.0.1 -p 5432 && break
            sleep 1
          done
          "$diagnostic_pg_bin/pg_isready" -h 127.0.0.1 -p 5432
          echo "$diagnostic_pg_bin" >> "$GITHUB_PATH"
          "$diagnostic_pg_bin/psql" postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE e2e WITH LOGIN PASSWORD 'e2e-local-only' CREATEDB"
          "$diagnostic_pg_bin/createdb" --owner=e2e mikka_e2e
      - name: Generate ephemeral test-only auth secret
        run: |
          node --input-type=commonjs - <<'NODE'
          const { appendFileSync, writeSync } = require('node:fs')
          const secret = require('node:crypto').randomBytes(32).toString('hex')
          writeSync(1, `::add-mask::${secret}\n`)
          appendFileSync(process.env.GITHUB_ENV, `BETTER_AUTH_SECRET=${secret}\n`)
          NODE
      - run: pnpm migrate && pnpm test:e2e:setup
        env:
          MIGRATE: '1'
      - name: Build the production API for the native ARM64 runtime
        # Traced runtime dependencies may contain platform-specific binaries.
        # Compile on the Mac; the Linux artifact is a separate auditable build.
        run: pnpm generate:agent-ui && pnpm build:app
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
      - name: Package an inspector-enabled harness input
        # The Dev-only packaging script removes inherited signing credentials,
        # explicitly permits PR ad-hoc signing, and verifies the final bundle.
        run: node apps/desktop/scripts/package-dev.mjs --acceptance
        env:
          MIKKA_DESKTOP_APP_URL: http://localhost:3000/mikka
      - name: Real Keychain encryption across three independent packaged processes
        # No accounts or authentication fixtures: the same immutable signed App
        # must decrypt random canaries across profiles and hosted/bundled modes.
        run: node apps/desktop/test/native-crypto.mjs
        env:
          MIKKA_DESKTOP_EXECUTABLE: ${{ github.workspace }}/apps/desktop/release-acceptance/mac-arm64/Mikka Dev.app/Contents/MacOS/Mikka Dev
      - name: Real packaged Apple Silicon native acceptance
        id: acceptance
        timeout-minutes: 30
        # Functional acceptance only. The one-hour idle measurement is not run
        # (Alex, 2026-11-06); run-acceptance.mjs still accepts `idle` by hand.
        run: node apps/desktop/test/environment.mjs -- node apps/desktop/test/run-acceptance.mjs bundled-smoke parity lifecycle
        env:
          MIKKA_DESKTOP_EXECUTABLE: ${{ github.workspace }}/apps/desktop/release-acceptance/mac-arm64/Mikka Dev.app/Contents/MacOS/Mikka Dev
      - name: Stop only this diagnostic run's PostgreSQL
        if: always()
        id: postgres-cleanup
        timeout-minutes: 3
        env:
          POSTGRES_STEP_OUTCOME: ${{ steps.postgres.outcome }}
        run: |
          node --input-type=commonjs - <<'NODE'
          const { existsSync, readFileSync, lstatSync, mkdirSync, writeFileSync } = require('node:fs')
          const { spawnSync } = require('node:child_process')
          const { join, isAbsolute } = require('node:path')
          const output = '.cache/desktop-evidence/diagnostic-control'
          let control
          const result = { version: 1, owner: 'issue1512/native_diag_runner', service: 'postgresql@17',
            startedAt: new Date().toISOString(),
            postgresStepOutcome: ['success', 'failure', 'skipped', 'cancelled'].includes(process.env.POSTGRES_STEP_OUTCOME) ? process.env.POSTGRES_STEP_OUTCOME : 'unknown',
            observation: 'unknown', ownedStartRequested: false, stopRequested: false,
            stopExitCode: null, readyExitCode: null, controlStatusExitCode: null,
            passed: false, failure: null, controlEvidenceCopied: false, finishedAt: null }
          const fail = code => { const error = new Error('Diagnostic cleanup failed'); error.code = code; throw error }
          const run = (command, args) => spawnSync(command, args, { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'], timeout: 120_000 })
          try {
            if (!isAbsolute(process.env.RUNNER_TEMP ?? '') || !/^\d+$/.test(process.env.GITHUB_RUN_ID ?? '')) fail('runner_temp_identity')
            control = join(process.env.RUNNER_TEMP, 'mikka-1512-native-read-diagnostic-' + process.env.GITHUB_RUN_ID)
            const file = join(control, 'postgres-intent.json')
            if (!existsSync(file)) {
              result.observation = 'no_owned_start_intent_observed'
              // A missing intent is never evidence that a PostgreSQL resource is absent.
              // Only an actually skipped start step proves this job has no owned stop action.
              result.passed = result.postgresStepOutcome === 'skipped'
              if (!result.passed) result.failure = 'owned_start_intent_missing'
            } else {
              const intent = JSON.parse(readFileSync(file, 'utf8'))
              if (intent.version !== 1 || intent.service !== 'postgresql@17' || intent.host !== '127.0.0.1' || intent.port !== 5432 || intent.baselineReadyStatus !== 2 || !Number.isFinite(Date.parse(intent.startRequestedAt))) {
                result.observation = 'owned_intent_invalid'
                fail('owned_intent_invalid')
              }
              result.ownedStartRequested = true
              result.observation = 'owned_start_intent_observed'
              const prefix = run('brew', ['--prefix', 'postgresql@17'])
              const homebrew = run('brew', ['--prefix'])
              if (prefix.status !== 0 || homebrew.status !== 0 || !prefix.stdout.trim().startsWith('/') || !homebrew.stdout.trim().startsWith('/')) fail('prefix_unavailable')
              result.stopRequested = true
              result.stopExitCode = run('brew', ['services', 'stop', 'postgresql@17']).status
              result.readyExitCode = run(join(prefix.stdout.trim(), 'bin', 'pg_isready'), ['-h', '127.0.0.1', '-p', '5432']).status
              result.controlStatusExitCode = run(join(prefix.stdout.trim(), 'bin', 'pg_ctl'), ['status', '-D', join(homebrew.stdout.trim(), 'var', 'postgresql@17')]).status
              result.passed = result.stopExitCode === 0 && result.readyExitCode === 2 && result.controlStatusExitCode === 3
              result.observation = result.passed ? 'owned_postgres_stopped' : 'owned_postgres_stop_unverified'
              if (!result.passed) result.failure = 'postgres_stop_unverified'
            }
          } catch (error) {
            result.failure = typeof error?.code === 'string' && /^[a-z_]{1,40}$/.test(error.code) ? error.code : 'cleanup_read_or_command_failed'
          } finally {
            mkdirSync(output, { recursive: true, mode: 0o700 })
            try {
              if (control) for (const name of ['source-manifest.json', 'source.json', 'postgres-intent.json']) {
                const file = join(control, name)
                if (!existsSync(file)) continue
                const info = lstatSync(file)
                if (!info.isFile() || info.isSymbolicLink() || info.size > 64 * 1024) fail('control_evidence_copy_failed')
                writeFileSync(join(output, name), readFileSync(file), { mode: 0o600, flag: 'wx' })
              }
              result.controlEvidenceCopied = true
            } catch {
              result.passed = false
              result.failure ??= 'control_evidence_copy_failed'
            }
            result.finishedAt = new Date().toISOString()
            writeFileSync(join(output, 'cleanup.json'), JSON.stringify(result, null, 2) + '\n', { mode: 0o600, flag: 'wx' })
            console.log(JSON.stringify(result))
            if (!result.passed) process.exitCode = 1
          }
          NODE
      - name: Audit closed diagnostic control receipts
        if: always()
        id: control-evidence
        run: |
          node --input-type=commonjs - <<'NODE'
          const { readFileSync, readdirSync, lstatSync } = require('node:fs')
          const { createHash } = require('node:crypto')
          const { join } = require('node:path')
          const directory = '.cache/desktop-evidence/diagnostic-control'
          const allowed = new Set(['source-manifest.json', 'source.json', 'postgres-intent.json', 'cleanup.json'])
          const keys = (value, expected) => value && typeof value === 'object' && !Array.isArray(value) && Object.keys(value).sort().join('\n') === expected.sort().join('\n')
          const sha = value => typeof value === 'string' && /^[0-9a-f]{40}$/.test(value)
          const hash = value => typeof value === 'string' && /^[0-9a-f]{64}$/.test(value)
          const instant = value => typeof value === 'string' && /^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d\.\d{3}Z$/.test(value) && Number.isFinite(Date.parse(value))
          const overlay = value => Array.isArray(value) && value.length <= 16 && value.every(item => keys(item, ['path', 'beforeBlob', 'afterBlob']) && /^[a-z0-9/_-]+\.(?:ts|tsx|mjs)$/.test(item.path) && (item.beforeBlob === null || sha(item.beforeBlob)) && sha(item.afterBlob))
          const uuid = value => typeof value === 'string' && /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/.test(value)
          const status = value => value === null || Number.isInteger(value) && value >= 0 && value <= 255
          const validators = {
            'source-manifest.json': value => keys(value, ['version', 'enabled', 'requestId', 'createdAt', 'expiresAt', 'baseCommit', 'baseTree', 'sourceCommit', 'sourceTree', 'overlay']) && value.version === 1 && value.enabled === true && uuid(value.requestId) && instant(value.createdAt) && instant(value.expiresAt) && [value.baseCommit, value.baseTree, value.sourceCommit, value.sourceTree].every(sha) && overlay(value.overlay),
            'source.json': value => keys(value, ['version', 'purpose', 'requestId', 'runId', 'runAttempt', 'ref', 'baseCommit', 'baseTree', 'sourceCommit', 'sourceTree', 'executionCommit', 'executionTree', 'manifestSha256', 'workflowBlob', 'originalDesktopWorkflowBlob', 'overlay', 'diagnosticOnly', 'production', 'runner', 'checkedAt']) && value.version === 1 && value.purpose === 'native-read-trigger-diagnostic' && uuid(value.requestId) && /^\d+$/.test(value.runId) && value.runAttempt === 1 && value.ref === 'refs/heads/ops/1512-native-read-diagnostic-memory-20261109' && [value.baseCommit, value.baseTree, value.sourceCommit, value.sourceTree, value.executionCommit, value.executionTree, value.workflowBlob, value.originalDesktopWorkflowBlob].every(sha) && hash(value.manifestSha256) && overlay(value.overlay) && value.diagnosticOnly === true && value.production === false && instant(value.checkedAt) && keys(value.runner, ['provider', 'os', 'timeoutMinutes', 'cleanupOwner', 'deadlineUpperBound']) && value.runner.provider === 'github-actions' && value.runner.os === 'macos-26' && value.runner.timeoutMinutes === 60 && value.runner.cleanupOwner === 'issue1512/native_diag_runner' && instant(value.runner.deadlineUpperBound),
            'postgres-intent.json': value => keys(value, ['version', 'service', 'host', 'port', 'baselineReadyStatus', 'startRequestedAt', 'startCommandCompletedAt']) && value.version === 1 && value.service === 'postgresql@17' && value.host === '127.0.0.1' && value.port === 5432 && value.baselineReadyStatus === 2 && instant(value.startRequestedAt) && (value.startCommandCompletedAt === null || instant(value.startCommandCompletedAt)),
