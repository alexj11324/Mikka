name: Read cache API acceptance

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/frontend/**'
      - 'lib/browser-rpc/**'
      - 'scripts/start-app*'
      - 'scripts/acceptance/read-action-transport.mjs'
      - '.github/workflows/read-cache.yml'
      - 'scripts/acceptance/read-cache*.mjs'
      - 'scripts/acceptance/run-read-cache*.mjs'
      - 'scripts/test-accounts/**'
      - 'lib/swr/**'
      - 'lib/coordinator/chat-read-client*'
      - 'lib/settings-read.ts'
      - 'app/actions/coordinator.ts'
      - 'app/actions/issues.ts'
      - 'app/actions/task-runs.ts'
      - 'app/api/settings/**'
      - 'components/authenticated-read-cache.tsx'
      - 'components/swr-defaults.tsx'
      - 'components/workspace/task-detail.tsx'
      - 'hooks/use-live-lists.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

concurrency:
  group: read-cache-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  read-cache:
    name: Read cache API and CLI
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e-local-only
          POSTGRES_DB: mikka_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e -d mikka_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      # Read-cache acceptance discovers actions published by the Web client.
      MIKKA_EDITION: cloud
      E2E_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      MIKKA_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      MIKKA_TEST_DB_PORT: '5432'
      # NextRequest canonicalizes loopback IPs to localhost; bind that exact origin.
      BETTER_AUTH_URL: http://localhost:3137
      E2E_BASE_URL: http://localhost:3137
      MIKKA_TEST_DEPLOYMENT_SHA: ${{ github.sha }}
      MIKKA_TEST_ENVIRONMENT_FILE: .cache/e2e/environment.json
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=6144
      SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
      MIKKA_SIGNUP_IP_HOURLY: '1000'
      MIKKA_SIGNUP_GLOBAL_HOURLY: '10000'
      MIKKA_VERIFICATION_IP_HOURLY: '1000'
      MIKKA_VERIFICATION_GLOBAL_HOURLY: '10000'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/pnpm-install
        with:
          ffmpeg-github-token: ${{ github.token }}
      - name: Verify the bounded read-only driver
        run: node --test scripts/acceptance/read-cache.test.mjs scripts/acceptance/run-read-cache.test.mjs
      - name: Generate ephemeral test-only authentication secret
        run: |
          node --input-type=commonjs - <<'NODE'
          const { appendFileSync, writeSync } = require('node:fs')
          const secret = require('node:crypto').randomBytes(32).toString('hex')
          writeSync(1, `::add-mask::${secret}\n`)
          appendFileSync(process.env.GITHUB_ENV, `BETTER_AUTH_SECRET=${secret}\n`)
          NODE
      - run: pnpm test:e2e:setup
      - name: Bind the isolated database and application to this checkout
        run: node scripts/test-accounts/bootstrap.mjs --output .cache/e2e/environment.json
      - name: Build this isolated application for production-mode acceptance
        run: pnpm build:app --public-test-fixture
      - name: Accept real incremental Server Actions and Settings GET
        run: node scripts/acceptance/run-read-cache.mjs
      - name: Check the public evidence for authentication material
        run: node scripts/test-accounts/cli.mjs audit-evidence --evidence .cache/e2e/http-acceptance-summary.json
      - name: Retain only the aggregate acceptance summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: read-cache-api-${{ github.sha }}
          path: .cache/e2e/http-acceptance-summary.json
          if-no-files-found: error
          retention-days: 7
