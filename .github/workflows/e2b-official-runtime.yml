name: E2B additive runtime release
# Build private candidates, preserve official files, prove both subscriptions,
# then publish through the same version-bound Web deployment queue.
on:
  push:
    branches: [main]
    # An unrelated merge can obsolete an in-flight publication. Recheck the
    # live worker on every main push; the check job still gates validation.
  pull_request:
    paths: &runtime_paths
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'packages/daemon/**'
      - 'packages/protocol/**'
      - 'packages/config/**'
      - 'patches/**'
      - 'scripts/e2b/**'
      - 'scripts/e2b/publish-template-env.mjs'
      - 'scripts/e2b/release-handoff.mjs'
      - 'lib/computer/official-runtime.ts'
      - '.github/workflows/e2b-official-runtime.yml'
      - '.github/workflows/e2b-template.yml'
      - 'scripts/e2b/validate-template-subscriptions.mjs'
      - 'scripts/e2b/cleanup-template-candidates.py'
      - 'scripts/acceptance/cloud-startup.mjs'
      - 'scripts/acceptance/cloud-startup-evidence.mjs'
      - '.github/workflows/web-deploy.yml'
      - 'scripts/release/web-deploy.mjs'
      - 'scripts/release/build-vercel.mjs'
      - 'scripts/release/web-deploy.test.mjs'
      # This issue's acceptance requires a same-application-SHA runtime proof.
      - '.github/workflows/model-provider-fallback-acceptance.yml'
      - 'scripts/acceptance/model-provider-fallback.mjs'
      - 'scripts/acceptance/model-provider-fallback.test.mjs'
      - '.github/workflows/project-decisions-acceptance.yml'
      - 'scripts/acceptance/project-decisions.mjs'
      - 'scripts/acceptance/project-decisions.test.mjs'
  workflow_dispatch:
    inputs:
      runtime-refresh:
        description: Validate and publish even when the configured worker hash matches
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('e2b-official-runtime-{0}', github.ref) || 'e2b-official-runtime-release' }}
  # An old rerun must not replace the latest main's pending runtime validation.
  # PRs have their own group and only run the offline test job; retain those too.
  cancel-in-progress: false
  queue: max
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: node --test scripts/e2b/publish-template-env.test.mjs scripts/e2b/validate-template-subscriptions.test.mjs scripts/e2b/cloud-acceptance-release.test.mjs scripts/e2b/release-handoff.test.mjs scripts/release/web-deploy.test.mjs
      - run: python3 scripts/e2b/build-template.test.py
      - run: python3 scripts/e2b/official-files.test.py
      - run: python3 scripts/e2b/cleanup-template-candidates.test.py
      - run: python3 -m py_compile scripts/e2b/validate-official-instances.py
      - run: bash -n packages/daemon/scripts/official-e2b-instance-bootstrap.sh scripts/e2b/start-prebuilt.sh
  # Unchanged runtime content skips validation unless its release-control path
  # changed in this push, or an operator explicitly requested a full refresh.
  check:
    needs: test
    if: github.repository == 'alexj11324/Mikka' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Refuse an obsolete source before runtime validation
        run: node scripts/release/web-deploy.mjs main
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check publication-control changes across this push
        id: control
        run: node scripts/release/web-deploy.mjs runtime-refresh
        env:
          RUNTIME_REFRESH: ${{ inputs.runtime-refresh }}
      - name: Read the Vercel team token through Infisical workload identity
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: VERCEL_TEAM_TOKEN
          include-imports: false
      - name: Compare the worker hash with production
        id: compare
        run: |
          wanted="$(python3 scripts/e2b/build-template.py --worker-hash --source-ref "$GITHUB_SHA")"
          live="$(node scripts/e2b/publish-template-env.mjs --current)"
          echo "worker hash $wanted; production $live"
          if [ "$RUNTIME_REFRESH" = true ] || [ "$wanted" != "$live" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
        env:
          RUNTIME_REFRESH: ${{ steps.control.outputs.refresh }}
  validate:
    needs: [test, check]
    if: needs.check.outputs.changed == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/e2b-template.yml
  # Do not take web-deploy-production here: the matching Web job needs that
  # queue to finish its GitHub build and upload while this read-only job waits.
  await-web:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Await this source's actual Web build and public version
        run: node scripts/release/web-deploy.mjs await-web
        env:
          GITHUB_TOKEN: ${{ github.token }}
  subscriptions:
    needs: [validate, await-web]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    outputs:
      release-artifact-id: ${{ steps.release.outputs.artifact-id }}
      release-report-sha256: ${{ steps.publish.outputs.report-sha256 }}
    env:
      # Existing ACME-owned workspace and dedicated test Bot, never a real task.
      MIKKA_ACCEPTANCE_WORKSPACE_ID: de300001-ece6-4021-8214-c986ea306bde
      MIKKA_ACCEPTANCE_BOT_ID: bc925088-d87f-47b8-a786-c1c317ac005f
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Refuse an obsolete source before real subscription work
        run: node scripts/release/web-deploy.mjs main
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Download only this run's immutable candidate artifact
        if: needs.validate.outputs.candidate-artifact-id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.validate.outputs.candidate-artifact-id }}
          path: ${{ runner.temp }}/candidate-handoff
          merge-multiple: true
      - name: Install only the pinned gate SDKs
        run: |
          npm install --prefix "$RUNNER_TEMP/e2b-js" --ignore-scripts --no-audit --no-fund 'e2b@2.62.1'
          ln -s "$RUNNER_TEMP/e2b-js/node_modules" node_modules
          python3 -m venv "$RUNNER_TEMP/e2b"
          "$RUNNER_TEMP/e2b/bin/pip" install --disable-pip-version-check 'e2b==2.62.0'
      - name: Read the existing candidate E2B key
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /vercel
          secret-name: E2B_API_KEY
          include-imports: false
      - name: Read the authorized acceptance account email
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          secret-name: ACME_DEMO_EMAIL
          include-imports: false
      - name: Read the authorized acceptance account password
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          secret-name: ACME_DEMO_PASSWORD
          include-imports: false
      - name: Require real Claude Code and Codex subscriptions on the private candidates
        run: |
          node scripts/e2b/release-handoff.mjs verify-candidates "$RUNNER_TEMP/candidate-handoff"
          node scripts/e2b/validate-template-subscriptions.mjs "$RUNNER_TEMP/candidate-handoff/report.json" "$RUNNER_TEMP/accepted.json" "$RUNNER_TEMP/subscription-diagnostics.json"
        env:
          RUNTIME_REPORT_SHA256: ${{ needs.validate.outputs.candidate-report-sha256 }}
          RUNTIME_WORKER_SHA: ${{ needs.validate.outputs.source-sha }}
          RUNTIME_TEMPLATE_IDS: ${{ needs.validate.outputs.template-ids }}
      - name: Preserve closed subscription gate diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2b-template-subscription-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/subscription-diagnostics.json
          if-no-files-found: warn
          retention-days: 7
      - name: Make only fully accepted candidates public
        id: publish
        run: |
          node scripts/release/web-deploy.mjs main
          "$RUNNER_TEMP/e2b/bin/python" scripts/e2b/build-template.py --publish-verified "$RUNNER_TEMP/accepted.json" > "$RUNNER_TEMP/release.json"
          node scripts/e2b/release-handoff.mjs pack-release "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/release-handoff" "$RUNNER_TEMP/candidate-handoff"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUNTIME_REPORT_SHA256: ${{ needs.validate.outputs.candidate-report-sha256 }}
          RUNTIME_WORKER_SHA: ${{ needs.validate.outputs.source-sha }}
          RUNTIME_TEMPLATE_IDS: ${{ needs.validate.outputs.template-ids }}
      - name: Preserve the complete verified publication evidence
        id: release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2b-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-handoff/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [validate, await-web, subscriptions]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/web-deploy.yml
    with:
      runtime-refresh: true
      runtime-worker-sha: ${{ needs.validate.outputs.source-sha }}
      runtime-template-ids: ${{ needs.validate.outputs.template-ids }}
      runtime-candidate-report-sha256: ${{ needs.validate.outputs.candidate-report-sha256 }}
      runtime-release-artifact-id: ${{ needs.subscriptions.outputs.release-artifact-id }}
      runtime-release-report-sha256: ${{ needs.subscriptions.outputs.release-report-sha256 }}
  cleanup:
    needs: [check, validate, await-web, subscriptions, publish]
    if: always() && github.repository == 'alexj11324/Mikka' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install the pinned cleanup SDK
        run: |
          python3 -m venv "$RUNNER_TEMP/e2b-cleanup"
          "$RUNNER_TEMP/e2b-cleanup/bin/pip" install --disable-pip-version-check 'e2b==2.62.0'
      - name: Read this release's E2B key
        id: e2b-key
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /vercel
          secret-name: E2B_API_KEY
          include-imports: false
      - name: Download the exact candidate artifact for cleanup
        if: always() && steps.e2b-key.outcome == 'success' && needs.validate.outputs.candidate-artifact-id != ''
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.validate.outputs.candidate-artifact-id }}
          path: ${{ runner.temp }}/candidate-handoff
          merge-multiple: true
      - name: Close this attempt's instances and remove only its private candidates
        if: always() && steps.e2b-key.outcome == 'success'
        run: |
          args=()
          handoff_status=0
          if [ -n "$CANDIDATE_ARTIFACT_ID" ]; then
            if node scripts/e2b/release-handoff.mjs verify-candidates "$RUNNER_TEMP/candidate-handoff"; then
              args+=(--report "$RUNNER_TEMP/candidate-handoff/report.json")
            else
              handoff_status=1
            fi
          elif [ -n "$RUNTIME_REPORT_SHA256" ]; then
            handoff_status=1
          fi
          # A partial build has no artifact. An invalid artifact must not supply
          # IDs, but neither case may prevent this run's existing prefix cleanup.
          cleanup_status=0
          "$RUNNER_TEMP/e2b-cleanup/bin/python" scripts/e2b/cleanup-template-candidates.py "${args[@]}" --output "$RUNNER_TEMP/release-cleanup.json" || cleanup_status=$?
          if [ "$handoff_status" -ne 0 ]; then
            echo '::error::Candidate artifact unavailable or invalid; only current-run prefix cleanup was allowed.'
            exit 1
          fi
          exit "$cleanup_status"
        env:
          CANDIDATE_ARTIFACT_ID: ${{ needs.validate.outputs.candidate-artifact-id }}
          RUNTIME_REPORT_SHA256: ${{ needs.validate.outputs.candidate-report-sha256 }}
          RUNTIME_WORKER_SHA: ${{ needs.validate.outputs.source-sha }}
          RUNTIME_TEMPLATE_IDS: ${{ needs.validate.outputs.template-ids }}
      - name: Preserve release cleanup receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2b-runtime-release-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-cleanup.json
          if-no-files-found: warn
          retention-days: 7
