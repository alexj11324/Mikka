name: E2B additive runtime release
# Build private candidates, preserve official files, prove both subscriptions,
# then publish through the same version-bound Web deployment queue.
on:
  push:
    branches: [main]
    # An unrelated merge can obsolete an in-flight publication. Recheck the
    # live worker on every main push; failed input fingerprints skip retries.
  pull_request:
    paths: &runtime_paths
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'packages/daemon/**'
      - 'packages/protocol/**'
      - 'packages/config/**'
      - 'patches/**'
      - 'scripts/e2b/**'
      - 'scripts/e2b/publish-template-env.mjs'
      - 'lib/computer/official-runtime.ts'
      - '.github/workflows/e2b-official-runtime.yml'
      - '.github/workflows/e2b-template.yml'
      - '.github/workflows/e2b-runtime-release.yml'
      - 'scripts/e2b/validate-template-subscriptions.mjs'
      - 'scripts/e2b/cleanup-template-candidates.py'
      - 'scripts/e2b/runtime-report.mjs'
      - 'scripts/e2b/acceptance-daemon.mts'
      - 'scripts/e2b/acceptance-bootstrap.mts'
      - 'lib/captures/bootstrap-evidence.ts'
      - 'app/api/runs/[runId]/evidence/route.ts'
      # The wildcard also matches Next route brackets as literal directory names.
      - 'app/api/runs/**/evidence/route.ts'
      - 'lib/computer/claude-startup-hint.ts'
      - 'lib/computer/codex-startup-hint.ts'
      - 'scripts/acceptance/cloud-startup.mjs'
      - 'scripts/acceptance/cloud-startup.test.mjs'
      - 'scripts/acceptance/cloud-startup-evidence.mjs'
      - 'scripts/acceptance/team-workspace.mjs'
      - 'scripts/acceptance/team-workspace.test.mjs'
      - 'lib/smoke-account.ts'
      - '.github/workflows/web-deploy.yml'
      - 'scripts/release/web-deploy.mjs'
      - 'scripts/release/build-vercel.mjs'
      - 'scripts/release/web-deploy.test.mjs'
      # This issue's acceptance requires a same-application-SHA runtime proof.
      - '.github/workflows/model-provider-fallback-acceptance.yml'
      - 'scripts/acceptance/model-provider-fallback.mjs'
      - 'scripts/acceptance/model-provider-fallback.test.mjs'
      - '.github/workflows/project-decisions-acceptance.yml'
      - 'scripts/acceptance/project-decisions.mjs'
      - 'scripts/acceptance/project-decisions.test.mjs'
  workflow_dispatch:
    inputs:
      runtime-refresh:
        description: Validate and publish even when the configured worker hash matches
        type: boolean
        default: false
      reason:
        description: Reason for this manual runtime retry (recorded in the dispatch event)
        type: string
        required: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install only the offline gate test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/runtime-gate-tests" --ignore-scripts --no-audit --no-fund 'tsx@4.23.15' '@opentelemetry/sdk-trace-base@2.12.0' 'zod@4.6.7'
          ln -s "$RUNNER_TEMP/runtime-gate-tests/node_modules" node_modules
          mkdir -p node_modules/@mikka
          ln -s "$GITHUB_WORKSPACE/packages/protocol" node_modules/@mikka/protocol
      - run: node --import tsx --test scripts/e2b/runtime-inputs.test.mjs scripts/e2b/runtime-report.test.mjs scripts/e2b/publish-template-env.test.mjs scripts/e2b/validate-template-subscriptions.test.mjs scripts/e2b/cloud-acceptance-release.test.mjs scripts/release/web-deploy.test.mjs scripts/acceptance/cloud-startup.test.mjs scripts/acceptance/cloud-startup-report.test.mjs
      - run: python3 scripts/e2b/build-template.test.py
      - run: python3 packages/daemon/scripts/prepare-worker-install.test.py
      - run: python3 scripts/e2b/official-files.test.py
      - run: python3 scripts/e2b/cleanup-template-candidates.test.py
      - run: python3 -m py_compile scripts/e2b/validate-official-instances.py
      - run: bash -n packages/daemon/scripts/official-e2b-instance-bootstrap.sh scripts/e2b/start-prebuilt.sh
  # Check before acquiring the publication queue or any E2B credentials.
  check:
    needs: test
    if: github.repository == 'alexj11324/Mikka' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      changed: ${{ steps.compare.outputs.changed || 'false' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Refuse an obsolete source before runtime validation
        run: node scripts/release/web-deploy.mjs main
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check publication-control changes across this push
        id: control
        run: node scripts/release/web-deploy.mjs runtime-refresh
        env:
          RUNTIME_REFRESH: ${{ inputs.runtime-refresh }}
      - name: Fingerprint runtime inputs and suppress a previously failed automatic retry
        id: history
        run: node scripts/e2b/runtime-inputs.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RETRY_REASON: ${{ inputs.reason }}
      - name: Read the Vercel team token through Infisical workload identity
        if: steps.history.outputs.skip != 'true'
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: VERCEL_TEAM_TOKEN
          include-imports: false
      - name: Compare the worker hash with production
        if: steps.history.outputs.skip != 'true'
        id: compare
        run: |
          wanted="$(python3 scripts/e2b/build-template.py --worker-hash --source-ref "$GITHUB_SHA")"
          live="$(node scripts/e2b/publish-template-env.mjs --current)"
          echo "worker hash $wanted; production $live"
          if [ "$MANUAL_RETRY" = true ] || [ "$RUNTIME_REFRESH" = true ] || [ "$wanted" != "$live" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
        env:
          RUNTIME_REFRESH: ${{ steps.control.outputs.refresh }}
          MANUAL_RETRY: ${{ github.event_name == 'workflow_dispatch' }}
  release:
    needs: [test, check]
    if: needs.check.outputs.changed == 'true'
    concurrency:
      group: e2b-official-runtime-release
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/e2b-runtime-release.yml
