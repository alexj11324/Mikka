name: Organization policy PostgreSQL
on:
  push:
    branches: ['codex/org-policy-230-231-20261025']
  pull_request:
    paths: ['lib/policy/**', 'app/api/policy/**', 'drizzle/*organization_policy.sql', '.github/workflows/organization-policy.yml']
permissions:
  contents: read
jobs:
  policy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: policy_app_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d policy_app_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MIKKA_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/policy_app_e2e
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/policy_workspace_e2e
      POLICY_APP_TEST_URL: postgresql://postgres@127.0.0.1:5432/policy_app_e2e
      POLICY_WORKSPACE_TEST_URL: postgresql://postgres@127.0.0.1:5432/policy_workspace_e2e
      REQUIRE_POLICY_DB: '1'
      CI: 'true'
      BETTER_AUTH_URL: http://127.0.0.1:3130
      NEXT_TELEMETRY_DISABLED: '1'
      POLICY_HTTP_ORIGIN: http://127.0.0.1:3130
      POLICY_EVIDENCE_DIR: policy-http-evidence
      POLICY_EXTERNAL_SERVER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: psql "$MIKKA_DATABASE_URL" -c 'CREATE DATABASE policy_workspace_e2e'
      - run: MIGRATE=1 node scripts/migrate.mjs
      - name: Repeated migrations apply nothing
        run: |
          MIGRATE=1 node scripts/migrate.mjs > policy-migrations-repeat.log
          test ! -s policy-migrations-repeat.log
      - run: pnpm test:policy | tee policy-postgres.log
      - run: pnpm --filter @mikka/protocol typecheck
      - run: pnpm --filter @mikka/daemon typecheck
      - run: pnpm --filter @mikka/protocol test
      - run: pnpm --filter @mikka/daemon test
      - name: Generate isolated auth secret
        run: |
          node -e "const s=require('node:crypto').randomBytes(32).toString('hex'); console.log('::add-mask::'+s); require('node:fs').appendFileSync(process.env.GITHUB_ENV,'BETTER_AUTH_SECRET='+s+'\n')"
      - run: pnpm exec next build --webpack
      - run: git rev-parse HEAD > .next/policy-source-sha
      - name: Compiled community execution with management adapter absent
        run: |
          set -euo pipefail
          pnpm exec next start --hostname 127.0.0.1 --port 3130 > policy-next.log 2>&1 &
          POLICY_CORE_ORIGIN=http://127.0.0.1:3130 POLICY_SPLIT_EVIDENCE_DIR=policy-http-evidence node --import tsx scripts/policy/split-acceptance.mjs | tee policy-http.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: policy-postgres-evidence
          path: |
            policy-*.log
            policy-http-evidence/
          retention-days: 14
