name: E 2271 independent reviewer on the pinned public QA build
on:
  push:
    branches: [evidence/2254-sidebar-85dfc396]
    paths:
      - .github/workflows/e-2271-independent-review.yml
      - evidence/2271/current-review/**
permissions:
  contents: read
jobs:
  review:
    if: github.repository == 'alexj11324/Mikka'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PUBLIC_SOURCE: 3f7eaa6042d04fc85c4c1c45d4be361e1796fa57
      PUBLIC_TREE: cb7a5f3f00075a88a220ce6bd300b97dffac9149
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: review
          persist-credentials: false
          sparse-checkout: evidence/2271/current-review
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 46d60aa6802ef48600fbe2fa3d48015b14f6d50b
          path: original
          persist-credentials: false
          sparse-checkout: evidence/2257/local-provider
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 3f7eaa6042d04fc85c4c1c45d4be361e1796fa57
          path: product
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - name: Prepare public components and exact-source release Eve without running the image
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C product rev-parse HEAD)" = "$PUBLIC_SOURCE"
          test "$(git -C product rev-parse 'HEAD^{tree}')" = "$PUBLIC_TREE"
          mkdir -m 700 material harness run run/home
          cp original/evidence/2257/local-provider/{package.json,package-lock.json,prepare-claude.py} harness/
          cp review/evidence/2271/current-review/provider.mjs harness/provider-current.mjs
          (cd product && pnpm install --frozen-lockfile)
          (cd harness && npm ci --omit=optional --ignore-scripts --no-audit --no-fund)
          python harness/prepare-claude.py product material
          image=ghcr.io/alexj11324/mikka@sha256:076f20b19385e4cf0c775a6fdf5a109ada55497ca2bc89433b0a5de21b7b08fe
          docker pull "$image"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" = "$PUBLIC_SOURCE"
          container=$(docker create "$image")
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/app/eve" product/apps/eve/.output
          test "$(jq -r .revision product/apps/eve/.output/mikka-eve-build.json)" = "$PUBLIC_SOURCE"
          if [ ! -x /usr/lib/postgresql/17/bin/initdb ]; then
            . /etc/os-release
            curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o "$RUNNER_TEMP/pgdg.asc"
            test "$(gpg --show-keys --with-colons "$RUNNER_TEMP/pgdg.asc" | awk -F: '/^fpr:/ {print $10;exit}')" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
            sudo install -m 0644 "$RUNNER_TEMP/pgdg.asc" /usr/share/keyrings/pgdg-evidence.asc
            echo "deb [signed-by=/usr/share/keyrings/pgdg-evidence.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg-evidence.list >/dev/null
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends postgresql-17
          fi
          /usr/bin/google-chrome --version
          mkdir -p product/.cache/e-codex-actual
          cp review/evidence/2271/current-review/current-review.mts product/.cache/e-codex-actual/work-independent-review.mts
      - name: Compile true lease attestation and run isolated reviewer with two identities
        shell: bash
        run: |
          set -euo pipefail
          sudo unshare --net bash -euc '
            ip link set lo up
            test -z "$(ip route show default)"
            exec setpriv --reuid="$1" --regid="$2" --clear-groups --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs env -i PATH="$3" HOME="$4/run/home" MIKKA_TEST_DEPLOYMENT_SHA="$5" RAYON_NUM_THREADS=2 UV_THREADPOOL_SIZE=2 NODE_OPTIONS=--max-old-space-size=3072 bash -euc '"'"'
              cd "$1/product"
              node apps/frontend/scripts/build.mjs --server-pages
              node apps/api/scripts/build.mjs
              node scripts/package-eve.mjs
              cd "$1"
              bash review/evidence/2271/current-review/run-review.sh "$1"
            '"'"' execute "$4"
          ' isolate "$(id -u)" "$(id -g)" "$PATH" "$GITHUB_WORKSPACE" "$PUBLIC_SOURCE"
      - name: Retain only the explicitly allowlisted report
        if: always()
        run: node review/evidence/2271/current-review/receipt.mjs "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: e2271-independent-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: public-receipt.json
          if-no-files-found: error
