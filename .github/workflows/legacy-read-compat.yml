name: Legacy read compatibility
on:
  push:
    branches: ['codex/legacy-read-compat-20261026']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-e2e:
    name: Shared image GET and saved current Bot reply
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e-local-only
          POSTGRES_DB: mikka_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e -d mikka_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      E2E_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      MIKKA_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      BETTER_AUTH_URL: http://localhost:3100
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      # Reuse S's immutable test-only extension bootstrap; no Coordinator code is imported.
      - uses: alexj11324/Mikka/.github/actions/isolated-pg-extensions@a8533de9e5b051d53987c1928ffc2fb606143a5f
        with:
          container: ${{ job.services.postgres.id }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate ephemeral test-only auth secret
        run: |
          node --input-type=module <<'JS'
          import { randomBytes } from 'node:crypto'
          import { appendFileSync } from 'node:fs'
          const secret = randomBytes(32).toString('hex')
          console.log('::add-mask::' + secret)
          appendFileSync(process.env.GITHUB_ENV, 'BETTER_AUTH_SECRET=' + secret + '\n')
          JS
      - run: pnpm exec playwright install --with-deps chromium
      - name: Bootstrap empty database using tracked migrations only
        run: node --experimental-strip-types --test tests/migrate-empty-db.test.mjs
        env:
          MIGRATION_BOOTSTRAP_CI: '1'
      - run: pnpm test:e2e:setup
      - run: pnpm test:legacy-reads
      - run: pnpm test:request-log
      - run: pnpm exec next typegen
      - run: pnpm typecheck
      - run: pnpm build
        id: build
      - name: Actual Next HTTP and focused browser regression (fixtures only)
        run: pnpm exec playwright test tests/e2e/bot-image-read.spec.ts
      - name: Upload browser failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-read-compat-evidence
          path: |
            playwright-report/
            test-results/
            playwright-performance-report/
            performance-results/
          if-no-files-found: ignore
          retention-days: 7
