name: PR acceptance declaration

# Run only reviewed default-branch code with metadata write permission. Never
# check out a PR head, install its dependencies, or interpolate its body in shell.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: pr-acceptance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  declaration:
    name: Inspect PR acceptance
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: write
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Check current metadata and publish PR acceptance
        run: node scripts/ci/pr-acceptance-github.mjs --publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
