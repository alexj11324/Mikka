# Disabled issue1506 reuse of the reviewed read-only connection contract.
# Bind actual APP/tree and one finite deadline only after shared-account handoff.
# Does not revoke or renew any historical child. Cleanup must use this run's new receipt.
name: Issue 1506 read-only Smoke GitHub prepare
on:
  push:
    branches: [acceptance/issues-1504-1506]
    paths:
      - .github/workflows/issue1505-smoke-github-readonly.yml
      - scripts/ops/issue1505/github-readonly-*.mjs
      - scripts/ops/issue1505/github-readonly.test.mjs
permissions:
  contents: read
concurrency:
  group: production-smoke-owner-acceptance
  cancel-in-progress: false
  queue: max
jobs:
  prepare:
    if: false && github.repository == 'alexj11324/Mikka' && github.ref == 'refs/heads/acceptance/issues-1504-1506' && github.run_attempt == 1
    runs-on: ubuntu-latest
    concurrency:
      group: web-deploy-production
      cancel-in-progress: false
      queue: max
    timeout-minutes: 15
    env:
      MIKKA_EDITION: cloud
      MIKKA_GITHUB_OPERATION: 'prepare'
      MIKKA_GITHUB_REPAIR_GO: 'root-reviewed-1506-r7-20261109t1622'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Verify exact source, file scope, current main and bounded entry before credentials
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import datetime,hashlib,json,os,pathlib,re,subprocess
          root=pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()
          assert pathlib.Path.cwd().resolve()==root
          assert re.fullmatch(r'[a-f0-9]{40}','32523d5955479de800a94ba002c551666c4ddeb1'), 'app_source_unbound'
          assert re.fullmatch(r'[a-f0-9]{40}','b0e93134333a6697b4c7456e48cebf7bced9d306'), 'app_tree_unbound'
          assert 'root-reviewed-1506-r7-20261109t1622'.startswith('root-reviewed-1506-'), 'go_unbound'
          assert os.environ.get('MIKKA_GITHUB_REPAIR_GO')=='root-reviewed-1506-r7-20261109t1622'
          assert os.environ.get('GITHUB_REPOSITORY')=='alexj11324/Mikka'
          assert os.environ.get('GITHUB_RUN_ATTEMPT')=='1'
          assert os.environ.get('GITHUB_REF')=='refs/heads/acceptance/issues-1504-1506'
          assert datetime.datetime.now(datetime.timezone.utc)<datetime.datetime.fromisoformat('2026-11-10T02:13:23+00:00')
          def git(*args): return subprocess.check_output(['git','-C',str(root),*args],text=True).strip()
          assert git('rev-parse','HEAD')==os.environ['GITHUB_SHA']
          assert git('rev-list','--parents','-n','1','HEAD').split()[1:]==['5d08fe6f771a3d85c5f4c2bafba1dc35bedc6811']
          try: git('cat-file','-e','5d08fe6f771a3d85c5f4c2bafba1dc35bedc6811^{commit}')
          except subprocess.CalledProcessError:
              subprocess.run(['git','-C',str(root),'fetch','--no-tags','--depth=1','https://github.com/alexj11324/Mikka.git','5d08fe6f771a3d85c5f4c2bafba1dc35bedc6811'],check=True,timeout=60,stdout=subprocess.DEVNULL)
          assert git('rev-parse','5d08fe6f771a3d85c5f4c2bafba1dc35bedc6811^{tree}')=='32ff7a84a4e16780797098ffa1ce87bd2e2b5d46'
          expected={"scripts/ops/issue1505/github-readonly-helper.mjs":"cdafa2f571ed898de2fc9d0a6f208cd3a0e53cfdc1d0777333cf755e73edb742","scripts/ops/issue1505/github-readonly-provider.mjs":"23a6f1098e66cddac71e76d6f9c9f41d5da0c3ba8bdf24c964cf4e7cece5851e","scripts/ops/issue1505/github-readonly-runner.mjs":"7c8fd8874a27d47447b5e8eeffe87c115a2ab138a20e946aaac5bec6132331ef","scripts/ops/issue1505/github-readonly-store.mjs":"1431219596ce2241f65f01df6642f0145c7f4c3b00f31181fefbc332ad9511d5","scripts/ops/issue1505/github-readonly.test.mjs":"ffa4fb2004471bc4831eb8d4099b7c3bf0130a540b1583eac6412ebe01dd292b"}
          allowed={'.github/workflows/issue1505-smoke-github-readonly.yml'}
          assert set(git('diff','--name-only','5d08fe6f771a3d85c5f4c2bafba1dc35bedc6811','HEAD').splitlines())==allowed
          raw=git('diff','--raw','--no-renames','--abbrev=40','5d08fe6f771a3d85c5f4c2bafba1dc35bedc6811','HEAD').splitlines()
          entries=[line.split('\t',1) for line in raw]
          assert len(entries)==len(allowed) and all(len(entry)==2 for entry in entries)
          assert {entry[1] for entry in entries}==allowed
          for header,path in entries:
              fields=header.split()
              assert len(fields)==5 and fields[0]==':100644' and fields[1]=='100644' and fields[4]=='M',path
              assert fields[2]=='12f5ec5082fe89d4d0ca14fae6b6cab0d5cb4f0d' and re.fullmatch(r'[a-f0-9]{40}',fields[3]),path
          assert not git('diff','--name-only','HEAD')
          for path,want in expected.items():
              assert hashlib.sha256((root/path).read_bytes()).hexdigest()==want,path
          import json,os,urllib.request
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl): return None
          request=urllib.request.Request('https://api.github.com/repos/alexj11324/Mikka/git/ref/heads/main',
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.build_opener(NoRedirect).open(request,timeout=20) as response:
              assert response.status==200
              actual=json.load(response)
          assert actual['object']['sha']=='32523d5955479de800a94ba002c551666c4ddeb1','main_changed'
          assert datetime.datetime.now(datetime.timezone.utc)<datetime.datetime.fromisoformat('2026-11-10T02:13:23+00:00')
          print(json.dumps({'status':'passed','source':os.environ['GITHUB_SHA'],'operatorParent':'5d08fe6f771a3d85c5f4c2bafba1dc35bedc6811','appSource':'32523d5955479de800a94ba002c551666c4ddeb1','appTree':'b0e93134333a6697b4c7456e48cebf7bced9d306','files':len(expected),'productDelta':False}))
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify the exact bounded helper before loading production credentials
