              actual=json.load(response)
            if actual.get('object',{}).get('sha')!='111a8dfb8b227ac0441324339ff42e4328ea609a': raise ValueError()
          except Exception:
            raise SystemExit('issue1505_cleanup_current_main_changed_or_unavailable') from None
          check_window()
          print(json.dumps({'status':'passed','source':os.environ['GITHUB_SHA'],'base':base,'unchangedExecutionFiles':len(expected),'workflowOnly':True,'currentMain':'111a8dfb8b227ac0441324339ff42e4328ea609a'}))
