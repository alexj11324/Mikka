          import datetime,os
          def stamp(name):
            value=os.environ.get(name,'')
            try:
              result=datetime.datetime.fromisoformat(value.replace('Z','+00:00'))
            except ValueError:
              raise SystemExit('issue1505_cleanup_window_unbound') from None
            if not value.endswith('Z') or result.tzinfo is None:
              raise SystemExit('issue1505_cleanup_window_unbound')
            return result
          start=stamp('MIKKA_1505_CLEANUP_WINDOW_START')
          entry=stamp('MIKKA_1505_CLEANUP_ENTRY_DEADLINE')
          hard=stamp('MIKKA_1505_CLEANUP_HARD_END')
          minutes=int(os.environ['MIKKA_1505_CLEANUP_JOB_MINUTES'])
          def check_window():
            now=datetime.datetime.now(datetime.timezone.utc)
            if not (1<=minutes<=15 and start<entry and entry+datetime.timedelta(minutes=minutes)<=hard and start<=now<entry):
              raise SystemExit('issue1505_cleanup_window_closed')
          check_window()
          import json,urllib.request
          class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self,req,fp,code,msg,headers,newurl): return None
          try:
            request=urllib.request.Request('https://api.github.com/repos/alexj11324/Mikka/git/ref/heads/main',
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
            with urllib.request.build_opener(NoRedirect()).open(request,timeout=20) as response:
              if response.status!=200: raise ValueError()
              actual=json.load(response)
            if actual.get('object',{}).get('sha')!='12458fe22e1217f644e8b28f82ab856211e73b72': raise ValueError()
          except Exception:
            raise SystemExit('issue1505_cleanup_current_main_changed_or_unavailable') from None
          check_window()
