# Disabled issue1506 reuse of the reviewed issue1505 read-only connection contract.
# Bind actual APP/tree and one finite deadline only after shared-account handoff.
# Does not revoke or renew any historical child. Cleanup must use this run's new receipt.
name: Issue 1506 read-only Smoke GitHub cleanup
on:
  push:
    branches: [acceptance/issues-1504-1506]
    paths:
      - .github/workflows/issue1505-smoke-github-readonly.yml
      - scripts/ops/issue1505/github-readonly-*.mjs
      - scripts/ops/issue1505/github-readonly.test.mjs
permissions:
  contents: read
concurrency:
  group: production-smoke-owner-acceptance
  cancel-in-progress: false
  queue: max
jobs:
  prepare:
    if: false && github.repository == 'alexj11324/Mikka' && github.ref == 'refs/heads/acceptance/issues-1504-1506' && github.run_attempt == 1
    runs-on: ubuntu-latest
    concurrency:
      group: web-deploy-production
      cancel-in-progress: false
      queue: max
    timeout-minutes: 15
    env:
      MIKKA_EDITION: cloud
      MIKKA_GITHUB_OPERATION: 'cleanup'
      MIKKA_GITHUB_REPAIR_GO: 'root-reviewed-1506-r7-20261109t1622'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Verify exact source, file scope, current main and bounded entry before credentials
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import datetime,hashlib,json,os,pathlib,re,subprocess
          root=pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()
          assert pathlib.Path.cwd().resolve()==root
          assert re.fullmatch(r'[a-f0-9]{40}','cc389d61e8a85206d17616e4326a660283a1b2bd'), 'app_source_unbound'
          assert re.fullmatch(r'[a-f0-9]{40}','3d7f2633b54853ca9eb2d730c60d2b11ae947b59'), 'app_tree_unbound'
          assert 'root-reviewed-1506-r7-20261109t1622'.startswith('root-reviewed-1506-'), 'go_unbound'
          assert os.environ.get('MIKKA_GITHUB_REPAIR_GO')=='root-reviewed-1506-r7-20261109t1622'
          assert os.environ.get('GITHUB_REPOSITORY')=='alexj11324/Mikka'
          assert os.environ.get('GITHUB_RUN_ATTEMPT')=='1'
          assert os.environ.get('GITHUB_REF')=='refs/heads/acceptance/issues-1504-1506'
          assert datetime.datetime.now(datetime.timezone.utc)<datetime.datetime.fromisoformat('2026-11-10T03:06:21+00:00')
          def git(*args): return subprocess.check_output(['git','-C',str(root),*args],text=True).strip()
          assert git('rev-parse','HEAD')==os.environ['GITHUB_SHA']
          assert re.fullmatch(r'[a-f0-9]{40}','5535069231383e6bf587192d80ca942955737b36'), 'cleanup_parent_unbound'
          assert re.fullmatch(r'[a-f0-9]{40}','fdbf3bbc39a8b8b48d7e45a18bfebdd6267ee816'), 'cleanup_parent_tree_unbound'
          assert git('rev-list','--parents','-n','1','HEAD').split()[1:]==['5535069231383e6bf587192d80ca942955737b36']
          assert git('rev-parse','5535069231383e6bf587192d80ca942955737b36^{tree}')=='fdbf3bbc39a8b8b48d7e45a18bfebdd6267ee816'
          assert set(git('diff','--name-only','5535069231383e6bf587192d80ca942955737b36','HEAD').splitlines())=={'.github/workflows/issue1505-smoke-github-readonly.yml'}
          try: git('cat-file','-e','5535069231383e6bf587192d80ca942955737b36^{commit}')
          except subprocess.CalledProcessError:
              subprocess.run(['git','-C',str(root),'fetch','--no-tags','--depth=1','https://github.com/alexj11324/Mikka.git','5535069231383e6bf587192d80ca942955737b36'],check=True,timeout=60,stdout=subprocess.DEVNULL)
          assert git('rev-parse','5535069231383e6bf587192d80ca942955737b36^{tree}')=='fdbf3bbc39a8b8b48d7e45a18bfebdd6267ee816'
          expected={"scripts/ops/issue1505/github-readonly-helper.mjs":"cdafa2f571ed898de2fc9d0a6f208cd3a0e53cfdc1d0777333cf755e73edb742","scripts/ops/issue1505/github-readonly-provider.mjs":"23a6f1098e66cddac71e76d6f9c9f41d5da0c3ba8bdf24c964cf4e7cece5851e","scripts/ops/issue1505/github-readonly-runner.mjs":"7c8fd8874a27d47447b5e8eeffe87c115a2ab138a20e946aaac5bec6132331ef","scripts/ops/issue1505/github-readonly-store.mjs":"1431219596ce2241f65f01df6642f0145c7f4c3b00f31181fefbc332ad9511d5","scripts/ops/issue1505/github-readonly.test.mjs":"ffa4fb2004471bc4831eb8d4099b7c3bf0130a540b1583eac6412ebe01dd292b"}
          allowed={'.github/workflows/issue1505-smoke-github-readonly.yml'}
          assert set(git('diff','--name-only','5535069231383e6bf587192d80ca942955737b36','HEAD').splitlines())==allowed
          raw=git('diff','--raw','--no-renames','--abbrev=40','5535069231383e6bf587192d80ca942955737b36','HEAD').splitlines()
          entries=[line.split('\t',1) for line in raw]
          assert len(entries)==len(allowed) and all(len(entry)==2 for entry in entries)
          assert {entry[1] for entry in entries}==allowed
          for header,path in entries:
              fields=header.split()
              assert len(fields)==5 and fields[0]==':100644' and fields[1]=='100644' and fields[4]=='M',path
              assert fields[2]=='42da3f876f54ddeff6892992bba0d2f643e9c045' and re.fullmatch(r'[a-f0-9]{40}',fields[3]),path
          assert not git('diff','--name-only','HEAD')
          for path,want in expected.items():
              assert hashlib.sha256((root/path).read_bytes()).hexdigest()==want,path
          import json,os,urllib.request
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl): return None
          request=urllib.request.Request('https://api.github.com/repos/alexj11324/Mikka/git/ref/heads/main',
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.build_opener(NoRedirect).open(request,timeout=20) as response:
              assert response.status==200
              actual=json.load(response)
          assert actual['object']['sha']=='cc389d61e8a85206d17616e4326a660283a1b2bd','main_changed'
          assert datetime.datetime.now(datetime.timezone.utc)<datetime.datetime.fromisoformat('2026-11-10T03:06:21+00:00')
          print(json.dumps({'status':'passed','source':os.environ['GITHUB_SHA'],'operatorParent':'5535069231383e6bf587192d80ca942955737b36','appSource':'cc389d61e8a85206d17616e4326a660283a1b2bd','appTree':'3d7f2633b54853ca9eb2d730c60d2b11ae947b59','files':len(expected),'productDelta':False}))
          PY
      - name: Validate only this preparation's original sanitized receipt before credentials
        working-directory: .
        run: |
          python3 - <<'PY'
          import base64,datetime,hashlib,json,os,pathlib,re
          origin={"source":"c55c674d1e74f0ba2bcc06b30ae61da831849d60","runId":"42739355795","runAttempt":1,"artifactId":"13728486583","artifactSha256":"4b7029a4078ea199eb000d8915bd8ba7228b5a100b839c7ee1294d5009816f29","receiptSha256":"425f2c4c6321208178f4b19b8fec5af71e4593d5ffb641af8c45c22d611421f3"}
          assert re.fullmatch(r'[a-f0-9]{40}',origin['source']), 'receipt_source_unbound'
          assert all(re.fullmatch(r'[1-9][0-9]*',origin[key]) for key in ('runId','artifactId')), 'receipt_origin_unbound'
          assert origin['runAttempt']==1
          assert all(re.fullmatch(r'[a-f0-9]{64}',origin[key]) for key in ('artifactSha256','receiptSha256')), 'receipt_hash_unbound'
          encoded=''
          raw=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(raw).hexdigest()==origin['receiptSha256'], 'receipt_bytes_changed'
          receipt=json.loads(raw)
          def closed(value,allowed):
              assert isinstance(value,dict) and set(value)<=set(allowed), 'receipt_fields_not_closed'
          def field_type(value,kind):
              assert type(value) is kind, 'receipt_type_not_closed'
          top={'version','issue','operation','status','stage','startedAt','completedAt','changed','ownerRefreshAttempted','mintAttempted','ownerTokenResolution','ownerSourceBaseline','ownerProviderExpiresAt','mintOutcome','mintedTokenSha256','minted','state','readback','ownerUnchanged','code','commitUnconfirmed','cleanup','newChildRevocation','closeCode','receiptWriteUnconfirmed','providerFailure'}
          state_keys={'version','issue','userId','ownerUserId','githubAccountId','githubLogin','repository','appId','appClientId','repositoryId','installationId','tokenSha256','providerExpiresAt','connectionExpiresAt','connectionUpdatedAt'}
          closed(receipt,top)
          assert receipt.get('version')==1 and receipt.get('issue')==1505 and receipt.get('operation')=='prepare'
          assert receipt.get('status') in ('passed','incomplete') and isinstance(receipt.get('state'),dict), 'receipt_has_no_owned_child_state'
          assert set(receipt['state'])==state_keys
          state=receipt['state']
          assert state['version']==1 and state['issue']==1505
          assert state['userId']=='cL1NXe1mr7WuIS8xWhU37v0p7kNoUMY3' and state['ownerUserId']=='XjTsvV1ASqtV8wWat9aco0Z0KLodd9jJ'
          assert state['githubAccountId']=='183887963' and state['githubLogin']=='alexj11324' and state['repository']=='alexj11324/Mikka-handoff'
          if 'ownerTokenResolution' in receipt: closed(receipt['ownerTokenResolution'],{'minimumValidityMs','status','actualRefresh','beforeUpdatedAt','beforeExpiresAt','afterUpdatedAt','afterExpiresAt','persistedMetadataChanged'})
          if 'minted' in receipt:
              closed(receipt['minted'],{'tokenSha256','providerExpiresAt','appId','repositoryId','installationId','permissions','mintScopeConfirmed','checkTokenScopeConfirmed'})
              closed(receipt['minted'].get('permissions'),{'metadata','contents'})
              assert receipt['minted']['permissions']=={'metadata':'read','contents':'read'}
          if 'readback' in receipt: closed(receipt['readback'],{'connected','samePrincipal','repositoryAccessible','sameAppInstallation'})
          for key in ('cleanup',):
              if key in receipt:
                  closed(receipt[key],{'version','issue','operation','status','stage','startedAt','completedAt','revoked','disconnected','revocation','code','providerFailure'})
          for value in (receipt.get('newChildRevocation'),receipt.get('cleanup',{}).get('revocation')):
              if value is not None:
                  closed(value,{'kind','status'})
                  assert (value.get('kind'),value.get('status')) in (('delete_token',204),('authenticated_check_token',404))
          codes=set(["issue1505_github_app_configuration_changed","issue1505_github_app_discovery_ambiguous","issue1505_github_app_not_configured","issue1505_github_arguments_invalid","issue1505_github_child_digest_mismatch","issue1505_github_child_not_distinct","issue1505_github_cleanup_token_mismatch","issue1505_github_cleanup_token_unavailable","issue1505_github_dependency_failed","issue1505_github_execution_not_enabled","issue1505_github_identity_mismatch","issue1505_github_invalid_state","issue1505_github_normal_readback_mismatch","issue1505_github_output_overwrites_input","issue1505_github_owner_connection_changed","issue1505_github_owner_credential_invalid","issue1505_github_owner_provider_expiry_invalid","issue1505_github_owner_source_not_fresh","issue1505_github_pagination_limit","issue1505_github_principal_mismatch","issue1505_github_provider_http","issue1505_github_provider_schema","issue1505_github_provider_transport","issue1505_github_provider_validity_insufficient","issue1505_github_repository_mismatch","issue1505_github_repository_unavailable","issue1505_github_revoke_scoped_token_failed","issue1505_github_scope_not_selected","issue1505_github_scope_permissions_mismatch","issue1505_github_scoped_app_mismatch","issue1505_github_scoped_expiry_invalid","issue1505_github_scoped_token_mismatch","issue1505_github_scoped_token_not_distinct","issue1505_github_smoke_connection_changed","issue1505_github_smoke_connection_exists","issue1505_github_smoke_legacy_github_exists","issue1505_github_smoke_work_active","issue1505_github_state_bytes_changed","issue1505_github_stored_credential_invalid","issue1505_github_stored_identity_invalid","issue1505_github_unexpected_oauth_scopes","issue1505_github_verified_app_id_invalid"])
          dates={'startedAt','completedAt','ownerProviderExpiresAt','providerExpiresAt','connectionExpiresAt','connectionUpdatedAt','beforeUpdatedAt','beforeExpiresAt','afterUpdatedAt','afterExpiresAt'}
          booleans={'ownerRefreshAttempted','mintAttempted','persistedMetadataChanged','mintScopeConfirmed','checkTokenScopeConfirmed','connected','samePrincipal','repositoryAccessible','sameAppInstallation','ownerUnchanged','commitUnconfirmed','revoked','disconnected','receiptWriteUnconfirmed'}
          enums={'operation':{'prepare','cleanup'},'status':{'passed','incomplete','attempting','committed'},'stage':{'configuration','identity','prepare_owner_source','read_owner_no_refresh','mint_readonly_child','mint_request','install_vacant_connection','commit_new_child','normal_repository_readback','state','match_owned_child','revoke_exact_child','disconnect_exact_child'},'actualRefresh':{'not_independently_observed'},'ownerSourceBaseline':{'after_normal_token_resolution'},'mintOutcome':{'unknown','received'},'metadata':{'read'},'contents':{'read'},'kind':{'delete_token','authenticated_check_token'}}
          public_state={'userId','ownerUserId','githubAccountId','githubLogin','repository'}
          provider_stages=set(["owner_identity","check_owner_token","discover_app","owner_repository","owner_installations","owner_installation_repositories","mint_scoped_token","scoped_identity","check_scoped_token","scoped_repository","scoped_installations","scoped_installation_repositories","revoke_scoped_token","check_revoked_token"])
          def provider_failure(value,code):
              closed(value,{'stage','status'})
              assert code in ('issue1505_github_provider_http','issue1505_github_provider_transport','issue1505_github_provider_schema'), 'receipt_provider_code_not_closed'
              assert isinstance(value.get('stage'),str) and value['stage'] in provider_stages, 'receipt_provider_stage_not_closed'
              if code=='issue1505_github_provider_http':
                  assert set(value)=={'stage','status'} and type(value['status']) is int and 100<=value['status']<=599, 'receipt_provider_status_not_closed'
              else:
                  assert set(value)=={'stage'}, 'receipt_provider_fields_not_closed'
          def values(value):
              for key,item in value.items():
                  if key=='providerFailure': provider_failure(item,value.get('code'))
                  elif isinstance(item,dict): values(item)
                  elif key in dates:
                      assert item is None or (isinstance(item,str) and re.fullmatch(r'[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+(?:Z|\+00:00)',item)), 'receipt_date_not_closed'
                      if item is not None: datetime.datetime.fromisoformat(item.replace('Z','+00:00'))
                  elif key in booleans: field_type(item,bool)
                  elif key=='changed': assert item is None or type(item) is bool
                  elif key in ('code','closeCode'): assert item in codes
                  elif key in ('tokenSha256','mintedTokenSha256'): assert isinstance(item,str) and re.fullmatch(r'[a-f0-9]{64}',item)
                  elif key in ('appId','repositoryId','installationId'): assert isinstance(item,str) and re.fullmatch(r'[1-9][0-9]{0,19}',item)
                  elif key=='appClientId': assert isinstance(item,str) and re.fullmatch(r'[A-Za-z0-9_.-]{1,128}',item)
                  elif key in public_state: assert item==state[key]
                  elif key=='version': assert type(item) is int and item==1
                  elif key=='issue': assert type(item) is int and item==1505
                  elif key=='minimumValidityMs': assert type(item) is int and item==660000
                  elif key=='status' and type(item) is int: assert item in (204,404)
                  elif key in enums: assert item in enums[key]
                  else: raise AssertionError('receipt_scalar_not_closed')
          values(receipt)
          destination=pathlib.Path(os.environ['RUNNER_TEMP'])/'issue1506-github-readonly-input'
          destination.mkdir(mode=0o700,parents=False,exist_ok=False)
          target=destination/'receipt.json'
          with target.open('xb') as output: output.write(raw)
          target.chmod(0o600)
          assert hashlib.sha256(target.read_bytes()).hexdigest()==origin['receiptSha256']
          print(json.dumps({'status':'passed','operation':'cleanup','receiptOrigin':origin,'inputBytes':len(raw)}))
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify the exact bounded helper before loading production credentials
        working-directory: .
        run: node --test scripts/ops/issue1505/github-readonly.test.mjs
      - name: Check out the exact bound application independently of the operator carrier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: cc389d61e8a85206d17616e4326a660283a1b2bd
          path: app-source
          persist-credentials: false
          fetch-depth: 1
      - name: Overlay only the six reviewed operator files onto the exact application
        working-directory: .
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          operator=pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()
          app=operator/'app-source'
          assert pathlib.Path.cwd().resolve()==operator
          def git(where,*args): return subprocess.check_output(['git','-C',str(where),*args],text=True).strip()
          assert git(operator,'rev-parse','HEAD')==os.environ['GITHUB_SHA']
          assert not git(operator,'diff','--name-only','HEAD')
          assert git(app,'rev-parse','HEAD')=='cc389d61e8a85206d17616e4326a660283a1b2bd'
          assert git(app,'rev-parse','HEAD^{tree}')=='3d7f2633b54853ca9eb2d730c60d2b11ae947b59'
          assert not git(app,'diff','--name-only','HEAD')
          assert not git(app,'ls-files','--others','--exclude-standard')
          expected={"scripts/ops/issue1505/github-readonly-helper.mjs":"cdafa2f571ed898de2fc9d0a6f208cd3a0e53cfdc1d0777333cf755e73edb742","scripts/ops/issue1505/github-readonly-provider.mjs":"23a6f1098e66cddac71e76d6f9c9f41d5da0c3ba8bdf24c964cf4e7cece5851e","scripts/ops/issue1505/github-readonly-runner.mjs":"7c8fd8874a27d47447b5e8eeffe87c115a2ab138a20e946aaac5bec6132331ef","scripts/ops/issue1505/github-readonly-store.mjs":"1431219596ce2241f65f01df6642f0145c7f4c3b00f31181fefbc332ad9511d5","scripts/ops/issue1505/github-readonly.test.mjs":"ffa4fb2004471bc4831eb8d4099b7c3bf0130a540b1583eac6412ebe01dd292b"}
          allowed=set(expected)|{".github/workflows/issue1505-smoke-github-readonly.yml"}
          def plain_file(base, relative):
              target=base/relative
              assert target.is_file() and not target.is_symlink(),relative
              current=target.parent
              while current!=base:
                  assert not current.is_symlink() and current.is_relative_to(base),relative
                  current=current.parent
              return target
          for relative in sorted(allowed):
              source=plain_file(operator,relative).read_bytes()
              if relative in expected: assert hashlib.sha256(source).hexdigest()==expected[relative],relative
              target=app/relative
              assert not target.exists() and not target.is_symlink(),relative
              current=target.parent
              while current!=app:
                  assert not current.is_symlink() and current.is_relative_to(app),relative
                  current=current.parent
              target.parent.mkdir(parents=True,exist_ok=True)
              with target.open('xb') as output: output.write(source)
              target.chmod(0o644)
              assert plain_file(app,relative).read_bytes()==source,relative
          assert set(git(app,'ls-files','--others','--exclude-standard').splitlines())==allowed
          assert not git(app,'diff','--name-only','HEAD')
          print(json.dumps({'status':'passed','operator':os.environ['GITHUB_SHA'],'appSource':'cc389d61e8a85206d17616e4326a660283a1b2bd','appTree':'3d7f2633b54853ca9eb2d730c60d2b11ae947b59','overlayFiles':len(allowed),'productDelta':False}))
          PY
