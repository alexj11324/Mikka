        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify the actual window, closed source and unchanged cleanup implementation
        run: |
          python3 - <<'PY'
          import datetime,os
          def stamp(name):
            value=os.environ.get(name,'')
            try:
              result=datetime.datetime.fromisoformat(value.replace('Z','+00:00'))
            except ValueError:
              raise SystemExit('issue1505_cleanup_window_unbound') from None
            if not value.endswith('Z') or result.tzinfo is None:
              raise SystemExit('issue1505_cleanup_window_unbound')
            return result
          start=stamp('MIKKA_1505_CLEANUP_WINDOW_START')
          entry=stamp('MIKKA_1505_CLEANUP_ENTRY_DEADLINE')
          hard=stamp('MIKKA_1505_CLEANUP_HARD_END')
          minutes=int(os.environ['MIKKA_1505_CLEANUP_JOB_MINUTES'])
          now=datetime.datetime.now(datetime.timezone.utc)
          if not (1<=minutes<=15 and start<entry and entry+datetime.timedelta(minutes=minutes)<=hard and start<=now<entry):
            raise SystemExit('issue1505_cleanup_window_closed')
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path('.')
          assert os.environ.get('MIKKA_GITHUB_REPAIR_GO')=='root-reviewed-1505-github-readonly-v1'
          assert os.environ.get('GITHUB_REPOSITORY')=='alexj11324/Mikka'
          assert os.environ.get('GITHUB_RUN_ATTEMPT')=='1'
          assert os.environ.get('GITHUB_REF')=='refs/heads/ops/1505-smoke-github-readonly-20261109'
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD')==os.environ['GITHUB_SHA']
          base='286ae62b4a5c3147bc99452973584637ca310464'
          assert git('rev-parse',base+'^{tree}')=='b3ac6d613e98cda928153766f68f56bc943f3c59'
          subprocess.run(['git','merge-base','--is-ancestor',base,'HEAD'],check=True)
          expected={'scripts/ops/issue1505/github-readonly-provider.mjs': '11b100e92c24d91b98200c18eea9a50a9c6a09ac3e3d5ece1166bbcc559f8937', 'scripts/ops/issue1505/github-readonly-helper.mjs': 'dcb7972129083c4b291a490f3965680935799413ad286a97c93042b96a4fe9d0', 'scripts/ops/issue1505/github-readonly-store.mjs': '3170e335a9623575c52a027372093a5eea32d2def30f178c2aa552c5ba176327', 'scripts/ops/issue1505/github-readonly-runner.mjs': '3ef68dd706ef605e68623ec24dcde593a47e8b9a882833069b38d36e1667f2c6', 'scripts/ops/issue1505/github-readonly.test.mjs': 'f4d75ebec6948be7a55e6096b909fcea0d8daf98fb87c2b18636d27974dded78'}
          assert git('diff','--name-status','--no-renames',base,'HEAD')=='M\t.github/workflows/issue1505-smoke-github-readonly.yml'
          assert not git('status','--porcelain=v1','--untracked-files=no')
          for path,want in expected.items():
            item=root/path
            assert item.is_file() and not item.is_symlink(),path
            assert hashlib.sha256(item.read_bytes()).hexdigest()==want,path
          print(json.dumps({'status':'passed','source':os.environ['GITHUB_SHA'],'base':base,'unchangedExecutionFiles':len(expected),'workflowOnly':True}))
          PY
