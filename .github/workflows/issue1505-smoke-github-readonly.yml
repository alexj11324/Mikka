      - name: Download the exact renewal ZIP without forwarding authorization
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,urllib.error,urllib.parse,urllib.request
          
          class DownloadRejected(Exception):
            pass
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self, req, fp, code, msg, headers, newurl):
              return None
          
          def download_archive(token, artifact_id, expected_size, expected_sha256, opener=None):
            code='issue1505_cleanup_archive_download_unavailable'
            try:
              if not isinstance(token,str) or not token:
                raise ValueError()
              opener=opener or urllib.request.build_opener(NoRedirect())
              request=urllib.request.Request(
                'https://api.github.com/repos/alexj11324/Mikka/actions/artifacts/'+str(artifact_id)+'/zip',
                headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28','User-Agent':'Mikka-Issue-1505-Exact-Child-Cleanup'},
                method='GET')
              try:
                response=opener.open(request,timeout=20)
              except urllib.error.HTTPError as error:
                response=error
              try:
                code='issue1505_cleanup_archive_redirect_invalid'
                if response.code!=302:
                  raise ValueError()
                location=response.headers.get('Location')
              finally:
                response.close()
              if not isinstance(location,str) or not location.startswith('https://') or '\\' in location:
                raise ValueError()
              if any(ord(char)<=32 or ord(char)==127 for char in location):
                raise ValueError()
              destination=urllib.parse.urlsplit(location)
              host=destination.hostname or ''
              allowed=(host=='results-receiver.actions.githubusercontent.com'
                or re.fullmatch(r'[a-z0-9][a-z0-9-]*\.blob\.core\.windows\.net',host) is not None)
              if (destination.scheme!='https' or not allowed or destination.username is not None
                or destination.password is not None or destination.port not in (None,443)
                or destination.fragment or not destination.query):
                raise ValueError()
              code='issue1505_cleanup_archive_download_unavailable'
              # Use the original signed Location unchanged, without Authorization; no further redirect is followed.
              request=urllib.request.Request(location,
                headers={'User-Agent':'Mikka-Issue-1505-Exact-Child-Cleanup'},method='GET')
              with opener.open(request,timeout=20) as response:
                if response.code!=200:
                  raise ValueError()
                archive=response.read(expected_size+1)
              code='issue1505_cleanup_archive_size_changed'
              if len(archive)!=expected_size:
                raise ValueError()
              code='issue1505_cleanup_archive_digest_changed'
              if hashlib.sha256(archive).hexdigest()!=expected_sha256:
                raise ValueError()
              return archive,host
            except Exception:
              raise DownloadRejected(code) from None
          
          if __name__=='__main__':
            try:
              archive,host=download_archive(os.environ.get('GITHUB_TOKEN'),13655911206,1920,
                'f8dce5e9dba3d6ef461616dcb0c36f70e7ce1a16b08fb8d48e404586721fbfd9')
              directory=pathlib.Path(os.environ['RUNNER_TEMP'])/'issue1505-readonly-original'
              directory.mkdir(mode=0o700,exist_ok=False)
              target=directory/'archive.zip'
              fd=os.open(target,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
              with os.fdopen(fd,'wb') as output:
                output.write(archive)
                output.flush()
                os.fsync(output.fileno())
              print(json.dumps({'status':'downloaded_immutable_zip','artifactId':13655911206,
                'zipBytes':len(archive),'zipSha256':hashlib.sha256(archive).hexdigest(),
                'downloadHost':host,'redirectAuthorizationForwarded':False}))
            except DownloadRejected as error:
              raise SystemExit(str(error)) from None
            except Exception:
              raise SystemExit('issue1505_cleanup_archive_save_failed') from None
          PY
      - name: Verify all three archive members and copy only exact receipt.json
        run: |
          python3 - <<'PY'
          import hashlib,io,json,os,pathlib,stat,zipfile
          
          class ArchiveRejected(Exception):
            pass
          
          def reject(code):
            raise ArchiveRejected('issue1505_cleanup_'+code)
          
          def verified_receipt(archive, expected_size, expected_sha256, members):
            if not isinstance(archive,bytes) or len(archive)!=expected_size:
              reject('archive_size_changed')
            if hashlib.sha256(archive).hexdigest()!=expected_sha256:
              reject('archive_digest_changed')
            if set(members)!={'cleanup-original-child.json','original-child-input.json','receipt.json'}:
              reject('archive_manifest_invalid')
            try:
              with zipfile.ZipFile(io.BytesIO(archive),'r') as source:
                entries=source.infolist()
                seen=set()
                for entry in entries:
                  name=entry.orig_filename
                  if name!=entry.filename or '/' in name or '\\' in name or '\x00' in name or name in ('.','..'):
                    reject('archive_member_path_invalid')
                  if name in seen:
                    reject('archive_member_duplicate')
                  seen.add(name)
                  mode=(entry.external_attr>>16)&0xffff
                  if entry.is_dir() or entry.external_attr&0x10 or stat.S_IFMT(mode) not in (0,stat.S_IFREG):
                    reject('archive_member_not_regular')
                  if entry.flag_bits&1:
                    reject('archive_member_encrypted')
                if len(entries)!=3 or seen!=set(members):
                  reject('archive_member_set_changed')
                checked={}
                for entry in entries:
                  name=entry.filename
                  expected=members[name]
                  if entry.file_size!=expected['bytes']:
                    reject('archive_member_size_changed')
                  with source.open(entry,'r') as stream:
                    body=stream.read(expected['bytes']+1)
                  if len(body)!=expected['bytes']:
                    reject('archive_member_size_changed')
                  if hashlib.sha256(body).hexdigest()!=expected['sha256']:
                    reject('archive_member_digest_changed')
                  checked[name]=body
                return checked['receipt.json']
            except ArchiveRejected:
              raise
            except Exception:
              reject('archive_invalid')
          
          if __name__=='__main__':
            try:
              source=pathlib.Path(os.environ['RUNNER_TEMP'])/'issue1505-readonly-original'/'archive.zip'
              if not source.is_file() or source.is_symlink():
                reject('input_not_regular')
              archive=source.read_bytes()
              members={
                'cleanup-original-child.json':{'bytes':321,'sha256':'c93269e1a6c62c72f6b582b1905201464c7d419dbba38b58ba345e0ce2b50a4c'},
                'original-child-input.json':{'bytes':1691,'sha256':'4d68933de480e7a56ee9b83606708ea80fdc533a507ba22d4118b2320eb7aaec'},
                'receipt.json':{'bytes':1691,'sha256':'f81a81a6e668f45daa01af217fba5e5bf294888e969c25c5efa4323507f47d26'},
              }
              original=verified_receipt(archive,1920,
                'f8dce5e9dba3d6ef461616dcb0c36f70e7ce1a16b08fb8d48e404586721fbfd9',members)
              wanted='f81a81a6e668f45daa01af217fba5e5bf294888e969c25c5efa4323507f47d26'
              directory=pathlib.Path(os.environ['RUNNER_TEMP'])/'issue1505-cleanup-input'
              directory.mkdir(mode=0o700,exist_ok=False)
              target=directory/'receipt.json'
              fd=os.open(target,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
              with os.fdopen(fd,'wb') as output:
                output.write(original)
                output.flush()
                os.fsync(output.fileno())
              if target.read_bytes()!=original:
                reject('input_copy_changed')
              print(json.dumps({'status':'verified','artifactId':13655911206,'archiveMembersVerified':3,
                'selectedMember':'receipt.json','originalReceiptBytes':len(original),
                'originalReceiptSha256':wanted,'byteIdenticalInput':True}))
            except ArchiveRejected as error:
              raise SystemExit(str(error)) from None
            except Exception:
              raise SystemExit('issue1505_cleanup_archive_validation_failed') from None
          PY
