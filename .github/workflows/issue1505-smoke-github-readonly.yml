          assert git(app,'rev-parse','HEAD^{tree}')=='b0e93134333a6697b4c7456e48cebf7bced9d306'
          assert not git(app,'diff','--name-only','HEAD')
          assert not git(app,'ls-files','--others','--exclude-standard')
          expected={"scripts/ops/issue1505/github-readonly-helper.mjs":"cdafa2f571ed898de2fc9d0a6f208cd3a0e53cfdc1d0777333cf755e73edb742","scripts/ops/issue1505/github-readonly-provider.mjs":"23a6f1098e66cddac71e76d6f9c9f41d5da0c3ba8bdf24c964cf4e7cece5851e","scripts/ops/issue1505/github-readonly-runner.mjs":"7c8fd8874a27d47447b5e8eeffe87c115a2ab138a20e946aaac5bec6132331ef","scripts/ops/issue1505/github-readonly-store.mjs":"1431219596ce2241f65f01df6642f0145c7f4c3b00f31181fefbc332ad9511d5","scripts/ops/issue1505/github-readonly.test.mjs":"ffa4fb2004471bc4831eb8d4099b7c3bf0130a540b1583eac6412ebe01dd292b"}
          allowed=set(expected)|{".github/workflows/issue1505-smoke-github-readonly.yml"}
          def plain_file(base, relative):
              target=base/relative
              assert target.is_file() and not target.is_symlink(),relative
              current=target.parent
              while current!=base:
                  assert not current.is_symlink() and current.is_relative_to(base),relative
                  current=current.parent
              return target
          for relative in sorted(allowed):
              source=plain_file(operator,relative).read_bytes()
              if relative in expected: assert hashlib.sha256(source).hexdigest()==expected[relative],relative
              target=app/relative
              assert not target.exists() and not target.is_symlink(),relative
              current=target.parent
              while current!=app:
                  assert not current.is_symlink() and current.is_relative_to(app),relative
                  current=current.parent
              target.parent.mkdir(parents=True,exist_ok=True)
              with target.open('xb') as output: output.write(source)
              target.chmod(0o644)
              assert plain_file(app,relative).read_bytes()==source,relative
          assert set(git(app,'ls-files','--others','--exclude-standard').splitlines())==allowed
          assert not git(app,'diff','--name-only','HEAD')
          print(json.dumps({'status':'passed','operator':os.environ['GITHUB_SHA'],'appSource':'32523d5955479de800a94ba002c551666c4ddeb1','appTree':'b0e93134333a6697b4c7456e48cebf7bced9d306','overlayFiles':len(allowed),'productDelta':False}))
          PY
      - name: Install the existing application dependencies with frozen lock and normal scripts
