      - name: Verify the single original archive member and copy only exact receipt.json
        run: |
          python3 - <<'PY'
          import hashlib,io,json,os,pathlib,stat,zipfile
          
          class ArchiveRejected(Exception):
            pass
          
          def reject(code):
            raise ArchiveRejected('issue1505_cleanup_'+code)
          
          def verified_receipt(archive, expected_size, expected_sha256, members):
            if not isinstance(archive,bytes) or len(archive)!=expected_size:
              reject('archive_size_changed')
            if hashlib.sha256(archive).hexdigest()!=expected_sha256:
              reject('archive_digest_changed')
            if set(members)!={'receipt.json'}:
              reject('archive_manifest_invalid')
            try:
              with zipfile.ZipFile(io.BytesIO(archive),'r') as source:
                entries=source.infolist()
                seen=set()
                for entry in entries:
                  name=entry.orig_filename
                  if name!=entry.filename or '/' in name or '\\' in name or '\x00' in name or name in ('.','..'):
                    reject('archive_member_path_invalid')
                  if name in seen:
                    reject('archive_member_duplicate')
                  seen.add(name)
                  mode=(entry.external_attr>>16)&0xffff
                  if entry.is_dir() or entry.external_attr&0x10 or stat.S_IFMT(mode) not in (0,stat.S_IFREG):
                    reject('archive_member_not_regular')
                  if entry.flag_bits&1:
                    reject('archive_member_encrypted')
                if len(entries)!=1 or seen!=set(members):
                  reject('archive_member_set_changed')
                checked={}
                for entry in entries:
                  name=entry.filename
                  expected=members[name]
                  if entry.file_size!=expected['bytes']:
                    reject('archive_member_size_changed')
                  with source.open(entry,'r') as stream:
                    body=stream.read(expected['bytes']+1)
                  if len(body)!=expected['bytes']:
                    reject('archive_member_size_changed')
                  if hashlib.sha256(body).hexdigest()!=expected['sha256']:
                    reject('archive_member_digest_changed')
                  checked[name]=body
                return checked['receipt.json']
            except ArchiveRejected:
              raise
            except Exception:
              reject('archive_invalid')
          
          if __name__=='__main__':
            try:
              source=pathlib.Path(os.environ['RUNNER_TEMP'])/'issue1505-readonly-original'/'archive.zip'
              if not source.is_file() or source.is_symlink():
                reject('input_not_regular')
              archive=source.read_bytes()
              members={
                'receipt.json':{'bytes':2132,'sha256':'80031945234e34264c558f830bd64bfa651858e69dbfdfa6354b62deb2a2022d'},
              }
              original=verified_receipt(archive,925,
                '87124f31fd4cfc332411985814650992fcdad9f21ca6f5a0709f70abb5c41a81',members)
              wanted='80031945234e34264c558f830bd64bfa651858e69dbfdfa6354b62deb2a2022d'
              directory=pathlib.Path(os.environ['RUNNER_TEMP'])/'issue1505-cleanup-input'
              directory.mkdir(mode=0o700,exist_ok=False)
              target=directory/'receipt.json'
              fd=os.open(target,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
              with os.fdopen(fd,'wb') as output:
                output.write(original)
                output.flush()
                os.fsync(output.fileno())
              if target.read_bytes()!=original:
                reject('input_copy_changed')
              print(json.dumps({'status':'verified','artifactId':13677458654,'archiveMembersVerified':1,
                'selectedMember':'receipt.json','originalReceiptBytes':len(original),
                'originalReceiptSha256':wanted,'byteIdenticalInput':True}))
            except ArchiveRejected as error:
              raise SystemExit(str(error)) from None
            except Exception:
              raise SystemExit('issue1505_cleanup_archive_validation_failed') from None
          PY
