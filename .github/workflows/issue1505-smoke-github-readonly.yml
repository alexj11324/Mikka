# Cleanup-only operator for the actual issue1503 window beginning 2026-11-09T07:58:15Z.
name: Issue 1505 exact read-only child cleanup
on:
  push:
    branches: [ops/1505-smoke-github-readonly-20261109]
    paths:
      - .github/workflows/issue1505-smoke-github-readonly.yml
      - scripts/ops/issue1505/github-readonly-*.mjs
      - scripts/ops/issue1505/github-readonly.test.mjs
permissions:
  contents: read
concurrency:
  group: production-smoke-owner-acceptance
  cancel-in-progress: false
  queue: max
jobs:
  cleanup:
    if: github.repository == 'alexj11324/Mikka'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: web-deploy-production
      cancel-in-progress: false
      queue: max
    env:
      MIKKA_EDITION: cloud
      MIKKA_GITHUB_REPAIR_GO: 'root-reviewed-1505-github-readonly-v1'
      MIKKA_1505_CLEANUP_WINDOW_START: '2026-11-09T07:58:15.000Z'
      MIKKA_1505_CLEANUP_ENTRY_DEADLINE: '2026-11-09T08:12:15.000Z'
      MIKKA_1505_CLEANUP_HARD_END: '2026-11-09T08:27:15.000Z'
      MIKKA_1505_CLEANUP_JOB_MINUTES: '15'
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
