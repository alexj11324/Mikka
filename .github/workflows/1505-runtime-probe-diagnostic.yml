name: Issue 1505 historical exact template recovery
on:
  push:
    branches: [ops/1505-runtime-diagnostic]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: key
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /vercel
          secret-name: E2B_API_KEY
          include-imports: false
      - name: Recover only the 25 templates from immutable issue-owned creation records
        timeout-minutes: 8
        run: python3 scripts/e2b/historical-template-recovery.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: e2b-historical-template-recovery
          path: ${{ runner.temp }}/historical-template-recovery.json
          if-no-files-found: error
          retention-days: 7
