name: Project decisions production acceptance
# Normal smoke session; secrets stay in the hosted workload and reports contain only fixed metadata.
on:
  workflow_run:
    workflows: [Web deploy]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only preflight, or three independent real model cases
        type: choice
        options: [preflight, active]
        default: preflight
permissions:
  contents: read
concurrency:
  group: production-smoke-owner-acceptance
  cancel-in-progress: false
jobs:
  acceptance:
    if: >-
      github.repository == 'alexj11324/Mikka' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.name == 'Web deploy' && github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == 'alexj11324/Mikka' &&
        contains(github.event.workflow_run.head_commit.message, '[project-map-acceptance]')))
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      MIKKA_EXPECTED_DEPLOYMENT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      MIKKA_PROJECT_DECISIONS_MODE: ${{ github.event.inputs.mode || 'active' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Verify the acceptance guards and permitted API model
        run: |
          node --test scripts/acceptance/project-decisions.test.mjs
          node scripts/assert-test-model.mjs deepseek-flash
      - name: Attest the exact live application and official runtime before reading credentials
        id: attest
        run: node scripts/acceptance/project-decisions.mjs --attest
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Read only the existing smoke account through the existing workload identity
        if: steps.attest.outputs.ready == 'true'
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          recursive: false
          include-imports: false
      - name: Run independent API and official subscription decision cases
        if: steps.attest.outputs.ready == 'true'
        run: node scripts/acceptance/project-decisions.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: project-decisions-${{ github.event.workflow_run.head_sha || github.sha }}
          path: |
            project-decisions-report/attestation.json
            project-decisions-report/report.json
          if-no-files-found: ignore
          retention-days: 14
