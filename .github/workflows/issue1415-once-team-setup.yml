name: Issue 1415 one-time authorized team setup

on:
  push:
    branches:
      - ops/issue1415-once-team-setup

permissions:
  contents: read

concurrency:
  group: production-smoke-owner-acceptance
  cancel-in-progress: false

jobs:
  setup:
    if: >-
      github.repository == 'alexj11324/Mikka' &&
      github.repository_id == '1427517699' &&
      github.repository_owner_id == '183887963' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/ops/issue1415-once-team-setup' &&
      github.event.deleted == false
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify the one-time setup guards with synthetic HTTP fixtures
        run: node --test scripts/ops/issue1415-one-time-team-setup.test.mjs
      - name: Verify the fixed Owner authorization and deployed source before credentials
        run: node scripts/ops/issue1415-one-time-team-setup.mjs --preflight
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Read only the existing shared smoke email
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          secret-name: SMOKE_OWNER_EMAIL
          recursive: false
          include-imports: false
      - name: Read only the existing shared smoke password
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          secret-name: SMOKE_OWNER_PASSWORD
          recursive: false
          include-imports: false
      - name: Read only the existing Alex email authorized by issue 1515
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          secret-name: ACME_DEMO_EMAIL
          recursive: false
          include-imports: false
      - name: Read only the existing Alex password authorized for this one-time setup
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          secret-name: ACME_DEMO_PASSWORD
          recursive: false
          include-imports: false
      - name: Apply only the authorized existing-team setup and close both sessions
        run: node scripts/ops/issue1415-one-time-team-setup.mjs --run
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Retain only the closed one-time setup reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue1415-once-team-setup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            production-once-team-setup-report/preflight.json
            production-once-team-setup-report/report.json
          retention-days: 14
          if-no-files-found: error
