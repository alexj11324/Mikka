name: Issue 1415 deployed production acceptance

on:
  workflow_dispatch:
    inputs:
      application_sha:
        description: Exact immutable application commit already serving the production alias
        required: true
        type: string
      web_run_id:
        description: Successful real Web deploy run for this application commit
        required: true
        type: string
      deployment_id:
        description: Exact READY production deployment currently attached to the fixed alias
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-smoke-owner-acceptance
  cancel-in-progress: false
  queue: max

jobs:
  acceptance:
    if: >-
      github.repository == 'alexj11324/Mikka' &&
      github.repository_owner_id == '183887963' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm-install
        with:
          ffmpeg-github-token: ${{ github.token }}

      - name: Run the original and explicit-target offline guards before credentials
        run: pnpm test:read-cache

      - name: Prepare Ubuntu package mirrors
        run: sudo "$(command -v node)" scripts/ci/apt-mirrors.mjs
      - name: Install Chromium before loading production credentials
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Read the existing platform token only for read-only target and managed evidence
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: VERCEL_TEAM_TOKEN
          recursive: false
          include-imports: false

      - name: Attest the real driver and the immutable deployed target before owner credentials
        run: node --import tsx scripts/acceptance/read-cache-production.mjs --attest --migration-1415
        env:
          MIKKA_ACCEPTANCE_TARGET_MODE: deployed-target
          APPLICATION_SHA: ${{ inputs.application_sha }}
          WEB_DEPLOY_RUN_ID: ${{ inputs.web_run_id }}
          VERCEL_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          GH_TOKEN: ${{ github.token }}

      - name: Read the existing smoke owner email only
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          secret-name: SMOKE_OWNER_EMAIL
          recursive: false
          include-imports: false

      - name: Read the existing smoke owner password only
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /
          secret-name: SMOKE_OWNER_PASSWORD
          recursive: false
          include-imports: false

      - name: Verify the normal owner browser and close only its own session
        timeout-minutes: 4
        run: pnpm exec playwright test -c playwright.smoke.config.ts --retries=0 --reporter=list
        env:
          MIKKA_ACCEPTANCE_TARGET_MODE: deployed-target
          APPLICATION_SHA: ${{ inputs.application_sha }}
          WEB_DEPLOY_RUN_ID: ${{ inputs.web_run_id }}
          VERCEL_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          GH_TOKEN: ${{ github.token }}
          SMOKE_BASE_URL: https://app.aspectlylabs.com
          SMOKE_EXPECT_ON: credentialVault,cloudComputer

      - name: Prove one normal Coordinator turn and its managed due reminder
        timeout-minutes: 10
        run: node --import tsx scripts/acceptance/workflow-migration-production.mjs
        env:
          MIKKA_ACCEPTANCE_TARGET_MODE: deployed-target
          APPLICATION_SHA: ${{ inputs.application_sha }}
          WEB_DEPLOY_RUN_ID: ${{ inputs.web_run_id }}
          VERCEL_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          GH_TOKEN: ${{ github.token }}

      - name: Verify normal mobile and source daemon HTTP and exact cleanup
        timeout-minutes: 6
        run: node --import tsx scripts/ops/production-mobile-daemon.mjs
        env:
          MIKKA_ACCEPTANCE_TARGET_MODE: deployed-target
          APPLICATION_SHA: ${{ inputs.application_sha }}
          WEB_DEPLOY_RUN_ID: ${{ inputs.web_run_id }}
          VERCEL_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          GH_TOKEN: ${{ github.token }}

      - name: Verify the owner-managed PKCE MCP session and exact cleanup
        timeout-minutes: 8
        run: node --import tsx scripts/acceptance/mcp-production.mjs
        env:
          MIKKA_ACCEPTANCE_TARGET_MODE: deployed-target
          APPLICATION_SHA: ${{ inputs.application_sha }}
          WEB_DEPLOY_RUN_ID: ${{ inputs.web_run_id }}
          VERCEL_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          GH_TOKEN: ${{ github.token }}

      - name: Require every business report and cleanup then recheck the live target
        if: always()
        timeout-minutes: 3
        run: node --import tsx scripts/acceptance/deployed-browser-session.mjs --verify-all
        env:
          MIKKA_ACCEPTANCE_TARGET_MODE: deployed-target
          APPLICATION_SHA: ${{ inputs.application_sha }}
          WEB_DEPLOY_RUN_ID: ${{ inputs.web_run_id }}
          VERCEL_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          GH_TOKEN: ${{ github.token }}

      - name: Retain only closed target and business evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issue1415-deployed-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            production-read-cache-report/attestation.json
            production-deployed-browser-report/report.json
            production-workflow-migration-report/report.json
            production-transport-proof-report/mobile-daemon.json
            production-transport-proof-report/mcp.json
            production-deployed-target-report/report.json
          if-no-files-found: ignore
          retention-days: 14
