name: Nightly offline journeys

# #2890 explicitly limits browser journeys to nightly/manual execution.
# Pull requests retain the API/CLI policy from decisions 1520 and 2225.
on:
  schedule:
    - cron: '43 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-offline-journey-${{ github.ref }}
  cancel-in-progress: false

jobs:
  journey:
    name: Offline MVP journeys
    if: github.repository == 'alexj11324/Mikka' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e-local-only
          POSTGRES_DB: mikka_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U e2e -d mikka_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      MIKKA_MVP_E2E: '1'
      MIKKA_TEST_MODE: '1'
      MIKKA_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      E2E_DATABASE_URL: postgresql://e2e:e2e-local-only@127.0.0.1:5432/mikka_e2e
      BETTER_AUTH_URL: http://localhost:3100
      E2E_BASE_URL: http://localhost:3100
      AUTH_TRUSTED_ORIGINS: http://localhost:3100,http://127.0.0.1:3100
      MIKKA_TEST_DEPLOYMENT_SHA: ${{ github.sha }}
      MIKKA_TEST_ENVIRONMENT_FILE: .cache/nightly/environment.json
      SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
        env:
          FFMPEG_GITHUB_TOKEN: ${{ github.token }}
      - name: Install Chromium
        run: |
          sudo "$(command -v node)" scripts/ci/apt-mirrors.mjs
          pnpm exec playwright install --with-deps chromium
      - name: Restore the verified official renderer for this main source
        run: node scripts/ci/nightly-ui.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Generate disposable authentication material
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs'
          import { randomBytes } from 'node:crypto'
          const value = randomBytes(32).toString('hex')
          console.log(`::add-mask::${value}`)
          appendFileSync(process.env.GITHUB_ENV, `BETTER_AUTH_SECRET=${value}\n`)
          JS
      - name: Prepare the local PostgreSQL 17 schema
        run: pnpm test:e2e:setup
      - name: Register the exact isolated test environment
        run: node scripts/test-accounts/bootstrap.mjs --output "$MIKKA_TEST_ENVIRONMENT_FILE"
      - name: Compile the local API and Eve around the verified official renderer
        run: |
          pnpm generate:agent-ui
          node scripts/build-eve.mjs
          node apps/api/scripts/build.mjs
          node scripts/package-eve.mjs
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Run the full scripted journey suite
        run: |
          node --input-type=module <<'JS'
          import { assertMvpEnvironment } from './tests/mvp/isolated-env.mjs'
          assertMvpEnvironment()
          console.log('Runtime: official compiled renderer, local API/Eve; loopback PostgreSQL 17/mikka_e2e; scripted model through fake LiteLLM at 127.0.0.1:3191; no external model credentials.')
          JS
          pnpm test:e2e:mvp --grep @journey
      - name: Audit evidence before upload
        if: always()
        id: audit
        run: |
          mkdir -p playwright-mvp-report
          if test -f .cache/nightly/ui-origin.json; then cp .cache/nightly/ui-origin.json playwright-mvp-report/ui-origin.json; fi
          node scripts/test-accounts/cli.mjs audit-evidence --evidence playwright-mvp-report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.audit.outcome == 'success'
        with:
          name: nightly-offline-journey-${{ github.sha }}
          path: playwright-mvp-report
          if-no-files-found: error
          retention-days: 7
