name: Credential vault backend
on:
  push:
    branches: ['codex/180-account-credential-vault']
  pull_request:
    paths: ['lib/credentials/**', 'services/credential-broker/**', 'drizzle/*credential*', '.github/workflows/credential-vault.yml']
permissions:
  contents: read
jobs:
  retention-hold:
    name: Credential vault retention hold
    runs-on: ubuntu-latest
    steps:
      - name: Report blocked verification
        run: |
          echo 'Credential database/browser verification is on retention hold; no test resources were created.'
          exit 1
