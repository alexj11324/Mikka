name: Credential vault backend
on:
  push:
    branches: ['codex/180-account-credential-vault']
  pull_request:
    paths: ['lib/credentials/**', 'services/credential-broker/**', 'drizzle/*credential*', '.github/workflows/credential-vault.yml']
permissions:
  contents: read
env:
  # A cache restore that fails (e.g. the account's cache egress limit) would
  # otherwise hang for actions/cache's 10-minute default before falling back
  # to a normal install, which outlasts the short jobs' own timeouts.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'

jobs:
  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-ci
          POSTGRES_DB: credential_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: npm ci --ignore-scripts --workspaces=false --prefix services/credential-broker
      - run: node services/credential-broker/build.mjs
      - run: node --input-type=module -e "await import('./services/credential-broker/api/fill.js'); await import('./services/credential-broker/api/oidc.js')"
      - run: pnpm exec oxlint --deny-warnings lib/credentials services/credential-broker app/api/credentials
      - run: node --import tsx --test lib/credentials/credentials.test.ts lib/credentials/store.db.test.ts
        env:
          REQUIRE_DB: '1'
          CREDENTIAL_TEST_RETAIN_RESOURCES: '1'
          CREDENTIAL_TEST_DATABASE_URL: postgresql://postgres:isolated-ci@localhost:5432/credential_test
