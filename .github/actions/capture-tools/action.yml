name: Pinned capture tools
description: >-
  Puts on PATH the exact FFmpeg and ffprobe that the daemon installs on task
  machines (packages/daemon/scripts/install-capture-tools.mjs, the same pinned
  ffmpeg-static release, verified by SHA-256), instead of whatever the Ubuntu
  mirror serves that day.
inputs:
  github-token:
    description: Optional API-read-only GitHub token for the release asset download.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Install the pinned FFmpeg and ffprobe
      shell: bash
      env:
        CAPTURE_TOOLS_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        sudo install -d -m 0755 /opt/mikka/runtime/capture-tools
        sudo --preserve-env=CAPTURE_TOOLS_GITHUB_TOKEN "$(command -v node)" packages/daemon/scripts/install-capture-tools.mjs
        directory="$(node --input-type=module -e "import { CAPTURE_TOOLS_DIRECTORY } from './packages/daemon/src/agents/capture-video.mjs'; console.log(CAPTURE_TOOLS_DIRECTORY)")"
        echo "$directory" >> "$GITHUB_PATH"
        "$directory/ffmpeg" -version | head -1
        "$directory/ffprobe" -version | head -1
