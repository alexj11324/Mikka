name: Cloudflare Registry workload credentials
description: Reuse the existing Cloudflare deployment identity for a short-lived Registry credential
inputs:
  mode:
    description: read or publish
    required: true
outputs:
  username:
    description: Registry username
    value: ${{ steps.registry.outputs.username }}
  password:
    description: Temporary Registry password
    value: ${{ steps.registry.outputs.password }}
runs:
  using: composite
  steps:
    - name: Read the existing Cloudflare deployment identity
      uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
      with:
        method: oidc
        identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
        oidc-audience: mikka-infisical
        project-id: 89850d6a-f020-4936-863e-df77380dfe40
        env-slug: prod
        secret-path: /platform
        secret-name: CLOUDFLARE_API_TOKEN
        recursive: false
        include-imports: false
    - name: Issue only the Registry permission needed by this phase
      id: registry
      shell: bash
      env:
        REGISTRY_CREDENTIAL_MODE: ${{ inputs.mode }}
      run: node scripts/cloudflare-registry-credentials.mjs "$REGISTRY_CREDENTIAL_MODE"
    - name: Remove the control-plane credential from subsequent step environments
      if: always()
      shell: bash
      run: echo 'CLOUDFLARE_API_TOKEN=' >> "$GITHUB_ENV"
