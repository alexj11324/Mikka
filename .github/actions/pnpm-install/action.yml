name: Install dependencies with pnpm
description: >-
  Exact installed-dependency reuse, with a pnpm-store fallback on misses.
  Only main pushes and manual main runs save caches; PRs only restore.
inputs:
  profile:
    description: full, or desktop (all workspaces except the independent mobile app)
    default: full
  skip-electron:
    description: Leave runtime installation to the checksum-verifying desktop installer
    default: 'false'
  ffmpeg-github-token:
    description: Optional API-read-only GitHub token for verified FFmpeg assets.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        version: 10.34.3
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 24
    - id: modules-key
      shell: bash
      env:
        INSTALL_PROFILE: ${{ inputs.profile }}
        ELECTRON_SKIP_BINARY_DOWNLOAD: ${{ inputs.skip-electron == 'true' && '1' || env.ELECTRON_SKIP_BINARY_DOWNLOAD || '' }}
      run: node scripts/ci/dependency-cache.mjs
    - name: Restore exact installed dependencies
      id: modules
      if: steps.modules-key.outputs.reusable == 'true'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
        key: ${{ steps.modules-key.outputs.key }}
    - id: store
      if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - id: restore
      if: steps.modules.outputs.cache-hit != 'true'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-store-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-v1-${{ runner.os }}-${{ runner.arch }}-
    - name: Install dependencies on a cache miss
      id: install
      if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      env:
        INSTALL_PROFILE: ${{ inputs.profile }}
        ELECTRON_SKIP_BINARY_DOWNLOAD: ${{ inputs.skip-electron == 'true' && '1' || env.ELECTRON_SKIP_BINARY_DOWNLOAD || '' }}
        FFMPEG_GITHUB_TOKEN: ${{ inputs.ffmpeg-github-token }}
      run: |
        case "$INSTALL_PROFILE" in
          full) pnpm install --frozen-lockfile ;;
          desktop) pnpm --filter '!@mikka/mobile' install --frozen-lockfile ;;
          *) echo '::error::Unknown dependency installation profile'; exit 1 ;;
        esac
    # Save immediately after installation, before tests/builds/credentials can
    # mutate node_modules. No fuzzy module restore and no PR cache writers.
    - name: Save exact installed dependencies (main only)
      if: >-
        github.ref == 'refs/heads/main' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        steps.modules-key.outputs.reusable == 'true' && steps.install.outcome == 'success'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
        key: ${{ steps.modules-key.outputs.key }}
    # Avoid uploading two near-identical large archives for one installation.
    # The store remains a fallback for misses; update it only when hooks prevent
    # saving a reusable installed tree.
    - name: Save the pnpm store when module reuse is disabled (main only)
      if: >-
        github.ref == 'refs/heads/main' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        steps.modules-key.outputs.reusable != 'true' &&
        steps.install.outcome == 'success' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-store-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
