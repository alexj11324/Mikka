# Playwright's Electron launcher needs the Node inspector in the test runner.
# This build is only a CI harness input; neither production nor the downloadable
# Mikka Dev artifact enables it.
extends: electron-builder.dev.yml
directories:
  output: release-acceptance
electronFuses:
  runAsNode: false
  enableNodeCliInspectArguments: true
  enableNodeOptionsEnvironmentVariable: false
  onlyLoadAppFromAsar: true
