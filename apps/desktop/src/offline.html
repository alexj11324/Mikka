<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
    <title>Mikka · 未连接</title>
    <style>
      :root { color-scheme: light dark; --bg: #f5f5f4; --card: #ffffff; --fg: #1c1917; --muted: #78716c; --border: #e7e5e4; --primary: #1c1917; --primary-fg: #fafaf9; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0a0a0a; --card: #171717; --fg: #e7e5e4; --muted: #a8a29e; --border: #292524; --primary: #e7e5e4; --primary-fg: #1c1917; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--fg); -webkit-app-region: drag; }
      main { width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 28px 24px 24px; border: 1px solid var(--border); border-radius: 12px; background: var(--card); text-align: center; }
      svg { width: 20px; height: 20px; color: var(--muted); }
      h1 { margin: 0; font-size: 15px; font-weight: 600; }
      p { margin: 0; color: var(--muted); }
      .status { font-size: 12px; font-variant-numeric: tabular-nums; }
      a { -webkit-app-region: no-drag; margin-top: 4px; display: inline-flex; align-items: center; justify-content: center; height: 32px; padding: 0 14px; border-radius: 8px; background: var(--primary); color: var(--primary-fg); font-size: 13px; font-weight: 500; text-decoration: none; }
      a:focus-visible { outline: 2px solid var(--muted); outline-offset: 2px; }
      @media (prefers-reduced-motion: no-preference) { .pulse { animation: pulse 2s ease-in-out infinite; } @keyframes pulse { 50% { opacity: .4; } } }
    </style>
  </head>
  <body>
    <main>
      <svg class="pulse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h.01"/><path d="M8.5 16.4a5 5 0 0 1 7 0"/><path d="M5 12.9a10 10 0 0 1 5.2-2.7"/><path d="M19 12.9a10 10 0 0 0-2-1.4"/><path d="M2 8.8a15 15 0 0 1 4.2-2.6"/><path d="M22 8.8A15 15 0 0 0 11 5"/><path d="m2 2 20 20"/></svg>
      <h1>暂时连不上 Mikka</h1>
      <p>请检查网络连接，Mikka 会自动重新连接。</p>
      <p class="status" role="status" aria-live="polite" id="status">正在等待网络…</p>
      <a id="retry" href="#">立即重试</a>
    </main>
    <script>
      (() => {
        const app = new URLSearchParams(location.search).get('app');
        const retry = document.getElementById('retry');
        const status = document.getElementById('status');
        if (!app || !/^https?:\/\//.test(app)) { retry.hidden = true; return; }
        retry.href = app;
        retry.addEventListener('click', () => { status.textContent = '正在重新连接…'; });
        let seconds = 0;
        setInterval(() => { seconds += 1; status.textContent = '已离线 ' + seconds + ' 秒，正在自动重试…'; }, 1000);
      })();
    </script>
  </body>
</html>
