<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
    <title>Mikka</title>
    <style>
      :root { color-scheme: light dark; --bg: #f5f5f4; --fg: #1c1917; --muted: #78716c; --track: #e7e5e4; --primary: #1c1917; --primary-fg: #fafaf9; }
      @media (prefers-color-scheme: dark) { :root { --bg: #171717; --fg: #e7e5e4; --muted: #a8a29e; --track: #292524; --primary: #e7e5e4; --primary-fg: #1c1917; } }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body { margin: 0; display: grid; place-items: center; padding: 28px 28px 24px; font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--fg); -webkit-app-region: drag; user-select: none; }
      main { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
      svg { width: 28px; height: 28px; color: var(--muted); }
      h1 { margin: 0; font-size: 14px; font-weight: 600; }
      p { margin: 0; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; max-width: 100%; overflow-wrap: anywhere; user-select: text; }
      .bar { width: 100%; height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; }
      .fill { height: 100%; width: 0; background: var(--primary); transition: width 200ms ease-out; }
      a { -webkit-app-region: no-drag; margin-top: 2px; display: inline-flex; align-items: center; justify-content: center; height: 28px; padding: 0 14px; border-radius: 8px; background: var(--primary); color: var(--primary-fg); font-size: 13px; font-weight: 500; text-decoration: none; }
      a:focus-visible { outline: 2px solid var(--muted); outline-offset: 2px; }
      [hidden] { display: none !important; }
      @media (prefers-reduced-motion: no-preference) { .busy { animation: pulse 2s ease-in-out infinite; } @keyframes pulse { 50% { opacity: .4; } } }
      @media (prefers-reduced-motion: reduce) { .fill { transition: none; } }
    </style>
  </head>
  <body>
    <main>
      <svg id="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v8"/><path d="m8 12 4 4 4-4"/></svg>
      <h1 id="heading" role="status" aria-live="polite"></h1>
      <div class="bar" id="bar" hidden><div class="fill" id="fill"></div></div>
      <p id="detail" hidden></p>
      <a id="retry" href="#retry" hidden></a>
    </main>
    <script>
      // apps/desktop/src/main/launch-update.ts (gateView) drives this page: main calls render() on each state
      // and watches for #retry.
      window.render = (view, lang) => {
        document.documentElement.lang = lang
        document.getElementById('icon').classList.toggle('busy', view.busy)
        document.getElementById('heading').textContent = view.heading
        const detail = document.getElementById('detail')
        detail.textContent = view.detail
        detail.hidden = !view.detail
        const bar = document.getElementById('bar')
        bar.hidden = view.percent === null
        document.getElementById('fill').style.width = (view.percent ?? 0) + '%'
        const retry = document.getElementById('retry')
        retry.textContent = view.retry ?? ''
        retry.hidden = !view.retry
        if (location.hash === '#retry') history.replaceState(null, '', '#')
      }
    </script>
  </body>
</html>
