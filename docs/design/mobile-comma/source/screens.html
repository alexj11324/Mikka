<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=393, initial-scale=1">
<title>Mikka iOS redesign</title>
<!--
  Mikka iOS redesign frames, drawn at iPhone size (393 × 852 pt).
  Open as screens.html#<screen>; add ?dark for the dark set. render.mjs turns every
  screen into a PNG at deviceScaleFactor 2. Colours are the app's own tokens
  (apps/mobile/lib/tokens.ts, iOS system colours). Nothing here is taken from Comma's code.
-->
<style>
@font-face { font-family: "SC"; font-weight: 400; src: local("Noto Sans SC"), url("fonts/noto-sans-sc-chinese-simplified-400-normal.woff2"); }
@font-face { font-family: "SC"; font-weight: 500; src: local("Noto Sans SC Medium"), url("fonts/noto-sans-sc-chinese-simplified-500-normal.woff2"); }
@font-face { font-family: "SC"; font-weight: 600; src: local("Noto Sans SC SemiBold"), url("fonts/noto-sans-sc-chinese-simplified-600-normal.woff2"); }
@font-face { font-family: "SC"; font-weight: 700; src: local("Noto Sans SC Bold"), url("fonts/noto-sans-sc-chinese-simplified-700-normal.woff2"); }

:root {
  --page: #FFFFFF; --page-rgb: 255,255,255; --grouped: #F2F2F7; --surface: #FFFFFF; --bubble: #E9E9EB;
  --chip: rgba(118,118,128,0.12); --ink: #000000; --secondary: rgba(60,60,67,0.70); --tertiary: rgba(60,60,67,0.30);
  --separator: rgba(60,60,67,0.18); --accent: #007AFF; --accentFill: #0068DA; --objectChip: rgba(0,122,255,0.10);
  --success: #34C759; --danger: #FF3B30; --orange: #FF9500; --purple: #AF52DE; --pressed: #E5E5EA;
  --glass: rgba(255,255,255,0.56); --glass-strong: rgba(250,250,252,0.84); --glass-hi: rgba(255,255,255,0.95);
  --glass-edge: rgba(0,0,0,0.07); --glass-shadow: rgba(0,0,0,0.10); --scrim: rgba(0,0,0,0.22); --kb: #D1D3D9; --key: #FFFFFF; --key2: #ADB1BB;
  --ink-bloub: #0a0a0c;
}
.dark {
  --page: #000000; --page-rgb: 0,0,0; --grouped: #000000; --surface: #1C1C1E; --bubble: #262628;
  --chip: rgba(118,118,128,0.24); --ink: #FFFFFF; --secondary: rgba(235,235,245,0.62); --tertiary: rgba(235,235,245,0.30);
  --separator: rgba(84,84,88,0.55); --accent: #0A84FF; --accentFill: #0068DA; --objectChip: rgba(10,132,255,0.22);
  --success: #30D158; --danger: #FF453A; --orange: #FF9F0A; --purple: #BF5AF2; --pressed: #2C2C2E;
  --glass: rgba(40,40,44,0.52); --glass-strong: rgba(36,36,38,0.86); --glass-hi: rgba(255,255,255,0.20);
  --glass-edge: rgba(255,255,255,0.08); --glass-shadow: rgba(0,0,0,0.50); --scrim: rgba(0,0,0,0.45); --kb: #2B2B2D; --key: #6B6B6E; --key2: #474749;
  --ink-bloub: #d9d5ca;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 393px; height: 852px; overflow: hidden; background: var(--page); }
body { font-family: "Inter", "SC", "WenQuanYi Zen Hei", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01"; letter-spacing: -0.2px; }
.phone { position: relative; width: 393px; height: 852px; overflow: hidden; background: var(--page); }
.phone.grouped { background: var(--grouped); }
.abs { position: absolute; }
svg { display: block; }
.ic { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* status bar and island */
.status { position: absolute; top: 0; left: 0; right: 0; height: 54px; z-index: 80; font-weight: 600; font-size: 17px; }
.status .time { position: absolute; left: 50px; top: 17px; letter-spacing: -0.3px; }
.status .right { position: absolute; right: 30px; top: 19px; display: flex; gap: 6px; align-items: center; }
.island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 125px; height: 37px; border-radius: 20px; background: #000; z-index: 81; }
.homebar { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 139px; height: 5px; border-radius: 3px; background: var(--ink); z-index: 90; }

/* Liquid Glass approximation */
.glass { background: var(--glass); backdrop-filter: blur(10px) saturate(190%); -webkit-backdrop-filter: blur(10px) saturate(190%);
  box-shadow: 0 6px 20px var(--glass-shadow), inset 0 0.5px 0 var(--glass-hi), inset 0 0 0 0.5px var(--glass-edge); }
.glass-strong { background: var(--glass-strong); backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%);
  box-shadow: 0 16px 40px rgba(0,0,0,0.16), inset 0 0.5px 0 var(--glass-hi), inset 0 0 0 0.5px var(--glass-edge); }
.gbtn { position: absolute; width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: var(--ink); z-index: 70; }
.gbtn.prominent { background: var(--accent); color: #fff; box-shadow: 0 6px 18px rgba(0,122,255,0.28); }
.gcap { position: absolute; height: 44px; border-radius: 22px; display: flex; align-items: center; gap: 8px; padding: 0 14px 0 8px; z-index: 70; font-size: 17px; font-weight: 600; }
.edge-top { position: absolute; top: 0; left: 0; right: 0; height: 116px; z-index: 60; pointer-events: none;
  background: linear-gradient(to bottom, rgba(var(--page-rgb),0.92) 0%, rgba(var(--page-rgb),0.72) 55%, rgba(var(--page-rgb),0) 100%);
  backdrop-filter: blur(3px); -webkit-mask-image: linear-gradient(to bottom, #000 60%, transparent); }
.grouped .edge-top { background: linear-gradient(to bottom, rgba(242,242,247,0.94) 0%, rgba(242,242,247,0.7) 55%, rgba(242,242,247,0) 100%); }
.dark.grouped .edge-top, .dark .grouped .edge-top { background: linear-gradient(to bottom, rgba(0,0,0,0.94) 0%, rgba(0,0,0,0.7) 55%, rgba(0,0,0,0) 100%); }
.edge-bottom { position: absolute; bottom: 0; left: 0; right: 0; height: 130px; z-index: 60; pointer-events: none;
  background: linear-gradient(to top, rgba(var(--page-rgb),0.85) 0%, rgba(var(--page-rgb),0) 100%); }
.inline-title { position: absolute; top: 54px; left: 70px; right: 70px; height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 70; }
.inline-title b { font-size: 17px; font-weight: 600; }
.inline-title span { font-size: 12px; color: var(--secondary); margin-top: 1px; }
.large-title { position: absolute; left: 16px; top: 104px; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: 0.2px; }

/* tab bar */
.tabbar { position: absolute; left: 21px; bottom: 24px; height: 62px; width: 278px; border-radius: 31px; z-index: 75; display: flex; padding: 4px; }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 27px; font-size: 10px; font-weight: 600; color: var(--ink); }
.tab.on { background: var(--chip); color: var(--accent); }
.tab .ic { width: 25px; height: 25px; }
.tab .badge { position: absolute; }
.searchtab { position: absolute; right: 21px; bottom: 24px; width: 62px; height: 62px; border-radius: 31px; z-index: 75; display: flex; align-items: center; justify-content: center; }
.searchtab .ic { width: 25px; height: 25px; }
.tabdot { position: absolute; width: 8px; height: 8px; border-radius: 4px; background: var(--accent); }

/* lists */
.section { font-size: 15px; font-weight: 600; color: var(--secondary); padding: 0 20px; height: 34px; display: flex; align-items: flex-end; padding-bottom: 6px; gap: 6px; }
.row { position: relative; display: flex; align-items: center; gap: 12px; margin: 0 10px; padding: 9px 10px; border-radius: 14px; }
.row.pressed { background: var(--pressed); }
.row .main { flex: 1; min-width: 0; }
.row .top { display: flex; align-items: baseline; gap: 8px; }
.row .name { font-size: 17px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .when { font-size: 13px; color: var(--secondary); }
.row .sub { font-size: 15px; color: var(--secondary); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 5px; }
.count { min-width: 20px; height: 20px; border-radius: 10px; background: var(--accent); color: #fff; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; padding: 0 6px; }
.udot { width: 10px; height: 10px; border-radius: 5px; background: var(--accent); flex: none; }
.group { margin: 0 16px; background: var(--surface); border-radius: 26px; overflow: hidden; }
.grow { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; position: relative; font-size: 17px; }
.grow + .grow::before { content: ""; position: absolute; top: 0; right: 0; left: 52px; border-top: 0.5px solid var(--separator); }
.grow.noicon + .grow.noicon::before { left: 16px; }
.grow .val { margin-left: auto; color: var(--secondary); display: flex; align-items: center; gap: 6px; }
.grow .chev { color: var(--tertiary); width: 14px; height: 14px; stroke-width: 2.4; }
.gicon { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; flex: none; }
.gicon .ic { width: 18px; height: 18px; stroke-width: 2; }
.ghead { font-size: 15px; font-weight: 600; color: var(--secondary); padding: 18px 32px 7px; }

/* chat */
.msgs { position: absolute; left: 0; right: 0; padding: 0 16px; display: flex; flex-direction: column; gap: 6px; }
.b { max-width: 290px; padding: 9px 14px; border-radius: 20px; font-size: 17px; line-height: 23px; }
.b.bot { background: var(--bubble); align-self: flex-start; }
.b.me { background: var(--accentFill); color: #fff; align-self: flex-end; }
.b.me .quote { opacity: 0.72; border-left: 2px solid rgba(255,255,255,0.6); padding-left: 8px; margin-bottom: 4px; font-size: 15px; line-height: 20px; }
.mchip { display: inline-flex; align-items: center; gap: 4px; background: var(--objectChip); color: var(--accent); border-radius: 7px; padding: 0 6px; font-size: 15px; line-height: 22px; font-weight: 500; }
.acts { display: flex; gap: 16px; padding: 2px 6px 4px; color: var(--secondary); }
.acts .ic { width: 18px; height: 18px; }
.card { background: var(--surface); border-radius: 22px; padding: 14px 16px; align-self: stretch; box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 0 0 0.5px var(--separator); }
.dark .card { box-shadow: none; }
.pill { height: 36px; border-radius: 18px; padding: 0 16px; display: inline-flex; align-items: center; font-size: 15px; font-weight: 600; }
.pill.ink { background: var(--ink); color: var(--page); }
.pill.soft { background: var(--chip); color: var(--ink); }
.composer { position: absolute; left: 16px; right: 16px; bottom: 34px; height: 48px; z-index: 75; }
.composer .plus { position: absolute; left: 0; top: 2px; width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; }
.composer .field { position: absolute; left: 52px; right: 0; top: 0; height: 48px; border-radius: 24px; display: flex; align-items: center; padding: 0 6px 0 16px; font-size: 17px; color: var(--secondary); }
.composer .send { margin-left: auto; width: 36px; height: 36px; border-radius: 18px; background: var(--accentFill); color: #fff; display: flex; align-items: center; justify-content: center; }
.tcard { display: flex; gap: 10px; align-items: flex-start; background: var(--surface); border-radius: 18px; padding: 12px 14px; box-shadow: 0 0 0 0.5px var(--separator); max-width: 300px; }
.dark .tcard { box-shadow: none; }
.ochip { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 9px; border-radius: 13px; background: var(--chip); font-size: 13px; font-weight: 500; margin-top: 7px; }

/* menus */
.menu { position: absolute; width: 250px; border-radius: 26px; padding: 8px 0; z-index: 85; }
.mi { display: flex; align-items: center; height: 44px; padding: 0 18px; font-size: 17px; gap: 12px; }
.mi .ic { margin-left: auto; width: 20px; height: 20px; }
.mi.left .ic { margin-left: 0; }
.mi.red { color: var(--danger); }
.msep { height: 0.5px; background: var(--separator); margin: 6px 18px; }
.mhead { font-size: 13px; color: var(--secondary); padding: 4px 18px 6px; }
.scrimmed > .content { filter: blur(14px) saturate(120%); transform: scale(1.0); }
.scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 82; }

/* segmented */
.seg { position: absolute; left: 16px; right: 16px; height: 36px; border-radius: 18px; background: var(--chip); display: flex; padding: 3px; font-size: 15px; font-weight: 600; }
.seg div { flex: 1; display: flex; align-items: center; justify-content: center; border-radius: 15px; }
.seg .on { background: var(--surface); box-shadow: 0 2px 8px rgba(0,0,0,0.10); }
.dark .seg .on { background: #636366; }
.chips { position: absolute; left: 0; right: 0; display: flex; gap: 8px; padding: 0 16px; }
.dchip { height: 34px; border-radius: 17px; background: var(--chip); padding: 0 12px; display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 500; white-space: nowrap; }
.dchip.on { background: var(--ink); color: var(--page); }
.gdot { width: 7px; height: 7px; border-radius: 4px; background: var(--success); }

/* sheet */
.sheet { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 38px 38px 0 0; background: var(--grouped); z-index: 86; overflow: hidden; }
.dark .sheet { background: #1C1C1E; }
.dark .sheet .group { background: #2C2C2E; }
.grabber { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); width: 36px; height: 5px; border-radius: 3px; background: var(--tertiary); }
.parent-behind { position: absolute; inset: 0; transform: scale(0.92) translateY(-6px); border-radius: 40px; overflow: hidden; filter: brightness(0.78); z-index: 1; }
.dark .parent-behind { filter: brightness(0.55); }
.field { height: 52px; display: flex; align-items: center; padding: 0 16px; font-size: 17px; }
.field .ph { color: var(--secondary); }
.caret { display: inline-block; width: 2px; height: 22px; background: var(--accent); margin-left: 1px; vertical-align: middle; }

/* keyboard */
.kb { position: absolute; left: 0; right: 0; bottom: 0; height: 336px; background: var(--kb); z-index: 84; padding: 8px 3px 0; }
.kr { display: flex; gap: 6px; justify-content: center; margin-bottom: 11px; }
.k { height: 43px; width: 33px; border-radius: 8px; background: var(--key); box-shadow: 0 1px 0 rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 400; color: var(--ink); }
.k.f { background: var(--key2); font-size: 15px; }
.cand { height: 38px; display: flex; gap: 22px; align-items: center; padding: 0 14px; font-size: 17px; color: var(--ink); margin-bottom: 6px; }

.label { font-size: 12px; color: var(--secondary); }
.swipe-act { position: absolute; top: 6px; bottom: 6px; border-radius: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #fff; font-size: 13px; font-weight: 500; }
.swipe-act .ic { width: 20px; height: 20px; stroke-width: 2; }
.switcher { position: absolute; left: 50%; transform: translateX(-50%); bottom: 98px; height: 48px; border-radius: 24px; z-index: 74; display: flex; align-items: center; padding: 4px; gap: 2px; }
.switcher .s { white-space: nowrap; height: 40px; min-width: 52px; border-radius: 20px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 15px; font-weight: 600; padding: 0 12px; color: var(--secondary); }
.switcher .s.on { background: var(--chip); color: var(--ink); padding: 0 16px; }
.pcard { flex: none; width: 168px; height: 76px; border-radius: 20px; background: var(--surface); padding: 12px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 0 0 0.5px var(--separator); }
.dark .pcard { box-shadow: none; }
.appic { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; font-weight: 700; flex: none; }
.ttl2 { font-size: 15px; font-weight: 600; }
.mono { font-family: "JetBrains Mono", monospace; font-size: 13px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const dark = location.search.includes('dark')
if (dark) document.documentElement.classList.add('dark')

// ---------- icons (drawn for these frames, SF-Symbols-like) ----------
const P = {
  chat: '<path d="M4.5 5h15A2 2 0 0 1 21.5 7v8.5a2 2 0 0 1-2 2H11l-5 3.6V17.5H4.5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/>',

const BC = { encre: 'var(--ink-bloub)', rouge: '#e8483f', orange: '#f08a24', ambre: '#f0b429', vert: '#3ecf8e', turquoise: '#2fbfa0', bleu: '#3b93f0', violet: '#8b5cf6', rose: '#e152b0', brun: '#8b5e3c', gris: '#a3a3a3' }
function bloub(color = 'encre', shape = 'circle', size = 44) {
  const c = BC[color]
  let body
  switch (shape) {
    case 'squircle': body = `<rect x="2.5" y="2.5" width="19" height="19" rx="6.5" fill="${c}"/>`; break
    case 'flower': body = [0, 72, 144, 216, 288].map(a => { const r = (a - 90) * Math.PI / 180; return `<circle cx="${12 + 5.4 * Math.cos(r)}" cy="${12.4 + 5.4 * Math.sin(r)}" r="5" fill="${c}"/>` }).join('') + `<circle cx="12" cy="12.4" r="6" fill="${c}"/>`; break
    case 'cloud': body = `<circle cx="8" cy="13" r="6" fill="${c}"/><circle cx="14" cy="9.5" r="6.5" fill="${c}"/><circle cx="17" cy="14" r="5.5" fill="${c}"/><rect x="4" y="13" width="17" height="6.5" rx="3.2" fill="${c}"/>`; break
    case 'cat': body = `<path d="M3.6 10.5 4.6 3l6 4.3M20.4 10.5 19.4 3l-6 4.3" fill="${c}" stroke="${c}" stroke-width="1.6" stroke-linejoin="round"/><ellipse cx="12" cy="13.5" rx="9.4" ry="8" fill="${c}"/>`; break
    case 'drop': body = `<path d="M12 2.2c3.6 4.4 7.8 8.7 7.8 13a7.8 7.8 0 0 1-15.6 0c0-4.3 4.2-8.6 7.8-13z" fill="${c}"/>`; break
    default: body = `<circle cx="12" cy="12" r="10" fill="${c}"/>`
  }
  const eye = color === 'encre' ? (dark ? '#0a0a0c' : '#fff') : '#fff'
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" style="flex:none">${body}<ellipse cx="15.6" cy="8.6" rx="1.5" ry="2.3" fill="${eye}"/></svg>`
}
