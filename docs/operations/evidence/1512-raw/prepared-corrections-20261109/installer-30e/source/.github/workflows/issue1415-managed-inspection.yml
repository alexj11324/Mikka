name: Issue 1415 managed history inspection

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Existing failed managed proof run (only 42285115630 is authorized)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: issue1415-managed-history-inspection
  cancel-in-progress: false

jobs:
  inspect:
    if: >-
      github.repository == 'alexj11324/Mikka' &&
      github.repository_owner_id == '183887963' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
      issues: read
      id-token: write
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      GH_TOKEN: ${{ github.token }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm-install
        with:
          ffmpeg-github-token: ${{ github.token }}

      - name: Run the existing managed proof and historical inspection guards
        run: node --import tsx --test scripts/acceptance/workflow-migration-production.test.mjs

      - name: Verify the real inspection driver and fixed original proof before platform access
        run: node --import tsx scripts/acceptance/workflow-migration-production.mjs --inspect-source

      - name: Read the existing platform credential for metadata only
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d
        with:
          method: oidc
          identity-id: 2cf9fa19-b9db-4c08-8ca0-b31859f2cbac
          oidc-audience: mikka-infisical
          project-id: 89850d6a-f020-4936-863e-df77380dfe40
          env-slug: prod
          secret-path: /platform
          secret-name: VERCEL_TEAM_TOKEN
          recursive: false
          include-imports: false

      - name: Recheck the source and inspect only existing managed metadata
        run: node --import tsx scripts/acceptance/workflow-migration-production.mjs --inspect-managed

      - name: Retain only closed historical metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issue1415-managed-inspection-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            production-managed-inspection-report/source.json
            production-managed-inspection-report/report.json
          if-no-files-found: ignore
          retention-days: 14
