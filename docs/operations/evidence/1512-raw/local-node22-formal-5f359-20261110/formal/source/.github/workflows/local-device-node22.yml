name: Local device Node 22
on:
  pull_request:
    paths:
      - 'apps/desktop/src/main/*install*'
      - 'packages/daemon/**'
      - 'packages/protocol/**'
      - 'scripts/acceptance/local-installer-macos.ts'
      - '.github/workflows/local-device-node22.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: local-device-node22-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the tested daemon package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/daemon
          node packages/daemon/scripts/build.mjs > /tmp/mikka-build.log
          package_dir=$(sed -n 's/^Retained build directory: //p' /tmp/mikka-build.log)
          npm pack "$package_dir" --pack-destination artifacts/daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: daemon-node22
          path: artifacts/daemon/*.tgz
  node22-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.1
      - name: Daemon and installer on real Node 22
        run: |
          node --version
          pnpm --filter @mikka/daemon test
          node --import tsx --test apps/desktop/src/main/ssh-install.test.ts apps/desktop/src/main/local-install.test.ts
  macos-arm:
    needs: package
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22.22.1, 18.20.8]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: daemon-node22
          path: artifacts/daemon
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - name: Real npm, LaunchAgent, enrollment and reconnect
        shell: bash
        run: |
          set -euo pipefail
          export MIKKA_DAEMON_TARBALL="$(find artifacts/daemon -name '*.tgz' -print -quit)"
          node --import tsx scripts/acceptance/local-installer-macos.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: macos-node-${{ matrix.node }}
          path: artifacts/local-installer/*.json
