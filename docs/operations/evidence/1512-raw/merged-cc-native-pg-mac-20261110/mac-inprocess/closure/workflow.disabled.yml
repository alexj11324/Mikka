name: Issue 1512 macOS in-process restart diagnostic
on:
  push:
    branches: ['ops/1512-macos-restart-20261110']
    paths:
      - '.github/issue1512-mac-restart.json'
      - '.github/workflows/issue1512-mac-restart.yml'
permissions:
  contents: read
concurrency:
  group: issue1512-macos-restart-20261110
  cancel-in-progress: false
jobs:
  package:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 5852aa8832c07fdeef43665dd5e156ce5516e3ea
          path: source
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Verify the sole temporary product overlay
        run: |
          node --check ../control/scripts/ops/issue1512-macos-restart-controller.mjs
          node ../control/scripts/ops/issue1512-macos-restart-controller.mjs prepare-build
      - name: Build the temporary diagnostic daemon package once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/daemon
          node packages/daemon/scripts/build.mjs > /tmp/mikka-build.log
          package_dir=$(sed -n 's/^Retained build directory: //p' /tmp/mikka-build.log)
          npm pack "$package_dir" --pack-destination artifacts/daemon
      - name: Bind the actual tarball and compiled diagnostic marker
        run: node ../control/scripts/ops/issue1512-macos-restart-controller.mjs bind-package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue1512-mac-inprocess-daemon
          path: |
            source/artifacts/daemon/*.tgz
            source/artifacts/daemon/package-binding.json
            source/artifacts/daemon/build-source-binding.json
          retention-days: 7
  macos-diagnostic:
    if: ${{ false }}
    needs: package
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 5852aa8832c07fdeef43665dd5e156ce5516e3ea
          path: source
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: issue1512-mac-inprocess-daemon
          path: source/artifacts/daemon
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.1
      - name: Verify fixed source and temporary diagnostic overlays
        run: |
          node --check ../control/scripts/ops/issue1512-macos-restart-controller.mjs
          node --check ../control/scripts/acceptance/local-installer-inprocess-diagnostic.mjs
          node ../control/scripts/ops/issue1512-macos-restart-controller.mjs prepare
      - name: One actual install and reconnect
        id: fixture
        shell: bash
        run: |
          set -euo pipefail
          export MIKKA_DAEMON_TARBALL="$(find artifacts/daemon -name '*.tgz' -print -quit)"
          node --import tsx scripts/acceptance/local-installer-macos.ts
      - name: Close only the exact fixture service and HOME
        if: always()
        env:
          MIKKA_FIXTURE_STEP_OUTCOME: ${{ steps.fixture.outcome }}
        run: node ../control/scripts/ops/issue1512-macos-restart-controller.mjs cleanup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue1512-mac-inprocess-diagnostic
          path: |
            source/artifacts/local-installer/node-22.json
            source/artifacts/local-installer/fixture-cleanup.json
            source/artifacts/local-installer/source-binding.json
            source/artifacts/local-installer/controller-cleanup.json
          if-no-files-found: error
          retention-days: 7
