<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>服务状态</title>
<style>
  body {
    margin: 0;
    padding: 24px;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    background: #f5f6f8;
    color: #1f2328;
  }
  h1 {
    max-width: 600px;
    margin: 0 auto 16px;
    font-size: 24px;
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    max-width: 960px;
    margin: 0 auto;
  }
  .card {
    background: #ffffff;
    border: 1px solid #d0d7de;
    border-radius: 8px;
    padding: 16px;
  }
  .card h2 {
    margin: 0 0 8px;
    font-size: 18px;
  }
  .card p {
    margin: 0;
    font-weight: bold;
  }
  .status-ok { color: #1a7f37; }
  .status-error { color: #cf222e; }
  .status-maintenance { color: #9a6700; }
  @media (max-width: 600px) {
    .cards {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>
<main>
  <h1>服务状态</h1>
  <section class="cards" aria-label="服务状态列表">
    <article class="card">
      <h2>网站</h2>
      <p class="status-ok">状态：正常</p>
    </article>
    <article class="card">
      <h2>接口</h2>
      <p class="status-error">状态：异常</p>
    </article>
    <article class="card">
      <h2>后台作业</h2>
      <p class="status-maintenance">状态：维护</p>
    </article>
  </section>
</main>
</body>
</html>
