services:
  app:
    image: ${MIKKA_IMAGE:-ghcr.io/alexj11324/mikka:latest}
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:${MIKKA_PORT:-3000}:3000"
    environment:
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      MIKKA_DATABASE_URL: postgres://mikka:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/mikka
      DATABASE_URL: postgres://mikka:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/mikka
      MIKKA_EMAIL_FROM: ${MIKKA_EMAIL_FROM:-}
      SMTP_URL: ${SMTP_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MIKKA_DEFAULT_MODEL_BASE_URL: ${MIKKA_DEFAULT_MODEL_BASE_URL:-}
      MIKKA_DEFAULT_MODEL_API_KEY: ${MIKKA_DEFAULT_MODEL_API_KEY:-}
      MIKKA_DEFAULT_MODEL_ID: ${MIKKA_DEFAULT_MODEL_ID:-}
    volumes:
      - app-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 60s
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mikka
      POSTGRES_DB: mikka
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mikka -d mikka"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  app-data:
  postgres-data:
