packages:
  - 'packages/*'
  - 'apps/*'

# Fix SWC's overflow-owner cache validation for next-intl in rootless Linux.
# Keep Workflow's separate SWC 1.15.3 dependency unchanged.
overrides:
  'next-intl@4.14.9>@swc/core': '1.16.20'

# The lockfile already pins these versions; pnpm's 24h release-age gate
# blocks every install/typecheck run until it is disabled.
minimumReleaseAge: 0

pmOnFail: ignore

minimumReleaseAgeExclude:
  - '@next/*'
  - next

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  sharp: true

patchedDependencies:
  '@novnc/novnc@1.6.0': patches/@novnc__novnc@1.6.0.patch
