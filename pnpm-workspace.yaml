packages:
  - 'packages/*'
  - 'apps/*'

# Fix SWC's overflow-owner cache validation for next-intl in rootless Linux.
# Keep Workflow's separate SWC 1.15.3 dependency unchanged.
overrides:
  'next-intl@4.14.9>@swc/core': '1.16.20'

# The lockfile already pins these versions; pnpm's 24h release-age gate
# blocks every install/typecheck run until it is disabled.
minimumReleaseAge: 0

pmOnFail: ignore

minimumReleaseAgeExclude:
  - '@next/*'
  - next

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  electron: true
  esbuild: true
  ffmpeg-static: true
  sharp: true

patchedDependencies:
  '@fantasticfour/world-cloudflare@2.4.3': patches/@fantasticfour__world-cloudflare@2.4.3.patch
  '@novnc/novnc@1.6.0': patches/@novnc__novnc@1.6.0.patch
  '@better-auth/sso@1.7.12': patches/@better-auth__sso@1.7.12.patch
  ffmpeg-static@5.3.0: patches/ffmpeg-static@5.3.0.patch
  # Eve CLI reads this engine range; actual build/start is tested on 22 and 24.
  eve@1.0.0-rc.9: patches/eve@1.0.0-rc.9.patch

# Eve development cleanup uses explicit resource management, absent on Node 22.
packageExtensions:
  eve@1.0.0-rc.9:
    dependencies:
      core-js-pure: 3.51.0
